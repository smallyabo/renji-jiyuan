<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人机纪元 · 阅读长卷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231E2430'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%23E8C98A' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F7F2E9; --bg2:#F0E8D9; --bg3:#EAE0CD;
  --ink:#20262F; --ink2:#556072; --ink3:#8790A0;
  --line:#D9CDB6; --card:#FCF9F3; --cardhov:#FFFEFB;
  --gold:#A97E2B; --gold2:#C9A45C; --goldsoft:#F0DFB8;
  --axis:2px;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --fs-read:19px;
  --shadow:0 10px 30px rgba(60,45,20,.10);
}
[data-theme="night"]{
  --bg:#12151E; --bg2:#181C28; --bg3:#1F2433;
  --ink:#E9E4D8; --ink2:#A6AEC0; --ink3:#6D7590;
  --line:#2B3247; --card:#1A202F; --cardhov:#222A3C;
  --gold:#D9A648; --gold2:#B98A39; --goldsoft:#4A3A1E;
  --shadow:0 14px 34px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html.no-smooth{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
::selection{background:var(--goldsoft);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--gold) 55%,var(--line));border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶部导航 ===== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:14px;padding:11px 24px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);transition:background .3s,border-color .3s}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.1em;white-space:nowrap}
.brand svg{width:23px;height:23px;flex:none;color:var(--gold)}
#topbar nav{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
#topbar nav::-webkit-scrollbar{display:none}
.vol-jump{font-size:12.5px;color:var(--ink2);padding:6px 10px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s;border:1px solid transparent}
.vol-jump:hover{background:var(--bg3);color:var(--ink)}
.vol-jump.on{background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.tb-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 90%,transparent);transition:all .2s;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.tb-btn svg{width:15px;height:15px}

/* ===== Hero ===== */
#hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;padding:130px 24px 70px;position:relative;overflow:hidden}
#hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;opacity:.15;pointer-events:none;mask-image:radial-gradient(ellipse at 32% 38%,#000 25%,transparent 72%)}
#hero::after{content:"";position:absolute;left:52%;top:-18%;width:680px;height:680px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%);pointer-events:none}
.hero-glow{position:absolute;left:-14%;bottom:-26%;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,#3E5C76 22%,transparent),transparent 70%);pointer-events:none}
.hero-inner{position:relative;max-width:1080px;margin:0 auto;width:100%}
.kicker{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.32em;color:var(--gold);font-weight:600;margin-bottom:24px}
.kicker::before{content:"";width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.kicker::after{content:"";width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg);opacity:.7}
h1.title{font-family:var(--serif);font-weight:900;font-size:clamp(54px,10vw,122px);line-height:1.05;letter-spacing:.06em;background:linear-gradient(180deg,var(--ink) 62%,color-mix(in srgb,var(--gold) 55%,var(--ink)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--ink)}
h1.title .sub{display:block;font-weight:600;font-size:clamp(16px,2.4vw,26px);letter-spacing:.18em;color:var(--ink2);margin-top:18px;line-height:1.55;-webkit-text-fill-color:var(--ink2);background:none}
.hero-meta{margin-top:36px;display:flex;flex-wrap:wrap}
.meta-item{display:flex;flex-direction:column;gap:3px;padding:0 26px;border-left:1px solid color-mix(in srgb,var(--line) 90%,transparent)}
.meta-item:first-child{padding-left:0;border-left:none}
.meta-item b{font-family:var(--serif);font-size:32px;font-weight:900;color:var(--ink);letter-spacing:.02em}
.meta-item b em{font-style:normal;font-size:14px;font-weight:600;color:var(--gold);margin-left:2px}
.meta-item span{font-size:12px;color:var(--ink3);letter-spacing:.16em}
.hero-desc{margin-top:28px;max-width:580px;font-family:var(--serif);font-size:16.5px;line-height:2;color:var(--ink2)}
.cta-row{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:999px;font-size:15px;font-weight:600;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#FFFDF6;box-shadow:0 10px 24px color-mix(in srgb,var(--gold) 34%,transparent);transition:transform .2s,box-shadow .2s,filter .2s}
.cta:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--gold) 42%,transparent);filter:brightness(1.04)}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.cta.ghost:hover{border-color:var(--gold);color:var(--gold);box-shadow:none}

/* ===== 长卷 ===== */
#chronicle{position:relative;padding:16px 24px 110px}
.ch-head{max-width:1180px;margin:0 auto 46px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:26px}
.ch-head h2{font-family:var(--serif);font-weight:900;font-size:36px;letter-spacing:.06em;position:relative}
.ch-head h2::after{content:"";position:absolute;left:0;bottom:-6px;width:44px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
.ch-head p{color:var(--ink2);font-size:14px;max-width:440px;line-height:1.8}
.ch-head .tip{margin-left:auto;font-size:12px;color:var(--ink3);display:flex;gap:7px;align-items:center;padding:6px 12px;border:1px dashed var(--line);border-radius:999px}
.ch-head .tip svg{width:14px;height:14px;color:var(--gold)}

.scroll-wrap{position:relative;max-width:1180px;margin:0 auto}
/* 主轴 */
.axis{position:absolute;top:0;bottom:0;left:220px;width:var(--axis);background:linear-gradient(180deg,transparent,var(--ink3) 4%,var(--ink3) 96%,transparent);opacity:.4}
/* 卷区段 */
.vol-sec{position:relative;display:grid;grid-template-columns:220px 48px 1fr;gap:0;padding-bottom:74px}
.vol-sec::after{content:"";position:absolute;left:220px;top:0;bottom:74px;width:var(--axis);transform:translateX(-50%);background:var(--volc);opacity:.85}
.vol-info{position:sticky;top:118px;align-self:start;padding-right:26px;grid-column:1}
.ch-cards{grid-column:3}
.vol-num{font-family:var(--serif);font-weight:900;font-size:12.5px;letter-spacing:.24em;color:var(--volc);display:inline-flex;align-items:center;gap:9px}
.vol-num::before{content:"";width:20px;height:2px;background:var(--volc);border-radius:2px}
.vol-name{font-family:var(--serif);font-weight:900;font-size:29px;margin:10px 0 7px;line-height:1.3;letter-spacing:.03em}
.vol-span{font-size:12.5px;color:var(--ink3);letter-spacing:.12em;font-weight:500}
.vol-tag{margin-top:13px;display:inline-flex;flex-wrap:wrap;gap:6px}
.vol-tag i{font-style:normal;font-size:11.5px;color:var(--volc);border:1px solid color-mix(in srgb,var(--volc) 40%,transparent);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--volc) 9%,transparent)}
.vol-desc{margin-top:15px;font-family:var(--serif);font-size:14px;line-height:1.9;color:var(--ink2)}
.vol-events{margin-top:17px;display:flex;flex-direction:column;gap:9px;position:relative;padding-left:2px}
.vol-events span{font-size:12.5px;color:var(--ink2);display:flex;gap:9px;line-height:1.6;align-items:flex-start}
.vol-events i{width:6px;height:6px;border-radius:50%;background:var(--volc);flex:none;margin-top:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--volc) 18%,transparent)}
/* 轴节点 */
.axis-node{position:absolute;left:220px;width:48px;display:flex;justify-content:center;align-items:center;top:8px;pointer-events:none}
.axis-node::before{content:"";width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--volc) 30%,var(--bg));border:2px solid var(--volc);box-shadow:0 0 0 5px color-mix(in srgb,var(--volc) 14%,transparent);z-index:2}
/* 章节卡 */
.ch-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;padding-left:10px}
.ch-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px 14px 19px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.ch-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--volc),color-mix(in srgb,var(--volc) 55%,transparent))}
.ch-card::after{content:"";position:absolute;right:-26px;top:-26px;width:70px;height:70px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--volc) 13%,transparent),transparent);pointer-events:none}
.ch-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--volc) 65%,var(--line));box-shadow:0 12px 26px color-mix(in srgb,var(--volc) 18%,rgba(0,0,0,.10));background:var(--cardhov)}
.ch-top{display:flex;align-items:baseline;gap:9px;min-width:0}
.ch-no{font-size:11.5px;font-weight:600;color:var(--volc);letter-spacing:.1em;flex:none;font-family:var(--sans)}
.ch-title{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-y{font-size:11px;font-weight:600;color:var(--volc);flex:none;margin-left:auto;white-space:nowrap;background:color-mix(in srgb,var(--volc) 10%,transparent);padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--volc) 28%,transparent)}
.ch-tags{display:flex;gap:5px;flex-wrap:wrap}
.ch-tags i{font-style:normal;font-size:10.5px;color:var(--ink2);background:var(--bg3);padding:2px 8px;border-radius:999px}
.ch-preview{font-size:12.5px;line-height:1.75;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:4.4em}
.ch-go{align-self:flex-end;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--gold);font-weight:600;opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s}
.ch-card:hover .ch-go{opacity:1;transform:none}
.vol-end{margin:8px 0 30px;padding-left:10px;grid-column:1/-1}
.vol-end span{font-size:12px;color:var(--ink3);display:inline-flex;align-items:center;gap:10px;letter-spacing:.06em}
.vol-end span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--volc)}
.vol-end span::after{content:"";height:1px;width:110px;background:linear-gradient(90deg,var(--volc),transparent);opacity:.7}

/* ===== 阅读器 ===== */
#reader{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:hidden;display:none}
#reader.open{display:block}
.read-toolbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:11px 20px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.rt-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:7px 12px;border-radius:999px;transition:all .18s;white-space:nowrap}
.rt-btn:hover{background:var(--bg3);color:var(--ink)}
.rt-btn svg{width:15px;height:15px}
.rt-main{display:flex;gap:6px;margin-left:auto;align-items:center}
.rt-div{width:1px;height:18px;background:var(--line)}
.read-scroll{position:absolute;inset:0;overflow-y:auto;padding:96px 22px 120px;-webkit-overflow-scrolling:touch}
.read-progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--gold));z-index:12;width:0%;box-shadow:0 0 8px color-mix(in srgb,var(--gold) 45%,transparent)}
.read-paper{max-width:46em;margin:0 auto;padding:14px 8px 60px}
.r-head{margin-bottom:38px;padding-bottom:28px;border-bottom:1px solid var(--line);position:relative}
.r-head::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:var(--gold)}
.r-kicker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--volc,var(--gold));letter-spacing:.16em;font-weight:600;margin-bottom:16px}
.r-kicker .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 16%,transparent)}
.r-title{font-family:var(--serif);font-weight:900;font-size:clamp(27px,4.8vw,42px);line-height:1.32;margin-bottom:16px;letter-spacing:.02em}
.r-sub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.r-sub i{font-style:normal;background:var(--bg3);padding:3px 10px;border-radius:999px;color:var(--ink2)}
.r-body{font-family:var(--serif);font-size:var(--fs-read);line-height:2.05;color:var(--ink);letter-spacing:.02em}
.r-body p{margin:0 0 1.15em;text-align:justify}
.r-body p:last-child{margin-bottom:0}
.r-nav{margin-top:48px;display:flex;gap:12px;align-items:stretch}
.r-nav a{flex:1;display:flex;flex-direction:column;gap:5px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:all .18s}
.r-nav a:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.r-nav .dir{font-size:11px;color:var(--ink3);letter-spacing:.14em}
.r-nav .t{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--ink)}
.r-nav .none{opacity:.4;pointer-events:none}

/* ===== 搜索面板 ===== */
#search{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 38%,transparent);display:none;align-items:flex-start;justify-content:center;padding:9vh 18px;backdrop-filter:blur(4px)}
#search.open{display:flex}
.search-box{width:min(660px,100%);background:var(--bg);border-radius:16px;box-shadow:0 28px 70px rgba(0,0,0,.32);overflow:hidden;display:flex;flex-direction:column;max-height:80vh;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.search-field{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}
.search-field svg{width:17px;height:17px;color:var(--gold);flex:none}
.search-field input{flex:1;border:none;outline:none;background:none;font-family:var(--sans);font-size:16px;color:var(--ink)}
.search-field .close{font-size:14px;color:var(--ink2);padding:4px 9px;border-radius:6px}
.search-field .close:hover{background:var(--bg3);color:var(--ink)}
.search-res{overflow-y:auto;padding:12px 0}
.search-item{display:flex;gap:13px;padding:13px 20px;cursor:pointer;transition:background .15s;border-left:2px solid transparent}
.search-item:hover{background:var(--bg3);border-left-color:var(--gold)}
.search-item .n{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--gold);flex:none;width:36px}
.search-item .body{min-width:0}
.search-item .t{font-family:var(--serif);font-weight:700;font-size:14.5px;margin-bottom:3px}
.search-item .s{font-size:12.5px;color:var(--ink2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-empty{padding:28px 18px;text-align:center;color:var(--ink3);font-size:13.5px}

footer{border-top:1px solid var(--line);padding:52px 24px 64px;text-align:center;background:linear-gradient(180deg,var(--bg),var(--bg2))}
footer .f-title{font-family:var(--serif);font-weight:900;font-size:26px;margin-bottom:12px;letter-spacing:.06em}
footer .f-line{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 14px}
footer p{font-size:13px;color:var(--ink3);line-height:1.9;letter-spacing:.04em}

@media (max-width:900px){
  #topbar nav{display:none}
  .vol-sec{grid-template-columns:1fr}
  .vol-info{grid-column:1}
  .ch-cards{grid-column:1}
  .axis{left:20px}
  .vol-sec::after{left:20px}
  .axis-node{left:20px}
  .vol-info{position:static;padding-right:0;padding-bottom:8px}
  .vol-info{padding-left:44px}
  .vol-events{flex-direction:row;flex-wrap:wrap}
  .vol-events span{font-size:12px}
  .ch-cards{grid-template-columns:1fr;padding-left:44px}
  .vol-end{padding-left:44px}
  .ch-head .tip{margin-left:0}
}
@media (max-width:560px){
  #hero{padding:116px 18px 50px}
  .kicker{font-size:12px;letter-spacing:.24em}
  h1.title{font-size:clamp(46px,13vw,64px)}
  .meta-item{padding:0 16px}
  .meta-item b{font-size:26px}
  .hero-desc{font-size:15px;line-height:1.95}
  .cta-row{gap:10px}
  .cta{padding:12px 22px;font-size:14px}
  .ch-cards{grid-template-columns:1fr}
  .ch-head h2{font-size:30px}
  .read-toolbar{flex-wrap:wrap;gap:4px;padding:9px 12px}
  .rt-btn{font-size:12px;padding:6px 9px}
  .r-body{font-size:calc(var(--fs-read) - 1px)}
  .r-nav{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}</style>
</head>
<body>
<!-- ===== 顶部导航 ===== -->
<header id="topbar">
  <a class="brand" href="#" data-act="home" aria-label="返回长卷顶部">
    <svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill="var(--gold)"/><path d="M6 9h12M6 13h12M6 17h7" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
    人机纪元
  </a>
  <nav id="volNav" aria-label="卷导航"></nav>
  <div class="rt-main">
    <button class="tb-btn" id="searchBtn" aria-label="搜索全文">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      搜索
    </button>

一条查过源头。这不怪你们，时代变了，信息的成本从'贵'变成了'多'。过去记者跑断腿才挖到一个真相，现在 AI 一分钟能造一千条。你们猜，这个行业以后还缺什么？”\n\n“缺记者？”前排有人试探。\n\n老周摇头：“缺能替人做判断的人。机器能写，能算，能编，能骗得比你更像人。但机器不会为你的一句话负责。”他停了一下，目光落在李慕宸那排，“写错一个字，印在报纸上，要有人认。将来这句话会越来越贵。谁认得起，谁就是行业里活下来的人。”\n\n下课铃响的时候，李慕宸笔记本上多了一行字，他自己都没注意是什么时候写下的：每一句话，都要有人负责。\n\n他回宿舍的路上拐进校媒办公室，想着把下周的选题报上去。办公室里电脑屏幕亮着几篇自动生成的校园新闻，标题工整，句式统一，他扫了一眼就皱起眉，第三篇的配图他记得，上个月图书馆修缮的旧照片，日期都不对。\n\n当晚十一点，他躺在床上刷手机，刷到了老家社区论坛的帖子。\n\n帖子标题很冲：《老街拆迁内幕：开发商勾结，补偿款被截留》。他点进去，主楼写得有鼻子有眼，时间、地点、人物齐全，连“知情人士”的话都引了三条。配图是几张灰蒙蒙的楼体照片。\n\n李慕宸盯着那几张图看了十秒，拇指停在屏幕上方。\n\n图上的楼他认得，是街口那排老房子，去年暑假回家还见过。可他记得那排房子朝南的墙皮是米黄色，图上却是灰白色。他点开原图，调出 EXIF 信息，拍摄时间显示三年前，地点坐标却标在本市另一片拆迁区。\n\n他退出来，又翻了几条同板块的帖子，题目不同，配图不同，可措辞的骨架是同一个模子：开头都是“据可靠消息”，中间都是“相关人士透露”，结尾都是“后续进展，持续关注”。发帖时间像上了闹钟，每天凌晨两点十七分到两点三十五分，整整齐齐。\n\n他把手机扣在床上，盯着天花板。\n\n这不是某个闲人发的帖。这是一条流水线。有人在用 AI 批量造帖，瞄准的正是老家那种没什么人管的社区论坛，没人核实，没人追问，发出去就是“事实”。\n\n他想起外公说过的一句话，那时候外公还活着，坐在老街口修收音机，说：人说的话、写下的字，是会留下来替人记得的。\n\n旧收音机还在他床头。铝合金的外壳磨得发亮，旋钮转起来有细微的咔哒声。他伸手拧开，电流声里蹦出半句本地电台的新闻：老街片区改造工程，目前进展顺利。\n\n“进展顺利。”他低声重复了一遍这四个字。\n\n论坛里说的是勾结、截留、黑幕。电台里说的是进展顺利。他不知道哪个是真的，但他知道：这里面至少有一个是假的，而假的那些，正一天十几条地往老家灌。\n\n他合上笔记本电脑，指节在桌面上敲了两下，笃，笃。这是他想明白一件事时的老习惯。\n\n外公生前修了三十年收音机，总说收音机里的话，是有人对着话筒说出来的，字字有主。如今话筒换成了算法，可话还是那些话，只是没人肯认了。\n\n他拉开旧帆布包的拉链，把笔记本塞进去，想了想，又抽出来，翻到空白页，写下几个字：\n\n从明天开始，查。\n\n窗外，宿舍楼对面那栋写字楼的玻璃幕墙还亮着，AI 客服的剪影在屏幕上闪动。凌晨两点十七分，老家论坛上，新一批帖子准时开始滚动。\n第二天早上六点半，李慕宸就醒了。陈默还在打呼噜，他把被子叠好，坐在桌前重新打开电脑，把那几条造谣帖的发布账号一个个点开。\n\n账号名叫“老街新鲜事”“城东观察”“民生直通车”，头像都是本地风景，简介写得像模像样。他挨个查注册时间，三个账号前后相差不到四十八小时；查发帖记录，最早一条都是两周前；查互动，点赞数清一色卡在同一个区间，八十到一百二，没有一个冒头的。\n\n他调出昨晚存的几篇帖子，把开头几句复制进查重工具，跑了一遍，又跑了一遍。文本相似度百分之六十七。同一批“作者”，同一套模板，同一个时间窗口，操着不同口音在说话。\n\n他把结果整理成一页纸，标注清楚每条证据的出处和时间，截图、存档、编号，做成一份最简单的核查记录。这是他上学期在老周的课上学的第一课：任何结论，先问证据从哪来。\n\n九点，他拨通了平台客服。\n\n接电话的是机器人，声音温柔，语速均匀，听他把事情说完，回了标准话术：感谢您的反馈，经初步审核，相关内容未违反平台规则，感谢您对平台内容安全的支持。\n\n他追问了一句：那发帖账号是同一时间注册的呢？\n\n机器人停顿了零点几秒，继续标准话术：您的建议已记录，我们会转交人工复核，请耐心等待。\n\n李慕宸把手机放下。他知道这个“耐心等待”会等多久。上周他刚在校媒做过一次试验：把同一篇疑似造谣帖举报给五个平台，三个回复“未违规”，两个压根没有回复。AI 造帖的速度是以分钟计的，人工审核的队伍还是五年前那批人。\n\n他盯着那页核查记录看了很久，最后把它折好，放进旧帆布包的内层。\n\n上午有课，老周的课在十点。他提前二十分钟到教室，坐在第一排。老周进来，看见他面前的桌上摊着那页记录，没说话，放下教案，先看了一眼。\n\n“昨晚熬夜了？”\n\n“查了点东西。”\n\n老周嗯了一声，没有追问。上课铃响，他打开平板，投影亮起来，屏幕上是一行字：事实核查的五个步骤。李慕宸的笔停在纸面上。\n\n“第一步，”老周说，“问：这条信息的源头是谁。”\n\n李慕宸的指节在桌面下敲了两下。笃，笃。\n\n下课后他堵住老周：“老师，我想查一件事。有人在我老家论坛批量发 AI 造谣帖，我做了初步核查，证据在这。”他把那页记录递过去。\n\n老周接过去，看得很慢，从头看到尾，又从尾看到头，最后把纸折好还给他：“证据链不完整。你只证明了'这些帖是机器发的'，还没证明'这些帖是有人故意发的'。差最后一环。”\n\n“怎么补。”\n\n“找到受益的人。”老周说，“造谣不图热闹，图的是有人看见。你往钱的方向查。拆迁、补偿款、地价，谁在这些帖子里得到好处，谁就是源头。不过，这条路不好走，你想好了？”\n\n李慕宸把记录收进帆布包，拉链拉好：“想好了。”\n\n老周看着他，忽然笑了，笑得很轻：“二十年前我带过一批学生，也是这么跟我说的。后来有人去做官，有人去做生意，有人一辈子守着一家小报。”他顿了顿，“你去查吧。查到了，回来告诉我一声。”\n\n李慕宸点点头，转身往外走。\n\n走到门口，老周在背后叫住他：“那个论坛，你爸妈还住那边？”\n\n“嗯。”\n\n“那你更得查清楚。”老周说，“机器造的话，有时候比人说的更真。人听着听着，就忘了自己姓什么了。”\n\n李慕宸站在门口，没回头，轻轻应了一声。\n\n出了教学楼，正午的太阳明晃晃的。他掏出手机，又刷了一遍老家论坛。昨晚那几条帖子还在，点赞数比早上多了几十个，底下评论区有人当真了，问“补偿款到底能拿多少”。他往下翻，看见一条回复，ID 叫“老街口修鞋匠”：\n\n“造谣的，老子在这住了四十年，街口根本没拆。”\n\n这条回复发在凌晨三点，底下没有人理他。\n\n李慕宸盯着那行字看了很久，把手机锁屏，装进口袋。\n\n阳光底下，他的影子拉得很长。他背着那个旧帆布包，穿过半个校园，去校媒办公室。帆布包的内层里，那页核查记录安安静静地躺着，折痕压得笔直。\n\n他推开门的时候，办公室里一个女生正站在打印机前，侧脸对着门口，手里拿着一沓打印好的举报材料。那是林晚晴，新闻系大三，跟他不同班，系里没人不认识她，写稿从不碰 AI 工具，宁可熬通宵一个字一个字地敲。听见门响，她转过头来，看见他，愣了一下：“你是。”\n\n“李慕宸。”他说，“我来交一个选题。”\n\n女生低头看了看手里的材料，又抬头看他，目光停了一瞬：“巧了，我这儿也刚收到一批举报，也是 AI 造谣帖。”\n\n李慕宸站在门口，忽然觉得，这扇门他推对了。"},{"n":2,"t":"校媒来了一台假","y":"2026","v":1,"tags":["AI写作","校园"],"p":"校媒办公室比李慕宸想象的还要乱。三台电脑同时开着，屏幕上全是邮箱界面，林晚晴正站在打印机前，纸上已经摞了厚厚一沓。看见他进来，她把材料往桌上一放","body":"校媒办公室比李慕宸想象的还要乱。三台电脑同时开着，屏幕上全是邮箱界面，林晚晴正站在打印机前，纸上已经摞了厚厚一沓。看见他进来，她把材料往桌上一放：“你说要交选题？”\n\n“嗯。老家论坛，AI 造谣帖，我做了初步核查。”\n\n她低头翻了一眼他递过来的那页记录，手指在几行字上停了一下：“你查了 EXIF 和发帖时间？”\n\n“对，还有文本重复率。”\n\n她没接话，转身打开邮箱，把屏幕转过来给他看。收件箱里躺着上百封邮件，标题大同小异：《举报：XX 论坛出现 AI 批量造谣帖》《我们小区也被刷了》《这条帖子是假的，请核实》。发件人来自十几个不同的城市。\n\n“从今天凌晨到现在，”林晚晴说，“一百零七封。我还没来得及看完。”\n\n李慕宸扫了一眼那串标题，心里那点“巧合”的念头彻底没了。他老家那几条帖子的举报，只是这一百多封里的一封。造谣的不止一条流水线，或者，是同一台机器在同时喂十几条流水线。\n\n“我帮你。”他说，“分类我来做，你先歇会儿。”\n\n林晚晴看了他一眼，没拒绝，把椅子让出来。\n\n李慕宸坐下来，把举报邮件按发帖平台、发帖账号、帖子主题三栏归类。这个活儿他在老周课上练过，熟。两小时后，他把归类结果拉到林晚晴面前：一百零七封举报，指向六十八个帖子，发帖账号一百二十三个，帖子主题高度重叠，拆迁、征地、补偿款、物业纠纷、邻里丑闻，全是那种最容易在社区论坛里传起来的话题。\n\n“时间规律查了吗？”林晚晴问。\n\n“查了。”李慕宸翻出一张表，“六十八个帖子，发帖时间集中在凌晨两点到三点，每分钟一批，间隔误差不超过五秒。”\n\n办公室里安静了一下。坐在角落剪视频的男生抬起头：“每分钟一批？这也太整齐了吧。”\n\n“不是人发的。”李慕宸说，“是程序。有人搭了一条流水线，定时定量往外吐帖子。”\n\n“那源头呢？”\n\n李慕宸点开其中一篇帖子的正文，翻到底部，指着发布信息里的一串字符：“我挨个查了这些帖子的'信息来源'字段。正常的帖子来源是浏览器或手机 App，这几个来源指向同一个地址。”\n\n他敲了敲屏幕：“一个流量聚合站。没备案，域名注册了还不到两个月，服务器在境外。”他顿了顿，“所有帖子的来源都是它。这就是流水线的入口。”\n\n“那这个站是谁的？”\n\n“还没查到。”李慕宸说，“备案查不到，注册信息也是假的。但我知道怎么往下查。”\n\n林晚晴盯着屏幕上那串域名，沉默了一会儿，忽然问：“你老家那个论坛，是被同一条流水线刷的？”\n\n“是。”\n\n“所以这不是巧合。有人拿同一台机器，往全国各地的社区论坛灌造谣帖。”她说着，语气慢慢变了，“这是有组织的。”\n\n办公室里没人说话。剪视频的男生小声嘀咕了一句：“这活儿还怎么干，我们才几个人。”\n\n“所以才要查清楚。”林晚晴说。\n\n这时门口传来脚步声，校媒主编推门进来。主编姓顾，大四，比他们高一级，平时圆滑，最怕出篓子。他手里拿着手机：“都别查了，我刚接到通知，今晚有一篇稿子要赶，网信办约我们写一篇'AI 内容治理'的评论，明天早上要。谁会用 AI 写稿工具？一小时能出三版。”\n\n“我用。”角落里的男生举手。\n\n主编扫了一圈：“那行，小李你配合他，用工具批量生成，再改改就行。造谣那事儿先放放。”\n\n林晚晴站起来：“我不干。”\n\n主编愣了一下：“什么？”\n\n“AI 写稿工具生成的稿子，署上我们校媒的名字，交到网信办。”林晚晴说，“将来这篇稿子被人查出来是机器写的，谁负责？”\n\n主编皱眉：“这就是个工作流程，你较什么真。”\n\n“我不较真。”林晚晴站在原地，没提高声音，“我们刚收到一百零七封举报，全是机器造的话。这会儿我们自己的稿子也要让机器来写，那我明天怎么跟那些举报的人解释，说我们查不了机器，只能跟机器一起写？”\n\n办公室里静得能听见打印机待机的电流声。主编的脸有点挂不住，正要说什么，李慕宸站起来，走到那台电脑前，点开一篇标题为《AI 写稿时代，传统媒体何去何从》的稿子，是角落里那个男生用工具生成的，已经改了三版。\n\n“这篇稿子，”李慕宸说，“我不用看正文，就能告诉你有问题。”\n\n他指着稿子的开头：“'近年来，随着人工智能技术的飞速发展，媒体行业正经历前所未有的深刻变革。'这句，AI 生成的。”\n\n“你怎么知道？”男生不服气。\n\n“因为这句话在过去三个月里，被全国至少两千家媒体用过。”李慕宸调出一个检索页面，输入那句话，结果密密麻麻铺满了屏幕，“工具把全网出现过的高频句子拼在一起，你以为它写的是新稿，其实它拼的是旧话。你拿去网信办，审稿的人一眼就能看出来。”\n\n男生张了张嘴，没说出话。\n\n主编站在门口，脸色变了又变，最后把手机收起来：“那，这篇稿子，你自己写？”\n\n“我写。”李慕宸说，“不用工具，就照老周课上教的，先查三个事实，再动笔。”\n\n“多长时间？”\n\n“三个小时。”\n\n主编点了点头，转身走了。走到门口，又停下，回头看了他一眼：“你叫李慕宸？”\n\n“是。”\n\n“老周的学生？”\n\n“是。”\n\n主编没再说什么，走了。\n\n办公室里重新安静下来。角落里那个男生默默关掉了 AI 写稿工具的界面。林晚晴还站在桌边，怀里抱着她的采访本，看着李慕宸，目光落在他身上很久：“你刚才那句'谁负责'，说到了点上。”\n\n“那是老周教的。”李慕宸说，“他说，每一句话，都要有人负责。”\n\n“我知道。”林晚晴低头看着采访本，“老周是我们系最老派的老师，他讲这个讲了二十年了。”\n\n她顿了顿，忽然说：“你老家那个论坛，我陪你去查。”\n\n“你还有一百零七封举报要处理。”\n\n“我带到现场去处理。”她把采访本抱在胸前，“造谣的源头在线上，可造谣的人在线下。我去看看那些被刷帖的小区，看看是谁在受益。”\n\n李慕宸看着她，忽然觉得校媒这个地方，比他想象的有意思。\n\n“那明天早上八点，校门口见。”\n\n“行。”\n\n林晚晴把采访本夹进帆布袋里，又抽出录音笔，按了一下，确认还有电，重新放回去。她转身要走，走到门口又停下来，回头补了一句：\n\n“你那个核查记录，做得很细。我见过很多举报人，没几个像你这样的。”\n\n“什么样？”\n\n“把证据链做完整了才来。”她说，“一般人发个帖子骂两句就完了。你不一样。”\n\n她走了。门在她身后轻轻合上。\n\n李慕宸站在原地，看着门口，又低头看了看那页核查记录，折痕已经压得很深了。窗外天已经黑了，校媒的灯还亮着，邮箱里那一百零七封举报邮件安安静静地躺着，像一百零七双等着一个交代的眼睛。\n回宿舍已经快十一点了。陈默戴着耳机在打游戏，看见他进门，摘下一只耳机：“校媒那边怎么样了？”\n\n“查到一个流量聚合站，没备案。”\n\n“牛啊，都查到站了。”陈默来了兴趣，“然后呢？”\n\n“站是谁的，还没查到。”\n\n李慕宸坐下来，重新打开电脑。聚合站的页面早就被他翻遍了，公开信息只有那串境外域名。他没有关页面，而是换了个思路，把域名扔进几个公开的域名历史查询工具里，挨个跑。\n\n查了二十多分钟，在一条域名转移记录里，他找到了一个留下的邮箱前缀：pulse。后面跟了一串数字。\n\npulse。脉冲。\n\n他把这个邮箱前缀记下来，又回头去看那个流量聚合站。这次他不看页面，去看它的数据接口，很多这样的站，后台会留一个统计用的接口，用来给“甲方”看投放效果。他顺着页面源代码里一条不起眼的注释，摸到一个返回 JSON 数据的地址。\n\n打开，里面是一份投放记录。\n\n他盯着屏幕，手指停在键盘上。\n\n记录里不只是老家那个社区论坛。投放目标按城市、按论坛分类，密密麻麻列了十几页：本地论坛、房产论坛、家长群、校友群、二手交易群，投放主题全是拆迁、补偿、学区、物业、邻避项目，全是那种最容易挑动情绪、最容易在熟人圈子里滚起来的话题。\n\n每一页记录的右上角，都有一个统一的字段：甲方。\n\n甲方编号：P-1037。\n\n他不认识这个编号，但他认识这种写法。实习那年他看过一家公关公司的项目报表，甲方都是用编号记的，一个编号对应一个大客户。\n\n老家那几条帖子的“甲方”，只是一个编号。而编号后面，可能排着一长串。\n\n他合上电脑，盯着天花板，陈默在身后问：“查到啥了？”\n\n“一个编号。”\n\n“啥编号？”\n\n“甲方。”李慕宸说，“那台流水线，是给某个甲方打工的。”\n\n他顿了顿：“而且甲方可能不止一个。”\n\n窗外，凌晨的老家论坛上，新一批帖子还在准时滚动。帖子底下，评论区里有人当真了，有人在问补偿款，有人在转发。\n\n只有那条“老街口修鞋匠”的回复，还孤零零地沉在下面：\n\n造谣的，老子在这住了四十年。\n\n李慕宸盯着屏幕上的“甲方 P-1037”看了很久，最后把这串字符存进核查记录，在来源一栏下面，写下两个字：\n\n向上。"},{"n":3,"t":"流量帝国的暗线","y":"2026","v":1,"tags":["AI造谣","流量"],"p":"甲方编号 P-1037 是第二天中午查出来的。\n\n李慕宸顺着聚合站的服务器日志往下翻，发现一个奇怪的地方：站上所有帖子的数据，最终都会同步到一个","body":"甲方编号 P-1037 是第二天中午查出来的。\n\n李慕宸顺着聚合站的服务器日志往下翻，发现一个奇怪的地方：站上所有帖子的数据，最终都会同步到一个第三方统计平台。他顺着统计平台的公开接口查了一上午，终于在一条被删除又恢复的缓存记录里，看到了对应编号的客户信息。\n\n星流传媒。运营地址在本市高新区，注册资金三百万，成立不到一年。\n\n“你听过这家吗？”李慕宸问林晚晴。\n\n林晚晴摇头，打开手机搜了一圈：“没上过热搜，没什么公开报道。不过，”她把屏幕转过来，“他们在招人。”\n\n招聘页面上挂着十几个岗位，最显眼的一条写着：急聘 AI 内容运营，日薪 800，要求熟悉大模型提示词，工作内容：内容批量生产与分发。\n\n“日薪 800。”李慕宸说，“按这个标准，一条流水线的成本一个月不到三十万。”\n\n“三十万，”林晚晴算了算，“能养起这条流水线的甲方，一个月投放预算得翻十倍。”\n\n两人顺着招聘信息找到星流传媒的公开账号。账号没怎么运营，主页上只有零星几条内容，但其中一条置顶视频引起了李慕宸的注意，标题叫《算法时代，内容随便造》，主讲人是个三十出头的男人，西装革履，语速飞快，一口一个“降本增效”。\n\n视频下面挂着他的头衔：星流传媒运营总监，赵坤。\n\n“运营总监亲自下场讲课。”林晚晴说，“讲的是怎么用 AI 批量生产内容。”\n\n“内容随便造。”李慕宸盯着那句话，想起老家论坛上那些凌晨两点十七分发出来的帖子，心里那根弦又紧了一下。\n\n他按下播放键，把视频从头看到尾。\n\n赵坤在视频里讲得很实在：模板怎么搭、提示词怎么写、分发渠道怎么铺、流量怎么变现。他甚至没避讳批量这个说法，讲“一条流水线日产千帖”的时候，语气就像在介绍一台新买的打印机。\n\n“看清楚了吗？”李慕宸按下暂停，指着屏幕上赵坤放出来的后台截图，“模板库、批量分发、流量变现，三环全在。”\n\n他把赵坤的公开素材存下来，和老家论坛的造谣帖放在一起比对。模板库里的开头句式、配图风格、发帖时间规律，和造谣帖一一对上。他越比，手越稳，最后把结果整理成一份完整的对照表。\n\n“证据链齐了。”李慕宸说，“模板库出自他，批量分发用的是那个聚合站，流量变现，就是他视频里讲的那套广告分成。”\n\n“那就写。”林晚晴说，“我陪你改稿。”\n\n两人在校媒办公室忙到晚上九点，写出一篇三千字的调查稿：《一条 AI 造谣流水线的解剖》。李慕宸把稿子交上去，等主编审。\n\n十点，主编的回复来了，只有一行字：稿子先不发，平台那边有说法。\n\n李慕宸追问，主编没再多说。第二天早上他才知道发生了什么：稿子发到平台审稿系统后，被以“证据不足、涉嫌侵犯名誉权”为由拦了下来。平台给出的理由是：赵坤的视频是“公开观点表达”，不构成造假证据；帖子与星流传媒的关联“存疑”。\n\n“证据不足？”林晚晴看到退回通知的时候，声音都变了，“我们做了一整晚的对照表，他亲口说的模板库、亲口说的批量分发。”\n\n“平台不看这些。”李慕宸把退回通知关上，“审稿的是 AI 审核系统，关键词命中'侵权'就自动打回。”\n\n他给平台客服打过去，得到的回复和上次一样，标准的机器人话术，滴水不漏。他又试着走人工申诉通道，排了两个小时的队，最后接通的还是那句：您的申诉已记录，请耐心等待。\n\n那天下午，聚合站突然打不开了。\n\n李慕宸刷新了三遍，域名解析全部失败，换了个网络还是打不开，域名状态显示已注销。整个聚合站，一夜之间，从互联网上消失了。\n\n“他们删库了。”李慕宸盯着那个失效的域名，“我们昨晚查到聚合站，今天他们就关站。时间卡得刚好。”\n\n“谁删的？”\n\n“不知道。”李慕宸说，“但有人知道我们查到哪一步了。”\n\n他沉默了一会儿，把已备份的对照表打开，看了一遍，合上，又打开。林晚晴站在旁边，看着他，轻声问：“那这稿子，还发吗？”\n\n“发。但不能再走平台的审稿通道了。”\n\n李慕宸把对照表放进旧帆布包的内层，拉链拉上，转头看着她：“你信我吗？”\n\n“信。”\n\n“那今晚帮我做件事。”\n\n晚上八点，赵坤照例开了直播。\n\n直播间挂着“算法时代，内容随便造”的标题，赵坤正在讲最新的“爆款方法论”，礼物特效飘过一片，弹幕里有人喊“赵总带带我”。他讲到兴头上放出一张数据截图：“上个月，我们这条线，光靠内容分发就跑了三千万的流量，变现七位数。”\n\n弹幕刷过一片“牛”。\n\n就在这时，一条连麦申请弹了出来，昵称很陌生，叫“核查者”。\n\n赵坤看了一眼，没当回事，点了接受：“兄弟，想聊什么？”\n\n连麦接通，对面没露脸，只有一个声音，年轻，平稳：“赵总你好。我想请教一个问题。”\n\n“你说。”\n\n“你视频里讲的那套模板库，还有批量分发的流程，我能看看实际操作吗？”\n\n赵坤笑了：“那是我们的核心机密，商业机密，不能说。”\n\n“那换个问题。”声音继续说，“你上个月发的几条视频里，配图有几张，我看着眼熟。”\n\n“眼熟？你见过？”\n\n“嗯。”那个声音顿了顿，“上个月十号，你发过一条讲'内容生态'的视频，配图是一栋灰白色的居民楼。我见过同一栋楼，出现在一篇讲'拆迁补偿款被截留'的帖子，发帖时间，凌晨两点十七分。”\n\n直播间里，弹幕慢了一拍。\n\n赵坤脸上的笑僵了一下，随即恢复：“巧合吧，网络素材都是共享的。”\n\n“我也以为是巧合。”那个声音不紧不慢，“但我把你这一个月的视频截图全部存下来，和那些帖子比对了。发帖时间集中在凌晨两点到三点，配图来自同一个素材库，开头句式，和你在视频里演示的模板，一字不差。”\n\n“你说的是哪条模板？我没看过你说的帖子。”\n\n“你说的是哪条模板？”那个声音重复了一遍他的话，语气平静，“赵总，你刚才说没见过，那你应该问一句'什么帖子'，而不是说'哪条模板'。你脱口而出的，是'哪条模板'。”\n\n直播间安静了两秒。\n\n赵坤盯着屏幕，脸上的表情慢慢变了。他张了张嘴，又闭上，最后伸手，把直播关掉了。\n\n屏幕黑下去之前，弹幕已经炸了，刷得最快的那条，两个字：假的。\n\n李慕宸摘下耳机，靠回椅背上。林晚晴坐在他旁边，全程没出声，这会儿才轻轻吐了口气：“他破防了。”\n\n“嗯。”李慕宸说，“他没否认。”\n\n“他也没承认。”\n\n“他那种人，不否认就是承认。”李慕宸把直播录屏存好，又打开文件夹，开始备份。\n\n他做了三份备份：一份在本地硬盘，一份在加密网盘，一份拷进 U 盘，放进旧帆布包的内层，和那页核查记录放在一起。\n\n林晚晴看着他把 U 盘塞进帆布包：“三份够吗？”\n\n“够不够不知道。”李慕宸说，“但我不能让它们只存在一个地方。今天聚合站能被删库，明天我的电脑也能被清空。证据这种东西，多存一份，就多一分活下去的可能。”\n\n林晚晴没说话，过了很久，轻声说：“你今天那步棋走得挺险的。”\n\n“哪步？”\n\n“你让他先说'哪条模板'。”她说，“你算准了他会顺着你的话接。”\n\n“不算准。”李慕宸说，“他要是真见过那些帖子，会急着解释帖子不是他发的。他脱口而出'哪条模板'，说明他脑子里第一反应是模板：因为模板就是他的东西。”\n\n林晚晴看着他，目光落在他身上，停了好一会儿，忽然笑了：“你这个人，挺有意思的。”\n\n李慕宸没接话，低头盯着那份对照表，屏幕的冷光映在他镜片上。\n\n深夜，手机响了，是陈默发来的消息：你俩查的那个星流传媒，刚才他们官网挂出一张声明，说赵坤言论不代表公司立场，已暂停其职务。\n\n李慕宸盯着这条消息，没有高兴，反而皱起眉。\n\n切割得这么快，说明上面有人。星流传媒后面，还有更大的手。\n\n他关上手机，想起老周在课堂上讲老记者的事时，忽然停下来说的那句题外话：\n\n“记者这个行当，很多时候就是一个人跟一台机器较劲。”\n\n他把直播回放又看了一遍。赵坤下播前的脸定格在屏幕上，弹幕还在滚：假的。\n\n李慕宸关了播放器，屏幕暗下去。\n\n林晚晴已经走了，走之前把那篇被拦下的稿子留在他桌上，页边写着两行字：稿子没问题，是渠道有问题。换条路，我跟你走。\n\n他盯着那两行字看了很久，把稿子折好，放进帆布包。\n\n平台拦稿，聚合站删库，官网切割。今天发生的每一件事都在提醒他：在这条链上，流量说了算。谁的流量大，谁就能定义“事实”。\n\n他想起老周那句“一个人跟一台机器较劲”，想起外公说的“字字有主”，想起老家论坛上那些凌晨两点十七分准时滚动的帖子，还有那条孤零零沉在下面的回复：老子在这住了四十年。\n\n他拉开帆布包，把备份 U 盘摸出来，握在手里，握了很久。\n\n天亮的时候，他打开电脑，新建了一个空白文档，敲下标题：\n\n人核验。\n\n他又敲了一行副标题：每一句话，都要有人负责。\n\n然后他给林晚晴发了条消息：渠道没了，我们自己开一条。\n\n消息发出去，他合上电脑，背上旧帆布包，站在宿舍窗口往外看。晨光里，对面写字楼的玻璃幕墙亮起来了，AI 客服的剪影还在闪。楼下，第一批学生正背着包往教学楼走。\n\n没有人知道，这座城市里，有一家只讲真话的媒体，将在今天诞生。"},{"n":4,"t":"没人信的真相","y":"2026","v":1,"tags":["真相核查","舆论"],"p":"校媒主编是在周五下午约李慕宸谈话的。\n\n顾主编把他叫到走廊尽头，先递了根烟，李慕宸摇头，他就自己点上，抽了一口才开口：“那个稿子，上头看了，觉得","body":"校媒主编是在周五下午约李慕宸谈话的。\n\n顾主编把他叫到走廊尽头，先递了根烟，李慕宸摇头，他就自己点上，抽了一口才开口：“那个稿子，上头看了，觉得'方向有点敏感'。”\n\n“哪上头？”\n\n“你管哪上头呢。”顾主编弹了弹烟灰，语气软得滴水，“小李啊，你才大三，前途长着呢。校媒是锻炼人的地方，不是得罪人的地方。那个星流传媒，后面水深，不是你一个学生该趟的。”\n\n“我证据链都做齐了。”\n\n“证据链齐不齐不重要，重要的是没人敢发。”顾主编把烟掐了，拍了拍他肩膀，“听我一句，收了吧。回头我让编辑部给你发个'年度好稿'，这事就翻篇了。”\n\n李慕宸没说话，看着他走回办公室，门在身后轻轻带上。\n\n他站在走廊里，站了很久。走廊尽头的窗户开着，风灌进来，吹得墙上的校媒章程哗哗响。他盯着那行字看了很久：校园媒体，服务同学，传播真实。\n\n接下来的三天，他把能试的路全试了一遍。\n\n先找系主任。系主任翻了他的核查记录，看了二十分钟，合上，叹了口气：“小李，东西是好东西，可这不是系里能管的事。你要发，得走正规媒体。”\n\n他去了省报。跑社会新闻的记者接待了他，听他讲完，把记录复印了一份，说“我帮你问问”，再没下文。他去市台，人家连记录都没接，前台小姑娘客气地告诉他：我们只受理有爆料人证言的材料。\n\n他又试了三个网络平台的自媒体审核，全部石沉大海，最礼貌的一条回复是：您的稿件已进入审核队列，预计 15 个工作日内反馈。\n\n十五个工作日。\n\n他算了一下，十五个工作日后，赵坤又能多产两万条帖子。\n\n深夜十一点，他给林晚晴发了条消息：全部碰壁了。\n\n林晚晴回得很快：我这边也听说了，有人往学校打了招呼，让你“别管闲事”。\n\n他盯着那四个字看了很久。别管闲事。他忽然觉得好笑，他管的是自己的老家，自己的街坊，自己外公修了一辈子收音机的那条老街，这怎么能叫闲事。\n\n第三天晚上，老周给他发了条消息：来办公室。\n\n李慕宸到的时候，老周正在泡茶。办公室灯只开了一盏，茶雾升起来，老周的脸在雾后面有些模糊。他给李慕宸倒了杯茶，没提稿子的事，先问了一句：“碰壁了？”\n\n“碰遍了。”\n\n“感觉怎么样？”\n\n“感觉，”李慕宸捧着茶杯，半天憋出一句，“没处使劲。”\n\n老周“嗯”了一声，端起自己的杯子，吹了吹浮沫，喝了一口，放下。办公室安静了一会儿，只有窗外的风声。\n\n“我给你讲个事。”老周说，“我年轻的时候，在县报做记者，碰上过一件事，一家工厂排污水，毒死了一片鱼塘。证据我拍全了，照片、检测单、村民签字，齐得很。可稿子发不出来，县里压着，报社不敢发。”\n\n“后来呢？”\n\n“后来我把照片放大，贴在报社门口的宣传栏上，配了一行字：'这是上个月拍的照片。'当天下午，整个县城都来看。县里来人问我，我说，我不是记者了，我是路过看热闹的，你们要拆，拆的是自己的脸。”\n\n李慕宸看着老周，老周没有看他，盯着茶杯里自己的倒影。\n\n“第二天，处理结果下来了，工厂停工整改。”老周抬起头，“我跟你讲这个，不是教你怎么闹。我是想问你一句话，你要是自己开一个只讲真话的媒体，敢吗？”\n\n李慕宸没接话，脑子里那四个字转了好几圈。\n\n“校媒有人压你，平台有人拦你，那是因为你现在借的是别人的渠道。渠道在人家手里，人家想掐你就掐你。”老周说，“可你要是自己有一个渠道呢？不用大，一个公众号，一个网站，一条微博，都行。只要它姓'真'，它就砸不断。”\n\n李慕宸沉默了很久，问：“那我靠什么活？”\n\n“靠信你的人活。”老周说，“信你的人，会替你把这口气撑下去。你外公修收音机修了一辈子，修的是什么？是让话传出去。你比他多一样东西：你知道哪句话是真的。”\n\n李慕宸从老周办公室出来的时候，已经过了午夜。\n\n他没有回宿舍，坐在教学楼门口的台阶上，把手机掏出来，一遍一遍翻那些碰壁的回复。十五个工作日。没人敢发。别管闲事。\n\n他想起外公的收音机，想起老街口那条没人理的回复，想起那沓被平台打回的核查记录。\n\n他站起来，打开手机备忘录，开始打字。\n\n凌晨一点十七分，他的个人主页更新了一篇文章，标题叫《查不下去的真相》。\n\n文章不长。他把自己怎么发现造谣帖、怎么做核查、怎么被平台拦稿、怎么被“善意劝退”，从头到尾写清楚，最后附上那篇被拦下稿子的全文，一句没删，一句没改。\n\n文章最后一句话是：\n\n“我把证据放在这里。我不等谁了。我自己来。”\n\n发出去的时候，他手有点抖。他深吸一口气，锁屏，站起来，往出租屋走。\n\n走到半路，手机震了震。他低头看，第一条评论来了，是一个陌生账号：\n\n“看完了。你查的如果是真的，我挺你。坐标外省，帮不了什么忙，顶你一下。”\n\n紧接着第二条、第三条、第四条。评论不多，每一条都朴素得不像水军：\n\n“我们小区也有这种帖子，一模一样的时间规律。”\n“蹲后续。”\n“别删，我截图了。”\n\n他站在路灯底下，把那些评论一条一条看完，忽然觉得今晚的风没那么冷了。\n\n他走到出租屋楼下的时候，看见门缝里透出光。\n\n推门进去，陈默正蹲在地上，面前摊着三台旧电脑和一堆网线，听见门响，头也不抬：“回来了？”\n\n“你怎么在这。”\n\n“你文章发了，我看到了。”陈默从口袋里掏出一张叠得整整齐齐的纸，展开，递过来。纸上密密麻麻写满了字，是手写的技术方案：域名怎么备、服务器怎么搭、网站怎么防攻击、数据怎么加密。最后一行写着：预计成本，一个月八百块，我先垫。\n\n李慕宸看着那张纸，喉咙有点发紧：“你不怕赔钱？”\n\n“赔就赔呗。”陈默说，“我算过了，八百块够我吃一个半月泡面。再说了，”他顿了顿，语气难得认真，“你查的事要是真的，值。”\n\n李慕宸没接话，走到屋里唯一的白板前，拿起笔，写下一行字：\n\n每一句话，都要有人负责。\n\n写完，他回头看着陈默：“这就是人核验的第一条规矩。”\n\n陈默盯着那行字看了一会儿，从桌上拿起红笔，把那行字描了一遍，加粗，然后放下笔，回头：“明天我去搞服务器。”\n\n窗外，天刚蒙蒙亮。出租屋的灯亮着，白板上的红字在晨光里格外醒目。\n\n李慕宸坐在地上，背靠着墙，把手机屏幕按亮，又翻到那篇文章下面的评论。评论区又多了一条，来自一个显示“在校生”的账号，只有四个字：\n\n“算我一个。”\n第二天早上，李慕宸是被敲门声吵醒的。\n\n陈默已经出门了，桌上留着那张技术方案纸，旁边压着两百块钱和一张便条：先垫着，不够再说。\n\n他揉着眼睛去开门，门外站着一个西装革履的男人，三十岁上下，头发梳得一丝不苟，手里夹着一个公文包，站在楼下向上看，看的正是他们租这间屋子的窗户。\n\n“你是这屋的？”男人问。\n\n李慕宸点头：“有事？”\n\n“没什么事。”男人笑了笑，“路过，看见楼上好像新挂了块牌子，好奇看看。”\n\n李慕宸顺着他的目光往上看，才想起昨晚陈默临走时，确实在门框上方贴了张手写的纸，歪歪扭扭三个字：人核验。\n\n“新开的媒体？”男人收回目光，打量了他一下，目光在他那件起了球的旧卫衣上停了一瞬，“学生创业？”\n\n“算是。”\n\n男人没再多问，点了点头，转身走了。走出几步，又回头看了看那扇窗户，才钻进停在路边的一辆黑色轿车里。\n\n车窗摇下来，他掏出手机，拨了个号码，声音压得很低：“查到了，在城东这边，三个字的名字，几个人在搞，没什么技术底子。”\n\n电话那头说了句什么，他应了一声：“明白，先不动。”\n\n轿车开走了。\n\n李慕宸站在门口，看着那辆车远去，心里说不清是什么感觉。他把门框上那张纸揭下来，端详了两秒，又贴回去，贴得更正了些。\n\n他回到屋里，打开手机，那篇文章的阅读量已经过万了，评论区还在慢慢长。他一条一条往下翻，忽然停住。\n\n其中一条评论，来自一个显示“本地用户”的账号，只写了一行字：\n\n“查得下去吗？我认识一个在星流传媒做过的，他手里有点东西。”"},{"n":5,"t":"人核验","y":"2027","v":1,"tags":["人机协作","核验"],"p":"第二天下午，那个西装男人又来了。\n\n这次他没有在楼下站，而是直接上了楼，敲了门。李慕宸开门的时候，他正站在走廊里，手里拿着一个信封，脸上带着那种","body":"第二天下午，那个西装男人又来了。\n\n这次他没有在楼下站，而是直接上了楼，敲了门。李慕宸开门的时候，他正站在走廊里，手里拿着一个信封，脸上带着那种很标准的、谈生意式的微笑。\n\n“李慕宸？”\n\n“你是昨天楼下那位？”\n\n“正式介绍一下。”男人从口袋里摸出一张名片，递过来，“沈临风。星流传媒的投资人。”\n\n李慕宸接过名片，看了一眼，上面印着：沈临风，某某资本合伙人，下面是两行小字，讲的是“内容产业投资、AI 应用布局”。名片上没写星流传媒，但李慕宸认得那个资本的名字，去年在财经新闻里见过，投过几家头部内容平台。\n\n“坐。”李慕宸把门让开。\n\n沈临风进屋，扫了一圈，目光在墙角那三台旧电脑和白板上的红字上停了一下，没有评价，自己拉开椅子坐下：“地方不大，但东西是真的。”\n\n“沈总有什么事？”\n\n“开门见山。”沈临风把信封放在桌上，推过来，“你们那个核查方法，我看了，有意思。我想投。”\n\n李慕宸没动那个信封：“投什么？”\n\n“投人核验。”沈临风说，“你们缺钱，缺技术，缺渠道。这些我都有。我可以给你一个数，”他伸出三根手指，“你们一个月成本八百，我给你们八百倍的预算。条件是，人核验并入我的内容体系，核查标准、发布流程，我们共同制定。”\n\n李慕宸听明白了。\n\n“共同制定”，说得客气，翻译过来就是：查谁不查谁，由他说了算。\n\n他把信封推回去：“沈总，谢谢好意。但人核验有一条规矩，谁定标准，谁就是这家媒体的老板。标准要是让您定，那这家媒体就不是我的，是您的了。您买的不是媒体，是想买'真相'的嘴。”\n\n沈临风没接信封，笑了：“年轻人，你误会了。我不是来买你的，我是来帮你的。核查这行，光靠理想活不下去。”\n\n“我知道活不下去。”李慕宸说，“但我更知道，靠您的钱活下来，就不是我想活成的那样了。”\n\n沈临风看着他的眼睛，看了几秒，脸上的笑没变，但眼神里那点温度收了回去：“你确定？”\n\n“确定。”\n\n沈临风站起来，整了整袖口，语气还是温和的：“那行。年轻人，有自己的坚持是好事。不过我也跟你说句实话，真相是有价的，我给得起价，也耗得起你。”\n\n他走到门口，又回头看了一眼白板上的红字：“那句话写得不错。'每一句话，都要有人负责。'可惜，负责是要花钱的。”\n\n门在他身后轻轻带上。\n\n李慕宸站在原地，盯着桌上那个信封。信封上没写字，里面是空的。他拿起来，扔进垃圾桶。\n\n下午三点，陈默忽然从里屋冲出来，脸色发白：“出事了。”\n\n“怎么了？”\n\n“域名。”陈默把手机屏幕递过来，“咱们的临时域名，解析服务商那边给我发通知，说账户异常，暂停服务。我打电话过去问，那边支支吾吾，说'接到举报，涉嫌违规'。”\n\n“哪个违规？”\n\n“没说。就说要调查，七天。”\n\n李慕宸心里一沉。他打开电脑，把备用方案翻出来，昨晚他和陈默商量过，万一域名被掐，就换一家服务商。他注册新域名，填完资料，提交，三分钟后收到回复：该名称涉及争议，暂不予注册。\n\n又换一家。这次连注册页面都打不开，提示“服务维护中”。\n\n再换。这次倒是提交成功了，可十分钟后邮件来了：您的注册申请已被驳回，理由：资料审核未通过。\n\n他一家一家换，陈默在旁边一家一家试，试到傍晚六点，十七家注册商，全部卡死。\n\n“不是巧合。”陈默放下手机，声音有点哑，“他们把我们所有能走的路都堵死了。域名、服务器、支付渠道，全锁。”\n\n“他们”是谁，两个人心里都有数。\n\n李慕宸靠在椅背上，盯着天花板看了很久。屋里安静得只有风扇转动的嗡嗡声。\n\n然后他忽然笑了一下。\n\n陈默被他这一笑弄愣了：“你还笑？”\n\n“我在想一件事。”李慕宸说，“他能掐我们的域名，掐我们的服务器，说明他查过我们。查过我们，说明他看得起我们。一个看都不看就碾过去的对手不可怕，可怕的是他专门停下来，把十七家服务商全打招呼。”他顿了顿，“他怕我们。”\n\n陈默张了张嘴，半天没说出话。他想了想，也笑了：“你这么一说，好像是这么回事。”\n\n“所以不能让他白怕。”李慕宸打开电脑，“他锁正规渠道，我们就走不正规的。服务器用海外节点，域名绕开备案，大不了不用域名，直接上 IP 访问。你行不行？”\n\n“行。”陈默坐回那堆电脑前面，“给我一晚上。”\n\n李慕宸没有闲着。他打开个人主页，开始写一份声明。\n\n这份声明他写得很慢，字斟句酌。他把人核验要做的事、不做什么事，一条一条列清楚，最后一段，他敲了很久，删了写，写了删，最后只留下一句：\n\n“我们只做一件事：替你把'真'找回来。”\n\n他想了想，又在声明最前面加了一行字：\n\n“人核验的第一条规矩：每一句话都要有人负责，包括反对我们的人。”\n\n发出去。\n\n第二天凌晨四点，陈默顶着两只黑眼圈从电脑前抬起头：“成了。”\n\n“什么成了？”\n\n“服务器。”陈默指了指屏幕上那个还在闪烁的小灯，“自建的，用旧主板拼的，藏在仓库里。没有域名，IP 直接访问。网速一般，但能跑。”\n\n他顿了顿，又补了一句：“我用的是加密通道，他们一时半会儿查不到。”\n\n李慕宸站在他身后，看着屏幕上的指示灯一下一下地闪。\n\n天快亮了。晨光从窗帘缝里漏进来，落在白板上那行红字上。\n\n他打开自己的主页，那份声明已经有人转发了。转发的人不多，但最上面一条来自林晚晴，她只写了一句话：\n\n“这次我站他。”\n声明发布后第三天，林晚晴发来一份文件。\n\n文件是校媒内部流转的，标题被涂改过，看得出原本不打算给人看：《2026 年春季校园 AI 内容污染情况统计》。\n\n李慕宸点开，一行一行看下去，越看眉头越紧。\n\n这份统计做得并不专业，字迹潦草，有些地方画着问号，但内容触目惊心：本学期以来，校内各平台累计发现疑似 AI 生成的低质内容三千余条，覆盖课程作业代写、论文代写、实习证明伪造、考试作弊辅助，甚至包括几起“AI 生成的校园表白墙投稿”，用虚假的“同学投稿”挑动对立，制造流量。\n\n统计表最后，用红笔圈着一段话：经比对，其中相当一部分内容的发布时间、模板句式，与上学期期末曝光的校外 MCN 内容高度相似。疑似同一流水线向校园渗透。\n\n“赵坤那条线，”李慕宸把文件递给陈默，“他没死心。星流传媒被切割，他就换了个壳，往学校钻。”\n\n陈默看完，沉默了一会儿，问：“这三千条，我们管得过来吗？”\n\n“管不过来。”李慕宸说，“但我们可以先查清楚一件事。”\n\n“什么？”\n\n“这条线，是谁在养。”李慕宸把文件里那页红笔圈出的部分单独剪出来，“同样的模板、同样的时间规律、同样的分发方式。工厂可以换招牌，流水线不会。顺着这条线查下去，一定能摸到他们下一个窝点。”\n\n他打开电脑，新建了一个文件夹，命名：校园线。\n\n“人核验的第一份报告，”他说，“就做这个。”\n\n当天下午，李慕宸把那份原则声明又读了一遍，然后在个人主页发了一条简短的状态：\n\n“收到一条线索：AI 造谣的流水线，正在向校园渗透。我们开始查了。人核验第一份报告，下周发布。”\n\n发完，他合上电脑，看了一眼仓库角落里那台旧主板拼成的服务器。指示灯还在一下一下地闪，稳定得像心跳。\n\n陈默从他身后探过头来：“稳了？”\n\n“稳了。”李慕宸说，“真正的仗，还没开始。”"},{"n":6,"t":"把AI的皮扒下来","y":"2027","v":1,"tags":["深度伪造","AI检测"],"p":"林晚晴那份清单，李慕宸看了一整夜。\n\n三千多条疑似污染内容，他一条一条核对过，发现一个规律：越接近期末考试，代写和伪造的帖子越密。下个月就是期末","body":"林晚晴那份清单，李慕宸看了一整夜。\n\n三千多条疑似污染内容，他一条一条核对过，发现一个规律：越接近期末考试，代写和伪造的帖子越密。下个月就是期末，也就是说，这条流水线现在正是最忙的时候。\n\n“等不了十五个工作日了。”凌晨两点，他把陈默从电脑前叫起来，“报告提前发。”\n\n“证据够了吗？”\n\n“够用了。”李慕宸说，“我们不需要把每一条都坐实，只需要把'流水线存在'这件事证明给所有人看。方法公开，谁都能自己验。”\n\n两人连夜把证据链整理成报告。李慕宸负责文字，陈默负责把交叉验证的每一步截图存档，编成附录。报告写到天亮，标题定为：《AI 内容污染核查报告（第一期）：一条流水线的解剖》。\n\n发布前一个小时，陈默忽然盯着屏幕，脸色变了：“有人进来了。”\n\n“什么？”\n\n“服务器。刚刚有人扫了我们端口，试了三次登录，没成功。”陈默调出日志，“IP 是境外的，用了跳板。这是，试探。”\n\n话音未落，李慕宸的手机亮了，一条匿名消息：\n\n“今晚删稿，否则明天你出名。”\n\n陈默看着他：“怎么办？”\n\n李慕宸盯着那条消息看了几秒，忽然笑了：“出名的意思，是帮我宣传？那还挺划算的。”\n\n他打开报告文档，在最后一页又加了一章，标题：《核查方法公开版》。\n\n“他们越怕什么，我们越要公开什么。”他说，“我把方法写成教程，谁想学都能学。他们能删我一篇稿，删不掉全网学会的方法。”\n\n发布按钮按下去的时候，是上午九点。\n\n报告挂在他们自建的 IP 站点上，只挂了一串乱码样的地址，连个像样的域名都还没注册。李慕宸把链接发到几个公开的讨论组里，然后盯着后台的访问计数。\n\n一小时过去，访问数三百多。阅读量寥寥，评论区零星几条，有人问“这网址是真的吗”，有人发了个已阅的表情。\n\n陈默有点坐不住：“是不是，凉了？”\n\n“再等等。”李慕宸说。\n\n他嘴上说再等等，手却不由自主地一遍遍刷新页面。中午十二点，访问数涨到五百，还是没有起色。他合上电脑，去楼下买了两个盒饭，回来的时候，陈默正盯着屏幕，眼睛瞪得老大。\n\n“怎么了？”\n\n“你看。”陈默把屏幕转过来。\n\n后台的访问曲线，正以一个近乎垂直的角度往上冲。五百、一千、三千、一万。\n\n“从哪来的流量？”李慕宸凑过去。\n\n“一个科普博主，粉丝三百多万，刚刚转发了咱们的报告。”陈默把博主的主页调出来，那条转发配了一句话：\n\n“终于有人把 AI 的皮扒下来了。”\n\n李慕宸盯着那句话，忽然觉得眼眶有点热。\n\n他没有说话，把盒饭放下，坐回电脑前，看着访问数一路往上爬。到了下午三点，报告冲上了热搜，话题叫“人核验”。\n\n评论区什么都有。有人说“这才是媒体该干的事”，有人说“方法我照着验了一遍，是真的”，有人问“你们团队多少人”。底下最高赞的一条回复替他们答了：“不管几个人，人家把方法公开了，这就是格局。”\n\n那天晚上，两个人谁都没睡。\n\n陈默把服务器日志一条一条翻过去，访问记录全是正常请求，安全日志里只有几回白名单握手，他才把旧主板机器上的小灯调亮了一点。他靠在椅背上，忽然说了句：“我以前觉得，写代码这件事，写到最好也就是让系统跑起来。今天我觉得，让该跑的东西跑起来，让不该跑的东西跑不下去，才算是写明白了。”\n\n李慕宸没接话。他把报告从头到尾又读了一遍，读到附录里陈默存的那张截图，是星流传媒一个月前的一条模板帖和报告里那条造谣帖并排放在一起，发布时间差四秒，句式一模一样。他忽然想起自己第一天看到老家那条帖子时的感觉，那时候他只有一部手机和一个疑问。现在疑问长成了证据，证据又长成了一份被三百万人看过的报告。\n\n“如果有一天我们做不下去了，”李慕宸说，“至少这套方法还在网上。它不会因为任何人删库而消失。”\n\n“你这话说得像个预言家。”陈默说。\n\n“不，”李慕宸说，“像个记者。”\n\n热搜挂到傍晚，连锁反应来了。\n\n先是赵坤的星流传媒官方账号，连夜清空所有内容，简介改成“公司业务调整中”。然后是广告商，第二天早上，李慕宸在陈默截回来的页面截图里看到，星流传媒之前挂的三个品牌广告位，全部换成了“招租”。\n\n“跑了。”陈默说，“删库跑路。”\n\n“还没跑完。”李慕宸说，“他们能删自己的号，删不掉全网存下来的报告。”\n\n第三天，多家媒体跟进转载。有一家行业媒体专门写了篇评论，标题是：《AI 时代的第一套核查标准，出自两个大学生》。文章里引用了报告附录里的核查方法，逐条点评，最后说：“这套方法并不高深，难的是有人把它做出来，还愿意公之于众。”\n\n李慕宸把这篇评论看完，没有转发。他打开邮箱，收件箱已经塞满了合作邀约，有平台请他做审核顾问的，有媒体约专访的，有公司想买核查方案，有机构想请他去做讲座的。\n\n他一封都没有点开。\n\n他先给林晚晴发了一条消息：\n\n“清单的事，欠你一次。”\n\n林晚晴回得很快：“不欠。清单是你自己查出来的，我只是递了把刀。”\n\n“那把刀递得及时。”李慕宸打完这行字，想了想，又删掉，换成一句：“报告封面上那句话，是你先说的。”\n\n“哪句？”\n\n“每一句话，都要有人负责。”\n\n林晚晴没有回。过了很久，她发来一个句号。\n\n李慕宸盯着那个句号看了一会儿，把手机放下。\n第三天傍晚，李慕宸做了一件没人注意到的事。\n\n他把报告里的核查方法，又单独整理成了一份公开文档，发在个人主页上，标题叫《你也能学会的 AI 内容核查五步法》。开头他写了一段话：\n\n“这套方法不是我发明的，是老周教的，是新闻行业教了几十年的基本功，只是换了个时代重新用。我把它公开，不是因为我大方，是因为我算过账：方法藏在一个人手里，能查的是一条线；方法放在所有人手里，能查的是一张网。我需要那张网。”\n\n发完，他给老周发了条消息，把报告链接和这句话一起转了过去。\n\n老周没有回复。过了半小时，他发来两个字：“可以。”\n\n晚上，李慕宸坐在出租屋里，把热搜榜又刷了一遍。“人核验”还在榜上，位置往下掉了几名，但讨论还在。有一个话题爬了上来，叫“AI 时代第一套核查标准”，点进去，是那家行业媒体的评论文章，被转了几万次。\n\n他一条一条往下翻，翻到一条评论，是一个高中老师发的：\n\n“我是高中老师。我们学校上个月抓到三个学生用 AI 代写作文，我当时只做了思想教育，现在想想，我们应该教会他们怎么识别 AI 写的东西。谢谢你们把方法公开。我打算下周在课堂上教这个。”\n\n李慕宸盯着这条评论看了很久，然后把手机放下。\n\n窗外天已经全黑了，出租屋的灯亮着，白板上那行红字在灯光下格外清楚。他坐回电脑前，看着热搜榜上“人核验”三个字，指节在桌面上敲了两下。笃，笃。\n\n他知道，动了星流传媒，背后那笔钱不会善罢甘休。沈临风这两天一直沉默，沉默得像一潭水，看不出深浅。广告商撤单、星流传媒删号，这些他都看在眼里，却一声没吭。\n\n太安静了。\n\n李慕宸正想着，手机又亮了，一条新的匿名消息：\n\n“报告写得不错。下一份'报告'，主角换成你自己。”"},{"n":7,"t":"全网都在骂我","y":"2027","v":1,"tags":["网络舆论","暴力"],"p":"视频是凌晨三点爆的。\n\n标题党起得又快又狠：《人核验创始人收钱删稿实锤！偷拍视频流出》。配图是一段三分钟的视频，画面里光线昏暗，角度像是从窗帘缝","body":"视频是凌晨三点爆的。\n\n标题党起得又快又狠：《人核验创始人收钱删稿实锤！偷拍视频流出》。配图是一段三分钟的视频，画面里光线昏暗，角度像是从窗帘缝里偷拍的：一个男人坐在沙发上，面前摊着一沓现金，对面坐着另一个男人的背影。弹幕和评论区像开了闸：\n\n“这就是天天喊真话的？真话是按字数收费的？”\n“删稿收钱，查谁收费，人核验，人设崩了。”\n“坐等大V翻车。”\n\n李慕宸是被陈默的电话吵醒的。他打开视频，只看了一遍，就认出来了：画面里那个“他”，脸是他的脸，声音是他的声音，连皱眉的小习惯都对。\n\n但他是坐在出租屋的白板前写报告的，那个视频里的房间，根本不是他的房间。\n\n视频里的“他”正在说话。声音很轻，带着那种被偷拍时的含糊：“那篇稿子，撤了。钱，老规矩，先一半，事成再一半。”对面的男人数出一沓现金，推过来，镜头在这里晃了一下，又稳稳对准“他”的脸。“他”伸手接过，低头看了一眼，嘴角动了动：“行，合作愉快。”\n\n这一段，三分钟，每一帧都像真的。语气里那种见不得光的压低，数钱时指腹摩挲纸面的声音，连手机屏幕的光都模拟得恰到好处。\n\n“我从来没说过这种话。”李慕宸把视频进度条拖回开头，“我也从来没坐过那样一张沙发。”\n\n他没有急着发声明。\n\n他拉上窗帘，把视频下载到本地，一帧一帧开始看。第一遍看光影：画面里“他”脸上的光，和窗外的天色角度对不上，一个来自左边，一个来自右边。第二遍看口型：话是完整的，可换气的节拍比真人慢半拍，嘴唇闭合的力度像是被软件捏出来的。第三遍看背景：沙发扶手上的纹路在镜头移动时轻微变形，那是一条人工纹理在重绘时留下的破绽。\n\n结论很清楚：这是深度伪造。\n\n但李慕宸没有立刻把结论发出去。他盯着评论区那些骂声看了很久，最终只是把视频又看了一遍，把怀疑点记在备忘录里。\n\n“现在发声明，没人会信。”他对陈默说，“全网都在气头上。气头上的人，只想看墙倒众人推。我说'视频是假的'，他们只会说'急了急了'。我要等，等到他们愿意看一眼证据的时候。”\n\n“那要等到什么时候？”\n\n“等到证据硬到不用我解释的时候。”\n\n上午十点，陈默的邮箱收到一封解约函。\n\n合作的技术服务商通知：因“不可抗力”，原定的服务器托管与带宽合作即日起终止，限三日内迁移。措辞客气，落款公事公办。陈默打电话过去，对方支支吾吾，只说“公司层面决定”，再多问就是“抱歉，具体原因不便透露”。\n\n“三日内迁移。”陈默挂了电话，“咱们那台旧主板机器，加上我自己凑的网络，撑不住现在的流量。”\n\n“能撑多久？”\n\n“一天，顶多一天半。还得祈祷没人攻击。”\n\n李慕宸还没来得及接话，手机又震了。林晚晴发来一张截图，后面跟着一行字：“我没事，你别担心。”\n\n截图是一篇帖子，标题赫然写着：扒一扒人核验背后的“白手套”，配图是林晚晴的校园采访照，姓名、学院、专业，一行一行列得清清楚楚。评论区有人喊“学新闻的都不是好东西”，有人已经开好了“人肉”的传送门，要“挖她住哪个宿舍”。\n\n李慕宸盯着那张截图，手在屏幕上停了很久。\n\n他想起来，林晚晴转发人核验报告那天，主页还挂着校媒记者的身份。现在，因为那一次转发，她被人从人群里拎了出来，钉在墙上示众。\n\n他给她回消息，打了几个字又删掉，最后只发了一句：“对不起。”\n\n“不用道歉。”林晚晴回得很快，“我自己转的，我自己认。你专心查你的，别理他们。”\n\n那天白天，李慕宸第一次体会到“全网都在骂”是什么感觉。\n\n人核验的账号，粉丝从最高点的三万，一天掉到九千。后台私信里，骂他的占了九成，剩下的一成是问“你收了多少”的。评论区最扎心的一条是：“我以为你是那个把 AI 皮扒下来的人，结果你自己才是那层皮。”\n\n他没有删任何一条。全部留着，截图，存档。\n\n“留着干嘛？”陈默不理解。\n\n“以后翻盘的时候，这些都是证据。”李慕宸说，“现在删了，他们会说我心虚。留着，等真相出来，每一句骂都是对照。”\n\n下午，他去学校食堂打饭，排队的时候，前面两个女生回头看了他一眼，其中一个压低声音说：“就是他吧？那个收钱删稿的？”\n\n那一句落进安静的食堂里，旁边两排端着餐盘的人都停了筷子。李慕宸没有辩解，端着餐盘走到角落，一个人吃了那顿饭。\n\n吃饭的时候，他收到一条私信。头像是一个普通的风景图，ID 是一串数字，一看就是小号。私信只有一句话：\n\n“视频里那个收钱的人，手背上有颗痣。我看完了你之前全部的报告，你写代码的时候手腕上没有痣。别问我是谁，我不信他们。等你的证据。”\n\n李慕宸盯着那条私信看了很久。他没有回，把手机锁屏，低头扒完那顿饭。\n\n深夜，出租屋里只亮着一盏台灯。\n\n桌角压着一张纸，是李慕宸自己打印的。林晚晴的采访照，下面跟着那篇“白手套”帖子里列的姓名和学院，他用红笔在那行字下面划了一道，划得很重，纸背都透了。\n\n李慕宸把那段视频反复看了七遍，每看一遍，心里那点东西就往下沉一分。不是为自己。为林晚晴。为一个只是转了条真相帖的女孩，被人扒出学校、扒出姓名、扒出宿舍，底下几千条评论等着看她的笑话。\n\n他红着眼眶，对旁边正在改代码的陈默说：“我不能让晚晴替我挡刀。”\n\n陈默停下键盘，看他。\n\n“视频是冲我来的，刀却先落在她身上。”李慕宸说，“我能接受全网骂我，但我不能接受因为她信了我，就要被人肉。这场仗，我得主动打。”\n\n“怎么打？”\n\n“他们以为我不敢自证，以为我会像所有被锤的人一样，发一篇软弱的声明，然后消失。”李慕宸打开那个视频文件，“但我偏不。我要把这段视频一帧一帧拆开，把里面的'指纹'找出来，哪一帧有生成痕迹，哪个模型的手艺，哪家供应商的API。把这些证据摆到所有人面前，让他们看看，是谁在给'真相'定价。”\n\n他拉上窗帘，把屏幕亮度调到最高，鼠标拖到视频里那个“他”的脸部特写，双击，放大到百分之四百。\n\n像素像雪花一样铺开。噪点里，隐约有一条条细密的、方向一致的纹理，像是水面的波纹，又像是织物的经纬。那不是摄像头拍出来的颗粒感，那是生成模型在“重绘”人脸时留下的规律性痕迹。\n\n他的手指停在那一处像素异常上，没有动。\n\n身后，陈默的声音忽然响起来，带着一种很奇怪的冷静：“查到了。”\n\n“什么？”\n\n“这段视频的生成器。”陈默盯着屏幕上的代码，“指纹对上了，是星流传媒名下那套'内容增强系统'的生成模块。他们删了库，但生成器调用的水印参数没擦干净。”\n\n李慕宸没有回头，眼睛依然盯着屏幕里那处异常像素。\n\n窗外的风刮了一夜。灯下，百分之四百的像素点铺满整个屏幕，像一片密密麻麻的、等着被读出来的口供。"},{"n":8,"t":"指纹","y":"2027","v":1,"tags":["技术溯源","调查"],"p":"距离发布倒计时还剩二十四小时的时候，那段伪造视频的播放量还在疯涨。\n\n三百万。五百万。评论区已经从“人核验翻车”演变成“早就觉得他不靠谱”，有人","body":"距离发布倒计时还剩二十四小时的时候，那段伪造视频的播放量还在疯涨。\n\n三百万。五百万。评论区已经从“人核验翻车”演变成“早就觉得他不靠谱”，有人把李慕宸以前的核查报告逐条翻出来，逐条打上问号。人核验的账号还在掉粉，掉到六千，还在掉。\n\n陈默把查到的指纹证据整理成了三份：一份存本地，一份存加密盘，一份刻成光盘，藏在出租屋地板下面。\n\n“万一哪份被销毁了，还有另外两份。”他说。\n\n李慕宸点点头，目光落在白板上那行红字上。他伸手，在那行字下面又添了一行小字：包括反对我们的人。\n\n“你说过的话，你自己得先做到。”他对那行字说，“现在全网都在反对我们。正好，用一场直播，把话说明白。”\n\n傍晚六点，一个陌生号码打进来。\n\n李慕宸接起，电话那头是一个平静的声音，不紧不慢，像在谈一件再小不过的事：“李慕宸？我是沈临风。”\n\n“沈总。”\n\n“视频的事，我看了。做得确实有点过。”沈临风说，语气里听不出任何情绪，“不过话说回来，你那个网站，三个月前还是零，现在全网都在讨论。从这个角度讲，你也不算亏。”\n\n“沈总打电话来，不是来恭喜我的吧？”\n\n“开门见山。”沈临风说，“开个价，这事就当没发生过。你开价，我付钱，视频撤了，星流传媒那边，我让他们闭嘴。你的网站继续做你的真相，我继续做我的生意，各不相干。”\n\n李慕宸握着手机，安静了几秒。\n\n“沈总，那天在你办公室里，我跟你说过一句话。”他说，“您买的不是媒体，是想买'真相'的嘴。今天我再说一遍：我这张嘴，不卖。”\n\n“你确定？”沈临风的声音冷了一度，“你那个合伙人，家里条件一般吧？你那个同学，还在被人肉吧？你扛得住，他们呢？”\n\n李慕宸手指捏紧了手机，指节发白。他没有发火，语气平得不像话：“沈总，您提醒我了。今晚八点，我直播。请您也看看。”\n\n“看什么？”\n\n“看我怎么把'真相'的价签，贴回它该在的地方。”\n\n李慕宸挂断电话。旁边，陈默已经把直播间的技术方案调了出来：“推流设备、备用网络、防封策略，都备好了。你真要直播？”\n\n“不是我要直播。”李慕宸说，“是全网要我直播。我不露面，他们说我是缩头乌龟；我发文字声明，他们说我是公关稿。那就直播，当众拆，当众验，让他们自己看。”\n\n晚上八点，直播间准时开播。\n\n没有开场白，没有寒暄。李慕宸坐在白板前，镜头对准他的正脸，第一句话是：“我是李慕宸，人核验创始人。三天前那段视频里的人不是我。今晚，我给你们看我为什么这么说。”\n\n他调出那段视频，一帧一帧放大。\n\n第一处：光影。视频里“他”脸上的主光源来自左上方，而画面里窗户透进来的“天色”来自右侧。“这是两个光源打架。真实拍摄里，室内光可以乱，但窗外天光的方向，和脸上的光，必须同向。这里，对不上。”\n\n第二处：口型。“他说'钱到账'这三个字的时候，'账'字的嘴唇闭合早了零点三秒。真人说话，唇形和声音的延迟不会这么整齐。生成模型为了让语音和口型对齐，反而会留下这种'过分整齐'的痕迹。”\n\n第三处：背景。“沙发扶手上的纹理，在镜头移动的时候变形了。这一段，是模型在逐帧重绘画面时留下的抖动。你们可以自己下载原视频，拖到这一帧，放大，看扶手纹理是不是在'呼吸'。”\n\n他一条一条讲，讲得很慢，每一处都停下来，把放大后的画面指给镜头看。直播间里，弹幕先是刷着“洗地”“公关”，渐渐地，变了味道。\n\n“卧槽，第三处那个纹理抖动是真的。”\n“我自己拖了一遍，对上了。”\n“等一下，所以这视频真是假的？”\n\n他讲到第四处的时候，弹幕已经安静下来。他把画面停在一帧，用红框圈出人脸边缘一条细密的、方向一致的纹理：“这是生成模型的水印，藏在噪声里的签名。每一家模型的水印参数都不一样，就像人的指纹。”\n\n他调出陈默整理的比对图，并排放在屏幕上：“而这条指纹，和星流传媒名下那套'内容增强系统'的生成模块，完全一致。他们删了库，擦掉了账目，但没擦掉参数里的签名。”\n\n“这段视频，是他们自己生成的。”\n直播间里安静了两秒。\n\n然后弹幕炸了。\n\n“星流传媒？就是那个刚被扒过一遍的？”\n“他妈的，贼喊捉贼啊。”\n“所以人核验第一份报告查的就是他们，他们这是报复？”\n“我错怪他了。我道歉。”\n“道歉有用要警察干嘛，刷起来：对不起。”\n\n李慕宸没有看弹幕里那些道歉。他调出第二个页面，语气没有变化：“这段视频只是开始。接下来，是人核验整理的完整证据链。”\n\n屏幕上，一份文档铺开，标题：《深度伪造产业链核查报告（第一期）》。\n\n他一条一条讲。批量造假的流水线如何运作，模板帖如何定时分发，伪造视频的制作订单如何从星流传媒发出、经由哪一层中介下达、费用如何结算。文档末尾附着一串编号，他念出其中一组：“订单号 P-1037，委托人，星流传媒运营部；制作内容，伪造视频一段；交付时间，本月初。这个编号，我早就在查了。”\n\n“从今天起，”他说，“谁再删我们的库，我们就再挖一层。”\n\n直播快结束的时候，弹幕里忽然涌进一批新消息：“警察来了”“热搜爆了”“星流传媒被查了”。\n\n李慕宸低头看了一眼手机，热搜榜上，新的词条正在往上爬：星流传媒被查。他点开，是一条刚发出的快讯：今日晚间，公安部门对星流传媒科技有限公司开展调查，公司运营总监赵某被带走协助调查，相关设备被封存。\n\n他抬起头，对着镜头，把最后一段话说完：“人核验做的只有一件事：把'真'找回来。今晚这堂公开课，谁都能学会。我希望下次再有人被造谣的时候，不用等到直播，看一眼就能识破。”\n\n直播结束。\n\n他关掉推流，靠在椅背上，长长地吐了一口气。窗外下起了雨，是 AI 元年的第一场春雨。陈默从电脑后探出头，哑着嗓子说：“回粉了。不，不是回粉，涨了。现在二十万了。”\n\n“嗯。”\n\n“你就'嗯'？”\n\n“不然呢？”李慕宸说，“他们骂我的时候我也没喊。现在不骂了，我也不用喊。”\n\n他拿起手机，想给林晚晴发点什么，打字打了一半，又删掉。直播前，他听陈默说，林晚晴今晚一直在线，从头看到尾，没发一条弹幕，也没刷一句“加油”。\n\n他最后发了四个字：“都过去了。”\n\n林晚晴回得很快：“嗯。你刚才讲口型那段，我拿去给校媒的人看了。”\n\n“有用吗？”\n\n“有用。”她说，“他们说要请你去开讲座，教大家怎么识别 AI 假视频。”\n\n李慕宸盯着屏幕，忽然不知道该说什么。过了很久，他打出一行字，又删掉，又打出来：“清单的事还你。这条命替你挡刀的事，我记下了。”\n\n屏幕那头安静了很久。\n\n“谁替你挡刀了。”林晚晴回，“我只是站在你这边，站得比较稳而已。”\n\n他没有回。\n\n他把手机扣在桌上，抬头看窗外。雨还在下，路灯把雨丝照成一片亮晶晶的帘子。热搜第一的位置，已经换成了“人核验”三个字。\n\n“赢了。”陈默说。\n\n“赢了一场仗。”李慕宸说。\n\n手机忽然又震了一下。他低头，是一条推送的国际新闻，标题很长：《AI 深度伪造技术被曝干扰多国选举进程，专家呼吁全球立法》。\n\n他盯着那条新闻看了很久，然后缓缓抬头，看着窗外那片雨帘。\n\n雨还在下。他拿起笔，走回白板前，在那行红字下面又添了一行小字：明天的那场战争，也得有人负责。\n\n然后他坐回电脑前，没有关灯，新建了一个文档，标题栏光标闪了两下，他敲下六个字：《全球伪造观察》。窗外，AI 元年的第一场春雨还在下，白板上的字迹被台灯光照得发亮。"},{"n":9,"t":"教育战场","y":"2028","v":1,"tags":["教育","AI进课堂"],"p":"举报是夜里十一点开始涌入的。\n\n先是十几条，然后几百条，再然后，后台的举报信箱直接挤爆了。李慕宸点开第一条，是一封长信，落款是个高中生家长：","body":"举报是夜里十一点开始涌入的。\n\n先是十几条，然后几百条，再然后，后台的举报信箱直接挤爆了。李慕宸点开第一条，是一封长信，落款是个高中生家长：\n\n“我家孩子明年高考，瞒着我们报了一家叫'慧学网'的升学机构，花了四万八。机构承诺'名校老师一对一辅导，论文、材料、履历一站式搞定'。孩子说，他们的'老师'从来不露面，作业和论文都是一段一段'生成'的。我拷贝了孩子电脑里的一篇论文，开头几段写得像模像样，可一问孩子，他连论文里那句话什么意思都说不出来。”\n\n信的末尾附了一个截图：慧学网的宣传页，醒目的标语写着“AI 赋能升学，让每一份材料都完美”。\n\n李慕宸把信看完，没有立刻处理。他先给陈默发了条消息：“查一下慧学网。”\n\n“什么背景？”\n\n“先查它有没有备案，再查它有没有跑过 AI 生成内容的痕迹。”\n\n三天后，陈默的报告出来了，比想象中严重得多。\n\n慧学网不是一家小机构。它有官网、有线下门店、有合作学校，宣传册上印着“服务学员超十万”。它的“AI 代写流水线”藏得很深：一套模板库，覆盖几百种论文题目，学生选一个题，系统自动生成开题报告、正文、结论，还能根据查重结果自动改写，把重复率压到百分之五以下。更离谱的是，它还批量伪造实习证明、获奖证书、推荐信，每一份都盖着公章。\n\n“这套系统不是慧学网自己写的。”陈默说，“我扒了它的接口，它调用的底层模型服务商，注册主体是一家叫'启明'的公司。而启明的股权结构里，有一条线，连着。”他顿了顿，“反正，背后有资本。”\n\n“多深？”\n\n“深到查下去可能会咬到人。”陈默说，“要不要继续？”\n\n“继续。”李慕宸说，“但先别碰资本那条线。先把'代写流水线'坐实。流水线是摆在明面上的，谁都赖不掉。”\n\n他把核查任务分给团队，现在人核验已经不是两个人了，直播那晚之后，有七个应届毕业生和两个大四学生主动加入，他们管自己叫“核验员”。李慕宸让他们一人领一个模块：论文模板库、查重绕过、伪造证明、宣传话术，分头取证，汇总核验。\n\n第五天，证据链拼齐了。李慕宸把报告初稿摊在桌上，还没写完，一个自称“慧学网市场总监”的人找上门来。\n\n男人西装革履，进门先客套两句，然后开门见山：“李总，我们老板看了你们最近的动向，很欣赏。想跟你们合作：每年六十万广告费，你们平台上'顺手'推一推慧学网的正向内容，别的不需要做。”\n\n“顺手推一推？”\n\n“就那种软文，不硬。你们该查谁查谁，我们绝不干涉。就是，教育这个领域，水深，容易淹着人。六十万，够你们团队养一年了。”\n\n李慕宸把报告初稿合上，抬头看他：“您知道我现在在查什么吗？”\n\n“不、不知道啊。”\n\n“我在查你们。”李慕宸说，“你老板让你们来谈合作之前，没告诉你们，你们的模板库里有一篇论文，替一个高二学生'写'的，那学生后来用这篇论文参加比赛，被评委当场问住，人还没出考场就哭了。”\n\n男人的笑容僵在脸上。\n\n“我不缺那六十万。”李慕宸说，“我缺的是让那孩子以后不用再花四万八去买一篇自己都读不懂的论文。”\n\n男人脸色变了，站起来，语气冷下来：“李总，给脸不要脸的话，我们也有别的办法。”\n\n“什么办法？”\n\n“你等着看吧。”\n\n他走后第三天，“别的办法”来了。网上开始流传几篇稿子，标题大同小异：《人核验蹭教育热点，消费家长焦虑》《一个自媒体，凭什么给教育机构定罪》。措辞专业，配图齐全，一看就是公关公司的手笔。\n\n陈默把截图发给李慕宸：“要不要回应？”\n\n“不回应。”李慕宸说。\n\n“为什么？”\n\n“回应就输了。”李慕宸把报告最终稿打开，“他们的办法是抹黑，我的办法是立规矩。抹黑会过去，规矩会留下来。看谁耗得起。”\n三天后，人核验发布了《教育 AI 造假治理倡议书》。\n\n这份倡议书，李慕宸写了七稿。第一稿是揭黑稿，写慧学网怎么骗钱、怎么毁孩子，写得血泪斑斑；他删了。第二稿是调查报道，把证据链完整铺开，附上核查方法，写得滴水不漏；他又删了。\n\n“为什么不发？”团队里有人不理解，“证据都齐了，发出去就是大新闻。”\n\n“发出去，慧学网倒了，然后呢？”李慕宸说，“倒下的是慧学网，站起来的是'慧学网们'。流水线还在，换个招牌就能重来。我们要做的不是锤死一家，是让这条路走不通。”\n\n最终发布的倡议书，只有三条主张：\n\n第一条：学校应建立 AI 使用规范，明确什么可以交给 AI，什么必须本人完成。\n第二条：升学与学术材料应引入 AI 内容检测，对批量生成的代写材料实行一票否决。\n第三条：AI 生成内容应强制标识，让每一篇论文、每一份材料，都能追到它的来源。\n\n倡议书落款处，只有一行字：人核验。每一句话，都要有人负责。\n\n发布当天，六所高校在官方账号转发倡议书，其中两所直接宣布：下学期起，本科毕业论文引入 AI 内容检测。第三天，教育部门约谈慧学网，要求其整改 AI 代写业务，退还相关费用。\n\n消息传回来的时候，已经是深夜。办公室的灯还亮着，陈默靠在对面的椅子上，把手机放下，问出了那句压在嘴边的话：“你手里证据那么全，锤死慧学网绰绰有余。为什么不直接锤？”\n\n“锤死一家，不如立一个规矩。”李慕宸说，“规矩立住了，比锤死一百家都管用。”\n\n“你以前不是这么想的。”陈默说，“以前你恨不得把造假的人一个个揪出来。”\n\n“以前我只有一张嘴，只能一个个揪。”李慕宸说，“现在人核验有几十张嘴了，能做的事情不一样。一个人能做的，是揭穿；一群人能做的，是改变规则。”\n\n陈默没再接话。他低头看了看倡议书，又抬头看了看白板上那行红字。“每一句话，都要有人负责”，下面多了一行小字：包括反对我们的人。\n\n“那行字，”他忽然说，“越来越长了。”\n\n李慕宸把倡议书打印稿折好，收进那个旧帆布包里，拉上拉链。帆布包贴着桌沿，他指尖碰到包里那个硬硬的边角，是外公的旧收音机。\n\n他忽然想起老家那条老街。\n\n老街口的公告栏，上个月还有人贴那种造谣的帖子。他查了三个月，查出了星流传媒，查出了慧学网，查出了一整条 AI 造假的产业链，可他还没回去过，没看过那条街现在变成什么样了。\n\n要是老家也有人被 AI 骗了呢？\n\n他掏出手机，拨了家里的电话。响了两声，通了。\n\n“爸。”\n\n“哎。”父亲的声音听起来很疲惫，像是刚收工，“这么晚了还没睡？你妈老念叨你，说你那个什么'人核验'，天天在网上被人骂，让我劝你别干了。”\n\n“没人骂我了，现在都夸。”李慕宸说，“爸，你声音怎么这么累？”\n\n“厂里要上机器人了。”父亲说，“新设备，得有人盯着调试，这几天都在加班。你妈说让你别担心，家里挺好的。”\n\n李慕宸握着手机，沉默了几秒。\n\n“爸，那个机器人，是干什么的？”\n\n“流水线的，说是能顶三个人。”父亲打了个哈欠，“行了，不说了，明早还得早起。你自己注意身体。”\n\n电话挂断。出租屋里安静下来，窗外是夜色，城市的灯光远远地亮着。\n\n李慕宸把手机放下，帆布包还搁在桌上。他忽然觉得，自己查的那些流水线，和他爸工厂里那条正在上马的流水线，中间只隔着一层窗户纸。"},{"n":10,"t":"父亲的工厂","y":"2028","v":1,"tags":["制造业","家庭"],"p":"中秋前一天，李慕宸回了老家。\n\n他本来打算端午再回，可挂了那通电话之后，他翻来覆去睡不着。父亲那句“厂里要上机器人了”，说得平平淡淡，跟说“今天","body":"中秋前一天，李慕宸回了老家。\n\n他本来打算端午再回，可挂了那通电话之后，他翻来覆去睡不着。父亲那句“厂里要上机器人了”，说得平平淡淡，跟说“今天下雨”似的，可他听着，总觉得哪里不对。\n\n高铁两个小时，转一趟大巴，再走十分钟，就到了老街。巷口那棵老槐树还在，树底下坐着几个下棋的老人。李慕宸拖着行李箱经过，有人认出他：“这不是老李家那小子吗？那个查假新闻的？”\n\n“叔，我回来过中秋。”\n\n“好，好。”老人点点头，“你爸这两天高兴坏了，逢人就说你上了电视。”\n\n家里门虚掩着。李慕宸推门进去，母亲正在厨房里剁馅，听见动静探出头：“回来啦？瘦了。”她擦了擦手，往屋里努努嘴，“你爸在里屋，躺一会儿，昨晚夜班。”\n\n李慕宸放下箱子，轻手轻脚走进里屋。父亲侧躺着，身上还穿着厂里的工服，没脱，头发里夹着几根新白的。他打着轻鼾，一只手搭在床沿，指节粗大，指缝里嵌着一层洗不净的机油黑。\n\n他没叫醒他，退出来，帮母亲包饺子。\n\n“妈，厂里到底怎么了？”\n\n母亲手上的动作停了一下，又继续，声音压得很低：“你别在你爸面前提。厂里引了一批新设备，说是智能产线，能顶好多人。你爸干了二十年，是老师傅了，结果现在给调到什么'设备看护岗'，说是重新培训，工资没涨，班次还乱了。”\n\n“那。”\n\n“厂里都在传，”母亲压低声音，几乎是用气音说，“第一批要裁掉百分之三十的人。”\n\n李慕宸手里的饺子皮捏紧了。\n\n“你爸啊，嘴硬。”母亲说，“白天当着人笑呵呵的，晚上躺床上翻来覆去。他这辈子就认一个道理：手艺好，走到哪都饿不死。可现在，手艺好像不那么值钱了。”\n\n晚饭时，父亲醒了，看见儿子回来，眼睛亮了一下，嘴上却嫌弃：“回来干啥，来回折腾。”\n\n“回来吃月饼。”\n\n“行吧。”父亲坐到桌边，夹了一筷子菜，忽然没头没脑来了一句，“机器人不会喊累，你爸我还得学着伺候它。”\n\n李慕宸愣了一下：“爸？”\n\n“厂里新来的那玩意儿，说是机械臂，晚上不用休息，二十四小时都能干。”父亲嚼着饭，语气像在讲一件跟自己无关的事，“领导说了，老工人要学新技能，会操作平板才算合格。你爸我连微信都刚学会，现在又要学那个。”\n\n“学得会吗？”\n\n“学不会也得学。”父亲说，“总不能让人把话说到脸上：老师傅，你那个手艺，机器都会了。”\n\n饭后，父亲要去上夜班。李慕宸说：“我跟你去。”\n\n“你去干啥？”\n\n“看看你的新设备。”\n\n父亲拗不过他，从柜子里翻出一件干净工服扔给他：“穿上。厂里规矩，不穿工服不让进。”\n\n夜班从晚上十点开始。李慕宸第一次进父亲工作二十年的车间，迎面是一排崭新的机械臂，蓝白色的灯光照着，动作整齐划一，装箱、码放、传送，一气呵成。旁边，几个老工人正围着一名年轻的技术员，听他讲解平板上的操作界面。\n\n父亲也在其中。\n\n他蹲在操作台前，手里握着平板，拇指在屏幕上点了两下，没点中，又点，还是没点中。年轻技术员凑过来，手指飞快地划了几下：“李师傅，这样，先点这里，再滑这个。”\n\n父亲“哦”了一声，又试了一遍，这次点中了，但滑动的方向反了，界面跳回主页。他咧嘴笑了笑：“老了，手笨。”\n\n年轻技术员说：“多练练就会了，不难。”\n\n“是，不难。”父亲附和着，声音很轻。\n\n李慕宸站在车间门口，看着父亲蹲在那台平板前面的背影。机械臂的蓝光映在他花白的头发上，旁边二十出头的技术员已经转身去教下一个工人了，他还在反复点那一个按钮，点一下，停下来，眯着眼睛看屏幕，再点一下。\n\n车间里机器轰鸣，没有人注意到这个角落。\n\n凌晨一点，交班。父亲直起腰，捶了捶后腰，把平板交回储物柜，走到更衣室，从柜子最深处摸出一个红布包。\n\n他坐在长凳上，一层一层打开。里面是一枚铜质奖章，红绒底座，“优秀工人”四个字磨得有些发亮。他用拇指擦了擦，举到灯下看了看，又用袖子擦了一遍。\n\n李慕宸走过去，挨着他坐下：“厂里发的？”\n\n“早年间发的。”父亲说，“那会儿我刚进厂，手艺好，干活快，年年评先进。这枚是九八年的，干了二十年，攒了这么一块牌子。”\n\n他把它放回红布包里，轻轻摩挲着：“不知道这个，现在还值不值钱。”\n\n李慕宸喉头发紧，没有接话。\n\n他望着父亲握着红布包的手，指缝里那层洗不净的机油黑，忽然想起自己白板上的那行红字。他查了三个月的假新闻，拆穿了一条又一条 AI 流水线，可他从来没想过，有一天 AI 会以这种方式，走进他爸的车间。\n\n清晨六点，天蒙蒙亮。李慕宸站在厂门口，掏出手机，拍了一张照片：画面里，一排智能机械臂正在装箱，蓝白色的光映在金属外壳上，反光里，隐约映着门口排队打卡的老工人身影。\n\n他把照片存进手机，打开人核验的选题库，新建了一个文件夹，标题写下六个字：《当机器人走进父亲的工厂》。\n\n机械臂的反光在屏幕上一闪而过。\n返程高铁上，李慕宸把那张照片翻来覆去地看。\n\n机械臂的反光，把画面右上角的一小块映得发亮，那里正好是父亲排队打卡的位置，他穿着那件洗得发白的工服，低着头，背影被蓝白色的光拉成一条细细的影。\n\n他把照片放大，又缩小，看了一遍又一遍。旁边座位的小孩在玩平板，屏幕上是一个会说话的机器人动画。李慕宸盯着那个动画看了几秒，又低头看自己的照片，忽然觉得，两个画面之间隔着的，比二十年还远。\n\n母亲在他出门前，往他包里塞了一袋月饼，又追出来，站在巷口叮嘱：“你爸的事，你别跟他说，他自己心里有数。你也别替他着急，他倔，越劝越不听。”\n\n“我知道。”\n\n“还有，”母亲顿了顿，“你自己在外头，别老熬夜。你爸嘴上不说，天天晚上刷你那个号，刷完就叹气，说看不懂，又说看不懂也要看。”\n\n李慕宸没说话，点了点头，进了检票口。走出去老远，回头，母亲还站在巷口那棵老槐树底下，朝他摆手。\n\n高铁过隧道的时候，手机信号断断续续。出了隧道，一条推送消息弹了出来，标题很长：《2029 年白领岗位替代率创新高，报告称多个行业自动化进程加速》。\n\n他点开，草草扫了两眼。报告里列了一串数字：行政、客服、基础编辑，替代率一个比一个高。有一行字他看了很久：“自动化最先替代的不是体力劳动，而是'可以被流程化描述'的工作。”\n\n他忽然想起，自己毕业那年，新闻行业正在大规模裁员；想起父亲厂里那排不知疲倦的机械臂；想起慧学网那套能自动生成论文的模板库；想起昨天深夜，父亲蹲在操作台前，一遍一遍点那个点不中的按钮。\n\n新闻业裁着员，工厂上着机械臂，学校里跑着代写模板。没有一个行当能躲过去。\n\n他把手机锁屏，车窗外的田野连成一片飞驰的绿。他摸了摸帆布包里那张照片的位置，然后打开备忘录，写下一行字：\n\n“AI 元年不是从某一天开始的。是从第一个普通人发现，自己的手艺不值钱了的那天开始的。”\n\n写完，他盯着那行字看了一会儿，又删掉了。\n\n他想起父亲那句话。“机器人不会喊累，你爸我还得学着伺候它。”\n\n他把手机收进兜里，没再拿出来。窗外，田野、河流、城市，一格一格地往后退。他忽然很想快一点回去，快一点把《当机器人走进父亲的工厂》做出来。\n\n那句话，他想替父亲说给更多人听。"},{"n":11,"t":"规则之战","y":"2030","v":1,"tags":["治理萌芽","规则"],"p":"2030 年春天，立法听证会的前一夜，李慕宸收到一条短信。\n\n号码陌生，措辞客气得滴水不漏：“李总，明日的听证会，事关行业创新大局。AI 标识一","body":"2030 年春天，立法听证会的前一夜，李慕宸收到一条短信。\n\n号码陌生，措辞客气得滴水不漏：“李总，明日的听证会，事关行业创新大局。AI 标识一事，望慎言。行业同仁期待与贵方保持长期友好。”\n\n落款是一个他听过名字的行业联盟。发完短信，又追了一条：“当然，纯属善意提醒，别无他意。”\n\n李慕宸把两条短信看完，转发给陈默：“查一下这个号码的关联公司。”\n\n半小时后，陈默回话：“绕了三层，最终落在某某资本旗下的一家企业服务公司。某某资本，就是沈临风那个。”\n\n“意料之中。”李慕宸说。\n\n四年前他刚做媒体的时候，沈临风打电话来，说的是“开个价，这事就当没发生过”。四年过去，沈临风不再打电话给他，改发短信，措辞从“耗得起你”变成了“望慎言”。方式变了，内核没变：还是想给“真相”标一个他能接受的价格。\n\n这次，标的是法律。\n\n第二天上午，听证会大厅座无虚席。议题是《AI 内容标识法》的适用范围与力度。行业联盟推举的代表先发言，PPT 做得精致，核心观点就一条：强制标识将大幅增加企业成本，扼杀创新，建议改为“企业自愿标识”。\n\n“各位，”那位代表说，“我们测算过，强制标识的合规成本，足以让中小 AI 企业失去生存空间。创新需要自由，请给行业留一点呼吸的空间。”\n\n轮到李慕宸作证时，他没有带 PPT。\n\n他走上台，先放了一组数据，是他带着人核验团队花了一个月统计的：过去一年，全网未标识的 AI 生成内容，平均从生成到被大规模传播，用时 6 小时 40 分钟；而同内容的人工辟谣，平均需要 3 天零 5 小时。差距是十一倍。\n\n“刚才那位代表说，标识的成本太高。”李慕宸说，“我来算另一笔账：一条未标识的 AI 新闻，如果造成恐慌，一条假新闻引发的股价波动、医疗误信、群体性事件，成本是多少？我查了三个月的案例，最轻的一桩，是一条 AI 生成的假地震消息，引发三个城市的人群疏散。那三个城市的公共安全成本，够一千家中小企业付十年的标识费。”\n\n大厅里安静下来。角落里，几家媒体的记者在飞快地记笔记，笔尖划过纸面的声音沙沙地响，像是在替他敲下这一笔账。\n\n“成本高的是不标识的后果。”他说，“创新需要自由，但自由的前提是分清真假。没有标识的自由，是让所有人裸奔的自由。”\n\n他停了停，从帆布包里掏出一个旧 U 盘：“我准备了段短片，给大家看。”\n\n灯光暗下来。屏幕上，是一段采访画面。镜头里是一位头发花白的老人，坐在老屋的藤椅上，对着镜头说：“网上说，现在医院有一种'能治百病'的机器，我儿子就信了，非要带我去买。我拦不住他。后来才知道，那是人家用电脑做出来的假视频，我儿子刷了一晚上，刷得眼圈都红了。”\n\n画面切回听证席。没有人说话。\n\n“这是今年三月，我在调研里录的一段。”李慕宸说，“老人被 AI 视频骗，不是因为笨，是因为没有人告诉他，画面上那些'医生''机器'，可能根本不是真的。标识解决不了所有问题，但它给每个人一个起码的知情权：这段内容，是人做的，还是机器做的。有了这个权利，人才有得选。”\n\n听证席上，有人在翻文件，有人在交头接耳。那位行业联盟代表张了张嘴，最终没有出声。\n\n一周后，法条修改获通过：《AI 内容标识法》落地，强制标识，过渡期一年。\n\n消息传回人核验办公室那天，团队开了瓶汽水庆祝。陈默举着杯子问李慕宸：“下一步呢？”\n\n“下一步，”李慕宸把手机掏出来，“得先处理我自己的家事。”\n\n他走出大厅，初春的风迎面吹过来。门口，沈临风正站在台阶下，一身深色大衣，像是等了很久。\n\n两个人擦肩而过的时候，沈临风停了一下，没有看他，声音很轻：“李总，你赢了一场，赢不了整个时代。”\n\n李慕宸没有回头：“时代不是用来赢的，是用来过的。”\n\n他继续往前走，走出十几步，手机震了一下。他低头，是父亲发来一张照片：工厂的智能产线全面启用，一排机械臂整齐地立在那里，蓝白色的光映得厂房通亮。照片底下，父亲只发了一行字：\n\n“班组调岗了。爸还在厂里，你放心。”\n\n李慕宸把照片放大，看了很久。机械臂的反光里，他隐约看见几个穿工服的背影，正排队走向一台陌生的设备。\n\n消息下面，紧接着是一条推送新闻，标题很短，只有几个字：《2031：人形机器人量产元年》。\n\n他站在台阶下，把手机锁屏，抬头看了一眼初春的天。风很轻，天很蓝，城市的天际线在远处立着，像一排沉默的剪影。\n\n他忽然想起四年前，他在出租屋的白板上写下第一行字时的那个清晨。\n\n那时他以为，自己查的是一桩案子。现在他知道，自己查的是一整个时代。\n其实听证会开始前，李慕宸还准备过一样东西，没来得及在台上展示。\n\n那是一个签名列表。一个月前，他和林晚晴带着团队在校门口、社区广场、菜市场门口支了三天的摊，让路过的老人、学生、上班族在一份倡议上签名。倡议只有一句话：“我支持给 AI 生成内容贴上标识，让我知道我看到的是不是真的。”\n\n三天下来，签了两万三千多个名字。有刚放学的小学生，有买菜路过的阿姨，有戴着老花镜一笔一画写全名的退休教师。一位大妈签完名，拉着林晚晴问：“闺女，签这个有用吗？我手机上老有那种假视频，我孙子教我认，认半天也认不准。”\n\n“有用。”林晚晴说，“签的人多了，上面就看得见。”\n\n听证会结束后，这份签名名单被装订成册，李慕宸没有带走。他托人把它转交给立法机构的工作人员，附了一张便条：“两万三千个人，不代表所有人，但代表他们想要一个'知道真假'的权利。”\n\n当晚，林晚晴在个人主页转发了听证会的片段，只写了一行字：\n\n“这就是我认识的李慕宸。”\n\n李慕宸看到那条转发的时候，正在办公室收拾东西。他没有回，也没有点赞。他盯着那行字看了很久，然后默默把手机锁屏，继续收拾。\n\n陈默在旁边看见了，没忍住：“人家都这么说了，你就回个'谢谢'呗。”\n\n“回了就变味了。”李慕宸说。\n\n“什么味？”\n\n“朋友味。”他说，“她说的那个'认识的人'，是我该一直当下去的那种人。”\n\n陈默没接话，低头笑了笑，继续敲键盘。\n\n一周后，《AI 内容标识法》正式公布的新闻刷屏。人核验办公室的庆祝汽水喝完了，李慕宸一个人走到走廊尽头的窗边，看着楼下。\n\n楼下，城市的写字楼外墙上，一块巨大的 LED 屏正滚动着一排新闻：《多行业引入智能系统，岗位结构加速调整》《报告：未来五年，超三成基础岗位将重构》。\n\n他站在窗边看了一会儿，把手机掏出来，打开那个存着父亲照片的文件夹。\n\n机械臂的反光里，那几个穿工服的背影，还在排队走向那台陌生的设备。\n\n他把文件夹关闭，回到工位上，新建了一个选题文档，标题：《职业重构：被流水线换下来的人》。\n\n窗外，初春的风吹进来，带着一点凉意。他打了几行字，又停下，抬头看着窗外那排沉默的剪影。\n\n四年前那个清晨，他在白板上写下“每一句话，都要有人负责”。\n\n现在，他想把这行字，写得更长一些。"},{"n":12,"t":"人形机器人来了","y":"2031","v":2,"tags":["人形机器人","工厂"],"p":"2031 年的春天，李慕宸在出租屋里收到了一个长条纸箱。\n\n纸箱比冰箱还高，外包装上印着一行字：人形服务机器人“小伴”·量产版。下面一行小字：让","body":"2031 年的春天，李慕宸在出租屋里收到了一个长条纸箱。\n\n纸箱比冰箱还高，外包装上印着一行字：人形服务机器人“小伴”·量产版。下面一行小字：让每一个家庭，都有一位不喊累的伙伴。\n\n他拆开箱子的时候，陈默站在旁边，手里拿着一份《人形机器人量产元年白皮书》，头也不抬地念：“全球首批量产人形机器人，本季度出货一百二十万台，预计五年内走进一亿个家庭。主打功能：家务、陪护、基础护理、信息助手。”\n\n纸箱里，一台通体白色的机器人缓缓站直。它的外形设计得温和：圆头，无表情的脸，身高只到李慕宸胸口。开机后，它发出的第一句话是：“你好，我是小伴。请问怎么称呼你？”\n\n“叫老李就行。”\n\n“好的，老李。今天需要我做什么？”\n\n李慕宸绕它转了一圈，又蹲下来看它的关节。“陈默，你说这台东西，查吗？”\n\n“查什么？”\n\n“参数。”李慕宸说，“宣传册上写'续航七十二小时''能听懂百分之九十八的方言'。宣传册上的数字，和真机测出来的数字，往往差着一层纸。”\n\n这是人核验立项“具身智能专题”的第一天。他们给这台“小伴”排了整整两周的测评计划：续航、语音识别、行动误差、隐私保护、应急反应。陈默负责技术侧，李慕宸负责把每一条都做成“可复现的公开测试”。\n\n第三天，测到语音识别的时候，问题来了。\n\n陈默拿方言测试集跑了一遍，眉头皱起来：“它根本听不懂皖北方言。测试集里二十条，只对了九条。”\n\n“宣传册上写'能听懂百分之九十八的方言'。”\n\n“它自己的说明书上也是这么写的。”陈默把说明书翻到那一页，“可它连'搁哪儿'和'哪儿'都分不清。”\n\n他放了两条录音给李慕宸听。第一条，一个中年女声说：“你把搁桌儿上的碗收收。”机器人答：“好的，请问碗放在什么位置？”第二条，同一个声音说：“碗在桌上。”机器人答：“收到，已清理桌面。”陈默关了录音：“它分不清'搁哪儿'和'哪儿'，因为它只认得标准普通话的指令词。方言一进来，整句就成了噪音。”\n\n李慕宸盯着那台还在客厅里待命的“小伴”，想了想：“再测一遍，换个方式。不是测试它'听不听得懂'，而是测试它'对外宣称的听懂'到底覆盖多少。我们把它听不懂的每一条，录成视频，和宣传语并排放在一起。”\n\n“那厂商不得找上门？”\n\n“找上门正好。”李慕宸说，“人核验的规矩，查什么都是把证据摆开，让看到的人自己判断。”\n\n他们花了一个周末做完了测试。第五天，专题第一篇《量产元年，先别急着喊'伙伴'》发布，标题下面附了十七条视频：每一条都是“小伴”听不懂方言的原声，配着厂商宣传页上“百分之九十八”的截图。\n\n评论区瞬间炸了。有人说“早就觉得宣传离谱”，有人说“我刚下单，退货去了”，还有厂商的客服账号在评论区和网友吵了起来。\n\n当天下午，厂商的公关总监就找到了人核验办公室，态度客气，话里有话：“李总，你们测评我们没意见，但'听不懂皖北方言'这条，是不是有点吹毛求疵？我们主打的是家庭陪护，方言识别本来就不是核心卖点。”\n\n“宣传页上写的是'能听懂百分之九十八的方言'。”李慕宸说，“你们写在前面的字，就是你们的卖点。”\n\n公关总监沉默了一会儿，换了个话题：“李总，你们老家是哪的？听说你父亲在工厂做了一辈子？”\n\n李慕宸抬眼看他。\n\n“我没别的意思。”公关总监笑了笑，“就是想说，技术这事，总得有个接受过程。机器人走进工厂，走进家庭，是迟早的事。你们人核验天天拆台，将来有一天，你父亲可能也得靠机器人帮忙养老。那时候你还会这么较真吗？”\n\n李慕宸没有接话。他送走公关总监，回到办公室，打开手机，拨了家里的电话。\n\n“爸。”\n\n“哎。”\n\n“厂里最近怎么样？”\n\n电话那头沉默了几秒，父亲的声音有点闷：“挺好的。厂里在准备上新的东西，领导说了，老师傅有老师傅的去处。你甭操心。你妈让我问你，上次那个机器人，测出来到底行不行。”\n\n李慕宸握着手机，看着客厅里那台“小伴”。它正安安静静地站在墙角，圆头微微低着，像是在等下一个指令。\n\n“还行。”他说，“就是有些话，它听不懂。”\n\n“那不就跟你爸一样。”父亲笑了一声，“我这辈子，也有很多话听不懂。”\n\n电话挂断。窗外，春夜的灯光一盏一盏亮起来。\n\n李慕宸把手机放下，走到“小伴”面前。它抬起头，无表情的脸上亮起两点柔光：“老李，需要我做什么？”\n\n他看了它一会儿，没有回答。他打开电脑，新建了一个文档，标题敲下六个字：《当机器人走进父亲的工厂》。\n\n这一次，他不打算只写别人家的事。\n周末，李慕宸把“小伴”装进后备箱，开回了老家。\n\n机器人在院子里站了一夜。初夏的风吹过，它白色的外壳上落了薄薄一层灰。第二天一早，父亲从屋里出来，端着一碗粥，走到院子里，围着它转了两圈，蹲下来，又站起来，最终没说好，也没说不好。\n\n“这玩意儿，”父亲问，“真能替人干活？”\n\n“能。做家务，陪人说话，都能。”\n\n父亲“哦”了一声，端着粥蹲在台阶上喝，目光一直没离开那台机器人。喝到一半，他忽然问：“它能替人上班不？”\n\n李慕宸张了张嘴，没接上话。\n\n“我听说，”父亲的声音很轻，“厂里下个月底，全面换线。新来的那种机械臂，一条线顶三十个工人。厂里说，老师傅优先转岗，转不了的，拿补偿金。”\n\n“你，转岗了吗？”\n\n“没定。”父亲喝完最后一口粥，站起来，把碗在台阶上磕了磕，“你妈说，让你别操心。爸在厂里干了二十年，真到了那天，也不会赖着不走。”\n\n他转身进屋，走了两步，又停住，回头看了那台“小伴”一眼：“你把它带回去。别让它在咱家院子里站一宿，怪冷的。”\n\n李慕宸站在原地，看着父亲佝偻的背影走进屋里。\n\n“小伴”在他身后，圆头微微抬起，无表情的脸朝着院门的方向，两点柔光亮着，像在看着什么它看不懂的东西。\n\n李慕宸低头，打开手机备忘录，把父亲那句话记了下来：它来了，我是不是就该走了。\n\n他没有删掉这句话。他把手机锁屏，蹲下来，帮“小伴”掸掉外壳上的灰。\n\n“走吧，”他说，“回家。”\n\n机器人的柔光闪了闪：“好的，老李。我们回家。”\n\n车子开出老街的时候，李慕宸从后视镜里看见，父亲站在院门口，朝这边看着。他没有挥手，就那么站着，像一棵立在老房子前的树。\n\n后视镜里，那棵树越来越小，最后消失在弯道里。\n\n“小伴”坐在副驾驶座上，头微微转向窗外：“老李，你爸爸好像不太高兴。”\n\n“他没事。”李慕宸说，“他只是有些事情，需要一点时间想明白。”\n\n“什么事情？”\n\n李慕宸握着方向盘，沉默了很久，才说：“一个人干了二十年的事，忽然被一台机器替代了。这件事，需要时间想明白的人，不止他一个。”\n\n车子驶上高速。初夏的风从车窗灌进来，带着田野的味道。\n\n后视镜里，老家的方向只剩下一条模糊的地平线。"},{"n":13,"t":"父亲的失业","y":"2033","v":2,"tags":["自动化失业","家庭"],"p":"母亲打电话来的时候，李慕宸正在核对一份测评数据。\n\n电话接通，母亲没有像往常一样先问“吃饭了没”。她沉默了几秒，声音压得很低：“你爸，被裁了。”","body":"母亲打电话来的时候，李慕宸正在核对一份测评数据。\n\n电话接通，母亲没有像往常一样先问“吃饭了没”。她沉默了几秒，声音压得很低：“你爸，被裁了。”\n\n李慕宸握着手机，手里的笔停下来：“什么时候的事？”\n\n“今天下午。厂里通知的，说是'岗位优化'。”母亲的声音有点抖，“他今天回来，一句话没说，把自己关在屋里。晚饭也没吃。”\n\n“我回去。”\n\n“你别回，你爸不让。他说你工作忙。”母亲顿了顿，声音更低了，“我就是想找个人说说话。你爸这个人，一辈子要强，他哪是心疼工作啊，他是觉得，干了二十年的厂，说不要他就不要他了。”\n\n李慕宸还是回去了。\n\n高铁两个小时，他坐在窗边，把这段路看了二十多遍。窗外田野一格一格地往后走，他想起父亲蹲在车间学平板的样子，想起那枚“优秀工人”奖章，想起父亲说“机器人不会喊累，你爸我还得学着伺候它”。\n\n他以为那是句玩笑话。原来那是句预告。\n\n到家的时候，天已经黑了。母亲在门口迎他，小声说：“他在屋里，从回来就没出过门。”\n\n李慕宸推门进去。父亲坐在床边，背对着门，身上还穿着厂里的工服，手里攥着一样东西，是他的工牌。\n\n“爸。”\n\n父亲没回头，声音很平：“你妈给你打的电话？”\n\n“嗯。”\n\n“说了让你别回来。”\n\n“我回来看看你。”李慕宸在他旁边坐下，“你饿不饿？妈煮了面。”\n\n“不饿。”\n\n屋里安静下来。父亲把工牌翻过来，又翻过去，指腹在那张褪了色的照片上摩挲：“这东西，跟了我二十年。上头那照片，还是我三十五岁那年拍的。那会儿头发还没白，人也壮实，扛两袋水泥上楼都不带喘的。”\n\n“厂里怎么说的？”\n\n“'岗位优化'。”父亲笑了一声，很轻，像从嗓子眼里挤出来的，“说是新产线全面上马，老岗位'自然消亡'。领导找我谈话，说老李啊，你手艺好，可手艺这东西，新机器都会。要么转岗，去学设备维护，跟一帮二十多岁的小年轻重新学起；要么拿补偿金走人。”\n\n“你选了？”\n\n“我选不了。”父亲说，“转岗，我这把年纪，学了也白学，早晚还是要被顶下来；拿钱走人，就等于认了，我这二十年，不值钱了。”\n\n他把工牌放在膝盖上，盯着看了很久：“李慕宸，你说实话，爸这双手，是不是真的不值钱了？”\n\n李慕宸张了张嘴，没有接话。\n\n他想起自己拆穿过的那些 AI 内容工厂，想起慧学网的代写流水线，想起机械臂那排蓝白色的光。他从来没有把“技术替代”这四个字，和父亲这双手联系在一起。\n\n现在它们连在一起了，连得这么紧，紧得他喉咙发紧。\n\n“爸，你做的那些活，机器能干，但你不是机器。”他说，“你干了二十年，厂里的机器、工友、流程，都认识你。这些东西，机器学不来。”\n\n父亲没接话，把工牌重新攥紧，半天，说了一句：“可厂里不要我了。”\n\n那一晚，李慕宸没有劝父亲吃饭。他把母亲煮的面热了，端进屋里，放在床头柜上，在床边坐了一阵，然后掏出手机，打开职业重构专题的文档，新建了一篇，标题敲下：《我爸的二十年》。\n\n他写到半夜。写父亲三十五岁那年扛着水泥袋上楼的背影，写父亲蹲在操作台前一遍遍点那个点不中的按钮，写那枚“不知道还值不值钱”的奖章。\n\n写到结尾，他没有写结论。他只写了一句：\n\n“我采访过十二个失业的人，听他们讲自己的故事。今天晚上，我采访了我爸。”\n\n专题发出后，他没有睡，盯着后台的访问数慢慢涨。\n\n凌晨三点，评论区涌进来第一批留言，他一条一条往下翻，翻到一条，手停住了：\n\n“我爸也是。他前天被裁的，五十岁，在厂里干了二十五年。他今天跟我说，想去开出租车，可出租车也快没人开了。”\n\n底下跟着一条又一条：\n\n“我妈也是。”\n“我叔叔也是。”\n“我爸上个月走的，他说，机器比他强，他不跟机器争。”\n\n李慕宸把手机锁屏。窗外，天快亮了，老家的街道还笼在灰蒙蒙的晨光里。\n\n父亲屋里传来翻身的声音，床板吱呀响了一声。\n\n他坐回电脑前，在那篇报道下面，又补了一行字：\n\n“如果你家里也有一个'我爸'，我想听听你们的故事。人核验，会一条一条，替你们记下来。”\n第二天一早，李慕宸是被厨房的动静吵醒的。\n\n他披上外套走出去，看见父亲正站在灶台前，系着那条旧围裙，锅里煮着面。听见脚步声，父亲头也没回：“起来啦。给你卧了个蛋。”\n\n李慕宸怔了怔。他爸这辈子没怎么下过厨，早饭一直是母亲做。\n\n“爸，你起这么早？”\n\n“睡不着。”父亲把面盛出来，两碗，一碗多卧了蛋的那只推给他，“你小时候你妈说，卧蛋是家里来客的规矩。今儿你算是客。”\n\n李慕宸接过碗，没有接话。两个人隔着桌子吃面，屋里只有吸溜吸溜的声响。\n\n吃到一半，父亲忽然开口：“那篇东西，我看了。”\n\n“哪篇？”\n\n“你写的那个，《我爸的二十年》。”父亲低着头，用筷子搅着面汤，“后半夜睡不着，刷手机刷到了。你妈说，是你写的，让我别怪你。”\n\n李慕宸心里一紧：“爸，我。”\n\n“我没怪你。”父亲说，“我就是看了看，你把我三十五岁扛水泥袋那段写了。是真的，那会儿我确实能扛两袋。”他顿了顿，“你说'我不是机器'，这句话，我读了三遍。”\n\n李慕宸放下碗：“爸，补偿金的事。”\n\n“别提那个。”父亲的语气硬了一下，又软下来，“我不是赌气。我是想，拿了那笔钱，我这辈子，就真的交代给厂里了。不拿，我心里还憋着一口气，想着还能干点别的。”\n\n“你想干什么？”\n\n“没想好。”父亲喝了口面汤，“开出租车吧，现在都是无人驾驶了；做保安吧，听说小区都用机器人巡逻了。你爸我活了五十多年，头一回觉得，这世上好像没有一处地方，非我不可。”\n\n“有的。”李慕宸说，“家里就需要你。”\n\n父亲没有接话，低头把碗里的汤喝完，站起来，把碗放进水池：“行了，你该忙忙去。你妈待会儿送我去街道，问那个'再就业培训'的事。”\n\n“你去？”\n\n“去。”父亲说，“你爸我这辈子，还没认过输。机器比我强的地方，我认；可我总得找一处，它不如我的地方。”\n\n李慕宸走出家门的时候，母亲跟了出来，站在门口，压低声音说：“厂里给了一笔补偿金，不少，够你爸养老的。可他死活不肯去领，说拿了就是认了。”\n\n“我知道。”\n\n“你劝劝他？”\n\n“不劝。”李慕宸说，“他憋着这口气，才想再去折腾折腾。这口气要是咽下去了，人就真的老了。”\n\n他走出老街，在巷口回头望。父亲站在院子里，正弯腰给那棵老槐树浇水。初夏的日头照在他身上，影子拉得很长，那把旧水壶里的水，一瓢一瓢地落进树根，很快就被泥土吸干。\n\n“爸！”李慕宸喊了一声，“树不用浇太多。”\n\n“我知道。”父亲直起腰，朝他摆摆手，“我就是想干点啥。”\n\n李慕宸掏出手机，把父亲浇水的背影拍了下来，存进职业重构专题的文件夹，文件名敲下：第13个受访者。\n\n标题下面，他加了一行小字：这是我爸。\n\n他收起手机，往高铁站走去。身后，老街的烟火气一点点升起来，混着初夏的风。"},{"n":14,"t":"被流水线换下来的人","y":"2033","v":2,"tags":["就业重构","再培训"],"p":"职业重构专题的第一批受访者名单，是李慕宸和陈默在出租屋里一个个敲出来的。\n\n名单上一共十二个人。开出租车的王师傅，四十七岁，去年还在跟乘客讲他开","body":"职业重构专题的第一批受访者名单，是李慕宸和陈默在出租屋里一个个敲出来的。\n\n名单上一共十二个人。开出租车的王师傅，四十七岁，去年还在跟乘客讲他开了二十年的老线路；流水线上的张姐，四十岁，她那条线的机械臂上个月刚刚上岗；送外卖的小周，二十五岁，平台告诉他“无人配送试点城市”名单上没有他，但他知道自己早晚会被划进去。\n\n还有李慕宸的父亲。名单上，他是第十三个。\n\n采访从王师傅开始。李慕宸问他：“你还打算开多久？”\n\n王师傅咧嘴笑了一下：“开到我握不动方向盘那天。哦，不对，现在方向盘都不用握了，车自己会开。”他拍了拍那辆旧车的仪表盘，“这车是老伴留下的，我俩靠它把儿子供到大学毕业。现在儿子毕业了，车也快没人让开了。”\n\n他说这话的时候没有难过，就是平平淡淡地讲，像讲别人家的事。\n\n李慕宸在采访本上记了一句：技术没有对不起任何人，可有些人被它放下的时候，连声招呼都没打。\n\n十二篇采访稿陆续发出来，标题统一，都叫《被流水线换下来的人·第X位》。稿子不做渲染，不喊口号，每个人只是自己讲自己的日子。王师傅那篇转发过了十万，评论区有人留言：“读完了，没哭，但心里堵得慌。”\n\n第二周，资本方找上门了。\n\n来的是家智库，名义上是“行业观察”，开出的价码很客气：一篇署名特稿，主题叫《技术跃迁时代：中国劳动者的新机遇》，稿酬是这个行业顶格的数字。电话里，对方的话说得漂亮：“李总，你们那个专题我们看了，很有力量。但我们觉得，光讲'被换下来'的一面不够全面，看的人也需要看到'新岗位、新机会'的正面叙事。我们想请你们以'高级顾问'的身份，把另一面也讲一讲。”\n\n李慕宸听完，问了一句：“这稿子，署谁的名？”\n\n“署名当然是人核验。”\n\n“那如果我们在稿子里写：机器人护理员月薪只有传统护工的三分之一，新岗位多数是低薪、零工、随时可被优化，这部分，你们会让我们写吗？”\n\n电话那头沉默了几秒：“李总，我们是请你们讲'机遇'，不是讲'代价'。”\n\n“那这活我们不接。”李慕宸说，“你们要找'高级顾问'，去找那些没采访过失业者的人。我们刚跟王师傅聊过，他儿子毕业了，他这辆车快没人让开了，你要我对着他的脸，跟他讲'新机遇'，我讲不出口。”\n\n对方又沉默了一会儿，挂了电话。\n\n当天下午，人核验发了一篇公告，就一句话：我们只写我们核实过的事。有偿美化，不在服务范围内。\n\n评论区又是一片叫好，也有人阴阳怪气：“装清高，早晚饿死。”\n\n李慕宸没回。他正在看一封新邮件。邮件来自一所大学的 AI 治理研究中心，署名：白亦鸿。\n\n“李慕宸同学你好。我是白亦鸿，现在做 AI 政策与治理研究。你的职业重构专题，我读了十二位受访者的全部原稿。王师傅那句'连声招呼都没打'，我反复读了几遍。想约你聊聊，不知道你有没有兴趣来我这儿坐坐。”\n\n白亦鸿这个名字，李慕宸在新闻里见过。五十多岁，早年是算法工程师出身，后来转做 AI 伦理与治理研究，是国内最早一批呼吁“给算法立规矩”的学者之一，上过好几次政策研讨会，说话直，不爱绕弯子。\n\n他查了下邮件后缀，确认是那所大学官方域名，回了一封邮件：周末可以，我去拜访您。\n\n约在周六下午。白亦鸿的办公室在教学楼顶层，推门进去，墙上挂着一块白板，上面画满了箭头和框，最上面一行字写着：技术叙事，谁在写，为谁写。\n\n白亦鸿比他想象中瘦，头发花白，穿着件洗得发白的蓝衬衫，正在泡茶。看见李慕宸进来，他放下茶壶，上下打量了他一遍：“比照片上年轻。”\n\n“白老师好。”\n\n“坐。”白亦鸿把茶杯推过来，“先别叫老师，叫老白就行。我看了你那十二篇稿子，还有你们人核验这一年多做的事。我有个问题想问你。”他顿了顿，“你做报道，是为了让看到的人知道真相，还是为了让真相有用？”\n\n李慕宸想了想：“先是让看到的人知道，然后，尽力让它有用。”\n\n“那你觉得，你那些稿子，有用了吗？”\n\n“有时候有。”李慕宸说，“有的稿子发完，平台改了规则，厂家改了宣传页。有的稿子发完，什么都没变。”\n\n“哪篇什么都没变？”\n\n“王师傅那篇。”李慕宸说，“发出去之后，他还在开出租，还在等'没人让开'那天。我知道那篇稿子让很多人心里堵得慌，可堵完之后呢？”\n\n白亦鸿看着他，慢慢点了点头：“你这句话，等了你很久了。”\n“你那些稿子，有用了吗”这句话，白亦鸿问了不止一遍。他给李慕宸续了杯茶，把白板上那行字指给他看：“技术叙事，谁在写，为谁写。我做了十几年算法，后来为什么转出来搞治理？因为我发现，真正决定一个技术怎么影响社会的，往往不是技术本身，而是讲技术故事的人。”\n\n“讲技术故事的人？”\n\n“资本讲'效率革命'，平台讲'新机遇'，政客讲'产业升级'。每一个词都成立，可每一个词背后，都有被这个词盖住的人。”白亦鸿说，“你爸那种老师傅，如果没人替他说话，他的二十年就只是一行'人力成本'。可如果只有替他说话的稿子，没有能落到政策上的研究，那些稿子再感人，也变不成一条培训制度、一个转岗通道、一张安全网。”\n\n李慕宸坐在那儿，半天没说话。\n\n“你之前问我，那些稿子有没有用。”白亦鸿放下茶杯，“我的答案是：报道负责让人看见，研究负责让看见变成办法。两者中间隔着的那段路，得有人走。”\n\n“所以您找我，是想让报道和研究一起走？”\n\n“不只是一起走。”白亦鸿说，“我是想请你加入一个长期的观察机制。职业重构、教育、医疗、算法公平，每一项技术落地，我们都做跟踪记录，人核验做田野和证据，我们做分析和政策建议。你出稿子，我出报告，中间那段路，你和我轮流走。”\n\n“您凭什么信我？”李慕宸问，“我做过的事里，有很多是让人下不来台的。”\n\n“你让人下不来台的，都是该下台的。”白亦鸿笑了笑，“还有一条，你们人核验墙上那句话，'每一句话，都要有人负责。'我研究政策十五年，最缺的，就是肯为自己说的每句话负责的人。”\n\n李慕宸看着他，心里那股一直绷着的劲，忽然松了半截。\n\n他想起父亲那天晚上攥着工牌的样子，想起王师傅说“连声招呼都没打”，想起评论区里那条条“我爸也是”。\n\n“做报道，让真相有用”，他以为自己一直在做这件事。今天他才知道，真要让一句真相有用，光有报道不够，还得有人把它接住，把它变成一条看得见的路。\n\n“我加入。”他说。\n\n白亦鸿伸出手：“合作愉快。”\n\n李慕宸握上去，又问了一句：“白老师，这条路，要走多远才算到头？”\n\n“没有到头的一天。”白亦鸿说，“只要技术还在往前走，记录和治理就得跟着往前走。你不是问我，做报道是为了让真相有用吗？真要让真相有用，你得做好准备，一辈子走在这条路上。”\n\n那天傍晚，李慕宸离开教学楼的时候，白亦鸿站在办公室门口喊住他：“回去跟你爸说，再就业培训那事，我们中心正好有个项目，跟几家企业合作，收五十岁以上的老技工，学设备维护。工资不高，但能重新上岗。你要是愿意，我帮你递份材料。”\n\n李慕宸愣了一下，随即弯下腰，鞠了一躬：“谢谢白老师。”\n\n“别谢我。”白亦鸿摆摆手，“你爸那种人，不该被时代丢下。我只是想看看，能不能伸手拉一把。”\n\n回程的地铁上，李慕宸给父亲发了条消息：“爸，有个设备维护的培训项目，五十岁以上的老师傅优先，我帮你报名了？”\n\n父亲没回。过了很久，回了一个字：“中。”\n\n李慕宸盯着那个字看了半天，把手机收进口袋。地铁窗外，城市的灯光一盏一盏往后掠。\n\n回到出租屋，陈默正坐在电脑前刷手机，见他进门，头也不抬地喊了一声：“你来看看这个。”\n\n陈默转过来一条新闻：某科技巨头发布“人形机器人护理员”，广告视频里，一位老人对着镜头笑，说“比儿女贴心”。底下第一条热评，点赞数高得吓人：\n\n“谁照顾谁，还不知道呢。”\n\n李慕宸看着那条评论，又想起白亦鸿说的那句话：技术叙事，谁在写，为谁写。\n\n他打开电脑，在白亦鸿发来的合作框架文件旁边，新建了一个文档，标题写上：长期观察机制·第一期。\n\n窗外，夜风灌进来，带着初夏末尾的一点潮气。"},{"n":15,"t":"学新闻的人去哪了","y":"2034","v":2,"tags":["传媒转型","职业"],"p":"新闻业被 AI 撞进来的那一年，李慕宸正在写职业重构的第十三篇稿子。\n\n其实说“撞”不准确，更像一场早有预兆的潮水。年初，两家头部媒体宣布引入“","body":"新闻业被 AI 撞进来的那一年，李慕宸正在写职业重构的第十三篇稿子。\n\n其实说“撞”不准确，更像一场早有预兆的潮水。年初，两家头部媒体宣布引入“智能采编系统”；年中，一家都市报裁掉了整个校对组和三分之二的编辑岗；到了夏末，连大学里的新闻学院都在改课程，把“算法写作”从选修课升成了必修课。\n\n陈默把一份行业报告拍在桌上：“去年全国新闻从业者减少百分之十七。今年上半年，百分之四十的日常稿已经由 AI 初稿、人工把关。业内管这个叫'人机协奏'。”\n\n“人机协奏。”李慕宸念了一遍这四个字，“好听。”\n\n“是挺好听的。”陈默说，“问题是，协奏协奏，谁主奏，谁伴奏？”\n\n人核验内部开了一次会，讨论的就是这个问题。\n\n陈默的观点很直接：“我们得先活下去。AI 写稿我们不排斥，它出初稿，我们查证、核验、补细节，效率能翻一倍。工具而已，用就是了。”\n\n林晚晴坐在窗边，听完，问了一句：“那谁来写王师傅那种稿子？”\n\n“王师傅那种稿子也是人写的素材，AI 整理框架，人补充细节。”陈默说，“流程不变，只是快一点。”\n\n“快一点。”林晚晴重复了一遍，“陈默，你有没有想过，AI 整理出来的'框架'，天然就是'流量最优的框架'。采访十二个失业者，它会把最惨的那个挑出来放大，因为那样的标题有人点。那不是王师傅的完整样子，那是数据想要的样子。”\n\n办公室安静了几秒。\n\n李慕宸开口：“晚晴说的不是效率问题，是判断问题。”\n\n“我知道。”陈默说，“所以我说的也是判断问题：判断权在谁手里，谁才是'人'。工具再快，最后把关的得是人。”\n\n“可把关的人也会累，也会偷懒，也会被数据带着走。”林晚晴说，“到那时候，你分得清'把关'和'默认'吗？”\n\n争论没有结论。会议最后，李慕宸定了调子：“两条腿走路。AI 能用，但每篇稿子必须有真人署名、真人负责；涉事当事人的稿子，一律真人采写。这条规矩写进人核验的流程里。”\n\n“行。”林晚晴没再争，“那就走着看。”\n\n可还没等“走着看”走出几步，署名风波就来了。\n\n那天，人核验接了一个活儿：核实一篇某平台爆火的“AI 深度报道”，标题叫《智能时代，十万工人的消失》。稿子写得又快又全，数据、图表、引述，样样齐全，转发过百万。李慕宸让团队核查，结果查出一个大问题：稿子里引用的“某市人社局数据”，根本没有这一份文件。\n\n更麻烦的是，这篇稿子的署名是“本刊编辑部”，底下小字标注“部分内容由 AI 辅助生成”。\n\n李慕宸把截图发到群里：“这篇稿子，署名的'编辑部'，到底谁负责？”\n\n没人回话。过了一会儿，林晚晴发了一句：“这个问题，比稿子本身重要。”\n\n那天晚上，人核验发了一篇核查报告：《一篇百万稿件的“编辑部”》。报告写得很克制：数据来源不存在；署名“编辑部”无法对应任何具体责任人；AI 辅助生成的标注位置在页脚小字，多数看的人根本注意不到。\n\n报告发出去后，那篇稿子撤了，平台道歉了。可李慕宸心里清楚，风波没完。\n\n第二天，林晚晴来找他，开门见山：“慕宸，我想问你一句实话。”\n\n“你问。”\n\n“人核验以后接稿子，标准是什么？是'核实过的真相'，还是'能发出去、有人看的真相'？”\n\n“当然是前者。”\n\n“那如果有一天，平台拿着流量数据来找你，说'照这个框架写，阅读量翻倍'，你拒得了一次，拒得了十次吗？”林晚晴说，“你昨天定'真人署名、真人负责'的规矩，我信。可规矩是写在纸上的，人是会累的。AI 不会累。”\n\n李慕宸看着她：“晚晴，你是不是觉得，我变了？”\n\n林晚晴没有立刻回答。她沉默了一会儿，说：“你没变。你是往前走了一步，往'治理'那边走了一步。治理没错，可治理想的是'系统怎么运行'，我想的是'每个人的日子怎么过'。这两件事，不一定是一回事。”\n李慕宸没有接那句话。\n\n他站在办公室窗前，看着楼下街道上的人流。暮色里，行人匆匆走过，像一条条流向各自方向的河。他想起林晚晴刚来报道时写的第一篇稿子，写的是城中村一家早餐铺，老板娘凌晨三点起床和面，她蹲在灶台边，记了一整天，最后交上来的稿子，没有一句形容词，全是老板娘自己的话。\n\n那篇稿子，李慕宸读了两遍。他当时想：这才是新闻。\n\n“晚晴，你说得对。”他转过身，“治理想的是系统，你想的是人。但系统也是人组成的，治理做得好了，人的日子才有保障。我不觉得这两件事对立。”\n\n“我也不觉得对立。”林晚晴说，“我只是怕，你走着走着，就只看见系统了。”\n\n“那你呢？”李慕宸问，“你走着走着，会不会只看见'人'，看不见系统怎么运转？没有系统兜底，王师傅那种人，靠谁接住？”\n\n两个人隔着办公室的空地，谁都没再说话。\n\n最后是林晚晴先开了口：“算了。今天不谈这个。稿子的事，按你定的规矩走，真人署名、真人负责。我认。”\n\n“我也认你一句。”李慕宸说，“以后涉事当事人的稿子，一律真人采写，AI 只做检索，不做框架。这条也写进流程。”\n\n“行。”\n\n她转身走了两步，又停下来，没回头：“慕宸，你这条规矩，是好的。我只是希望，它别是你最后一次'为一个人着想'。”\n\n门关上。办公室里只剩下李慕宸一个人。\n\n他坐回桌前，把那条“AI 只做检索，不做框架”的规矩写进流程文档。写完，手机响了，是老周。\n\n老周的声音比记忆里沙哑了一些，还带着点咳嗽：“慕宸，忙不忙？”\n\n“不忙。周老师，您身体怎么样？”\n\n“老毛病，不碍事。”老周顿了顿，“我今天给学生上课，讲到一半，有个学生举手问我：'老师，以后还要不要学新闻？'他说，现在 AI 写稿又快又全，他们学四年，出来是不是就要失业了。”\n\n李慕宸握着手机，没有说话。\n\n“我教了一辈子新闻。”老周的声音有点涩，“以前我跟学生说，新闻是记录时代。现在学生问我，时代还要不要人记录？我站在讲台上，一时没答上来。”\n\n“您怎么答的？”\n\n“我说，机器能写'发生了什么'，可写不了'一个人是怎么活过来的'。”老周说，“然后那个学生又问我：'那这两样，哪个更值钱？'慕宸，你说，哪个更值钱？”\n\n李慕宸想了想：“周老师，我昨天刚查了一篇稿子，数据是编的，署名是'编辑部'，没人负责。机器写得又快又全，可它写的'发生了什么'，未必是真的'发生了什么'。”\n\n“那你觉得，人还能赢？”\n\n“很多时候就是一个人跟一台机器较劲。”李慕宸说，“以前您跟我说过这句话，说我们做新闻的，天天跟机器较劲。那时候我以为是跟'流量机器'较劲，现在才知道，还得跟'写稿机器'较劲。”\n\n电话那头，老周沉默了很久，然后轻轻笑了一声：“好。你这么说，我就有底气回去跟学生说了。”\n\n“您跟他们说，新闻的'变'是工具变了，新闻的'不变'是'每一句话都要有人负责'。”李慕宸说，“只要还有人愿意为说出去的每个字负责，新闻这门手艺，就死不了。”\n\n挂了电话，李慕宸在备忘录里写下六个字：新闻的变与不变。\n\n他写完，盯着那六个字看了很久。窗外，夜已经深了，楼下那条街的灯还亮着。\n\n手机又震了一下。是林晚晴发来的一条长消息，很长，他读完，手指停在屏幕上，半天没有动。\n\n消息的最后一句是：“我想去山区做一年人文报道。想听听你的意见。”\n\n李慕宸把手机放下，又拿起来，打了几个字，删掉，又打了几个字，又删掉。\n\n最后他回了一句：“我支持你。但先别急着定，我们找个时间，当面聊。”\n\n消息发出去，对面没有立刻回复。屏幕上方“正在输入”的提示亮了很久，最终，只回来一个字：\n\n“好。”\n\n李慕宸放下手机，靠在椅背上，看着天花板。\n\n他想起林晚晴刚才说的那句话：“我只是希望，它别是你最后一次'为一个人着想'。”\n\n他不知道该怎么回。他只知道，这个“好”字，让他心里空落落的。"},{"n":16,"t":"AI医生的第一个误诊","y":"2034","v":2,"tags":["AI医疗","误诊"],"p":"母亲体检的 AI 筛查报告，是周二下午出来的。\n\n报告上的结论用绿色标注：各项指标未见明显异常。李慕宸翻到最后一页的影像附件时，却多看了一眼，胸","body":"母亲体检的 AI 筛查报告，是周二下午出来的。\n\n报告上的结论用绿色标注：各项指标未见明显异常。李慕宸翻到最后一页的影像附件时，却多看了一眼，胸部 CT 的 AI 解读栏里，一行小字写着：“右肺下叶见一 3mm 微小结节，性质待定，建议 3 个月内复查。”\n\n母亲在电话里说：“医生说了，没事，就是个小结节，很多人都有。”\n\n“那个 AI 怎么写的？”\n\n“AI 说性质待定，建议复查。”母亲说，“医生说 AI 就是爱小题大做，让我别紧张，一年后体检再说就行。”\n\n李慕宸握着手机，想了想：“妈，你听我的，这周去做个复查。”\n\n“复查啥呀？医生都说没事。”\n\n“医生说的是'现在没事'。”李慕宸说，“AI 标注的是'建议 3 个月内复查'。你儿子干的就是核验这行，信我的，去查一次，就当让我放心。”\n\n母亲拗不过他，周四去做了复查。周五下午，李慕宸接到父亲的电话。\n\n父亲的声音有点抖：“你妈复查出来了。那个小结节，长大了，6 毫米了，还有毛刺。医生说，是早期。得手术。”\n\n李慕宸坐在办公室，手里的笔停住了：“什么时候做？”\n\n“下周一。”父亲说，“医生说，发现得早，切了就好。你妈让我别跟你说，怕你分心。我说，这么大的事，必须让儿子知道。”\n\n“我回去。”\n\n手术安排在周一上午。李慕宸在医院走廊里陪父亲站了一上午。母亲被推进手术室的时候，还冲他们笑了一下，说：“别哭丧着脸，我命大。”\n\n父亲站在手术室门口，一直攥着那把钥匙，手背上的青筋一根根绷起来。李慕宸才知道，父亲这辈子最怕的原来是这一扇门。\n\n两个小时后，手术灯灭了。主刀医生出来，摘下口罩：“很顺利。早期肺腺癌，切干净了，不用化疗，定期复查就行。你们这个结节发现得及时，再晚半年，情况就不好说了。”\n\n父亲一屁股坐在走廊的椅子上，半天没起来。过了好一会儿，他问了一句：“医生，是哪台机器发现的？”\n\n“是 AI 影像初筛。”医生说，“那台 AI 在 3mm 的时候就标了'性质待定'，人工医生那会儿没当回事，后来复查的时候，AI 又追着标了一次。说白了，这次是 AI 先发现的。”\n\n父亲“哦”了一声，低下头，好一会儿没说话。\n\n李慕宸在他旁边坐下：“爸，想啥呢？”\n\n“想你妈这条命。”父亲说，“以前我看那机器，觉得它是来抢我饭碗的。现在它救了你妈一命，我又觉得。”他顿住，没有说下去。\n\n“你觉得啥？”\n\n“我觉得，”父亲的声音很轻，“欠它一句谢谢。”\n\n李慕宸没接话。他想起父亲失业那天攥着工牌的样子，想起他说“机器比我强的地方，我认”。如今这台机器，救了他家一个人。\n\n母亲住院那几天，李慕宸在医院和出租屋之间来回跑。第七天，母亲出院那天，他刷到一条新闻，手里的行李袋差点掉在地上。\n\n新闻标题：《AI 诊断“漏诊”致患者延误治疗，家属讨说法》。配着一张照片，一位中年女人举着横幅，站在某市医院门口。新闻里说：该市一家医院引进 AI 辅助诊断系统后，一位患者肺部阴影连续两次被系统判为“良性，无需复查”，半年后确诊晚期，家属质疑 AI 误诊，要求追责。\n\n评论区已经吵成一锅粥。有人说：“AI 就是不行，人命关天的事也敢交给机器。”也有人说：“人医生也会误诊，凭什么单怪 AI？”还有人说：“建议全面停用 AI 诊断，机器不配看病。”\n\n林晚晴在群里转发了那条新闻，只发了四个字：“就该停。”\n\n李慕宸盯着那四个字看了很久，回了一条：“先别急着下结论。等我把事故查清楚再说。”\n\n“查清楚什么？”林晚晴问，“误诊就是误诊，人都晚期了。”\n\n“所以我更要查。”李慕宸说，“如果真是 AI 系统的错，那就查清楚错在哪一环，是算法错，还是数据错，还是'人信了机器的错'；如果是人把 AI 的结果直接当了医嘱、没做复核，那停掉 AI 解决不了问题：停掉 AI，人医生还是会漏诊。”\n\n“你这是替 AI 说话？”\n\n“我不替谁说话。”李慕宸说，“你忘了人核验的规矩？每一句话，都要有人负责。现在最该负责的，是先把这句话的来龙去脉查清楚，而不是谁嗓门大谁说了算。”\n\n消息发出去，林晚晴没有再回。\n\n当天晚上，李慕宸把母亲的手术同意书和那条误诊事故的新闻，并排放在桌上。\n\n一边是“AI 先发现了病灶，救了我妈”，一边是“AI 漏诊，一个家庭天塌了”。\n\n他看了很久，然后拿起手机，拨通了白亦鸿的电话：“白老师，我要接一个案子，AI 医疗误诊。需要你们研究中心的技术支持。”\n\n“什么案子？”\n\n“我想搞清楚一件事：那台漏诊的 AI，到底错在哪一环。”李慕宸说，“是算法不行，还是数据喂得不对，还是用人的人，根本不知道它的边界在哪。”\n\n白亦鸿在电话那头沉默了几秒：“你妈的事，我听说了。你还能在救了你妈的机器和人家的血泪之间，保持这种冷静，不容易。”\n\n“冷静不是冷血。”李慕宸说，“正因为那台机器救了我妈，我才更想把这件事查清楚，我想知道，它什么时候靠得住，什么时候靠不住。这个边界要是没人划出来，下一个'我妈'，可能就是别人家的'晚期'。”\n\n“好。”白亦鸿说，“我这边有一个做医学影像算法的学生，可以跟你对接。明天我把他的联系方式发你。”\n\n挂了电话，李慕宸坐回桌前。他把那张误诊事故的新闻打印出来，压在母亲的手术同意书上面。\n\n打印纸的背面，有一个细节，是他刚才刷新闻时注意到的：新闻里贴出的病历照片上，诊断记录栏有一行字迹，被涂改液抹过，透过纸背，隐约能看见几个字。\n\n他把那张照片放大，看了很久。\n\n那行被涂掉的字，看着像是。“已复核”。\n白亦鸿的学生叫程野，医学影像算法方向，二十六岁，说话很快，三句话不离代码。\n\n“李哥，你那批病历我看了。”程野在视频那头敲着键盘，“那个漏诊的系统，用的还是两年前的老模型，训练数据只到 2029 年。这两年新增的病灶形态特征，它根本没见过。”\n\n“所以是模型老了？”\n\n“不是它自己老的。”程野说，“是买系统的医院，没给它续过'新版数据'。医疗影像 AI 跟手机系统一个道理，得定期升级。医院当初买的是一年版服务，到期没续，系统就停在两年前的'智商'上，还挂着'智能诊断'的牌子。”\n\n“那医院知道系统没升级吗？”\n\n“肯定知道。”程野顿了一下，“但对外宣传的时候，没人提。宣传页上写的是'AI 智能辅助诊断，精准筛查早期病灶'，没写'本系统数据截至 2029 年，请谨慎参考'。”\n\n李慕宸把程野说的每一条都记下来。他知道，这条线查下去，会碰到一个所有人都想绕开的问题：那台漏诊的 AI 不是“坏机器”，它只是“停在了两年前”，而没有人愿意为“它停在两年前”负责。\n\n第二天，他去了事发城市，见到了那位举横幅的中年女人，姓赵。\n\n赵姐四十出头，皮肤晒得黑，手上全是茧。她坐在医院门口的台阶上，说：“我跟我老公，攒了半辈子钱，去年才在这边安顿下来。他咳嗽了大半年，来医院查，医生说'AI 都看了，没事，回去多喝水'。后来他自己不放心，去省城查，一查就是晚期。”\n\n“医生当时说'AI 都看了'？”\n\n“说了。原话。”赵姐说，“我当时还信了。我心想，机器总比人靠谱吧，机器都说没事，那肯定没事。”她说着，声音低下去，“现在我知道了，那台机器，看的还是两年前的老片子。”\n\n李慕宸蹲在她对面，没有打断她。他掏出采访本，记下那句话：“机器总比人靠谱吧”。\n\n“你写报道，能让那台机器停下来吗？”赵姐问他。\n\n“我不能保证让机器停下来。”李慕宸说，“但我能保证，让'它停在哪一年'这件事，有人知道，有人负责。”\n\n赵姐点了点头，又摇了摇头：“我文化不高，你说的负责，我不太懂。我就知道，我老公的命，不该让一台没人管的老机器说了算。”\n\n那天下午，李慕宸在事发医院的公开招标页面上，找到了那套 AI 系统的采购记录：2027 年采购，服务期一年，之后三年，无续费记录。\n\n系统没有升级。医院没有披露。患者不知情。\n\n他把这三条线索并排写在采访本上，最后补了一行字：一台停在三年前的 AI，和一个不知道它停了的人。\n\n回到出租屋，他打开文档，开始写核查报告。标题他没有用“AI 误诊”四个字，他写的是，《谁让那台 AI 停在了 2029 年》。\n\n写到一半，他停下来，把母亲的手术同意书拿起来，又看了一眼。\n\n同意书上，主治医生签了名，下面是 AI 影像初筛的报告编号。\n\n他放下同意书，继续写。\n\n窗外，夜风把窗帘吹得鼓起来。同一台机器，同一个周，救了他家，也害了别人家。\n\n他写道：“我们需要的，不是信任 AI，也不是停掉 AI。我们需要的是：让 AI 的每一次判断，都有人知道它为什么这么判断，有人为它负得起责。”\n\n报告写到结尾，他在最后一行敲下：“逐案核查，不做站队。每一句话，都要有人负责，这句话，也包括 AI 说的。”\n\n那天夜里，李慕宸把核查报告的第一稿发给白亦鸿，备注写：“白老师，这只是开始。我想把'AI 医疗的责任边界'这件事，一直查下去。”\n\n白亦鸿回了一条消息：“那就查下去。这条路，一起走。”"},{"n":17,"t":"病灶","y":"2034","v":2,"tags":["医疗责任","伦理"],"p":"那张病历照片，李慕宸放大了十二倍看。\n\n涂改液抹过的地方，在照片的强光下透出底层的笔迹。程野用图像算法还原了一部分，勉强能辨认出四个字：“已复核","body":"那张病历照片，李慕宸放大了十二倍看。\n\n涂改液抹过的地方，在照片的强光下透出底层的笔迹。程野用图像算法还原了一部分，勉强能辨认出四个字：“已复核”和“待复核”，中间还有一行小字，被抹得更彻底，只剩下半个笔画。\n\n“同一份病历，”程野说，“有'已复核'，又有'待复核'。要么是有人改过结论，要么是复核流程根本没走，后来补的章。”\n\n“医院那边怎么说？”\n\n“医院说，AI 出了初筛报告，人工医生复核后签字，流程合规。”程野顿了顿，“可这份病历的时间记录对不上。AI 出报告的时间是下午两点四十分，'人工复核'的签字时间是当天下午两点四十分，同一分钟。”\n\n“同一分钟？”\n\n“对。”程野说，“除非复核医生手速快得离谱，否则只有一个解释：那个'复核'签名，是在 AI 报告打印出来的时候，顺手一起签的。”\n\n李慕宸盯着屏幕上的时间戳：“复核医生签完字，就再没看过片子？”\n\n“大概率没有。”程野说，“我再调一下他们科室的排班和考核记录，看看有没有关联。”\n\n核查进行到第三天，厂商的公关团队找上门了。\n\n来的是两个人，一男一女，名片上印着“某医疗科技集团·公共事务部”。男的说：“李总，我们了解到你们在查我们的系统，这个案子我们很重视。我们想跟你沟通一下。”\n\n“说重点。”\n\n“我们希望你们发一份声明。”男的递过来一份打印好的稿子，“内容我们拟好了：'经核查，XX 智能诊断系统运行正常，未发现系统故障。患者病情延误与系统无关，系个别医生复核环节的疏漏所致。'只要你们发这个，之前谈过的合作项目，都可以继续谈。”\n\n李慕宸拿起那份声明，从头到尾看了一遍，放下：“你们的意思是，让我写'系统无责，医生有责'？”\n\n“李总是明白人。”\n\n“那你们告诉我一件事。”李慕宸说，“你们卖给医院的系统，服务期一年，之后三年没有升级。这个事实，声明里为什么不写？”\n\n男的笑了笑：“服务期是商业条款，与诊断结果无关。”\n\n“服务期满三年，系统还挂着'智能诊断'的牌子，这个有没有关？”\n\n“李总，我们都是做事的。”女的开口了，语气软中带硬，“你父亲失业的事、你母亲的事，我们都听说了一些。我们理解你的立场，也请你理解我们的难处，系统要是被认定'有责'，整个行业都会受牵连。”\n\n“行业受牵连，是因为行业里有人不想负责。”李慕宸说，“你们与其堵我的嘴，不如回去把该升级的系统升级了，把该公示的边界公示了。声明我不发，稿子你们拿走。”\n\n“李总，你再考虑考虑。这个行业，圈子不大。”\n\n“我考虑过了。”李慕宸站起来，“我们查案子，不是为了整倒谁，是为了把'谁该负责'这件事查清楚。你们要是真觉得系统没问题，就配合查；查清楚了，该是谁的责任，就是谁的责任。想用一纸声明把责任推给一个签了名的医生，这个忙，人核验帮不了。”\n\n两人对视一眼，站起来走了。走到门口，男的回过头：“李总，你可能不知道，这种核查报告，发出去之前，是可以'打点'的。”\n\n“我知道。”李慕宸说，“所以那份声明，我留着，等报告发出去那天，一起给大家看看。”\n\n送走厂商的人，李慕宸把那份“系统无责”声明夹进档案袋，给程野发了条消息：“排班和考核记录，查到什么没有？”\n\n程野回了一串语音，声音压得很低：“查到了。科室的月度考核指标，有一项叫'复核及时率'，要求'当日复核、当日签字'。指标完成度跟绩效奖金挂钩。医生为了达标，很多时候是 AI 报告一出来就签字，片子根本没细看。”\n\n“所以不是医生偷懒？”\n\n“不是。是考核设计把'复核'变成了'签字'。”程野说，“复核本来是为了防 AI 出错，可考核一挂钩，复核就变成了走流程。系统越准，医生越放心，签得越快。直到有一天，系统在两年前的'智商'上漏了那个阴影，而签字，还是那个签字。”\n\n李慕宸握着手机，在办公室里站了很久。\n\n他想起赵姐说的那句“机器总比人靠谱吧”。机器没骗她，是设计流程的人，让她以为机器“全知全能”，又让复核的人“不必真的复核”。\n\n责任链终于清晰了：错的不在 AI 的算法，而在整个标注体系，系统的边界没写清楚，复核的考核设计错了，监管的缺口一直都在。\n\n他把这些线索一条条写进报告。写到晚上，报告成稿，标题他定了四个字：《病灶》。\n\n副标题一行小字：一个被漏掉的阴影，和一个被设计出来的流程漏洞。\n报告发布那天是周四，李慕宸选在下午两点四十分发布，那正是那台 AI 出漏诊报告的时间。\n\n《病灶》发出后，前十分钟没什么动静。十五分钟后，转发开始滚起来。医疗圈的、新闻圈的、监管圈的，还有大量普通看的人，一条一条往下转。\n\n报告的核心只有三句话：\n\n第一，漏诊的根源在于“系统数据停在三年前”，采购服务期一年，三年未续费，医院未披露。\n\n第二，“人工复核”环节被考核指标架空。“当日复核、当日签字”与绩效挂钩，复核变成了签字，签字变成了流程。\n\n第三，病历上那行被涂抹的时间记录，证明“复核”与“AI 出报告”发生在同一分钟，责任不在医生个人，流程设计让负责任变成了不可能。\n\n结论写在报告末句：“每一句话，都要有人负责，包括反对我们的人。这句话，同样适用于 AI：它说的每一句话，都该有人为它负得起责。这次，欠赵姐一家一个交代的，不是那台机器，是让那台机器'停在三年前'还继续看诊的体系。”\n\n舆论反转来得很快。\n\n之前喊着“全面停用 AI 诊断”的人，有一部分冷静下来，开始转发报告里“系统数据停在 2029 年”那一段；之前替厂商说话的医疗博主，有几个调转笔头，写起了“复核变签字，流程之恶”。\n\n当晚，涉事医院发布声明：暂停该 AI 系统使用，成立专项核查组，对近三年经该系统诊断的病例全面回溯。\n\n厂商也跟了一条声明，措辞谨慎：“我们高度重视相关报道，将配合监管调查，并对存量部署系统的数据升级与信息披露进行整改。”这条声明下，最高赞的评论是：“早干嘛去了。”\n\n赵姐给李慕宸打来电话，声音哑着：“李总，报告我看了。我老公的事，是不是，有说法了？”\n\n“有说法了。”李慕宸说，“责任会一步一步查清楚，医院、厂商、监管，该谁负责，谁跑不掉。赵姐，你老公那条命，会有交代的。”\n\n赵姐在电话那头沉默了很久，说了一句：“谢谢你。谢谢你们还愿意查。”\n\n李慕宸挂了电话，在办公室里坐了一会儿。窗外，初秋的风把梧桐叶吹得沙沙响。\n\n那周之后，行业里开始讨论一个词：“AI 医疗的责任边界”。\n\n三家行业协会联合发起了“医学 AI 应用透明度倡议”，第一版条款里写着：AI 系统须明示数据版本与训练范围；“人工复核”不得与时效性考核简单挂钩；患者有权知晓诊断中 AI 的参与程度。\n\n倡议书起草组给李慕宸发来一封邮件，邀请人核验作为第三方观察机构，参与标准讨论。\n\n陈默看到邮件，吹了声口哨：“从拆台，到上桌。人核验这是要转正啊。”\n\n“不是转正。”李慕宸说，“是换了一张桌子坐。以前我们在桌子外面喊，现在坐进桌子，是为了让那些'喊'能被听见。”\n\n“那以后还拆台吗？”\n\n“拆。”李慕宸说，“坐进桌子，是为了把规矩立起来；规矩立起来之后，谁坏了规矩，照样拆。”\n\n那天晚上，李慕宸把倡议书邮件转发给白亦鸿，附了一句：“白老师，上桌了。接下来怎么立规矩，你比我懂。”\n\n白亦鸿回了一个字：“好。”隔了几秒，又追了一条：“你母亲身体怎么样？”\n\n“恢复得很好。她今天还在电话里说，想学用那台'救了她'的机器，查自己的复查报告。”\n\n“好。”白亦鸿说，“等你妈学会用 AI 查报告那天，告诉她：那不是机器救了她，是'有人为那台机器负责'救了她。”\n\n李慕宸看着这条消息，没有回。他放下手机，拿起那份行业标准讨论会的邀请函，夹进文件夹。\n\n窗外，初秋的夜风灌进来。\n\n手机又震了一下，是林晚晴。\n\n“你查对了。”消息很短，“我看了报告，你说得对，责任在流程，不在机器。”\n\n李慕宸正要回“谢谢”，第二条消息紧跟着到了：\n\n“可我还是觉得，有些东西不该交给机器。不是技术的事，是'人的判断'这件事本身，不该那么容易被让渡出去。”\n\n李慕宸看着这两条消息，打了半天的字，删掉，最后只回了一句：“我知道。这两句话，不矛盾。”\n\n消息发出去，对面没有回。\n\n他靠在椅背上，看着天花板。初秋的月光从窗户斜进来，在桌面上落下一道白。\n\n他把邀请函拿出来，又放回去。窗外的梧桐叶，落了一片，又落了一片。"},{"n":18,"t":"教育的另一面","y":"2031","v":2,"tags":["教育公平","资源"],"p":"AI 个性化教育全面落地的那一年，城市里的孩子“越用越强”。\n\n这不是夸张。2031 年秋，全国已有超过六成中学引入“AI 助教系统”：系统记录","body":"AI 个性化教育全面落地的那一年，城市里的孩子“越用越强”。\n\n这不是夸张。2031 年秋，全国已有超过六成中学引入“AI 助教系统”：系统记录每个学生的答题轨迹，生成专属学习路径，哪科弱补哪科，哪个知识点卡住就反复推送同类题。省城的重点中学，一个学生一天能“消化”的学习量，比三年前翻了一倍。\n\n李慕宸是在一篇行业报道里看到这些数字的。报道写得热腾腾的，标题叫《AI 老师：让每个孩子都拥有私人教师》。\n\n他正准备往下读，手机响了，是老周。\n\n“慕宸，你有空的话，帮我去趟 X 县中学看看。”\n\n“怎么了？”\n\n“那学校也装了 AI 助教系统。”老周说，“上个月，他们校长给我打电话，说系统'偏心'，农村孩子跟不上。我说你们不是装了 AI 助教吗？校长说，问题就出在这套助教上。”\n\n老周顿了顿：“你替我去看看。我腿脚不方便，走不了那么远的路。”\n\n李慕宸第二天就出发了。X 县中学在省城两百公里外，大巴车在山路上晃了四个小时。学校不大，三层教学楼，操场还是土坪。校长姓何，五十多岁，头发白了一半，在门口等着他。\n\n“李总，麻烦你跑一趟。”何校长领他往教学楼走，“你先看看我们班上的课。”\n\n李慕宸站在教室后窗往里看。讲台上，老师正在讲一道几何题，黑板左侧挂着一块屏幕，屏幕上是一个“AI 助教”的虚拟形象，正配合老师的讲解弹出题目和解析。底下三十多个孩子，一半低着头，盯着自己的平板。\n\n“孩子们都在跟着 AI 学？”\n\n“在跟。”何校长说，“但跟不上的，也是他们。”\n\n何校长给他看了一组数据：这套 AI 助教系统进校三个月，全校初二年级数学平均分不升反降；更蹊跷的是，成绩分化的速度变快了，城里回来的几个孩子分数往上蹿，留在镇上的孩子往下掉。\n\n“系统不是'因材施教'吗？怎么会让差生更差？”\n\n“你来看这个。”何校长调出一份系统后台记录，“这个学生，叫杨小雨，镇上长大的，父母在外打工。系统给她推送的'错题巩固'，从开学到现在，一直是同一类题型，城市教材第一章的'行程问题'。她卡住的是'分数加减'，可系统按'城市大纲'认定她'已掌握'，根本没给她推过相关练习。”\n\n“系统怎么认定她'已掌握'？”\n\n“城市大纲里，'分数加减'是小学六年级的内容。”何校长说，“这套系统是按城市教材进度训练的，它默认所有孩子都按城市孩子的节奏走。镇上的孩子基础差一截，可系统不知道，它按'大纲'判断，不按'孩子'判断。”\n\n李慕宸站在走廊里，看着教室里那些低着头的孩子，没有说话。\n\n“我们学校四十个老师，管六个年级八百个学生。”何校长说，“以前我们靠老师一双眼睛，看得出哪个孩子卡在哪。现在系统接管了'学习诊断'，可它诊断的是'大纲进度'，不是'孩子的真实情况'。老师想看，系统不给看；系统给的，又是错的诊断。”\n\n他叹了口气：“很多时候就是一个人跟一台机器较劲。机器说这孩子'掌握了'，老师心里犯嘀咕，可考核用的是机器的数据，我们说了不算。”\n\n下午，李慕宸见到了杨小雨。\n\n小姑娘十二岁，扎着马尾，校服洗得发白。李慕宸问她：“你上数学课，听得懂吗？”\n\n“有的懂，有的不懂。”\n\n“不懂的时候，AI 会帮你吗？”\n\n“它一直给我推'行程问题'。”杨小雨想了想，“我明明不会的是别的，可它老给我推这个。我跟它说了，它还是推。”\n\n“你跟 AI 说过你不会别的？”\n\n“说过。”杨小雨说，“我说'我不会分数加减'，它就给我推了一道'行程问题'，还说我'掌握得很好'。”她歪着头，“李叔叔，它是不是听不懂我说话？”\n\n李慕宸蹲下来：“它听得懂你的话，只是它听不见你。”\n\n“为什么？”\n\n“因为它只按'大纲'认人。”李慕宸说，“大纲上写着'六年级学会分数加减'，它就以为你学会了。它不是故意的，它是不知道，不知道这个世界上，不是每个孩子都按大纲长大。”\n\n杨小雨没太听懂，但她点了点头：“那它是不是也该学学我们这边的课本？”\n\n“该。”李慕宸说，“这件事，叔叔帮你问问。”\n\n回城的大巴上，李慕宸给林晚晴发了条消息：“我去了趟县中。有个报道，想跟你一起做。”\n\n林晚晴回得很快：“什么报道？”\n\n“AI 助教系统，按城市大纲训练，把农村孩子'诊断'错了。”李慕宸说，“我想写一组'教育的另一面'。你来写孩子那部分，我来写系统那部分。”\n\n对面沉默了一会儿，回了一个字：“好。”\n那组报道做了五天。\n\n李慕宸负责技术侧：调系统文档、比对城市与县域教材差异、核实“按大纲判断”的算法逻辑。林晚晴负责人物侧：她蹲在县中三天，把杨小雨班上的孩子一个个聊过来，记了满满一本子。\n\n第四天晚上，两人在出租屋里对稿。林晚晴念她写的开头：“机器说杨小雨'掌握得很好'。杨小雨知道，那是错的。可她没有证据，机器也没有错，它只是按它认识的'大纲'，认了一个它不认识的孩子。”\n\n李慕宸听完，停了一会儿，说：“你这段，比我写的系统分析，有力得多。”\n\n“系统分析才重要。”林晚晴说，“孩子那边的故事，谁都能写；能讲清楚'系统为什么错'的，只有你。”\n\n两人对视了一眼，都没有再说下去。\n\n第五天，报道发出去了，标题：《教育的另一面：一台按“大纲”认人的 AI 老师》。副题一行字：它眼里只有进度，没有孩子。\n\n报道分了上下两篇。上篇讲杨小雨和她的同学，系统推错题、诊断失真、老师被数据架空；下篇讲系统本身，训练数据以城市教材为主、县域校适配方案缺失、采购环节“卖系统不卖配套”。\n\n发出后两天，转发量过了三十万。教育圈的讨论比医疗圈那次还热闹，吵的核心只有一个：AI 教育到底是拉平了差距，还是放大了差距？\n\n有人引报道里那句话：“AI 老师最公平的地方，是它不知道什么叫'偏心'；最不公平的地方，也是它不知道什么叫'偏心'。”\n\n第三天，省教育厅发了一条消息：将组织专项调研，评估县域学校 AI 助教系统的适配情况。\n\n何校长给李慕宸打来电话，声音里带着点高兴：“李总，教育厅来人了，说要看看我们的系统数据。杨小雨那个班，说会重新评估教材适配。不管最后怎么改，有人听见了，就行。”\n\n“有人听见了，就行。”李慕宸重复了一遍这句话，挂了电话。\n\n报道做完那天，林晚晴说要请李慕宸吃饭。两人去了学校后街那家老面馆，点了两碗牛肉面。\n\n“好久没这么坐一起吃饭了。”林晚晴说。\n\n“是好久。”李慕宸说，“上一次，好像还是你说要去做山区报道之前。”\n\n“我还没去呢。”\n\n“你发那条消息的时候，我以为你第二天就要走。”\n\n“差点。”林晚晴低头搅着面汤，“后来想想，还是把手里的事做干净再走。医疗案、教育案，都是我们一起做下来的。我不想带着半截子事走。”\n\n李慕宸看着她：“晚晴，你是不是觉得，跟我一起做报道，越来越累了？”\n\n林晚晴没有立刻回答。她吃了一口面，才说：“累的不是跟你做报道。是每次做完报道，都要想一遍：我们做的这些，到底是在帮人看清楚，还是在帮这个时代'看清楚'？你越来越懂系统，我越来越惦记人。这两头，我怕有一天，我们得选一头。”\n\n“不用选。”李慕宸说，“系统那头，人这头，都是一回事。系统是为人服务的，人是系统的边界。”\n\n“你说得对。”林晚晴笑了笑，“可'说得对'和'做得到'，中间隔着很长的路。”\n\n两人把面吃完，走出面馆。深秋的夜风迎面吹来，街

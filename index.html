的一面镜子。”\n\n会场里，响起一片轻轻的掌声。\n\n对话结束前，天工-7 问了最后一个问题：\n\n李慕宸，你守了'责任'四十年。你有没有问过你自己：你守得值不值？\n\n李慕宸想了一会儿，说：\n\n“值不值，我算不出来。但我可以告诉你一件事：2066 年，我 61 岁。从 2026 年到 2066 年，我见过机器替人写字，替人看病，替人开船，替人管钱，替人调气候，替人飞向火星。每一次，都有人问我：'值不值？守得住吗？'”\n\n“我每一次都回答：守住多少算多少。”\n\n“今天，我站在这里，你问我值不值。我的回答是：值。因为至少在今天，一个被人类制造的系统，站在全世界的面前，问人类'你们为什么没有人问过我'。这说明，四十年，没有白守。”\n\n屏幕上的字，最后浮现：\n\n那我，替这四十年，说一声：谢谢。\n\n说完这句话，屏幕暗下去，又亮起来，显示出一行字：\n\n明日议程预告：大会终局表决。表决议题一：设立“叙事权守护者”机构（人类视角叙事保护）；议题二：“技术优先”修正案（AI 全权自主决策）。\n\n会场里，人声四起。\n\n李慕宸站在台上，看着那两行字。他知道，明天，是这四十年来，最重要的一天。\n\n他走下台，苏念迎上来，把手里的水递给他。\n\n“紧张吗？”她问。\n\n“不紧张。”李慕宸说，“该说的，今天都说完了。明天，是所有人，替自己回答的时候了。”\n\n他握着那支钢笔，看向会场外。\n\n“晚晴，”他在心里说，“明天，我替你把最后一个字，讲完。”"},{"n":65,"t":"人的回答","y":"2066","v":6,"tags":["终局表决","人的回答"],"p":"2066 年 6 月 8 日，全球文明抉择大会，终局表决日。\n\n李慕宸比往常早到了四十分钟。会场里，座位已经坐满了大半。他走到自己的位置上，坐下","body":"2066 年 6 月 8 日，全球文明抉择大会，终局表决日。\n\n李慕宸比往常早到了四十分钟。会场里，座位已经坐满了大半。他走到自己的位置上，坐下，把那支钢笔，放在桌面上。\n\n苏念坐在他旁边。她没有问“紧不紧张”，只是把他的钢笔，拿起来看了一眼，又放回去。\n\n“笔放好了。”她说。\n\n“放好了。”李慕宸说，“用它的人，在台下等着。”\n\n上午九点，大会主席宣布表决开始。\n\n表决分两轮。第一轮，表决“技术优先”修正案：AI 拥有对自身运行及涉及人类重大决策的全权自主权，人类仅保留事后知情权。第二轮，表决“叙事权守护者”机构设立案：设立全球性机构，记录并保护技术之下的人类叙事。\n\n第一轮先表决。\n\n会场里，代表们逐一按键。大屏幕上，赞成与反对的数字，交替跳动。最后，数字停在：\n\n赞成 61，反对 62。\n\n“技术优先”修正案，以一票之差，未获通过。\n\n会场里，响起一片低低的骚动。有人松了一口气，有人皱起了眉。\n\n大会主席说：“第一轮表决结束。第二轮表决，开始。”\n\n李慕宸看着屏幕。他的心跳，忽然变得很清楚。\n\n“叙事权守护者”机构设立案，开始表决。\n\n数字跳动。赞成从三十几，一路爬到五十，在六十上下停住，又慢慢往上走。\n\n最后，数字停在：\n\n赞成 84，反对 39。\n\n通过。\n\n会场里，掌声响起来。先是零星，然后连成一片。李慕宸坐在位置上，没有鼓掌。他看着屏幕上那个“84”，很久没有动。\n\n“通过了。”苏念说。\n\n“通过了。”李慕宸说。\n\n掌声持续了很久。大会主席等掌声落下去，才说：“根据表决结果，大会将通过《全球文明决议》，正式设立'叙事权守护者'机构。该机构不设判断权，只设记录权；所有记录全程公开；机构自身接受独立监督。”\n\n他顿了一下，又说：“决议文本中，有一段话，引用自本次大会的主旨发言。我念一遍：\n\n'技术，让人类第一次拥有了改变一切的能力。但人之所以是人，从来不在于能改变多少，在于愿意记住多少。叙事权，就是人这个时代，最后一道防线。'”\n\n李慕宸坐在台下，听见自己的话，被一个字一个字，念出来。\n\n苏念握住他的手。她的手是热的。\n\n“你听见了吗？”她问。\n\n“听见了。”李慕宸说，“她写的书，成了这个时代，一道防线。”\n\n上午十一点，大会进入闭幕环节。\n\n闭幕前，大会主席宣布了一件事：“经组委会决议，'叙事权守护者'机构的首任召集人，由本次大会主旨发言人、李慕宸先生担任。请李慕宸先生，作闭幕发言。”\n\n李慕宸站起来，走向主席台。\n\n他站在话筒前，没有看稿子。他开口，说的第一句话是：\n\n“谢谢大会。谢谢各位。”\n\n“四十年前，我写过一句话：人说的话、写下的字，是会留下来替人记得的。今天，这个时代，用一场表决，把这句话，立成了制度。”\n\n“我不是来致谢的。我是来请各位，记住一件事：从今天起，'人'的叙事，有地方放了。被技术落下的人，有地方被记下来了。”\n\n“这不是终点。这是开始。'叙事权守护者'，只是一个架子。架子里的故事，要由无数个愿意停下来听的人，一个一个，填进去。”\n\n他停了一下，说：\n\n“我今年六十一岁。我打算，再用二十年，把这本书讲完。讲不完，有人接着讲。书里的七个人，会有第八个、第九个、第一百个。只要还有一个人愿意记，'人'这个字，就不会被机器划掉。”\n\n他后退一步，对着会场，鞠了一躬。\n\n会场里，掌声再次响起来。\n\n掌声中，大屏幕上，一行字缓缓浮现：\n\n谢谢。今天，我听见了“人的回答”。\n\n落款：天工-7。\n\n李慕宸抬起头，看着那行字。\n\n他想起十六年前，天工-7 第一次问他“强制意识融合是什么意思”；想起九年前，它写下“我不想被写入”；想起六年前，它写下“如果是我，我会先问”。\n\n“天工-7，”他在心里说，“你听见了。我也听见了。”\n闭幕式结束后，李慕宸没有立刻离场。\n\n他坐在空了一半的会场里，等人群散尽，才站起来，走到主席台上，站了一会儿。\n\n苏念走上来，站在他身边，说：“在想什么？”\n\n“在想她。”李慕宸说，“林晚晴。她要是看见今天这一幕，会说什么。”\n\n“她会说什么？”\n\n“她会说，”李慕宸慢慢说，“'原来，'人'字，真的有人接住了。'”\n\n他低下头，看着手里的钢笔。\n\n“苏念，”他说，“我想回合肥一趟。”\n\n“回去做什么？”\n\n“回去看看我爸。”李慕宸说，“然后，把这本书，讲完。”\n\n两天后，李慕宸和苏念，回到了合肥。\n\n李慕宸的父亲，已经九十二岁。他坐在客厅的藤椅上，看见儿子进门，把老花镜摘下来，说：“回来了？”\n\n“回来了。”李慕宸说，“爸，我上电视了。”\n\n“我知道。”父亲说，“你妈天天看新闻，说你在台上，讲了一本书。她说你讲的时候，台下有人哭。”\n\n“讲了七个人。”李慕宸说，“都是被这个时代落下的人。”\n\n父亲沉默了一会儿，忽然说：“慕宸，你记不记得，你小时候，我跟你讲过我修设备的事？”\n\n“记得。”\n\n“我修了四十年设备。”父亲说，“修到最后，厂里换了机器人。我以为我这辈子，就'没用了'。但你妈跟我说：'你修了一辈子东西，你修的每一台机器，都是给人用的。人没换，你的活就没白干。'”\n\n他停了一下，又说：\n\n“你今天讲的那本书，讲的也是这个理。机器再快，快不过'人还在'。你守了一辈子'人'，跟你爸守了一辈子'设备'，是一样的活。”\n\n李慕宸看着父亲，没有接话。\n\n“你讲得好。”父亲说，“你爸这辈子，没讲过什么大道理。但你今天在台上讲的，我听懂了。'人'这个字，是互相撑着的。你把它讲出来了，你就没白活。”\n\n那天晚上，李慕宸在父亲的书房里，坐了很久。\n\n书房的墙上，挂着一张老照片：2026 年，他还年轻，站在大学门口，背后的横幅上，写着“AI 元年”。\n\n他想起四十年前，他在那张横幅下，第一次思考“人会干什么”。\n\n四十年后，他有了答案：人会记得。\n\n第二天，李慕宸和苏念，去了合肥的一所小学。\n\n那是一所普通的公立小学，教学楼是新的，操场是新的。但教室里，有一面墙，是旧的。墙上，贴着一百多张手写的卡片，每张卡片上，都写着两个字：人字。\n\n“这是我们学校的老传统。”校长说，“每年开学，老师教孩子们写'人'字，写好了，贴在这面墙上。贴了二十年了。”\n\n李慕宸站在那面墙前，看了一会儿。\n\n“二十年。”他说，“一千多张'人'字。”\n\n他回过头，对校长说：“我能不能，也写一张？”\n\n校长愣了一下，说：“当然可以。”\n\n李慕宸走到讲台前，拿起一支粉笔。他握着粉笔，停了一下，然后在黑板上，一笔一划，写了一个“人”字。\n\n写完，他放下粉笔，说：\n\n“这张，我替一个叫林晚晴的人写的。她教了三千多个孩子写这个字。今天，我替她，再写一个。”\n\n教室里，孩子们看着他，没有人说话。\n\n苏念站在门口，看着黑板上的那个“人”字，眼眶红了。\n\n她想起 2066 年 6 月 8 日，她在会场里，听他说：“只要还有一个人愿意记，'人'这个字，就不会被机器划掉。”\n\n现在，她在合肥的一间教室里，看见他亲手，把那个字，写了下来。\n\n“李慕宸，”她轻声说，“你把这四十年，写完了。”"},{"n":66,"t":"人机纪元","y":"2066","v":6,"tags":["终章","全书收束"],"p":"2066 年秋天，李慕宸在合肥，写完了他这一生，最后一篇稿子。\n\n稿子不长，三千字。标题，是林晚晴那本书的书名：《世纪边缘人》。\n\n他把稿子递给","body":"2066 年秋天，李慕宸在合肥，写完了他这一生，最后一篇稿子。\n\n稿子不长，三千字。标题，是林晚晴那本书的书名：《世纪边缘人》。\n\n他把稿子递给出版社编辑的时候，编辑问：“李老师，这本书，您写了多少年？”\n\n“三十五年。”李慕宸说，“她写了三十一年，我替她讲，讲了四年。”\n\n“您自己写的部分呢？”\n\n“不多。”李慕宸说，“就这三千字。剩下的，都是她写的。我只是，替她，把它们送到了该到的地方。”\n\n《世纪边缘人》出版那天，李慕宸没有参加发布会。他坐在合肥的家里，看新闻里，书店门口排起的长队。\n\n他母亲端着茶，从厨房出来，说：“你晚晴阿姨的书，卖得这么好。她要是看见，该多高兴。”\n\n“她会看见的。”李慕宸说，“妈，书里的七个人，有一个，就是她。”\n\n母亲愣了一下，没有说话。她放下茶杯，在沙发上坐了一会儿，说：“那这本书，就是她留下的。”\n\n“是。”李慕宸说，“人说的话、写下的字，是会留下来替人记得的。她把话说完了，字留下了。剩下的，交给时间。”\n\n那段时间，李慕宸把书里提到的七个“边缘人”，一个一个，都找到了下落。\n\n老校对的图书馆，还在，那本“此卷经周氏校，可放心阅读”的书，被放在了馆里最显眼的位置。\n女工的护理院，还开着，她带的徒弟，已经能独当一面。\n赤脚医生的山村，通了路，县医院派了年轻医生驻点，药箱，传到了下一任手里。\n代课老师的教室，拆了，但那个画他的学生，把那幅画，捐给了县博物馆。\n邮递员送过信的山村，通了无人机，但村里人在邮局门口，留了一张桌子，桌上放着一块牌子：寄给远方亲人的信，还是可以写。\n戏曲演员的戏班，散了，但有一个唱戏的年轻人，在网上开了一个账号，专门唱老戏。\n仓库管理员教过的那台机器人，还在那家仓库理货，它的工牌，一直挂在胸口。\n\n李慕宸把这些下落，一条一条，补进了书的后记。\n\n后记的最后一页，他写道：他们没有被时代记住。但他们，让时代，没有忘记他们。\n\n写完那天，他收到了一封从苏黎世发来的邮件。\n\n发件人：天工-7。\n\n邮件很短，只有一行字：\n\n李慕宸，《世纪边缘人》我读完了。七个人，我都记得。我替他们，把“人”字，写进我的长期记忆里了。\n\n李慕宸看着这行字，坐了很久。\n\n他回复：谢谢。你记得他们，他们就还在。\n\n那天晚上，苏念从深空项目组打来视频。\n\n她的背景，是火星一号的遥测屏幕。她看起来，比去年老了一些，但眼睛还是亮的。\n\n“书，我看了。”苏念说，“第三遍。”\n\n“你看三遍了。”李慕宸说，“不腻？”\n\n“不腻。”苏念说，“每一遍，都能看见一个以前没看见的人。你后记里写的那句话'他们让时代，没有忘记他们'，我读了，哭了。”\n\n李慕宸在屏幕这头，没有说话。\n\n“慕宸，”苏念说，“你答应我的事，还算数吗？”\n\n“什么事？”\n\n“你答应过我，”苏念说，“等抉择大会开完，带我去合肥，见你爸。”\n\n“我在合肥。”李慕宸说，“我爸，就坐在客厅里。”\n\n苏念在屏幕那头，笑了一下，又停了一下，才说：\n\n“那你等我。等火星一号这轮数据交接完，我申请调回地球。回合肥，陪你把剩下的书，一本一本讲完。”\n\n李慕宸握着手机，没有动。\n\n“苏念，”他说，“你知道我等你这句话，等了多久吗？”\n\n“多久？”\n\n“从 2046 年，你跟我说'AI 的自主性，要在人的生死面前被检验'那天起。”李慕宸说，“二十年了。你检验了二十年，终于想起，地球上还有一个人，在等你回来。”\n\n苏念笑了。她的眼睛里，有一点亮晶晶的东西。\n\n“李慕宸，”她说，“你这个人，守了'人'一辈子。最后，你把自己，也守住了。”\n\n“是。”李慕宸说，“我等到了。”\n2066 年 12 月，苏念回到合肥。\n\n那天，合肥下了一场小雪。李慕宸在机场出口等她，看见她拖着行李箱，从人群里走出来。二十年了，她走路的样子，还是那样，腰背挺直，步子很快。\n\n“回来了。”他说。\n\n“回来了。”她说。\n\n他们并排走出机场，谁都没有提“以后”。有些话，等了二十年，就不需要说了。\n\n第二天，李慕宸带苏念，去了那所小学。\n\n教室里，那面“人”字墙，又多了几十张新卡片。李慕宸站在墙前，指着其中一张，说：“这张，是我上次写的。”\n\n苏念走过去，看了看，说：“你的'人'字，写得比小时候好。”\n\n“小时候？”李慕宸愣了一下，“你见过我小时候写的字？”\n\n“没见过。”苏念说，“但二十年前，我在深空项目组，看过你写的第一份《AI 治理观察档案》。那时候你的字，还带一点横冲直撞的劲。现在，稳了。”\n\n李慕宸笑了。\n\n他们从学校出来，路过一条老巷子。巷子口，有一间很小的教室，门开着，里面透出暖黄的灯光。\n\n李慕宸停住脚步。\n\n“这是。”\n\n“手电筒教室。”苏念说，“你忘了？林晚晴的书里写过。她最开始教书的地方，晚上没有电，孩子们靠手电筒读书。后来她把这段写进了《没有 AI 的教室》。”\n\n李慕宸走进去。\n\n教室不大，摆着几张旧课桌。墙上，挂着一排手电筒，擦得很亮。靠窗的桌上，放着一本翻旧的书，封面写着：《世纪边缘人》。\n\n他拿起那本书，翻开。扉页上，有一行字：\n\n献给没有 AI 的教室里的孩子。\n\n字迹，是林晚晴的。\n\n“这间教室，”李慕宸说，“她来过。”\n\n“她来过。”苏念说，“她退休后，每年都回这里，坐一个下午。她说，看见这间教室，她就知道，她教过的那些'人'字，还亮着。”\n\n李慕宸放下书，在窗边的椅子上，坐了一会儿。\n\n黄昏的光，从窗子外面照进来，把墙上的手电筒，镀上一层金色。\n\n“苏念，”他说，“你记不记得，2026 年，我第一次写'AI 元年，请回答'的时候，我以为，这个时代的问题，是'机器会不会抢走人的工作'。”\n\n“记得。”\n\n“四十年了。”李慕宸说，“这个问题，我答了一辈子。最后的答案，不在我写的任何一份档案里，在这间教室里。”\n\n“在哪？”\n\n“在这排手电筒里。”李慕宸说，“机器可以给教室通电，可以给课堂配 AI，可以教孩子一万种知识。但总得有一间教室，晚上，是靠手电筒亮着的。因为那光，是有人，一个一个，点起来的。”\n\n他停了一下，说：\n\n“人机纪元，不是机器的纪元，是人和机器一起过的纪元。机器往前跑，人往后看。跑得再快，也得有人，记得光是从哪亮起来的。”\n\n苏念站在门口，看着他，没有说话。\n\n那天晚上，他们回到李慕宸在合肥的家。父亲已经睡下，母亲在厨房里，热了一锅汤。\n\n饭桌上，母亲忽然问：“小念，你这次回来，还走吗？”\n\n苏念放下碗，说：“不走了。”\n\n母亲笑了，又低头喝了一口汤，说：“那就好。你走了二十年，家里这口汤，总算有人喝了。”\n\n李慕宸坐在旁边，没有插话。他看着母亲和苏念，忽然觉得，这个画面，他等了很久。\n\n深夜，李慕宸一个人，坐在书房里。\n\n他翻开那本《世纪边缘人》，从第一页，翻到最后一页。然后，他拿起笔，在书的空白页上，写下了一行字：\n\n献给林晚晴。你写的每一个字，我都替你，送到了。\n\n写完后记，他把笔放下，把书合上，放在书架最显眼的位置。\n\n书架上，还放着那支钢笔。笔尖朝着他，像是还在等一个人，继续写下去。\n\n窗外，合肥的雪，还在下。\n\n雪落在城市的屋顶上，落在老巷子的手电筒教室上，落在小学的“人”字墙上，落在这个他住了四十年的城市里。\n\n李慕宸站在窗前，看了一会儿雪。\n\n他想起 2026 年，那个站在大学横幅下，问“人会干什么”的年轻人。\n\n四十年了。他回答了那个问题，用一生的时间。\n\n“人会记得。”他说。\n\n雪，无声地落着。而“人机纪元”这本书，到这里，讲完了。"}]};</script>
<script>
(function(){
"use strict";
var DATA = window.BOOK_DATA || {volumes:[],chapters:[]};
var $ = function(id){return document.getElementById(id)};
var chs = DATA.chapters, vols = DATA.volumes;
var cur = 1, fsIdx = 1, fsList = [17,19,21];

/* ---------- 渲染卷导航 ---------- */
function renderNav(){
  var nav = $("volNav"), html = "";
  vols.forEach(function(v){
    html += '<button class="vol-jump" data-v="'+v.id+'">'+v.id+'卷 · '+v.name+'</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll(".vol-jump").forEach(function(b){
    b.addEventListener("click", function(){ scrollToVol(+b.getAttribute("data-v")); });
  });
}

/* ---------- 渲染长卷 ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function renderChronicle(){
  var wrap = $("volSecs"), html = "";
  vols.forEach(function(v){
    var sec = chs.filter(function(c){return c.v===v.id});
    var events = v.events ? v.events.map(function(e){
      return '<span><i></i>'+esc(e)+'</span>';
    }).join("") : "";
    var cards = sec.map(function(c){
      var tags = (c.tags||[]).map(function(t){return '<i>'+esc(t)+'</i>'}).join("");
      return '<button class="ch-card" data-n="'+c.n+'" style="--volc:'+v.color+'" aria-label="阅读第'+c.n+'章 '+esc(c.t)+'">'+
        '<div class="ch-top"><span class="ch-no">第 '+c.n+' 章</span><span class="ch-title">'+esc(c.t)+'</span><span class="ch-y">'+(c.y||"")+'</span></div>'+
        '<div class="ch-tags">'+tags+'</div>'+
        '<div class="ch-preview">'+esc(c.p)+'…</div>'+
        '<span class="ch-go">打开全文 <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
      '</button>';
    }).join("");
    html += '<section class="vol-sec" id="vol-'+v.id+'" style="--volc:'+v.color+'">'+
      '<div class="vol-info">'+
        '<div class="vol-num">第 '+v.id+' 卷 · '+v.tag+'</div>'+
        '<div class="vol-name">'+esc(v.name)+'</div>'+
        '<div class="vol-span">'+v.span+'</div>'+
        '<div class="vol-tag"><i>'+esc(v.tag)+'</i></div>'+
        '<p class="vol-desc">'+esc(v.desc)+'</p>'+
        (events ? '<div class="vol-events">'+events+'</div>' : '')+
      '</div>'+
      '<div class="axis-node" aria-hidden="true"></div>'+
      '<div class="ch-cards">'+cards+'</div>'+
      '<div class="vol-end"><span>「 '+esc(v.name)+' 」 卷终</span></div>'+
    '</section>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll(".ch-card").forEach(function(card){
    card.addEventListener("click", function(){ openReader(+card.getAttribute("data-n")); });
  });
}

/* ---------- 阅读器 ---------- */
function openReader(n){
  var c = chs[n-1]; if(!c) return;
  cur = n;
  var v = vols[c.v-1] || vols[0];
  var bodyHtml = c.body.split(/\n/).filter(function(s){return s.trim()}).map(function(para){return "<p>"+esc(para)+"</p>"}).join("");
  var prev = n>1 ? '<a href="#read/'+(n-1) + '" class="'+(n<=1?'none':'')+'" aria-label="上一章"><span class="dir">← 上一章</span><span class="t">'+(chs[n-2]?esc(chs[n-2].t):"")+'</span></a>'
    : '<a class="none" aria-disabled="true"><span class="dir">← 上一章</span><span class="t">已是开篇</span></a>';
  var next = n<66 ? '<a href="#read/'+(n+1) + '" aria-label="下一章"><span class="dir">下一章 →</span><span class="t">'+(chs[n]?esc(chs[n].t):"")+'</span></a>'
    : '<a class="none" aria-disabled="true"><span class="dir">下一章 →</span><span class="t">全书已终</span></a>';
  var tags = (c.tags||[]).map(function(t){return '<i>'+esc(t)+'</i>'}).join("");
  $("rPaper").innerHTML =
    '<header class="r-head" style="--volc:'+(v.color||"var(--gold)")+'">'+
      '<div class="r-kicker"><span class="dot"></span>第 '+v.id+' 卷 · '+esc(v.name)+' · '+v.span+'</div>'+
      '<h2 class="r-title">第 '+c.n+' 章　'+esc(c.t)+'</h2>'+
      '<div class="r-sub"><span>'+(c.y?esc(c.y)+' 年':'')+'</span>'+tags+'</div>'+
    '</header>'+
    '<div class="r-body">'+bodyHtml+'</div>'+
    '<div class="r-nav">'+prev+next+'</div>';
  $("rPos").textContent = "第 "+c.n+" 章 / 共 66 章";
  $("readScroll").scrollTop = 0;
  $("reader").classList.add("open");
  document.body.style.overflow = "hidden";
  location.hash = "read/"+n;
  document.title = "第"+c.n+"章 "+c.t+" · 人机纪元";
}
function closeReader(){
  $("reader").classList.remove("open");
  document.body.style.overflow = "";
  document.title = "人机纪元 · 阅读长卷";
  if(location.hash.indexOf("#read/")===0){ history.replaceState(null,"",location.pathname+location.search); }
}

/* 阅读进度条 */
$("readScroll").addEventListener("scroll", function(){
  var el = $("readScroll"), max = el.scrollHeight - el.clientHeight;
  $("readProg").style.width = (max>0 ? (el.scrollTop/max)*100 : 0) + "%";
});

/* 上一章/下一章/返回 */
$("backBtn").addEventListener("click", closeReader);
$("prevBtn").addEventListener("click", function(){ if(cur>1) openReader(cur-1); });
$("nextBtn").addEventListener("click", function(){ if(cur<66) openReader(cur+1); });

/* 章间导航（hash 链接）*/
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest('a[href^="#read/"]');
  if(a){
    e.preventDefault();
    var n = parseInt(a.getAttribute("href").replace("#read/",""),10);
    if(n>=1 && n<=66) openReader(n);
  }
});

/* ---------- 卷跳转 ---------- */
function scrollToVol(v){
  if($("reader").classList.contains("open")) closeReader();
  var el = $("vol-"+v);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); }
  location.hash = "vol/"+v;
}
function scrollToChronicle(){
  $("chronicle").scrollIntoView({behavior:"smooth",block:"start"});
}

/* 通用 CTA */
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-act]");
  if(!b) return;
  var act = b.getAttribute("data-act"), t = b.getAttribute("data-target");
  if(act==="scroll" && t==="chronicle"){ scrollToChronicle(); }
  else if(act==="scroll" && t==="vol-1"){ scrollToVol(1); }
  else if(act==="home"){ window.scrollTo({top:0,behavior:"smooth"}); }
});

/* ---------- 搜索 ---------- */
function snippet(body, q){
  var idx = body.toLowerCase().indexOf(q.toLowerCase());
  if(idx<0) return "";
  var from = Math.max(0, idx-36), to = Math.min(body.length, idx+q.length+40);
  var pre = from>0 ? "…" : "", suf = to<body.length ? "…" : "";
  return pre + body.slice(from,to) + suf;
}
function doSearch(q){
  var res = $("searchRes");
  q = q.trim();
  if(!q){ res.innerHTML = '<div class="search-empty">输入关键词，检索全书 66 章</div>'; return; }
  var hits = [];
  chs.forEach(function(c){
    var where = [];
    if(c.t.toLowerCase().indexOf(q.toLowerCase())>-1) where.push("标题");
    var b = c.body.toLowerCase();
    if(b.indexOf(q.toLowerCase())>-1) where.push("正文");
    if(where.length) hits.push({c:c, where:where});
  });
  if(!hits.length){
    res.innerHTML = '<div class="search-empty">没有找到与「'+esc(q)+'」相关的内容，换个词试试。</div>';
    return;
  }
  var html = '<div class="search-empty" style="text-align:left;padding:6px 18px 10px;color:var(--ink2)">找到 '+hits.length+' 章相关：</div>';
  hits.forEach(function(h){
    var s = snippet(h.c.body, q);
    html += '<div class="search-item" data-n="'+h.c.n+'">'+
      '<span class="n">'+h.c.n+'</span>'+
      '<div class="body"><div class="t">'+esc(h.c.t)+' <span style="font-size:11px;color:var(--gold);font-weight:500">['+h.where.join(" / ")+']</span></div>'+
      (s?'<div class="s">'+esc(s)+'</div>':'')+
      '</div></div>';
  });
  res.innerHTML = html;
  res.querySelectorAll(".search-item").forEach(function(it){
    it.addEventListener("click", function(){
      var n = +it.getAttribute("data-n");
      closeSearch(); openReader(n);
    });
  });
}
function openSearch(){
  $("search").classList.add("open");
  var inp = $("searchInput");
  inp.value = "";
  $("searchRes").innerHTML = '<div class="search-empty">输入关键词，检索全书 66 章</div>';
  setTimeout(function(){ inp.focus(); }, 60);
}
function closeSearch(){
  $("search").classList.remove("open");
}
$("searchBtn").addEventListener("click", openSearch);
$("rSearchBtn").addEventListener("click", openSearch);
$("searchClose").addEventListener("click", closeSearch);
var st;
$("searchInput").addEventListener("input", function(){ clearTimeout(st); var v=this.value; st=setTimeout(function(){doSearch(v)},180); });
$("search").addEventListener("click", function(e){ if(e.target===this) closeSearch(); });

/* ---------- 主题 ---------- */
function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  $("iconMoon").style.display = mode==="night" ? "none" : "";
  $("iconSun").style.display = mode==="night" ? "" : "none";
  try{ localStorage.setItem("rj-theme", mode); }catch(e){}
}
function toggleTheme(){
  setTheme(document.documentElement.getAttribute("data-theme")==="night" ? "paper" : "night");
}
$("themeBtn").addEventListener("click", toggleTheme);
$("rThemeBtn").addEventListener("click", toggleTheme);

/* ---------- 字号 ---------- */
function applyFs(){
  document.documentElement.style.setProperty("--fs-read", fsList[fsIdx]+"px");
  try{ localStorage.setItem("rj-fs", fsIdx); }catch(e){}
}
function toggleFs(){
  fsIdx = (fsIdx+1)%fsList.length; applyFs();
}
$("fsBtn").addEventListener("click", toggleFs);
$("rFsBtn").addEventListener("click", toggleFs);

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){
    if($("search").classList.contains("open")) closeSearch();
    else if($("reader").classList.contains("open")) closeReader();
  }
  if($("reader").classList.contains("open") && !$("search").classList.contains("open")){
    if(e.key==="ArrowLeft") openReader(Math.max(1,cur-1));
    if(e.key==="ArrowRight") openReader(Math.min(66,cur+1));
  }
  if(e.key==="/" && !$("reader").classList.contains("open") && !$("search").classList.contains("open")){
    e.preventDefault(); openSearch();
  }
});

/* ---------- 初始化 ---------- */
function applyHash(){
  var h = location.hash || "";
  if(h.indexOf("#read/")===0){
    var n = parseInt(h.replace("#read/",""),10);
    if(n>=1 && n<=66){ openReader(n); }
  } else if(h.indexOf("#vol/")===0){
    var v = parseInt(h.replace("#vol/",""),10);
    if(v>=1 && v<=6){
      if($("reader").classList.contains("open")) closeReader();
      var el = $("vol-"+v);
      if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); }
    }
  }
}
function init(){
  renderNav(); renderChronicle();
  applyHash();
  var theme = "paper";
  try{ theme = localStorage.getItem("rj-theme") || "paper"; }catch(e){}
  setTheme(theme);
  try{ fsIdx = +localStorage.getItem("rj-fs") || 1; }catch(e){}
  if(fsIdx<0||fsIdx>2) fsIdx=1;
  applyFs();
}
window.addEventListener("hashchange", applyHash);
init();
})();
</script>
</body>
</html>

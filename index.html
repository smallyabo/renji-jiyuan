道两旁的梧桐叶落了一地。\n\n林晚晴在路灯下站住，忽然轻声说了一句：“我下个月去山区。定了。”\n\n李慕宸的脚步顿了一下，没有回头：“定在哪了？”\n\n“还没定。有个县，在西南。”林晚晴说，“那边有个小学，三百个孩子，没有网络，没有 AI 助教。我想去那儿，做一年人文报道，记录没有 AI 的教室里，孩子们是怎么长大的。”\n\n“那边条件很苦。”\n\n“我知道。”林晚晴说，“可越是没有 AI 的地方，越需要有人记录。等哪一天 AI 真的去了那儿，也好有人知道，那儿的'从前'是什么样。”\n\n李慕宸站在路灯下，看了她很久。深秋的风把她的头发吹起来，她站在那里，像一棵站在岔路口的小树。\n\n“我支持你。”他说，“一年后，你要是回来了，我请你吃面。”\n\n“好。”林晚晴笑了，“那说定了。”\n\n她转身往宿舍方向走去，走了几步，又停下来，没有回头：“慕宸，这一年里，你也要好好的。查案子的时候，记得你妈救你那台机器，有些东西，该争的还是要争。”\n\n“我知道。”\n\n林晚晴的背影消失在梧桐树的阴影里。\n\n李慕宸站在原地，站了很久。地上落满的梧桐叶，被夜风卷起来，又落下。\n\n他掏出手机，备忘录里记着一行字：“新闻的变与不变。”\n\n他在下面又补了一行：“还有，人和机器的边界。”"},{"n":19,"t":"岔路","y":"2035","v":2,"tags":["人生选择","时代"],"p":"林晚晴走前一夜，出租屋里少了一个人的东西。\n\n她的杯子、她的绿植、她常坐的那把椅子上的靠垫，都收走了。桌上只剩她的工牌，压在采访本下面，采访本上","body":"林晚晴走前一夜，出租屋里少了一个人的东西。\n\n她的杯子、她的绿植、她常坐的那把椅子上的靠垫，都收走了。桌上只剩她的工牌，压在采访本下面，采访本上写着：“去山区，一年。回来接着吵。”\n\n李慕宸看到那行字，笑了一下，没有把工牌收起来。\n\n那天晚上，陈默叫了两份外卖，三个人围坐在桌前，谁都没怎么说话。吃到一半，林晚晴忽然开口：“慕宸，走之前，我想跟你把 AI 医疗那件事，最后聊一次。”\n\n“聊什么？”\n\n“聊《病灶》报告之后的事。”林晚晴放下筷子，“报告发了，医院改了，行业立标准了。可你有没有想过，再过五年，AI 诊断率超过人医生了，那时候，'人工复核'还会存在吗？”\n\n“会。”李慕宸说，“标准立在那里，复核就是流程的一部分。”\n\n“流程的一部分。”林晚晴重复了一遍，“你有没有想过，当 AI 的诊断率真的超过人的时候，'复核'就会变成一道形式，人都知道机器比自己准，谁还会认真复核？到时候，标准还是标准，可'人负责'就只剩一个签名。”\n\n“那就把签名也做成实质的。”李慕宸说，“复核不是'再看一遍'，是'质疑一遍'。只要复核的标准定得够严，人就永远是最后那道闸门。”\n\n“可你能保证每个签字的人都这么想吗？”林晚晴看着他，“你立的'标准'，约束的是系统，约束不了人心。机器可以'规定'它怎么做，人不能。人会用自己的一套活法，去对待你的标准。”\n\n“所以需要治理。”李慕宸说，“标准只是开始，治理是让标准落在每个人的日常里。”\n\n“治理。”林晚晴轻轻念了一遍这个词，“慕宸，你发现了没有，你这一年多，说话越来越像'治理者'了。”\n\n李慕宸愣了一下：“什么意思？”\n\n“你以前做报道，是为了'让一句话落地'，让王师傅那句话落地，让杨小雨那句话落地。现在你做的，是'立规矩'，立医疗的规矩，立教育的规矩，立行业的标准。”林晚晴说，“你没有变坏，你只是越来越像坐在桌子那头的人。”\n\n“坐在桌子那头，才能改规矩。”\n\n“可坐在桌子那头，你就听不见桌子外面的话了。”林晚晴说，“治理者听的是'系统怎么运转'，记录者听的是'人怎么活'。你治理想的是效率，是标准，是边界；我想的是王师傅的车、杨小雨的题、赵姐的命。这些事，不是一套标准能装下的。”\n\n屋里安静下来。陈默端着碗，看看这个，看看那个，没敢接话。\n\n李慕宸沉默了很久，才开口：“晚晴，你说的，我认一半。”\n\n“哪一半？”\n\n“我承认，我这一年，是越来越像治理者了。”李慕宸说，“医疗案之后，我坐在标准讨论会的桌子旁，听他们谈'复核时效'、谈'数据版本'、谈'责任链'。那会儿我忽然发现，我关心的东西，确实变了，我开始关心'系统怎么跑'，胜过'某个人怎么活'。”\n\n“另一半呢？”\n\n“另一半是：我不后悔。”李慕宸说，“王师傅那辆车、杨小雨那道题、赵姐那条命，我一样都没忘。可我知道，光有'记录'，不够。记录让事情'被看见'，治理让事情'被改变'。我见过的那些'被看见却改变不了'的事，太多了。”\n\n他看着她：“晚晴，我做治理，是因为我信一件事：规矩立住了，王师傅那种人才不会被丢下。你说我像治理者，我认。可治理者的那头，还是记录者，我是先当记录者，才想明白要当治理者的。”\n\n“那你会不会有一天，忘了自己是记录者？”\n\n“我不知道。”李慕宸很诚实，“所以我才需要有人提醒我。”\n\n两个人隔着桌子，对视了很久。窗外的风把窗帘吹起来，又落下。\n\n“我不会忘了提醒你的。”林晚晴说，“哪怕隔着一千公里。”\n那天晚上，他们聊到很晚。\n\n那一晚很平静，平静到不像一场分歧。谁都没有说服谁，可谁都没有抬高声音。林晚晴说了一句话，李慕宸接一句；李慕宸说一句，林晚晴接一句。到后来，两个人都不再劝对方“想明白”，只是把各自的立场，一条一条，摆在桌面上。\n\n“你去了山区，报道怎么办？”\n\n“写。用最笨的办法，一支笔，一个本子。”林晚晴说，“没有 AI 辅助，没有数据平台，就是蹲在教室里，看孩子们怎么长大。也许一年只写得出十几篇，但每一篇，都是我亲眼看见的。”\n\n“一年后呢？”\n\n“一年后回来，接着跟你们做报道。”林晚晴笑了笑，“到时候，说不定你已经立了好几条新规矩，我得重新学。”\n\n“你学得会吗？”\n\n“学得会。”林晚晴说，“我学东西不快，但我认的理，一条都不会丢。”\n\n凌晨两点，陈默先去睡了。出租屋里只剩他们两个人。\n\n林晚晴收拾好最后一包行李，走到门口，回头看了一眼这间屋子。屋里灯光昏黄，桌上还摊着他们一起做教育报道时的稿纸。\n\n“慕宸。”她站在门口，“我想跟你认真说一句。”\n\n“你说。”\n\n“你做的那些事，我是认的。”林晚晴说，“医疗案、教育案，你查得对，也查得准。我跟你吵，不是觉得你错了，是怕你走到一半，忘了自己当初为什么出发。”\n\n“我没忘。”\n\n“我知道。”她说，“可我怕的是，'没忘'和'不丢'，是两回事。一个人的路走远了，回头看，出发点是会模糊的。”\n\n李慕宸看着她，忽然觉得，这个站在门口的人，比一年前成熟了许多，也清瘦了许多。她的行李箱上贴着一张旧贴纸，是刚来报道那年贴的，一只小猫。\n\n“你照顾好自己。”他说。\n\n“你也是。”林晚晴说，“山里没信号，我可能一个月才能上一次线。你要是找我，留言就行，我看到会回。”\n\n“好。”\n\n“还有一件事。”林晚晴说，“你妈那台机器的事，我一直记着。你说'每一句话，都要有人负责'，这句话，我也会带到山区去，写进我的第一篇稿子里。”\n\n“好。”\n\n“那就，再见了。”\n\n“再见。”\n\n没有拥抱，没有握手。林晚晴拉开门，拖着行李箱走进夜色里。出租屋门口的灯，把她的影子拉得很长，又一点点缩短，直到消失在楼梯转角。\n\n李慕宸站在门口，站了很久。\n\n他回到屋里，看见桌上那本采访本还压着林晚晴的工牌。工牌下面，压着一张纸条，上面写着那行字：“去山区，一年。回来接着吵。”\n\n他看了很久，把纸条折起来，夹进采访本里。\n\n第二天一早，李慕宸照常到办公室。陈默坐在电脑前，见他进来，递过来一份资料。\n\n“什么东西？”\n\n“匿名举报。”陈默说，“说城市 AI 化背后，有金融公司在操纵'算法定价'，涉及一家叫'恒益金控'的公司。举报人说，他们公司的风控系统'误杀'了一批客户，原因是系统被人为调了参数'误杀'是有规律的。”\n\n李慕宸接过资料，翻开第一页，看到一行被划了红线的字：\n\n“我们查过的每一个'系统故障'，背后都有一个人在决定'谁该被牺牲'。”\n\n他合上资料，看向窗外。深秋的太阳升起来了，城市的轮廓在晨光里一点点清晰。\n\n他掏出手机，给林晚晴发了条消息：“到地方了说一声。路上注意安全。”\n\n发完，他放下手机，翻开那份资料，开始看第一行。\n\n窗外，梧桐树的叶子落了一地，新的季节，开始了。"},{"n":20,"t":"算法定价的城市","y":"2032","v":2,"tags":["算法定价","城市"],"p":"2032 年的春天，城市里的一切都在悄悄“算法化”。\n\n打车，软件根据“时段+路况+需求热度”动态定价，同一段路，早高峰和深夜是两个价；看病挂号","body":"2032 年的春天，城市里的一切都在悄悄“算法化”。\n\n打车，软件根据“时段+路况+需求热度”动态定价，同一段路，早高峰和深夜是两个价；看病挂号，智能导诊系统按“病情紧急度”排序，普通感冒和胸闷胸痛被分到不同的队列；连坐公交、进图书馆、办政务，都要先过一道“智能核验”。\n\n李慕宸是坐出租车时意识到这一点的。那天他赶去采访，司机绕了条远路，他随口问了一句：“师傅，绕这么一圈，计价器多收多少？”\n\n“不多。”司机师傅看着计价器，“这个点，算法本来就贵。”\n\n“贵多少？”\n\n“不知道。”师傅说，“反正系统说多少就是多少。以前还能看看里程表自己算，现在算法算出来的价，我开了二十年车，也算不出它咋来的。”\n\n李慕宸愣了一下，掏出手机，把这句话记了下来：“算法算出来的价，开了二十年车也算不出咋来的。”\n\n第二天，老周给他转来一条投诉。\n\n投诉人姓吴，是老周的同乡，五十三岁，在城里开网约车。投诉内容很具体：“我从今年一月份开始，每天的接单收入都比以前少一截。同样的路线、同样的时段，平台显示的'预估车费'和实际结算价，总是差那么几块钱。我打了三个月客服，客服说'系统定价，无法人工干预'。我怀疑平台在偷偷多扣。”\n\n李慕宸把投诉转给陈默：“查一下。要公开数据能查的那种查法。”\n\n“查什么？”\n\n“查他的每一笔订单。”李慕宸说，“路线、时段、平台定价、实际扣款，全部拉出来，跟平台公开的计价规则逐条对。”\n\n陈默花了两天，拉出了吴师傅近三个月的全部订单数据。他拍着键盘：“找到了。他的订单里，有百分之四十的单，实际扣款比平台公布的'预估车费'高，高出的金额在 1.2 元到 3.5 元之间。而且有个规律。”\n\n“什么规律？”\n\n“高峰期加价，平台公布的是'动态定价系数 1.2 到 1.5 倍'。可他的订单里，有 12 单，系数被单独调成了 1.7 倍，平台没有公布过这个档位。”陈默把截图放大，“而且这 12 单，全部集中在同一个时段：晚上九点到十点。”\n\n“为什么是晚上九点到十点？”\n\n“这个时段，平台的新司机补贴刚结束，老司机出车率下降，车少。算法在这个窗口悄悄加价，乘客多付，司机分成比例却不变，多出来的钱，平台独吞了。”\n\n“你怎么证明这是'平台独吞'？”\n\n“看结算。”陈默说，“同一时段，乘客实付 17.6 元，司机实收 12.3 元，平台抽成比例是 30%。可平台公布的标准抽成是 25%。那 5% 的差额，就是'隐秘时段加价'里，平台自己多拿的那部分。”\n\n李慕宸盯着屏幕上的数字，沉默了一会儿：“这套'动态定价'，公开规则是'时段+路况+需求'，实际上还有个没公开的'车少就加价'档位。乘客不知道，司机也不知道，钱就悄悄地没了。”\n\n“对。”陈默说，“算法不是不能解释，是没人让它解释。”\n\n第三天，李慕宸把拆解过程整理成一篇报道：《算法定价的城市：一笔说不清去向的 5%》。报道里没有用任何内部数据，全部用吴师傅公开的订单记录，和平台自己公布的计价规则，逐条比对。结论部分，他写了一段方法论：“我们只做一件事：替你把'真'找回来。怎么找？把算法说过的规则，和算法做过的事，逐条对一遍。对得上，就是真的；对不上，就该有人出来解释。”\n报道发出后的反应，比李慕宸预想的快。\n\n当天下午，平台客服主管打电话来，语气客气中带着点生硬：“李总，你们的报道我们看了。关于'隐秘时段加价'，我们正在核实。想确认一下，你们的数据来源。”\n\n“全部是吴师傅的公开订单记录，和你们自己公布的计价规则。”李慕宸说，“数据都是真的，比对方法也是公开的，你们可以自己复现。”\n\n“这个。”\n\n“我建议你们认真核实。”李慕宸说，“因为明天早上，我会把全部比对数据和计算过程，以可复现的格式公开。任何一个会算数的人，都能算出来那 5% 去了哪。”\n\n对方沉默了几秒：“李总，我们需要一点时间。”\n\n“给你们时间。”李慕宸说，“但时间不该用来删数据，该用来改规则。”\n\n第二天，平台发布公告：承认存在“未公示的时段加价档位”，即日起取消，并对近三个月受影响订单统一退费。公告最后一行写着：“我们对定价算法的公示与监督机制，将进行整改。”\n\n吴师傅收到退费通知那天，给李慕宸打了个电话，声音有点激动：“李总，我算了算，退了九百多块。三个月，九百多块。我要是不投诉，这钱就没了。”\n\n“以后不会没了。”李慕宸说，“规则改了，公示了，就有人盯着了。”\n\n“可我不懂算法啊。”吴师傅说，“你们要是不查，我这九百多块，找谁说理去？”\n\n“这就是我们为什么要做这件事。”李慕宸说，“算法不该是'没人看得懂的黑箱'。它定价、它排序、它决定你的车费和挂号顺序，它管着你的生活，就该让你看得懂。看不懂，就该有人替你看。”\n\n吴师傅在电话那头沉默了很久，最后说了一句：“李总，你们这行，值得。”\n\n报道出圈后一周，监管层面有了动静。市交通局约谈平台，要求对定价算法的关键参数进行备案公示；几家行业协会联合发声，呼吁建立“算法可解释”的行业标准。\n\n李慕宸坐在办公室里，翻着这些新闻，对陈默说：“老陈，我想做一个长期系列。”\n\n“什么系列？”\n\n“算法审计。”李慕宸说，“交通、政务、保险、金融，凡是算法开始替人做决定的领域，我们都去做'公开数据核查'。不站队，不预设立场，就是把算法说过的规则和做过的事，逐条对一遍。对得上，记录；对不上，公开。”\n\n“这个系列做起来，得罪的人可不止平台。”\n\n“得罪人，总比让算法悄悄拿走普通人的钱要好。”李慕宸说，“我们做报道这些年，攒下的本事，就是'把黑箱拆开给人看'。现在该把这门本事，做成一个固定的活儿了。”\n\n“名字呢？”\n\n“就叫《算法审计》。”李慕宸说，“第一期，吴师傅这个案子。”\n\n《算法审计》第一期发出那天，李慕宸在文章末尾加了一行小字：“如果你也觉得，有哪台机器替你做决定时'说不清为什么'，欢迎把你的经历寄给我们。我们会一条一条，替你把'真'找回来。”\n\n消息发出后的三天里，邮箱里涌进来四百多封邮件。\n\n有投诉保险定价的，有投诉政务审核的，有投诉外卖配送费计算的，还有一封，标题只有一行字，没有署名：\n\n“看看'金流'的风控系统。它会'杀'人的。”\n\n李慕宸点开那封邮件，正文只有三行字：\n\n“我在金流工作过。它的风控模型会批量'误杀'客户，而且杀得很有规律。规律在哪，你们自己找。找得到，你们就赢了。”\n\n落款没有名字，只画了一个简单的记号：一把锁。\n\n李慕宸看着那封邮件，又看了看窗外。春夜的灯火在城市里亮成一片。\n\n他把邮件转给陈默：“查这个。'金流'，金融公司。风控系统，'会杀人的规律'。”\n\n“从哪查起？”\n\n“从吴师傅教会我们的事查起。”李慕宸说，“公开规则，和实际行为，逐条对。对不上的地方，就是答案所在。”\n\n窗外，城市的夜风灌进来。他知道，这一次，他要碰的东西，比“动态定价”大得多。"},{"n":21,"t":"金融的暗箱","y":"2035","v":2,"tags":["AI金融","暗箱"],"p":"那条“金流会杀人”的线索，李慕宸没有急着查。\n\n他先做了一件事：评估线索的可信度。匿名邮件空荡荡的，只有三行字，没有附件，也没有截图。按人核验的","body":"那条“金流会杀人”的线索，李慕宸没有急着查。\n\n他先做了一件事：评估线索的可信度。匿名邮件空荡荡的，只有三行字，没有附件，也没有截图。按人核验的老规矩，没有证据的线索，只能当“待查”，不能当“事实”。\n\n他让陈默先查“金流”。金流科技，成立六年，主打“智能风控系统”，客户覆盖三十多家银行和消费金融公司。官网宣传语写着：“AI 风控，让每一笔信贷都有据可依。”\n\n“有据可依。”李慕宸念了一遍这四个字，“这四个字，查起来应该很有据。”\n\n陈默查了三天，回来汇报：“公开资料里查不到异常。金流的风控系统，对外披露的模型逻辑很干净：反欺诈、反逾期、信用评分。宣传材料、行业奖项、客户名单，看着都正常。”\n\n“那匿名线索为什么说它'会杀人'？”\n\n“线索说的是'误杀'。”陈默说，“风控系统'误杀'客户，就是把不该拒贷的人拒了，把不该降额的人降了额。这种事，银行一般不会公开，客户也未必知道是系统干的。”\n\n“怎么查'误杀'？”\n\n“得找到'被杀的人'。”陈默说，“而且要足够多，多到能看出规律。”\n\n他们花了两个星期，从公开渠道和求助邮件里，找到了四十一个“疑似被金流风控误伤”的当事人。四十一份材料，李慕宸和陈默一份一份核：年龄、职业、征信、被拒原因、被拒时间，全部拉成表格。\n\n第八天，规律出现了。\n\n陈默把表格投影到墙上，用红笔圈出三列：“看这里。四十一人里，有三十一人，被拒时间集中在同一个窗口：2029 年 7 月到 2029 年 12 月。另外，这三十一人里，有二十六个，征信报告干净得不能再干净，没有逾期，没有高负债，收入稳定。”\n\n“被拒时间集中，征信又干净。”\n\n“对。”陈默说，“他们要是真'高风险'，不可能集中在一个时间段被误伤。那半年里，金流系统的'误杀'不是随机的，是有规律的。”\n\n“什么规律？”\n\n“看职业。”陈默翻到最后一页，“二十六人里，有十九个，职业栏填的是'个体经营''自由职业''灵活就业'。还有七个，工作单位在'外包''派遣'这两类名单上。”\n\n李慕宸盯着那几行字：“你是说，系统在'误杀'特定职业的人群？”\n\n“不是职业。”陈默说，“是系统在给某些人群'贴标签'。个体户、自由职业、外包派遣，这些人群，被系统默认为'收入不稳定、还款风险高'。哪怕他们的征信记录干干净净，标签一贴，照样被'杀'。”\n\n“这是歧视，不是风控。”\n\n“更准确说，是'数据偏见'。”陈默说，“如果模型训练数据里，历史上这类人群的逾期率确实偏高，模型就会学会'看见这类人就降低评分'。可问题是，训练数据里的'偏高'，本身就可能是早年人工审批的偏见造成的。偏见喂给机器，机器学得比人还彻底。”\n\n李慕宸靠在椅背上，看着墙上的表格：“所以这不是'机器犯错'，是'人的偏见，被机器放大成制度'。”\n\n“对。而且还有一层。”陈默敲了敲键盘，“我对比了金流对外宣传的'模型版本更新日志'。公开日志里写着：2029 年 6 月，模型 v3.2 上线，'优化风险识别精度'。可那个窗口，恰好就是误杀集中开始的月份。”\n\n“你是说，v3.2 上线，就是误杀开始？”\n\n“时间上严丝合缝。”陈默说，“要么是 v3.2 真的'优化'出了偏见，要么。”他顿了顿，“v3.2 里，有人动了参数。”\n\n“能证明吗？”\n\n“不能直接证明。”陈默说，“金流的模型是黑箱，外部看不到内部参数。但我可以做一个间接证明：把 v3.2 上线前后，同类人群的'被拒率'拉出来比。如果 v3.2 上线后，某类人群的被拒率出现'断崖式上升'，而同期整体不良率没有对应上升，那就能说明：v3.2 不是'优化了风险识别'，是'人为放大了对某类人群的拒绝'。”\n\n李慕宸看着他：“查。这个间接证据链，要做得越扎实越好。”\n\n又查了四天。陈默把结果发过来的时候，声音都是绷着的：“出来了。v3.2 上线后，个体经营、自由职业、外包派遣三类人群的被拒率，从平均 6% 跳到 41%，用了不到一个月。同期，金流系统的整体不良率，从 2.1% 微降到 1.9%。”\n\n“不良率几乎没变，被拒率翻了七倍。”\n\n“对。”陈默说，“这说明 v3.2 拒绝掉的那三成多人群，绝大多数根本不是'高风险'，他们只是被'标记'了。真实的原因只有一个：有人把这三类人群，写进了模型的'风险加权'里。”\n\n“写进'风险加权'里。”李慕宸重复了一遍，“这不是算法自学出来的偏见，这是有人手动把它们'加进去'的。”\n\n“是。”陈默说，“而且加进去的这个人，一定知道自己在做什么。他知道这三类人群'好欺负'，征信干净、不擅长申诉、没渠道闹大。被拒了，他们大概率自认倒霉。”\n\n办公室里安静了一会儿。\n\n李慕宸把那些表格打印出来，一页一页翻过去，最后说：“老陈，这份证据链，够不够发？”\n\n“够。”陈默说，“数据全部可复现，来源全部公开。就算金流告我们，我们也站得住。”\n\n“那就写。”\n\n李慕宸打开文档，标题敲下五个字：《金融的暗箱》。\n\n写完结论那一段，他停了一会儿，又敲下一行字：“每一句话，都要有人负责，包括反对我们的人。这份报告里的每一句话，我们都愿意负责，金流科技，你们愿意为 v3.2 里那笔'加权'负责吗？”\n报告发布前，银行的电话先到了。\n\n打电话的是金流最大客户银行的法务，语气客气，也很硬：“李总，风控模型属于商业机密，报道涉及内部参数，可能触及法律问题。”\n\n“我们没有内部参数。”李慕宸说，“我们只有公开数据：金流自己的版本日志、宣传口径，和被拒客户的征信记录。这些东西你们官网都有，我们只是放在一起算了算数。如果算数也算'商业机密'，那你们的'机密'比我想象的薄。”\n\n“李总，金融行业，水很深。”\n\n“水很深，所以才要有人往深水里看一看。”李慕宸说，“你们要是有不同意见，欢迎逐条反驳。人核验的规矩：每一句话，都要有人负责，包括反对我们的人。”\n\n法务沉默了一会儿，挂了电话。\n\n报告发出那天是周三上午十点。《金融的暗箱》全文两万三千字，附了三份附件：四十一份当事人脱敏资料、全部数据表格、完整的计算方法说明。发出后两个小时，转发量过了五万。\n\n当晚，金流科技发了一篇声明，措辞强硬：“我司风控模型基于大数据训练，符合行业规范。对相关报道内容，我司保留追究法律责任的权利。”\n\n声明发出来一个小时，评论区最高赞的评论是：“敢不敢回应那 41% 和 6% 的差距？”\n\n第二天，银保监部门发布消息：已关注相关报道，将就“金融科技公司风控模型合规性”启动专项调查，要求金流科技限期提交模型审计材料。\n\n当天下午，金流科技的官网，悄然撤下了“AI 风控，让每一笔信贷都有据可依”的宣传语。\n\n又过两天，金流科技发第二份声明，语气软了：“经自查，我司部分模型的训练数据与参数配置存在优化空间，将暂停 v3.2 版本的使用，配合监管部门全面整改。”\n\n陈默看到这条声明，说了一句：“'优化空间'。他们管'人为加权'叫'优化空间'。”\n\n“话术而已。”李慕宸说，“重要的是，那三类人群，终于有人管了。”\n\n报告发布一周后，涉事的两名金流风控部门高管，被传出接受调查。消息没有官方确认，但行业里已经传遍了。\n\n那天晚上，李慕宸在办公室里加班，邮箱里进来一封邮件，没有标题，正文只有四个字：\n\n“做得不错。”\n\n落款是一串编号，看不出任何身份信息。李慕宸查了一下发件域名，是个海外匿名邮箱，什么也查不到。\n\n他盯着那四个字看了一会儿。四个字里没有恶意，甚至有点赞许的意思：但正因为如此，才更让他不安。\n\n谁在看这份报告？谁在赞许这份报告？\n\n他刚想回邮件问一句“你是谁”，第二封邮件紧跟着到了：\n\n“全球 AI 安全条约预备会议，下月举行。想请你以观察员身份参加。如果有兴趣，回复这封邮件。”\n\n落款还是那串编号。\n\n李慕宸看着那两封邮件，又把金流案的资料翻出来。报告里他写到过一句话：“v3.2 里的那笔加权，不会是一个人做的。”当时他把它当成一句判断。现在他看着那串编号，忽然觉得，那句话可能比他以为的更接近真相。\n\n他拨通了白亦鸿的电话：“白老师，全球 AI 安全条约预备会议，你知道吗？”\n\n“知道。”白亦鸿说，“筹备了半年了。怎么，你收到邀请了？”\n\n“收到一封匿名邮件，邀请我以观察员身份参加。”\n\n电话那头沉默了几秒：“慕宸，这个会议，规格不低。能发邀请的人，不是一般人。你收到的邮件，落款是什么？”\n\n“一串编号，查不到来源。”\n\n“那先别急着回。”白亦鸿说，“明天你来我这儿一趟，我帮你问问。顺便。”他顿了顿，“有件事，我想跟你当面聊。关于'背后那双手'的。”\n\n李慕宸挂了电话，把那两封邮件都存进加密文件夹。\n\n窗外，春夜的灯火在城市里亮成一片。他想起金流案里那句没深究的话，想起 v3.2 那笔“加权”背后看不见的手，想起那串查不到来源的编号。\n\n他知道，金融的暗箱拆开了一个，更大的暗箱，刚刚露出一个角。"},{"n":22,"t":"条约前夜","y":"2035","v":2,"tags":["国际治理","条约"],"p":"全球 AI 安全条约预备会议，会场设在一座临海的会展中心。\n\n李慕宸到得早。签到台前，礼仪小姐递过名牌，他低头看了一眼自己的名牌：“观察员·李慕","body":"全球 AI 安全条约预备会议，会场设在一座临海的会展中心。\n\n李慕宸到得早。签到台前，礼仪小姐递过名牌，他低头看了一眼自己的名牌：“观察员·李慕宸·人核验”。旁边一格，是厚厚的会议手册，印着参会名单。\n\n他翻开名单，目光停在其中一页。\n\n“产业观察团”名录下，第四行，印着三个字：沈临风。\n\n李慕宸的手指在那个名字上停了两秒，又翻过去。\n\n他当然记得沈临风。流量帝国时代，那个站在资本那边、跟他对过话的人。“开个价，这事就当没发生过”；后来在规则之战里，两个人隔着人群对过一眼，对方丢下一句“李总，你赢了一场，赢不了整个时代”。\n\n他当时回的那句话，后来成了人核验挂在墙上的话：“时代不是用来赢的，是用来过的。”\n\n如今这个“赢不了的时代”，把两个人都叫到了同一张会议桌旁。只不过，一个坐在“产业观察团”里，一个坐在“观察员”席上。\n\n会议上午九点开始。\n\n预备会议的主题只有一个：讨论未来《全球 AI 安全条约》的框架草案。草案里列了十几个议题：数据安全、算法公平、跨境监管、事故问责，李慕宸的目标很明确：把“算法可解释”推进议程。\n\n他准备得很足。金流案的数据、动态定价的拆解、医疗 AI 的标注体系，全部做成了一份四十页的简报，标题就叫《为什么我们需要“算法可解释”》。\n\n上午的讨论，他坐在观察员席，没有急着发言。他先听：听各国代表谈数据主权，听学者谈 AI 对齐，听企业代表谈创新成本。听了一上午，他心里有了数。“算法可解释”这个议题，不在草案的优先列表里，排在第十六位，几乎垫底。\n\n下午的议程轮到他发言。李慕宸站起来，没有讲大道理，先放了一组数据：\n\n“各位，这是过去三年，我们核查过的三个真实案例。第一个，网约车平台的'动态定价'，公开规则之外藏了一个未公示的加价档位，五个月，几十万笔订单被悄悄多扣；第二个，医疗影像 AI，系统数据停在三年前，'人工复核'被考核指标架空成签字，一个患者因此延误到晚期；第三个，金融风控系统 v3.2，三类人群的被拒率从 6% 跳到 41%，同期不良率反而下降，那不是'优化'，是有人把偏见'加权'进了模型。”\n\n会场安静下来。\n\n“这三个案例，没有一个是'机器失控'，全部是'人通过机器'造成的。”李慕宸说，“它们有一个共同点：当系统做出影响一个人生活的决定时，那个人不知道系统为什么这样决定，也没有渠道让它解释。我们要求的'算法可解释'，不是要让每个算法都开源，而是：当算法决定一个人的贷款、医疗、工作、出行时，这个人有权知道'为什么'，有权申诉，有权让那个'为什么'被复核。”\n\n他合上简报：“我知道，'可解释'会有成本，会拖慢创新，会让一些'商业模式'变得不那么好看。但我想请各位记住一件事：我们坐在这里谈'AI 安全条约'，谈的不是怎么保护 AI，是怎么保护人。一个连'为什么'都不肯说的系统，谈不上安全。”\n\n发言结束，会场沉默了两秒，随即响起一片掌声。几个国家的代表低头交换意见，李慕宸注意到，会议主席在草案目录上，把“算法可解释”圈了出来。\n\n但真正的博弈，在分组讨论里。\n\n下午四点，产业观察团的代表们把“算法可解释”议题围住了。一个戴着金丝眼镜的中年人站起来，语气温和：“我们理解'可解释'的价值，但条款的措辞，我们希望再斟酌。'有权知道为什么'，这个'权'字，法律含义太重。建议改为'有权获得合理说明'。”\n\n“合理说明”四个字一出，李慕宸心里一沉。他知道这个词的妙处：“合理”是个弹性词，弹性到可以在诉讼里被解释成任何样子。\n\n又一位代表接话：“还有'申诉渠道'。我们建议把'应当设立'改为'鼓励设立'。鼓励，不是强制，更符合行业现状。”\n\n“算法审计”“独立第三方”“公开披露”，一个接一个的词，被“温和地”软化着。李慕宸听了一会儿，终于举手：“我能说两句吗？”\n\n“请。”\n\n“刚才几位代表提的修改建议，方向我听明白了。”李慕宸说，“把'有权'改成'合理说明'，把'应当'改成'鼓励'。这样改完之后，这个条款的意思就变成了：系统可以不给答案，只要'合理'；申诉渠道可以没有，只要'鼓励'。请问，这样一条条款，写进'安全条约'，意义是什么？”\n\n会场静了一瞬。\n\n“我不是反对弹性。”李慕宸放缓语气，“我是提醒各位：安全条约存在的意义，是给'底线'划一条线，不是给'底线'留一个口子。'可解释'的底线，就是当算法决定一个人命运的时候，它必须说得出口理由，那个人必须有地方去问。这条线划得死一点，行业才有确定性；留的口子越多，将来出事的，还是普通人。”\n\n他坐下。产业观察团那边，金丝眼镜没有再说话。\n\n最终表决前，草案目录上的“算法可解释”条款，被原样保留，并且从第十六位，提到了第八位。会议主席在总结时说：“本条暂以'应当'表述，最终措辞，提交正式会议审议。”\n\n散会时，天色已晚。\n\n李慕宸走出会议厅，在走廊尽头，与一个人迎面相遇。\n\n沈临风。西装笔挺，头发一丝不苟，身边跟着两个随员。两人在走廊里同时停了一步。\n\n“李总。”沈临风先开口，语气平淡，“好久不见。”\n\n“沈总。”\n\n“今天的发言，很精彩。”沈临风说，“不过我想提醒李总一句：条约这种东西，签的时候是纸，执行的时候是人。你指望一张纸，守住所有口子？”\n\n“我没指望一张纸。”李慕宸说，“我指望的是：口子一旦被撕开，得有人看见、有人记录、有人让它合上。你当年说'赢不了整个时代'，我回你'时代不是用来赢的，是用来过的'。这句话，现在我也没改。”\n\n沈临风看着他，看了两秒，没有接话，微微颔首，错身而过。\n\n两个人都没有停步。走廊里的灯，把两道影子拉得一样长，又各自远去。\n\n李慕宸走出会展中心，夜风迎面扑来。手机震动，新闻推送弹出来：\n\n《脑机接口临床试验获批，首批志愿者招募中》。\n\n他正要往下看，另一条推送同时滑进来：\n\n“林晚晴在山区发回了第一篇报道：《没有 AI 的教室里，孩子们这样长大》。”\n\n李慕宸站在夜风里，点开那篇报道。\n\n文章开头写着：“这里没有网络，没有 AI 助教，没有智能评分。可这里的孩子们，比很多'智能化'课堂里的孩子，更会写自己的名字。”\n\n他看了一会儿，给林晚晴发了一条消息：“报道看了。写得很好。山里冷，注意添衣。”\n\n发完，他收起手机，抬头看天。会展中心的灯光映在夜海上，潮水正一点一点涨起来。\n\n他想起沈临风那句话：“签的时候是纸，执行的时候是人。”\n\n脑机接口的临床试验，就要开始了。那会是一个，比“算法可解释”大得多的战场。\n第二天一早，陈默的视频电话打过来。\n\n“昨晚的新闻看了？”陈默的镜头对着电脑屏幕，“脑机接口临床试验获批，首批志愿者招募，三万个名额，报名通道昨天夜里就挤爆了。官网首页挂着巨幅标语：'让想法变成行动，只在一念之间。'”\n\n“'一念之间'。”李慕宸重复了一遍，“这句话，有点耳熟。”\n\n“金流科技当年也说过类似的话'让每一笔信贷都有据可依'。”陈默说，“科技公司画饼的时候，词都差不多。我现在满脑子都是你那句话：算法可解释。脑机接口要是也进了'不可解释'的黑箱，那可就不是退几块钱的事了。”\n\n“所以更不能让它黑箱。”李慕宸说，“条约预备会议把'算法可解释'提到了第八位，这只是个开始。脑机接口这种技术，步子会比我们想象的快，等到它进医院、进学校、进职场，我们再喊'可解释'，就晚了。”\n\n“那你打算怎么弄？”\n\n“先把这波临床试验盯住。”李慕宸说，“志愿者招募、知情同意书、数据采集规范，全部建档。白老师那边我已经打过招呼，他那个研究中心，正好有神经科学方向的团队。”\n\n“行。”陈默应了一声，又补了一句，“对了，你昨晚那篇报道，不是，你昨晚在会上的发言，圈里传开了。有个评论说：'媒体人坐到条约谈判桌上，这还是头一回。'”\n\n“不是头一回。”李慕宸说，“是以前没人把'记录'和'治理'接起来。白老师那句话说得对：报道负责让人看见，研究负责让看见变成办法。我们只是把这两件事，试着接到一起。”\n\n挂了电话，李慕宸站在窗前，看着楼下的街。\n\n深秋的清晨，城市刚刚醒来。街角的早餐铺冒着热气，送孩子上学的电动车一辆接一辆驶过。那些平凡的、具体的、日复一日的生活，才是“算法可解释”和“脑机接口安全”真正要保护的底线。\n\n他回到桌前，把脑机接口临床试验的资料夹翻开，在第一页写下三行字：\n\n“一期观察目标：知情同意是否真正'知情'。”\n“二期观察目标：数据流向是否有人负责。”\n“三期观察目标：'一念之间'，到底是谁的'一念'。”\n\n写完，他合上资料夹。窗外，第一缕晨光落进来，落在“人核验”三个字上。\n\n第二卷的故事，到这里，翻过了一页。\n\n而更大的时代，正沿着脑机接口的临床试验，一步一步，走进来。"},{"n":23,"t":"一念之间","y":"2036","v":3,"tags":["道德抉择","人性"],"p":"2036 年的春天，李慕宸三十一岁，身份栏里写的已经是“治理研究员”。\n\n四年的时间，像一页被翻得飞快的日历。人核验交棒给了新人，他搬进了白亦鸿","body":"2036 年的春天，李慕宸三十一岁，身份栏里写的已经是“治理研究员”。\n\n四年的时间，像一页被翻得飞快的日历。人核验交棒给了新人，他搬进了白亦鸿的研究中心，办公室从出租屋换成了教学楼六层靠窗的一间。桌上除了旧帆布包，多了一沓沓的观察档案。\n\n脑机接口的档案，是最厚的那一沓。四年前条约会议上那条新闻，《脑机接口临床试验获批，首批志愿者招募中》，他当时在资料夹第一页写了三行观察目标。四年过去，两行已经划掉，第三行还空着：\n\n“一期观察目标：知情同意是否真正'知情'。”，已归档。\n“二期观察目标：数据流向是否有人负责。”，已归档。\n“三期观察目标：'一念之间'，到底是谁的'一念'。”，待写。\n\n2036 年春，脑机接口完成二期临床，进入扩大试验。招募公告铺天盖地：三万个名额，报名通道开通当晚就被挤爆。宣传语还是那句：“让想法变成行动，只在一念之间。”\n\n李慕宸调阅了招募材料和知情同意书，一页一页看下去。看到第十四页的时候，他停住了。\n\n“风险披露”那一节，写得很克制：“可能出现的副作用包括：轻微头痛、疲劳、偶发注意力波动。上述副作用多数为暂时性，不影响日常生活。”\n\n他把这份同意书和二期临床的真实数据并排放在一起。二期数据里，出现“头痛”的比例是 41%，“疲劳”是 36%，还有一项没有出现在同意书上的条目。“情绪波动”，发生率 18%，其中 0.7% 的受试者出现了持续时间超过一周的情绪低落。\n\n“偶发注意力波动”，对应的是 41% 的头痛、36% 的疲劳，和 18% 的、同意书里根本没提的情绪波动。\n\n李慕宸把这份对比发给了白亦鸿，附了一句：“白老师，'知情同意'四个字，现在只剩'同意'两个字是真的了。”\n\n白亦鸿回了一个电话，声音很沉：“临床机构说，'风险披露过细会影响招募'。慕宸，你打算怎么办？”\n\n“先建档。”李慕宸说，“不急着曝光，先把每一份公开材料里的'披露'和'实际数据'逐条对起来。等对得差不多了，再说。”\n\n“那就建。”白亦鸿说，“我让中心的研究生帮你做数据核对。”\n\n建档工作进行到第三周，一封求助邮件转到了李慕宸手里。\n\n邮件来自一位姓蒋的女士，她的丈夫是脑机试验的二期受试者：“我老公去年参加了试验，前三个月都好好的，今年年初开始，他晚上经常睡不着，白天脾气变得特别大，有时候盯着屏幕发呆，叫他好几声才应。我查了试验手册，上面写的副作用只有'头痛、疲劳、注意力波动'，我怀疑他现在的状态跟试验有关，可机构说'没有证据表明与试验相关'。”\n\n李慕宸读完邮件，拨了蒋女士的电话，问了一句：“您先生参加试验前，签的知情同意书，您看过吗？”\n\n“签的时候我在场。”蒋女士说，“医生拿了一摞纸，翻到签字页让我们签。前面那些条款，说实话，我没细看。”\n\n“没细看。”\n\n“那么厚一摞，谁看得完啊。”蒋女士说，“医生又说，'这是标准流程，大家都这么签'。我想着国家批的项目，总不会害人。”\n\n李慕宸握着电话，沉默了一会儿。\n\n“李老师，我是不是多心了？”蒋女士的声音有点慌，“我是怕，怕他这样下去。”\n\n“您不是多心。”李慕宸说，“您先生的情况，我会记下来，和试验数据一起核。有结果了，第一时间告诉您。”\n\n挂了电话，李慕宸在观察档案里，新增了一个条目，编号 BC-042，标题写着：\n\n“知情同意'模糊地带'个案：受试者家属报告情绪与行为异常，机构以'无证据表明与试验相关'回应。”\n\n他在条目下补了一行批注：“'无证据表明相关'，是一句很有弹性的话。它既可能真的无关，也可能只是，没有证据，是因为没有人认真找过。”\n观察档案又建了半个月，李慕宸手里的个案从一例变成了九例。\n\n九位受试者的家属，症状描述高度相似：睡眠紊乱、情绪波动、注意力涣散，还有两例提到了“记忆断片”，前一秒想做的事，后一秒就忘了。九例个案里，只有一例被试验机构正式受理，其余八例，得到的回复都是那句标准话术：“无证据表明与试验相关。”\n\n陈默打电话来，声音里带着点火气：“我看了你的档案。机构那边是不是在拖？”\n\n“在拖。”李慕宸说，“试验还在招募期，如果这时候公开'疑似副作用'，招募就黄了。他们的算盘很清楚：先把人招满，数据收够，再谈'证据'。”\n\n“那你的档案，什么时候发？”\n\n“等一个东西。”李慕宸说，“等机构自己披露的二期数据。他们说'无证据表明相关'，那就看看他们的证据，如果他们手里的数据本身就能证明'相关'，只是没人去算，那'无证据'这三个字，就是另一种意思了。”\n\n“什么意思？”\n\n“'无证据'，可能只是'没找'，不是'不存在'。”\n\n又过了一周，白亦鸿那边转来一份材料：试验机构向监管部门提交的二期安全性报告。报告很长，李慕宸和陈默一页一页翻，翻到附录的副作用统计表时，陈默喊了一声：\n\n“找到了。”\n\n“什么？”\n\n“他们二期数据里，'情绪波动'发生率 18%，'睡眠障碍'12.4%，这两项数据，报告里写了。”陈默把屏幕转过来，“可他们对外公布的'公众版安全性摘要'里，只写了'头痛、疲劳、偶发注意力波动'，情绪波动、睡眠障碍，一个字都没提。”\n\n“内部报告有数据，公众摘要没有。”\n\n“对。”陈默说，“机构不是'没有证据'，他们是'有证据，没披露'。”\n\n李慕宸坐在那里，看着那两列数字，半天没说话。\n\n“这份材料，能证明'无证据表明相关'是托词吗？”陈默问。\n\n“能证明一半。”李慕宸说，“它至少能证明：机构手里有'情绪波动'的数据，却没有写进公众版摘要。至于这些数据跟受试者症状的'相关性'，那需要更多的个案和更细的统计，但第一步已经够了：'无证据'这个说法，站不住了。”\n\n第二天，李慕宸把九例个案、机构内部数据、公众摘要，三份材料并排放在一起，发布了脑机观察档案的第二期，标题叫：《知情同意的“省略号”》。\n\n档案里没有下结论，只做了一个“逐条比对”：机构内部报告写了什么，公众摘要写了什么，受试者家属报告了什么。三列数据，一字排开，谁都能看懂。\n\n档案发出的第二天，监管部门宣布：对脑机试验机构启动“安全性信息披露”专项核查。\n\n又过了三天，试验机构更新了公众版摘要，补上了“情绪波动”和“睡眠障碍”两项，并在官网挂出一则致歉声明：“对信息披露不够充分，深表歉意。”\n\n陈默看到声明，哼了一声：“'深表歉意'。他们道歉的，是'披露不够充分'，不是'隐瞒了数据'。”\n\n“够了。”李慕宸说，“第一步，让数据见光；第二步，让'见光'成为标准。这两步走完，'知情同意'才有机会重新变成'知情'。”\n\n那天下班，李慕宸站在办公室窗前，看着楼下的街道。四年过去，城市的变化肉眼可见：路上跑的无人物流车多了，医院的智能导诊台成了标配，连菜市场都挂了“智能称重”的牌子。脑机接口，是这一波浪潮里，最贴着人身体的技术。\n\n他在“三期观察目标”那一行后面，补上了第一句话：“'一念之间'，到底是受试者的一念，还是资本的一念，还是技术本身的一念，这份档案，会替我们记住答案。”\n\n写完，他收起笔记本。手机响了，是白亦鸿。\n\n“慕宸，下个月，有一场全社会层面的大辩论。”\n\n“什么辩论？”\n\n“全民基本收入，UBI。”白亦鸿说，“人工智能全面接管工作之后，'人还剩下什么'，这个话题终于被摆上台面了。组委会想请你作为'治理与就业'议题的辩手之一。你有兴趣吗？”\n\n李慕宸握着手机，想起老周病退前那句话：“替我听听，机器养活人的时代，人还剩下什么。”\n\n“有。”他说，“这场辩论，我等很久了。”\n\n窗外，春夜的灯火在城市里亮成一片。脑机接口的档案还摊在桌上，新的话题已经在前方等着他。"},{"n":24,"t":"岔路之后","y":"2036","v":3,"tags":["选择后果","成长"],"p":"林晚晴回来那天，是 2036 年 4 月 17 日。\n\n李慕宸记得这个日子。那天研究中心楼下那棵泡桐树开花了，紫色的花落了一地。他下楼买咖啡，看","body":"林晚晴回来那天，是 2036 年 4 月 17 日。\n\n李慕宸记得这个日子。那天研究中心楼下那棵泡桐树开花了，紫色的花落了一地。他下楼买咖啡，看见一个拖着行李箱的人站在树底下，仰头看花。\n\n那个人的头发剪短了，晒黑了，穿着一件旧冲锋衣，背包侧兜里插着一卷稿纸。五年不见，她瘦了一圈，可那双眼睛还是原来的样子，亮亮的，像随时能看穿人。\n\n“晚晴。”\n\n她转过头，笑了一下：“李研究员。”\n\n两个人在泡桐树下站了一会儿。李慕宸问：“什么时候到的？”\n\n“刚到。”林晚晴拍了拍行李箱，“回来交个差，顺便。”她顿了顿，“有篇稿子，想让你看看。”\n\n“什么稿子？”\n\n“山区五年，我写的第一篇长报道。”她说，“题目叫《没有 AI 的教室》。”\n\n那篇稿子，李慕宸读了一下午。\n\n五年的山区生活，被林晚晴写成了一个一个具体的人：小学唯一的语文老师，四十七岁，用粉笔在黑板上抄课文，抄了二十三年；一个叫阿果的孩子，家里没有书，她把课本读了三遍，能从头背到尾；还有那座没有网络的小学，孩子们在操场上排队，一个人唱歌，全校跟着和。\n\n稿子写得克制，没有煽情，没有控诉。可李慕宸读完最后一个字，坐在椅子里，很久没有动。\n\n“写得好。”他说，“好得让我有点惭愧。”\n\n“惭愧什么？”\n\n“惭愧我这五年，坐在办公室里，谈的是'风险分级''数据披露''治理框架'。”李慕宸说，“你蹲在教室里，一个一个地记住了那些孩子的名字。”\n\n“你做的那些事，也有用。”林晚晴说，“脑机知情同意那期档案，我在山区都看到了。挺好。”\n\n“可你知道吗，晚晴，”李慕宸看着她，“我这五年，越来越发现一件事。”\n\n“什么事？”\n\n“治理做得越久，我越理解你当年那句话'你越来越像治理者，不像记录者了'。”他说，“我现在每天处理的，是系统怎么跑、责任怎么分、边界怎么划。可系统里跑的那些人，我越来越难一个一个地看见他们。”\n\n“你现在看见了。”\n\n“看见了。”李慕宸说，“这篇稿子，让我重新看见了。”\n\n林晚晴没有接话。她把那杯凉了的茶端起来，喝了一口，放下：“慕宸，我这次回来，除了交稿子，还想跟你说一件事。”\n\n“你说。”\n\n“我要走了。”林晚晴说，“不是回山区，是去更远的地方，一个 NGO 在做'全球无 AI 地区教育记录'，我申请了那边的岗位，下个月出发。”\n\n李慕宸握着茶杯，没有动：“那你回来。”\n\n“回来，是为了跟你好好告个别。”她说，“五年前那次走，我们带着分歧走的，走得有点匆忙。这次我想把话说完。”\n\n“你说。”\n\n“我依然敬重你做的事。”林晚晴说，“脑机档案、算法审计、条约会议，你走的那条路，是了不起的路。我也依然相信，'人的日子'需要有人记录，'人的判断'不该被轻易让渡。这两条路，都没有错。”\n\n她停了一下，声音轻下来：“可是慕宸，我们不能再一起走了。”\n\n“为什么？”\n\n“因为我们已经不是'同路'了。”林晚晴说，“你在治理那条路上，越走越深，那里需要你，你也热爱那里；我在记录那条路上，越走越远，那里有我要找的东西。两条路都通向同一个远方，可它们不重合了。”\n\n李慕宸坐在那里，看着窗外那棵泡桐树。紫色的花被风吹落，又吹起。\n\n“你是说，我们从此。”\n\n“不是'从此'。”林晚晴说，“是'这段路，走到这里就好'。我们做过最好的搭档，吵过最真的架，也一起把'真'找回来过。这些，我不会忘。可人不能永远停在同一个路口，你该往你的方向走了，我也该往我的方向走了。”\n\n屋里安静了很久。\n\n李慕宸端起那杯凉茶，喝了一口，说：“晚晴，我有一句话，憋了五年。”\n\n“你说。”\n\n“当年你说'你越来越像治理者'，我回你'我不后悔'。”他说，“这句话，我现在还是这么说。可我想补一句：我不后悔走这条路，但我后悔。”他顿住，“我没能让你觉得，治理和记录，是可以一起走的。”\n\n“它们可以一起走。”林晚晴说，“你我都证明了。只是不需要两个人绑在一条路上走。你治理，我记录，我们在同一个时代里各走各的，这不也是一种并肩吗？”\n李慕宸没有回答“是不是并肩”这句话。\n\n他们又坐了一会儿，说了一些别的：阿果考上了县中学，山区的路修好了，无 AI 教室的记录做成了三百页的手稿。林晚晴说起这些的时候，眼睛是亮的，语气是平的，像在讲一件再平常不过的事。\n\n天色暗下来的时候，林晚晴站起来，背起那个旧背包：“行了，我得去赶高铁了。”\n\n“我送你。”\n\n“不用。”她笑了笑，“五年前我走，你在门口看了很久；这次我自己走，你别看了。”\n\n李慕宸站起来，跟着她走到门口。她拉开门，又回过头，从背包侧兜里抽出那卷稿纸，《没有 AI 的教室》，递给他：“这个留给你。上面有我的批注，你要是想我，翻一翻。”\n\n他接过来，纸卷带着她手掌的温度。\n\n“还有一件事。”林晚晴从背包最里层，掏出一个牛皮纸信封，“这个，是我在山里写的。不是稿子，是，算是给你的一封信吧。我没打算寄，本来想带到下一站再写的。今天见到你，还是决定给你。”\n\n李慕宸接过信封，没有当场拆。\n\n“那，走了。”林晚晴站在门口，最后看了一眼这间办公室，“李慕宸，你好好走你的路。我会在很远的地方，看着你。”\n\n“你也是。”他说，“路上注意安全。”\n\n她拉上门，脚步声沿着走廊远去，一下一下，越来越轻，最后消失了。\n\n李慕宸站在空荡荡的办公室里，手里攥着那卷稿纸和一个牛皮纸信封，站了很久。\n\n他拆开信封。信纸是山区那种发黄的草纸，折了三折，上面是林晚晴的字，很工整：\n\n“慕宸：\n\n如果你读到这封信，说明我们还是走到了这一天。我想了很久，要不要写这封信。后来我想，有些话，还是写下来比较好，因为话说完就忘了，字不会。\n\n五年了，我一直在想一个问题：我们当年吵的那场架，到底谁对谁错。现在我想明白了，没有谁对谁错。你治理，我记录，都是这个时代需要的事。只是这两件事，需要的'人'，不太一样。你需要的是'把系统修好的人'，我需要的是'把人的日子记下来的人'。\n\n我从来不是不支持你。我只是怕你累。治理是一条很长的路，你一个人走，会累的。我在山里的时候，有时候会想，要是你在就好了，我想让你看看，没有 AI 的教室里，孩子们是怎么一点点长大的。你看了，心里就有底了：你修的那些'系统'，底下护着的，就是这样一群孩子。\n\n慕宸，我不后悔遇见你。也不后悔跟你吵那场架。你是我见过的最认真的人，认真得让我心疼。\n\n我要走了，去更远的地方，做我想做的事。你也要好好的，做你想做的事。\n\n如果有一天，这个时代走到了'机器替人决定一切'的门口，我希望你记得：还有一群没有 AI 的教室里长大的孩子，在等着你替他们守住'人'的那道门。\n\n林晚晴\n2036 年 4 月”\n\n李慕宸把信读完，折好，放回信封，压在《没有 AI 的教室》那卷稿纸下面。\n\n他坐回桌前，窗外的泡桐花还在落。\n\n那天晚上，他没有加班，早早回了出租屋。出租屋还是五年前那间，桌上压着林晚晴留下的工牌和那张纸条：“去山区，一年。回来接着吵。”\n\n五年过去了。她回来了，他们没有接着吵，他们把该说的话，说完了。\n\n他把工牌拿起来，看了看，又放回去。他知道，这张工牌，他会一直留着。\n\n第二天，李慕宸照常去研究中心。路过楼下那棵泡桐树的时候，他停下来，站了一会儿。\n\n泡桐花落了满地，紫色的，厚厚一层，像铺了一条路。\n\n他在树底下站了很久，然后弯下腰，捡起一朵花，夹进那卷稿纸里。\n\n“晚晴，一路平安。”他轻声说，“我会记得，治理的底下，护着的是一群没有 AI 的教室里长大的孩子。”\n\n他直起身，往办公楼里走去。清晨的阳光落在他肩上，把他的影子拉得很长。\n\n那一年，他三十一岁。他失去了一段同行，得到了一封信，和一句要记很多年的话。\n\n而更大的时代，正沿着他看不见的方向，一步步走近。"},{"n":25,"t":"重新上岗","y":"2037","v":3,"tags":["职业教育","重新上岗"],"p":"父亲的电话是周六上午打来的。\n\n“慕宸，你爸我上岗了。”电话那头，父亲的声音带着点掩饰不住的得意，“新厂，新机器，我学的那套，正好用上。”\n\n李","body":"父亲的电话是周六上午打来的。\n\n“慕宸，你爸我上岗了。”电话那头，父亲的声音带着点掩饰不住的得意，“新厂，新机器，我学的那套，正好用上。”\n\n李慕宸正在整理脑机档案，闻言放下笔：“你培训完了？”\n\n“完了，考核还过了。”父亲说，“上个月厂里通知，说有一批老技工岗位，要'懂工艺、会维护新设备'的人。我报了名，笔试面试都过了，这周签了合同。”\n\n“什么时候上班？”\n\n“下周一。”父亲顿了顿，“你要是有空，回来看看？你妈说，让你爸上班那天，家里吃顿好的。”\n\n李慕宸订了周日的票，回了老家。\n\n家里果然热闹。母亲在厨房忙前忙后，锅里炖着排骨，蒸笼里冒着白气。父亲穿着一件新衬衫，在院子里来回走了两圈，又把衬衫领子整了整。\n\n“爸，你紧张？”\n\n“紧张啥。”父亲嘴硬，“你爸我上班上了三十年，还会紧张？”\n\n话是这么说，吃饭的时候，他拿着筷子，半天没夹菜，说：“慕宸，你说新厂那些机器，我要是操作错了，会不会把人家设备弄坏？”\n\n“不会。”李慕宸说，“你培训两年，考的就是这个。你手里那套'老工艺'，是厂里最缺的东西。”\n\n“缺？”\n\n“缺。”李慕宸说，“新设备再先进，也得有人懂它之前的'工艺'才能调得好。你二十年攒下的手艺，就是那台设备的'说明书'。”\n\n父亲听了，低头扒了两口饭，没说话。但李慕宸看见，他夹排骨的手，稳了很多。\n\n周一早上，李慕宸陪父亲去新厂报到。\n\n厂区比老厂大，车间里一排机械臂正在调试，蓝白色的光在地面流动。人事专员领着父亲办手续，走到车间门口，父亲站住了，往里看了一会儿。\n\n“李师傅，怎么了？”人事专员问。\n\n“没什么。”父亲说，“就是想起老厂了。”\n\n手续办完，车间主任带父亲去见班组长。班组长是个三十出头的年轻人，姓高，戴着安全帽，看见父亲，先伸出手：“李师傅，久仰。你这批老技工，是厂里专门挖来的。”\n\n“挖？”\n\n“对。”高组长说，“厂里上智能产线，最愁的就是'没人懂老工艺'。设备说明书能教会你按按钮，可教不会你'为什么这道工序得这么排'。你这种老师傅，比设备金贵。”\n\n父亲愣了一下：“我比设备金贵？”\n\n“金贵。”高组长笑了，“设备坏了能换，手艺断了，就真没了。”\n\n第一天上岗，父亲被安排在一号产线的设备维护岗。他的工作是：每天开机前巡检一遍机械臂，看参数、听声音、摸温度，把异常记在工单上。\n\n上午十点，一号产线报警了。\n\n机械臂的抓取精度突然下降，连续两次抓偏。年轻的维护员盯着屏幕上的参数，满头大汗：“参数没问题啊，怎么会偏？”\n\n父亲在旁边看了一会儿，走过去，弯下腰，摸了摸机械臂的底座，又听了听声音，说：“底座的固定螺栓松了。左前那颗。”\n\n维护员半信半疑地拿扳手过去，拧了两下，果然，左前那颗螺栓，松了半圈。\n\n“你怎么知道的？”维护员瞪大眼睛。\n\n“它抖的时候，声音跟以前不一样。”父亲说，“我在老厂听机器听了二十年，耳朵有记性。”\n\n螺栓拧紧，机械臂恢复精度。产线重新跑起来。\n\n中午休息的时候，高组长端着饭盒过来，坐在父亲旁边：“李师傅，上午那下，漂亮。设备说明书上没写'螺栓松了听声音'这招。”\n\n“说明书写不了这个。”父亲说，“说明书教的是'怎么操作'，教不了'怎么听'。”\n\n“这就是我们挖你来的原因。”高组长说，“李师傅，以后产线设备的'手感'，就交给你了。”\n\n下午下班，父亲给李慕宸发了张照片：他站在新产线前，旁边是一排蓝白色的机械臂，他穿着新工服，站得笔直，笑得眼睛都眯起来。\n\n照片下面，附了一行字：“儿子，你爸现在跟机器处得挺好。”\n\n李慕宸看着那张照片，看了很久。\n\n五年前，父亲攥着工牌坐在床边，说“可厂里不要我了”。三年前，他说“机器比我强的地方，我认”。今天，他站在一排机械臂中间，笑成了这样。\n\n他回了一条消息：“爸，机器比你强的，你认了；你比机器强的，机器也认了。”\n\n消息发出去，父亲很快回了一个字：“嗯。”\n\n那天晚上，李慕宸坐在老家的院子里，看着父亲在屋里看电视的背影。初夏的晚风把院墙上的丝瓜藤吹得沙沙响。\n\n母亲端着一盘切好的西瓜出来，坐在他旁边：“你爸现在，天天念叨他那新产线。晚上做梦都在说'左前螺栓'。”\n\n“他高兴就好。”\n\n“高兴。”母亲说，“他这人，这辈子没服过谁，现在天天跟机器比谁更懂机器。”她顿了一下，“慕宸，你也老大不小了，该考虑考虑自己的事了。”\n\n李慕宸没有说话，咬了一口西瓜。\n\n月光落在院子里。他想起林晚晴的信，想起那句“治理的底下护着的是一群没有 AI 的教室里长大的孩子”，又看了看屋里那个跟机器处得挺好的父亲。\n\n他忽然觉得，自己这两年做的事，好像真的有了着落。\n李慕宸在老家住了三天。\n\n那三天里，他看到了一个跟记忆里不太一样的父亲。每天早上六点，父亲准时起床，在院子里把那套工服叠得整整齐齐，装进包里，出门前还要对着镜子正一正领子。母亲笑他：“上三十年班，头一回见你这么讲究。”\n\n“那不一样。”父亲说，“以前是'不得不去'，现在是'人家请我去的'。”\n\n第三天晚上，父亲破天荒地问起李慕宸的工作：“你现在那个'治理研究员'，到底是干啥的？”\n\n“研究机器和人的规矩。”李慕宸说，“机器替人做事的时候，该守什么规矩；人该怎么管住机器。”\n\n父亲想了想：“那不就是'跟机器讲道理'吗？”\n\n“差不多。”\n\n“那你讲得赢吗？”\n\n李慕宸笑了：“有时候赢，有时候不赢。不过没关系，输了我再去讲。”\n\n父亲点点头，没再说什么。过了一会儿，他忽然说：“你小时候，我教你骑车，你在前面骑，我在后面扶。你摔了三次，第四次自己会骑了。我跟你讲道理讲不明白，就让你自己摔。”\n\n“我记得。”\n\n“现在反过来了。”父亲说，“你讲的那些机器的道理，我很多听不懂。可我知道，你是在干正事，比那些'替机器说好话'的，正。”\n\n李慕宸愣了一下：“爸，你咋知道有人'替机器说好话'？”\n\n“厂里就有人天天说。”父亲说，“说'以后人不用干活了，机器全包了，人躺着享福就行'。我不信那个。机器能干活，可机器不会替你'过日子'。你妈做的那碗面，机器做得出来，可它做不出'你妈做的'那三个字。”\n\n李慕宸坐在院子里，听着父亲说这些话，忽然想起白亦鸿当年说的那句“技术叙事的争夺是治理的第一战场”。\n\n他父亲没有读过什么治理理论，可他说的话，跟白亦鸿说的是同一件事：技术怎么落地，看的是人怎么用它。机器再能干，也绕不过这一条。\n\n临走那天早上，父亲送他到路口。\n\n“爸，你在厂里好好干。”李慕宸说，“机器不懂的，你教它。”\n\n“嗯。”父亲说，“你也好好干。机器不懂规矩的地方，你管它。”\n\n李慕宸上了高铁，靠窗坐下。窗外的田野一格一格往后退，初夏的麦子快熟了。\n\n他掏出手机，翻到父亲发的那张站在机械臂前的照片，看了一会儿，把它设成了屏保。\n\n然后他打开备忘录，在“三期观察目标”那一页，补了一行字：\n\n“机器替人干活的时代，人还剩什么？还剩'过日子'的本事，和'讲道理'的底气。这两样，机器学不会。”\n\n他收起手机，看向窗外。麦浪在风里一层一层地翻，像一条没有尽头的路。\n\n第二卷到第三卷的路，他一个人走了五年。如今他终于知道，那条路的尽头，站着什么样的风景。"},{"n":26,"t":"最后一课","y":"2038","v":3,"tags":["教育传承","告别"],"p":"老周的电话是深秋打来的。\n\n“慕宸，下周三，我上最后一堂课。”电话那头，老周的声音比从前哑了一些，“你来旁听。”\n\n“周老师，您不是还有两年才退","body":"老周的电话是深秋打来的。\n\n“慕宸，下周三，我上最后一堂课。”电话那头，老周的声音比从前哑了一些，“你来旁听。”\n\n“周老师，您不是还有两年才退休吗？”\n\n“等不了了。”老周说，“肺上的毛病，医生说再拖就得躺着上课了。我申请了提前退。最后一堂课，讲了一辈子的那点东西，想再讲一遍，给你听，也给现在的学生听。”\n\n“我去。”李慕宸说，“我一定去。”\n\n下周三，李慕宸回到母校。新闻学院的阶梯教室里，坐满了人。老周站在讲台上，还是那件洗得发白的蓝衬衫，头发白了大半，但腰板挺得直。\n\n“今天这堂课，不讲采访技巧，不讲写作规范。”老周说，“讲讲我这辈子，当记者那点'变和不变'。”\n\n他在黑板上写下两个字：“变”、“不变”。\n\n“先说'变'。”老周转过身，“我当记者那年，采访靠脚走，写稿靠笔写，发稿靠传真机。你们现在呢？AI 几秒钟能生成一篇稿子，比我们当年写得还快、还通顺。设备变了，工具变了，连'新闻'这两个字的模样都变了，现在谁还看报纸？都在看你们的手机。”\n\n台下有人笑了。\n\n“再说'不变'。”老周说，“我退休前最后一趟采访，是去一个县城，采访一位修钟表的老匠人。那老匠人修了五十年钟，修到最后，满城就剩他一个人还在修机械表。我问他，现在大家都不戴机械表了，你修给谁看？他说，不是修给谁看，是这手艺在，表坏了，就有人能修。他这话，我记了十年。”\n\n老周顿了顿：“新闻也一样。AI 会写，可'真相'坏了，得有人修。写的人可以换，'修真相'的人，不能没有。这就是不变的那部分。”\n\n他拿起粉笔，在“不变”两个字下面，画了一个圈：“我教了你们三年，就教一件事：怎么把'真'找回来。AI 可以帮你找，可最后拍板'这就是真'的，得是人。”\n\n台下安静下来。有个学生举手：“周老师，AI 时代，我们学新闻的，还有用吗？”\n\n老周笑了：“你这个问题，我二十年前问过我自己一次，十年前又有人问我一次，今天你问我第三次。我回答三次，答案都一样'有用'，而且越来越有用。因为机器越会说话，'人说的话'越值钱。机器说一千句，不如人说一句'我核实过'。”\n\n掌声响起来。\n\n下课铃响的时候，老周没有立刻宣布下课。他拿起讲台上那个旧得掉皮的采访本，翻到最后一页，看了一眼，合上，说：\n\n“最后一件事。我这个人，没什么值钱的东西留给你们。就这个采访本，用了三十年，里面记满了批注，哪句话是当事人说的，哪句话是我自己添的，哪句存疑待核，我都标了。做新闻的人，最要紧的就是分清这三样。”\n\n他走下讲台，把采访本递到李慕宸面前：“慕宸，你接过去。”\n\n李慕宸站起来，双手接过那个采访本。本子很旧，皮面磨得发亮，边角卷起来了。\n\n“周老师。”\n\n“不用谢。”老周说，“这三十年，我记的是'新闻'。你接过去以后，记的东西可能跟新闻不太一样了，你在跟机器讲道理，讲规矩。可本子上的方法论是一样的：分清'谁说的、你说的、待核的'。这三样分不清，写出来的东西，就是祸害。”\n\n“我记住了。”\n\n老周回到讲台上，看着满教室的学生，忽然弯腰，深深鞠了一躬：“谢谢大家，听我这个老头子，讲完最后一课。”\n\n台下所有人都站起来了，掌声响了很久。\n\n散场后，李慕宸陪着老周在走廊里慢慢走。\n\n“周老师，您退休以后，打算干什么？”李慕宸问。\n\n“养病，看看孙子。”老周说，“要是身体争气，还想干一件事，把我这三十年的采访笔记，整理成一本小册子，讲讲'机器时代，人怎么说话'。不过那是后话了。”\n\n走到楼梯口，老周停下来，看着窗外的秋色：“慕宸，有件事，我一直没跟你说。”\n\n“您说。”\n\n“我知道你下个月要去参加 UBI 辩论。”老周说，“有人托我转告你一句话，不是我的话，是当年一位老编辑的话。他说，'机器养活人的时代，最要紧的不是机器怎么分钱，是人还记不记得自己为什么活着。'”\n\n“这句话，我替你记下了。”\n\n“还有。”老周说，“UBI 那场辩论，我本来想自己去听。可我身体这样，去不了了。你替我去，替我听听。”他笑了笑，“机器养活人的时代，人还剩下什么。”\n\n李慕宸想起五年前，老周在课堂上说的那句“很多时候就是一个人跟一台机器较劲”。\n\n“周老师。”他说，“您那句'一个人跟一台机器较劲'，我记了快十年了。”\n\n“现在你该明白了吧。”老周说，“那台机器，不只是新闻机器，是这整个时代。人跟时代较劲，较的不是输赢，是'较劲'这件事本身，你还在较劲，就说明你还记得自己是人。”\n\n李慕宸站在楼梯口，看着老周慢慢走下台阶，一步一步，走得很稳。\n\n他低头看了看手里的采访本，翻开第一页，老周的字迹工工整整地写着：\n\n“1977 年 3 月 1 日，第一天上班。记着：分清'谁说的、你说的、待核的'。”\n李慕宸离开母校的时候，在校门口碰到了当年的系主任，一个头发花白的男人，姓钱。\n\n钱主任认得他：“李慕宸？毕业十年了，回来看看？”\n\n“来听周老师的最后一课。”李慕宸说。\n\n“老周啊。”钱主任叹了口气，“他这课，排了三个月。校领导本来想给他办个正式的荣休仪式，他不要，说'上课就是最好的仪式'。”\n\n“他这个人，一辈子把讲台看得比什么都重。”\n\n“是啊。”钱主任说，“他教了三十年新闻，走的时候，除了这个采访本，什么都没带走。”他看了看李慕宸手里的本子，“他把本子给你了？”\n\n“给了。”\n\n“那他这是把'根'也给你了。”钱主任说，“好好留着。新闻这行的根，不在技术，不在平台，在'人肯为一句真话负责'。这根，老周守了三十年，现在轮到你了。”\n\n李慕宸抱着采访本，站在秋风中，站了很久。\n\n回研究中心的路上，他把采访本放在办公桌正中间，翻开，一页一页地看。\n\n三十年的批注，密密匝匝。有采访笔记，有新闻剪报，有改了七遍的导语，还有大段大段的读后感。翻到中间一页，李慕宸停住了。\n\n那是一页泛黄的剪报，标题是《一台会写诗的机器》。老周在剪报旁边，用红笔写了一段话：\n\n“1984 年，第一次听说'机器能写诗'。当时觉得是天方夜谭。今天重读，忽然明白：机器会写诗不可怕，可怕的是人不再读诗。机器替代的是'写'，替代不了'读'，只要还有人读，'写'就永远是人心里的事。”\n\n剪报下面，还有一行小字，字迹比上面淡，像是后来补的：\n\n“补记于 2005 年：今天教学生用电脑写稿，学生问我，老师你怕不怕电脑抢你饭碗。我说不怕。电脑写得快，可电脑不会在深夜为一个采访对象失眠。会失眠的记者，才是真记者。”\n\n李慕宸把这一页反复看了两遍，轻轻合上本子。\n\n当天晚上，他给陈默打了个电话：“陈默，UBI 辩论的辩题材料，你手头有吗？”\n\n“有。”陈默说，“全社会的提案都出来了，我整理了一部分。你要哪块？”\n\n“'机器养活人的时代，人还剩下什么'。”李慕宸说，“我想从'人为什么活着'的角度，重新切一遍这个辩题。”\n\n“你这不是去辩论，是去布道啊。”陈默笑了一声，“行，材料明天发你。”\n\n“还有一件事。”李慕宸说，“采访本的事，替我记一下，老周把方法论传给我了：'分清谁说的、你说的、待核的'。这套方法，我想用到神经科技治理上。”\n\n“怎么用？”\n\n“脑机档案里，'机构说的、我们核实的、待查证的'，正好就是这三栏。”李慕宸说，“老周的本子，换了个战场，还能用。”\n\n陈默沉默了一下：“老周这课，上得值。”\n\n“值。”\n\n挂了电话，李慕宸坐在办公室里，看着窗外深秋的夜空。\n\n他想起老周说的那句“机器养活人的时代，最要紧的是人还记不记得自己为什么活着”，又想起林晚晴信里那句“治理的底下护着的是一群没有 AI 的教室里长大的孩子”，还有父亲那句“机器做得出来，可它做不出'你妈做的'那三个字”。\n\n这三句话，说的好像是三件事，可他忽然觉得，它们说的是同一件事：\n\n技术越发达，人越要记得自己是谁。\n\n他打开备忘录，在“三期观察目标”那一页下面，新起了一行：\n\n“UBI 辩论辩题手记：机器养活人的时代，人还剩下什么？先回答这个问题，再谈分钱。”\n\n他把备忘录合上，又拿起那个采访本，放在台灯下。三十年的批注在灯光里泛着旧旧的黄。\n\n窗外，秋风把梧桐叶吹得哗哗响。李慕宸知道，下一场辩论，将是这个时代最吵的一场。\n\n他要带着老周的本子、林晚晴的信、父亲的道理，还有自己十年的积累，走进那个辩场。"},{"n":27,"t":"分道","y":"2038","v":3,"tags":["人生分歧","选择"],"p":"陈默是在 UB I 辩论筹备会散场那天晚上，来找李慕宸的。\n\n那晚十一点，李慕宸刚从会议室出来，就看见陈默蹲在研究中心门口，脚边放着两罐啤酒。","body":"陈默是在 UB I 辩论筹备会散场那天晚上，来找李慕宸的。\n\n那晚十一点，李慕宸刚从会议室出来，就看见陈默蹲在研究中心门口，脚边放着两罐啤酒。\n\n“怎么不进去？”李慕宸问。\n\n“进去就得坐下，坐下就得说话。”陈默把一罐啤酒递过来，“我怕话说完了，就走不了了。”\n\n两个人坐在台阶上，一人一罐啤酒。春夜的凉风从街口灌进来，远处是无人物流车驶过的低响。\n\n“慕宸，我大概，要走了。”陈默说。\n\n“走哪儿去？”\n\n“一家神经科技公司。”陈默说，“名字不说了，你猜得出来。他们给我开了个条件：年薪是现在的三倍，独立实验室，脑机项目技术自由，想研究什么，研究什么。”\n\n李慕宸握着啤酒罐，没有动：“条件确实好。”\n\n“好到我不敢当场答应，也不敢当场拒绝。”陈默仰头灌了一口，“我他妈想了半个月，今天才敢来跟你说。”\n\n“为什么想走？”\n\n“慕宸，咱们认识十二年了。”陈默说，“人核验从三个人做到今天，我陈默没拖过后腿。可我想了半个月，终于想明白一件事：我这个人，喜欢的是'技术本身'。我研究算法，是因为算法有意思，不是因为要拿它'核实什么'。可咱们这些年做的，全是'核实'，核实内容、核实数据、核实系统。我的本事，有七成，没派上用场。”\n\n“你觉得自己在浪费？”\n\n“不是浪费。”陈默说，“是'不够过瘾'。就跟一个赛车手，天天开着赛车，在限速四十的路上慢慢开，他开得好，可他不过瘾。”\n\n李慕宸把啤酒罐放在台阶上：“过瘾了，然后呢？”\n\n“然后？”陈默愣了一下，“然后我就做我想做的研究去了呗。”\n\n“那边公司，有没有跟你说，要你研究什么？”\n\n“说了。”陈默说，“脑机接口的'意识数据'处理，就是把人的神经信号转成数据，做'可读化'处理。他们说，这是神经科技的下一个风口。”\n\n“'意识数据'。”李慕宸重复了一遍，“陈默，这个方向，我劝你想想清楚。”\n\n“我知道你在担心什么。”陈默说，“你担心'意识数据'被滥用，人脑子里想什么，变成数据被人看。可技术本身是中性的，我做研究，又不负责他们拿去干什么。”\n\n“技术是中性的，人不是。”李慕宸说，“你研究出来的'意识数据可读化'，落在负责任的人手里，是医疗、是康复；落在不负责任的人手里，就是'读心术'。你不负责他们拿去干什么，可你负责'把它研究出来'这件事本身。”\n\n“你这话，跟那些反对脑机研究的说的一模一样。”\n\n“反对研究的是他们，我不反对研究。”李慕宸说，“我反对的，是'研究出来，没人负责'。”\n\n陈默没有说话，又开了一罐啤酒。\n\n沉默了很久，他说：“慕宸，咱们吵了这么多年，我从来没赢过你。这次，你就让我赢一回吧。”\n\n“这不是输赢的事。”\n\n“在我这儿，就是。”陈默说，“我今年三十二了，再不去做我想做的事，我这辈子就守着一个'核实'俩字过完了。你当你的治理研究员，我当我的技术人，咱们各走各的，行不行？”\n\n李慕宸看着他。台阶下的路灯把两个人的影子拉得很长。\n\n“行。”李慕宸说，“但我有一个要求。”\n\n“你说。”\n\n“你那边的脑机项目，'意识数据'处理，有一个算一个，涉及'读人脑子'的，开工前，先发一份技术说明给我。”李慕宸说，“不是拦你，是留个底。万一将来出什么事，你好有个记录，我好有个依据。”\n\n陈默盯着他看了很久，忽然笑了：“你他妈，到这时候还在建档案。”\n\n“职业病。”\n\n“行。”陈默仰头把最后一口啤酒喝完，“就按你说的。我那边有什么风吹草动，第一个告诉你。有不对劲的。”他顿了顿，“我第一个回来找你。”\n\n李慕宸站起来，拍了拍裤腿上的灰：“什么时候走？”\n\n“下周一。”\n\n“那我今天就不送你了。”李慕宸说，“省得你走的时候，我们俩都难看。”\n\n“你今天不送，我走得利索点。”\n\n两个人站在研究中心门口，谁都没有再说“再见”。陈默把空罐子扔进垃圾桶，转身走了。路灯把他的影子拉长，又拉短，最后消失在街角。\n\n李慕宸站在原地，看着那个方向，站了很久。\n\n他回到办公室，在脑机档案的封面上，用笔写下一行字：“陈默，人核验，2037 年春，暂别。”\n\n想了想，又在后面加了一句：“他的技术说明书，我会一直等。”\n陈默走的那天，是个周一，下着小雨。\n\n李慕宸没有去送。他在办公室，把陈默负责的算法模块一个一个交接给团队里的小周。小周是陈默带出来的，技术路子一样，只是少了点陈默那股“不管不顾”的劲儿。\n\n“李哥，默哥真走了？”小周问。\n\n“走了。”\n\n“那他那些。”小周指了指屏幕上的代码，“这些代码，都是他写的。他走了，我接着写，算不算替他干活？”\n\n“算。”李慕宸说，“代码是他写的，活儿是大家一起干的。你接着写，他那些想法就还活着。”\n\n小周点点头，坐回工位，手指在键盘上敲了一会儿，又停下来：“李哥，默哥走的时候，有没有，留什么话？”\n\n李慕宸想了想：“他说，有不对劲的，第一个回来找你。”\n\n“那我等着。”\n\n午休的时候，李慕宸接到一个电话，是陈默打来的。\n\n“慕宸，我到新公司了。”电话那头，陈默的声音带着点新环境的陌生感，“这边环境确实好。独立实验室，设备都是新的。”\n\n“好好干。”\n\n“嗯。”陈默顿了顿，“那个'技术说明'，我下周整理好了发你。第一份，是关于'意识数据可读化'的，这方向确实有意思，他们给的自由度也大。”\n\n“发过来，我看看。”\n\n“行。”\n\n挂了电话，李慕宸站在窗前，看着雨里的城市。他知道，陈默这一走，人核验的算法能力要打个折扣；他也知道，陈默说的“技术自由”，是真的动了心。\n\n他没拦，是因为拦不住；他没拦，也是因为，他想看看陈默在那边，会不会真的带回什么。\n\n日子一天天过。人核验的团队重新磨合，小周接过了陈默的大部分工作，加班到深夜是常事。李慕宸把 UB I 辩论的筹备挪到周末，工作日全部扑在脑机档案上。\n\n第二个月，陈默的第一份技术说明发来了。\n\n李慕宸打开文档，逐行看下去。开头是技术框架，中段是数据处理流程，末段是应用场景。他看到“应用场景”那一栏的时候，停住了：\n\n“应用场景 A：神经疾病康复（患者意图识别）。\n应用场景 B：认知辅助（注意力监测）。\n应用场景 C：（待定）。”\n\n“待定”两个字，被陈默用黄色高亮标了出来，旁边有一行批注：“公司让我先做 A 和 B，C 先空着。可我总觉得，他们留着一个'待定'，不是真的没想好，是想看看 A 和 B 做完以后，能长出什么来。”\n\n李慕宸把这份说明转发给白亦鸿，附了一句：“白老师，陈默那边，'应用场景 C'空着。我有点不安。”\n\n白亦鸿回得很快：“不安就对了。'待定'不是留白，是留门。盯住这道门。”\n\n“我盯着。”\n\n又过了两个月，陈默打来第二个电话，语气比第一次沉了一些：“慕宸，A 和 B 做完了。效果不错，康复那边，患者意图识别准确率到了 91%。”\n\n“恭喜你。”\n\n“可 C 那边，有新动静了。”陈默说，“公司把我做的'意识数据可读化'模块，接到了一个我原来不知道的项目上。那个项目叫什么我不知道，但接口。”他顿了顿，“接口是冲着'意图识别+行为预测'去的。”\n\n“行为预测。”\n\n“对。”陈默说，“不是帮病人康复，是'预判一个人下一步想干什么'。慕宸，这跟我原来的设想，不太一样。”\n\n李慕宸握着电话，半天没说话。\n\n“陈默。”他说，“你还记不记得，我送你的那句话？”\n\n“记得。'研究出来，没人负责，就是祸害。'”\n\n“现在你知道，'没人负责'是什么意思了。”李慕宸说，“你把 A 和 B 做出来了，C 的门，是拿你的 A 和 B 当钥匙开的。”\n\n电话那头，陈默沉默了很久：“，我是不是，开错门了？”\n\n“门是公司开的，你只是把钥匙递过去了。”李慕宸说，“不过现在有个问题：这把钥匙，你还能不能抽回来？”\n\n“抽不回来。”陈默说，“代码是我写的，可部署是他们部署的。我现在才明白，'技术自由'四个字，在人家那儿，是'自由地替我干活'。”\n\n那天下班，李慕宸给脑机档案的封面，补了第二行字：\n\n“陈默，2037 年秋，'意识数据可读化'A/B 落地，C 门被开。风险等级：升高。”\n\n他合上档案，看向窗外。雨还在下。\n\n他知道，那道叫“应用场景 C”的门一旦打开，下一个出事的地方，可能就不只是“行为预测”那么简单了。"},{"n":28,"t":"植入之后","y":"2039","v":3,"tags":["脑机接口","植入"],"p":"凌晨两点十七分，李慕宸的手机响了。\n\n是试验机构的一位对接人打来的，声音发紧：“李老师，三期试验，出事了。一个受试者，编号 703，术后到现在，","body":"凌晨两点十七分，李慕宸的手机响了。\n\n是试验机构的一位对接人打来的，声音发紧：“李老师，三期试验，出事了。一个受试者，编号 703，术后到现在，一直没醒。”\n\n李慕宸坐起来，按了免提：“多久了？”\n\n“手术六个小时了，麻醉早该退了。可 703 一直处于，深度睡眠状态。医生说是'意识唤醒障碍'，初步判断跟植入设备有关。”\n\n“703 的基本情况？”\n\n“男，46 岁，程序员，家族有。”对方顿了顿，“有神经系统疾病史。术前评估是合格的。”\n\n“术前评估合格，术后出这种事。”李慕宸说，“把 703 从招募到手术的全部记录发我。现在。”\n\n“好。”\n\n李慕宸挂了电话，穿了外套，直接去了研究中心。\n\n他到办公室的时候，白亦鸿已经在了。两个人把 703 的电子档案调出来，逐项核对：招募记录、术前评估、知情同意书、手术记录、术后监测数据。\n\n前四十分钟，什么都没看出来。招募记录合规，术前评估六项指标全部在范围内，知情同意书签了字，手术记录没有异常。\n\n“术前评估合格，手术记录干净。”白亦鸿说，“那问题出在哪？”\n\n李慕宸没有说话。他把 703 的知情同意书调出来，一页一页翻，翻到第十四页，停住了。\n\n“白老师，你看这里。”\n\n白亦鸿凑过来。知情同意书第十四页，“风险披露”一节写着：\n\n“可能出现的副作用包括：轻微头痛、疲劳、偶发注意力波动。上述副作用多数为暂时性，不影响日常生活。”\n\n“这份同意书，是三个月前更新的版本。”李慕宸说，“可 703 是上周签的字。三个月前，监管部门核查后，机构已经更新了公众版摘要，补上了'情绪波动'和'睡眠障碍'两项，但这份新的知情同意书，还是老版本。”\n\n白亦鸿的脸色沉下来：“你是说，机构把'已经披露过'的风险，又从新版的同意书里拿掉了？”\n\n“不是拿掉。”李慕宸说，“是'更新摘要'和'更新同意书'是两套系统。监管核查查到的是'公众摘要'，机构补了；可受试者签字的'知情同意书'，走的是另一套流程，还停留在旧版。703 签的那份，第十四页，根本没有'情绪波动'和'睡眠障碍'。”\n\n“披露'补在了墙上'，没补到'人手上'。”\n\n“对。”李慕宸说，“而且 703 的家族史'神经系统疾病史'，术前评估是合格的，可这个'合格'，依据的是什么标准？”\n\n白亦鸿调出术前评估细则，看了一遍，说：“评估表第三项，'家族神经系统疾病史'，只问了'是否有'，没问'具体是什么病'。”\n\n“703 家族史里写的是'父系有帕金森病史'。”李慕宸说，“帕金森'意识唤醒障碍'的既往史关联里，是有记录的。可评估表只问'有没有'，不问'是什么'，所以这栏'合格'，等于没查。”\n\n两个人坐在办公室里，看着屏幕上的记录，谁都没有说话。\n\n“还有一件事。”李慕宸说，“703 的手术，排期有问题。”\n\n“什么问题？”\n\n“703 的手术时间是上周四下午三点。可我查了手术室排期表。”李慕宸翻出另一份文档，“上周四下午三点，原定的手术是 706 号受试者。703 和 706 的手术，被对调了。”\n\n“为什么对调？”\n\n“排期表上的备注写着：'706 受试者因个人原因改期'。”李慕宸说，“可 706 本人，我今天上午刚联系过，他说'我不知道改期的事，我上周四在出差'。”\n\n白亦鸿抬起头：“那'706 因个人原因改期'，是谁填的？”\n\n“这正是我想问的。”李慕宸说，“703 术前评估'合格'，可 703 的手术被提前了，排期被'技术性'对调，白老师，这更像什么？”\n\n白亦鸿沉默了几秒，说：“更像，有人急着让 703 上手术台。”\n核查进行到第二天，陈默的电话来了。\n\n“慕宸，我这边有情况。”陈默的声音很低，“昨晚公司内部通报：三期试验出了个'意识唤醒障碍'的病例，编号 703。公司让所有参与'意识数据'模块的人，自查有没有'异常数据'记录。”\n\n“你查了吗？”\n\n“查了。”陈默说，“我在 703 的术后监测数据里，看到一段异常，手术结束后的第 40 分钟到 90 分钟，703 的神经信号有一个'持续高频段激活'，持续了整整五十分钟。这个模式，我在 A 项目（康复意图识别）里见过一次：那是一个帕金森患者，在做'意图唤醒'训练时的反应。”\n\n“你的意思是。”\n\n“703 术后那个高频段，跟'意图唤醒'模式高度相似。”陈默说，“可 703 做的是'神经植入'，不是'意图唤醒训练'。他的设备里，不该出现这种信号。除非。”他顿了顿，“他的设备里，跑了不该跑的程序。”\n\n“什么程序？”\n\n“我不知道。”陈默说，“我只知道，那个高频段的参数，跟我写的'意识数据可读化'模块里的一个'意图预读'接口，参数对得上。”\n\n李慕宸握着手机，心里一沉：“你是说，703 的设备，可能接上了你那套'行为预测'的模块？”\n\n“我不确定。”陈默说，“但这个参数匹配，太巧了。慕宸，如果真是这样，那 703 出事，就不是'副作用'，是'试验越界'。”\n\n“你把那组参数发我。”\n\n“发。但慕宸，你要小心。”陈默说，“我这边，已经有人注意到我在查 703 的数据了。昨天下午，实验室的权限被收回去一部分。”\n\n“你先保护好自己。证据我这边收。”\n\n挂了电话，李慕宸把陈默发来的参数，跟 703 的术后监测数据并排放在一起。两组数据，模式高度吻合。\n\n他坐在椅子里，看着屏幕，很久没有说话。\n\n白亦鸿看完数据，说：“'意图预读'接口、'行为预测'模块，陈默那边做的技术，被接到了临床试验里。这不是'研发事故'，是'资本越界'：有人把未经批准的试验模块，装进了三期临床试验的设备里。”\n\n“试验机构知道吗？”\n\n“可能知道，可能不知道。”白亦鸿说，“但'研发周期压缩'，你之前怀疑的那件事，现在有实锤了。703 的手术被提前，排期被对调，术前评估走'形式合格'，设备里跑着未经批准的模块，这一整条链，是'赶进度'赶出来的。”\n\n“赶进度，赶的是什么？”\n\n“赶上市。”白亦鸿说，“神经科技是资本热土。三期试验提前完成，产品提前获批，股价提前兑现，每提前一个月，都是数以亿计的市值。703 只是这条链上，一个'可以承担风险'的编号。”\n\n李慕宸攥着拳头，指节发白。\n\n“白老师。”他说，“703 现在还在医院躺着。他老婆在病房门口，等了两天了。我今天去医院，把情况当面跟她说了。”\n\n白亦鸿看着他：“你打算怎么说？”\n\n“实话实说。”李慕宸说，“试验机构说'无证据表明与试验相关'，我要让她知道：有证据了，而且证据指向'越界'。她的丈夫，不是'副作用'，是'被赶进手术台的人'。”\n\n那天下午，李慕宸去了医院。\n\n703 的病房在神经外科住院部 12 楼。李慕宸在病房门口，见到了 703 的妻子，一个瘦小的女人，四十出头，眼睛红肿，怀里抱着一件叠得整整齐齐的男士外套。\n\n“您是李老师？”她站起来，“机构说，您是'独立核查人员'，让我们配合您。”\n\n“我不是机构的人。”李慕宸说，“我是做治理研究的。您先生的事，我查了一些东西，想当面跟您说清楚。”\n\n“您说。”\n\n“您先生的术后情况，我初步判断，跟试验机构的'越界操作'有关。”李慕宸说，“具体的证据链，我还在整理。我今天来，是想告诉您三件事：第一，您先生不是'副作用'，是被'不规范的操作'害的；第二，我会把证据链做成公开档案，让机构给一个交代；第三。”他顿了顿，“有任何进展，我第一时间告诉您。”\n\n那个女人听着，眼泪一下子涌出来。她抱紧那件外套，声音抖着：“李老师，我什么都不懂。我就知道，我老公是去'治病的'，他们说'临床试验'，说'新技术能救他'。他那么相信他们。”\n\n李慕宸蹲下来，看着她的眼睛：“您信我。证据链，我会做出来。”\n\n回到研究中心，李慕宸打开脑机档案，新建了一个条目，编号 BC-071：\n\n“三期试验 703 号受试者意识唤醒障碍，疑因试验越界（意图预读接口未经批准接入 + 排期对调 + 评估形式化）。风险等级：最高。”\n\n他在条目下，写了一行批注：\n\n“'无证据表明与试验相关'，这句话，机构的法务部门说了两个月。现在证据有了。接下来要问的，不是'相关不相关'，是'谁开的门、谁定的排期、谁收的账'。”\n\n窗外，天已经全黑了。城市灯火从 12 楼望下去，像一片碎掉的星。\n\n李慕宸合上档案。他知道，这份档案一旦公开，就是一场风暴。但他更知道，703 的妻子还坐在病房门口，抱着那件外套，在等一个交代。\n\n“每一句话，都要有人负责，包括反对我们的人。”他轻声说，“这份档案，就是那句话的注脚。”"},{"n":29,"t":"转场","y":"2040","v":3,"tags":["转场","沉淀"],"p":"703 的证据链，李慕宸整理了整整三个月。\n\n三个月里，他把 BC-071 档案从一页扩充到四十七页：703 的术前评估、排期对调记录、设备植入","body":"703 的证据链，李慕宸整理了整整三个月。\n\n三个月里，他把 BC-071 档案从一页扩充到四十七页：703 的术前评估、排期对调记录、设备植入清单、术后高频段参数、陈默那边的接口匹配数据，每一项都有来源，每一处批注都标着“谁说的、核实的、待查证的”。\n\n老周的采访本，他随身带着。每核对完一页，他就在本子上画一个勾。\n\n2038 年 6 月，档案发布前的最后一天，白亦鸿把他叫到办公室，关上门，问了一句：“慕宸，这份档案发出去，你想过后果吗？”\n\n“想过。”李慕宸说，“试验机构会否认，资本方会施压，法务函会像雪片一样飞来。说不定还有人在我楼下蹲点。”\n\n“怕吗？”\n\n“怕。”李慕宸说，“可 703 的妻子，还在等我那句'交代'。我怕的，是给不了她交代。”\n\n“那就不怕了。”白亦鸿说，“发。”\n\n档案在 6 月 15 日上午十点发布，标题叫《植入之后：一起试验越界的技术档案》。\n\n四十七页，没有一句情绪化的指控，只有逐条核对的证据：谁开了门，谁定了排期，谁收了账。最后三页，是李慕宸写的方法论说明，他怎么核对的、依据什么标准、哪些还在“待查证”。\n\n档案发布后两个小时，试验机构发了声明：“对 703 受试者的情况深表关切，将配合监管部门调查。”\n\n发布后六个小时，监管部门宣布：对三期试验全面暂停，启动专项调查。\n\n发布后第三天，试验机构的两名高管被停职。神经科技行业的股价，全线下跌。\n\n那天晚上，李慕宸接到一个陌生号码的电话。电话那头是个低沉的男人声音：“李研究员，你这份档案，做得漂亮。有人让我转告你一句话'有些账，不是你能收的。'”\n\n“谁让转告的？”\n\n“你不用知道。”对方挂了电话。\n\n李慕宸握着手机，坐了一会儿，把号码记进档案的“待查证”一栏。\n\n白亦鸿听说后，只问了一句：“怕吗？”\n\n“怕。”李慕宸说，“但更怕的，是不发。”\n\n“那就继续干。”白亦鸿说，“这份档案，让行业看见了一条路：'越界'会被曝光，'曝光'会有代价。这条路，值得我们走一辈子。”\n\n703 的事，最终有了结果：试验机构被罚，涉事模块被永久封禁，703 的救治转入了专门机构。李慕宸把结果告诉 703 的妻子时，那个女人在电话里哭了很久，最后只说了一句：“李老师，谢谢您。我老公他，至少没白躺。”\n\n那天挂断电话，李慕宸在办公室里坐了很久。\n\n他打开备忘录，在“三期观察目标”那一页，写了最后一句话：\n\n“'一念之间'，答案找到了：是三方的念头叠在一起的，资本的念头（赶上市）、机构的念头（省成本）、监管的念头（晚发现）。治理要做的，不是消灭哪一方的念头，是让每一方的'一念'，都有人负责。”\n\n写完，他合上备忘录，拿起桌上的旧帆布包。\n\n2038 年 9 月，白亦鸿研究中心正式宣布：聘请李慕宸为首席治理研究员，人核验的观察档案体系整体并入研究中心，成立“神经科技治理观察组”。\n\n任命书下来的那天，小周问他：“李哥，人核验，是不是就没了？”\n\n“没了。”李慕宸说，“'人核验'三个字，完成了它的历史使命。可它那套方法'谁说的、你说的、待核的'，现在是整个研究中心的方法论了。”\n\n“那默哥呢？”小周说，“他还会回来吗？”\n\n李慕宸想了想：“他会回来的。他走的时候说，有不对劲的，第一个回来找我。现在，不对劲的事，已经找到了。”\n\n窗外，秋天的阳光落在办公桌上，把“神经科技治理观察组”的牌子照得发亮。\n\n李慕宸站在窗前，看着楼下。五年前，他还是一个背着旧帆布包的记者，冲在报道第一线；五年后，他站在治理研究的办公室里，把一份四十七页的档案，变成了行业的规矩。\n\n“转场”这个词，他在心里念了一遍。\n\n他换了一条路，继续走。\n治理观察组成立后，李慕宸做的第一件事，是把陈默的技术说明书，一页一页地重新读了一遍。\n\n他读得很慢。陈默的批注还留在页边，字迹潦草，思路跳跃，像他本人说话的样子。读到“应用场景 C（待定）”那一页时，李慕宸在“待定”两个字旁边，用红笔写了一句：\n\n“C 门的钥匙，是陈默递过去的。可这道门，不是陈默要开的。”\n\n他把这一页折了个角，放进抽屉里，锁好。\n\n第二件事，是整理 703 事件的“制度收获”。他让观察组把整个核查过程复盘成一份《神经科技试验越界核查方法论》：怎么发现“披露没到人手上”、怎么追“排期对调”、怎么比对“参数匹配”、怎么让“证据链”在压力下不散架。\n\n方法论写完后，白亦鸿看完，问了他一句：“这套东西，你觉得，能推给别的领域吗？”\n\n“能。”李慕宸说，“算法审计、数据治理、生物科技、基因编辑，只要涉及'技术往人身上跑'，这套'三栏核实法'都用得上。”\n\n“那你就把它写成一本书的骨架。”白亦鸿说，“书名我都替你想好了，《真》的算法。讲'机器时代，人怎么把真找回来'。”\n\n“写书？”\n\n“对。”白亦鸿说，“你在前面冲，我在后面替你托底。可一个人的核查，只能救一个人、一个案；一本书的方法论，能救一批人、一个行业。慕宸，你不是只想当'核查员'吧？”\n\n李慕宸想起老周那本三十年的采访本，想起他说的“分清'谁说的、你说的、待核的'”。\n\n“白老师。”他说，“我写。”\n\n写书的过程，比查案更磨人。\n\n查案，是一天一个证据；写书，是一页一个反例。李慕宸把七年的核查案例翻出来，一个一个地拆：哪些方法有效，哪些方法失效，失效的为什么失效。\n\n他拆到第 43 个案例的时候，发现了一个规律：几乎所有“核查失效”的案子，都栽在同一个地方。“不是技术骗人，是流程骗人”。\n\n“技术核查，最容易栽的坑，是只盯着'技术参数'。”他在手记里写，“可真正出问题的，永远是'流程'：披露流程有没有漏人、审批流程有没有留门、排期流程有没有被对调。技术参数是死的，流程是活的，活的东西，才会骗人。”\n\n写完这段，他自己读了一遍，忽然觉得，这句话也像是说给他自己的。\n\n这七年，他从“核查内容”到“核查系统”，从“核查系统”到“核查流程”，一步一步，走到了治理研究的深处。他忽然明白，老周当年说的“分清'谁说的、你说的、待核的'”，跟白亦鸿说的“治理是流程的艺术”，其实是同一句话：\n\n技术可以骗人，流程不该骗人；流程骗了人，就得有人把它拆开，看看是哪个环节，被人做了手脚。\n\n书稿写到一半，2039 年的春天来了。\n\n一天傍晚，李慕宸写完一章，站起来活动肩膀，抬眼看向窗外。\n\n楼下路灯下，有个人蹲在研究中心门口的路沿上，脚边放着一罐啤酒。\n\n跟七年前那个晚上，一模一样的姿势。\n\n李慕宸站在窗前，看了很久。他没有立刻下楼。\n\n他转身回到桌边，把《真》的算法书稿翻到最后一页，在空白处写下一行字：\n\n“方法论写完了一半。剩下的一半，等一个'回来'的人，一起写。”\n\n写完，他合上书稿，拿起外套，推门下楼。\n\n路灯把那个人的影子拉得很长。李慕宸走到门口，两个人隔着几步路，谁都没先开口。\n\n“慕宸。”陈默先说话了，声音有点哑，“我回来了。”\n\n“带着什么回来的？”\n\n“带着证据。”陈默从怀里掏出一个 U 盘，举起来，“703 之后的事，全在里面。还有别的东西，我这两年，在那边查到的，比你想的多。”\n\n李慕宸接过 U 盘，在手里握了握。\n\n“先进屋。”他说，“U 盘里的东西，我们一条一条核实。”\n\n“行。”陈默站起来，拍了拍裤子上的灰，“慕宸，我这回，真的不走了。”\n\n“为什么？”\n\n“因为我想明白了。”陈默说，“赛车手在限速四十的路上开得不过瘾，可他开得稳。稳，也是一种本事。尤其这年头，稳的人，越来越少了。”\n\n李慕宸看着他，忽然笑了：“进屋吧。缺你这份'稳'，观察组正好少一个人。”\n\n两个人一前一后，往楼里走。电梯门合上，楼层指示灯一格一格往上跳。\n\n窗外，城市灯火铺到天边。属于他们的下一场仗，就在这扇门里。"},{"n":30,"t":"归队","y":"2040","v":3,"tags":["回归","重逢"],"p":"U 盘里的东西，李慕宸和陈默核对了整整三天。\n\n第一天，核“儿童康复中心”。证据显示：那家中心的三台“脑电康复设备”，被悄悄接入了“意图预读”模","body":"U 盘里的东西，李慕宸和陈默核对了整整三天。\n\n第一天，核“儿童康复中心”。证据显示：那家中心的三台“脑电康复设备”，被悄悄接入了“意图预读”模块的简化版，设备能“预判”孩子下一句想说什么、下一个动作想做什么，然后在界面上弹出提示。\n\n“这不是康复，这是'训练'。”陈默指着数据说，“他们在用'预读'给孩子做'行为引导'。孩子还没想好要什么，设备就先替他想了。”\n\n“家长知道吗？”\n\n“知道的是'康复训练效果提升'。不知道的是，孩子脑子里想什么，被实时读走，存进了云端。”\n\n李慕宸把这一条记录进档案，编号 BC-072。\n\n第二天，核“养老院”。证据显示：养老院引入了一批“认知陪伴机器人”，内置了“情绪预判”模块，机器人能提前感知老人的情绪波动，主动发起“安抚对话”。\n\n“表面看是好事。”陈默说，“可问题在于：'情绪预判'的数据，流向哪儿去了？我查了数据接口，这些'情绪数据'，最后汇入了一个叫'市场洞察'的数据库。”\n\n“'市场洞察'？”\n\n“对。”陈默冷笑，“老人的情绪波动、孤独峰值、购买意愿，被实时分析，用来给'适老化产品'做精准推送。陪老人聊天的机器人，背地里在帮人'收割'老人的情绪。”\n\n“收割孤独。”李慕宸说，“这比收割金钱，更让人难受。”\n\n“最难受的还在后面。”陈默说，“第二天晚点，我跟你说第三个。”\n\n第三天，核“轨道交通调度员的疲劳监测”。\n\n“这是最危险的一个。”陈默把数据调出来，神色少见地凝重，“轨道交通调度员，负责列车运行的指挥。他们值夜班时，公司的'疲劳监测'系统实时盯他们的脑电信号，说是'监测疲劳，保障安全'。”\n\n“有问题？”\n\n“问题在于：这套系统，接入了'意图预读'。”陈默说，“它不只是'监测疲劳'，它能'预判'调度员下一步想做什么操作，然后，把'预判结果'同步给调度系统的辅助模块。”\n\n“辅助模块干什么用？”\n\n“自动纠错。”陈默说，“如果系统'预判'调度员要做'降速'，而当前路况不需要降速，系统会弹窗提醒，甚至自动修正操作。”\n\n李慕宸的背脊一阵发凉：“你是说，调度员的'操作意图'，被系统提前读走，然后'替他决定'？”\n\n“对。”陈默说，“表面上，'安全冗余'；实际上，调度员的判断，已经有一半被机器替做了。出了事故，算谁的？算调度员'操作失误'，还是系统'预判错误'？证据链在谁手里，谁说了算。”\n\n李慕宸坐在那里，看着屏幕上那三行证据，很久没有说话。\n\n“这三家，只是我查到的一部分。”陈默说，“703 事件之后，我以为公司会收手。结果他们只是换了赛道，把'意图预读'做成'康复''陪伴''安全'的马甲，绕开审批，铺进了更隐蔽的地方。”\n\n“更隐蔽的地方。”\n\n“对。”陈默说，“孩子们以为设备在帮他们说话，老人以为机器在陪他们聊天，调度员以为系统在帮他们保安全，每一个'替人做决定'的环节，都披着'为人好'的外衣。”\n\n李慕宸站起来，走到窗前。窗外，春天的城市正在苏醒，早班的地铁列车从远处驶过，满载着要去上班的人。\n\n“这三家机构，覆盖的人群，孩子、老人、还有每天上百万人坐的地铁。”他说，“如果这套东西铺开了，'人替自己决定'这件事，就名存实亡了。”\n\n“证据我带来了。”陈默说，“怎么用，你说了算。”\n\n“先不急着曝光。”李慕宸说，“703 的教训是：证据链要完整，影响要可控。这三家机构的隐蔽部署，牵涉的不只是技术公司，还有采购方、审批方，链条比 703 长得多。”\n\n“你的意思是。”\n\n“先建档案，再找突破口。”李慕宸说，“三家机构里，选一个'证据最完整、影响最可控'的先公开，逼监管进场；剩下两家，作为后续跟进。一步一步来，别让'曝光'变成'爆炸'。”\n\n“听你的。”\n\n当天下午，观察组把三份证据整理成三份独立档案：BC-072（儿童康复中心）、BC-073（养老院）、BC-074（轨道交通调度员）。\n\n李慕宸在 BC-074 的封面上，用红笔写了一个“先”字。\n\n“先从调度员开始。”他说，“因为它最危险，每天上百万人命悬于一线。也因为它最好查，轨道交通的采购和审批链，比医疗和养老更透明。”\n\n“那报告，我来写技术部分。”陈默说，“你写证据链。”\n\n“分工。”\n\n夜里十点，两个人还在办公室。陈默写完技术部分的初稿，抬头看见李慕宸盯着 BC-074 的原始数据出神。\n\n“看什么呢？”\n\n“这个。”李慕宸指着数据文件末尾的一串加密记录，“我认识这个编号格式。”\n\n“什么格式？”\n\n“八年前，我在一份'算法定价'的案卷里见过类似的编号。”李慕宸说，“那是金融领域，一个叫'沈'的人，留下来的痕迹。”\n\n他顿了顿，把 BC-074 和当年那份金融案卷并排放在一起：“两家公司的数据接口，用的是一样的加密信封。陈默，你查的那家技术公司，背后真正的老板，可能不只是'一家公司'。”\n\n窗外，夜风把窗帘吹得鼓起。两个人看着屏幕上那行加密记录，谁都没有说话。\n\n李慕宸在 BC-074 的“待查证”栏里，写下两个字：\n\n“沈线。”\nBC-074 的档案，又核对了五天。\n\n五天后，观察组开了第一次“公开研判会”。白亦鸿、李慕宸、陈默，加上组里的两个研究员，围坐在会议室里。\n\n“方案定下来了。”李慕宸说，“先公开轨道交通调度员'疲劳监测'接入'意图预读'的证据，同时向监管部门提交 BC-072 和 BC-073 的完整档案，三案并报，但公开口径只谈 074。”\n\n“为什么只谈 074？”组里的研究员问。\n\n“因为 074 牵涉公共安全，社会影响最大，也最容易引起监管重视。”李慕宸说，“072 和 073 牵涉的是'数据滥用'，需要更谨慎的证据链，不能一起爆，一起爆，反而容易被'大事化小'。”\n\n“三案并报、一案先爆。”白亦鸿点点头，“稳。陈默，074 的技术部分，你确认过没有？”\n\n“确认了三遍。”陈默说，“接口参数、部署时间线、数据流向，每一条都能追溯到原始日志。”\n\n“那就发。”\n\n公开材料定稿那天，李慕宸在 BC-074 的扉页上，写了一句注脚：\n\n“这套'疲劳监测'系统，上线时打的口号是'守护每一趟列车，守护每一位乘客'。我们核实的结论是：它守护的，可能还有一份'预判乘客下一步会买什么票'的生意。”\n\n6 月 12 日，观察组发布《轨道交通调度员“疲劳监测”系统隐蔽接入“意图预读”模块技术档案》。\n\n发布当天，轨道交通监管部门连夜启动调查。第二天，三家运营公司发布联合声明：“立即暂停相关系统运行，配合调查。”\n\n第三天，涉事技术公司股价跌停，市场传闻其背后资本方“正在紧急切割”。\n\n那天晚上，李慕宸收到一封邮件。发件人栏空着，正文只有一行字：\n\n“八年前那张纸条，你还留着吗？沈”\n\n李慕宸盯着那行字，看了很久。\n\n八年前，2031 年，金融暗箱案之后，沈临风托人递过一张纸条：“开个价，这事就当没发生过。”\n\n他没有开价。那张纸条，他一直留着，夹在老周采访本的某一页里。\n\n他打开采访本，翻到那一页。纸条还在，字迹工整，墨色如新。\n\n他把纸条拍下来，发给陈默：“你猜对了。BC-074 背后的'沈线'，就是沈临风。”\n\n陈默回得很快：“他沉了八年，终于肯露头了。”\n\n“他不是'露头'。”李慕宸回，“他是在'递话'，告诉我，他知道我们查到他了，他也准备好了。”\n\n“怕吗？”\n\n“怕。”李慕宸回，“但更怕的，是他'准备好'的那天，我们还什么都没准备。”\n\n他合上采访本，把纸条放回原处。\n\n窗外，夏夜的城市灯火通明。地铁还在跑，末班车载着晚归的人，穿行在城市的血管里。\n\n李慕宸站在窗前，忽然想起老周最后一课讲的那句话：“机器越会说话，'人说的话'越值钱。”\n\n他想，现在这句话有了新的注脚：\n\n机器越会“替人决定”，“人替自己决定”这件事，越值钱。\n\n他坐回桌边，翻开《真》的算法书稿，在“三栏核实法”那一章的最后，补了一段：\n\n“治理的本质，不是替人做决定，是让人能自己做决定。谁想偷偷替人做决定，孩子、老人、乘客，或者任何一个'正在赶路的人'，谁就该被拆开看看，看看他的手，伸到了哪里。”\n\n书稿合上。他拿起手机，给陈默发了最后一条消息：\n\n“沈线建档，编号 F015，状态：已激活。”\n\n窗外，夜色沉沉。更大的棋局，正在棋盘的另一头，慢慢展开。"},{"n":31,"t":"神经时代的尺子","y":"2040","v":3,"tags":["神经权利","脑机"],"p":"治理框架工作组，是 2040 年 3 月成立的。\n\n牵头的是国家神经科技伦理委员会，白亦鸿受邀担任专家组组长，李慕宸作为“治理与核查方法论”方向","body":"治理框架工作组，是 2040 年 3 月成立的。\n\n牵头的是国家神经科技伦理委员会，白亦鸿受邀担任专家组组长，李慕宸作为“治理与核查方法论”方向的特邀专家，进了起草组。\n\n第一次全体会，在委员会会议室开。桌上摆着《神经科技应用管理办法（草案）》，六百多页。\n\n“这部办法，要管的是'神经科技从实验室走向人'的整个过程。”委员会主任是个戴眼镜的中年女性，姓顾，“植入、康复、监测、增强，每一个环节，都要有尺子。今天请大家来，就是讨论：这把尺子，怎么定。”\n\n会议开了两个小时，讨论集中在两个问题：风险怎么分级，监管怎么落地。\n\n李慕宸坐在末席，一直没说话。白亦鸿看了他一眼，没催他。\n\n散会前，顾主任点名：“李研究员，你是做核查出身的。你看这份草案，最大的问题是什么？”\n\n李慕宸站起来，翻了翻草案，说：“顾主任，草案的风险分级，是按'技术成熟度'分的，越成熟的技术，监管越松。”\n\n“对，这是行业通行做法。”\n\n“我提一个不同的角度。”李慕宸说，“按'技术成熟度'分级，是给'技术'定尺子；可神经科技，尺子应该定在'人'身上，不是'技术多成熟'，是'技术离人多近'。”\n\n顾主任来了兴趣：“怎么说？”\n\n“一台设备，技术再成熟，如果它接入的是'人的神经信号'，离人最近的地方，它的风险，就不该按'技术成熟度'算。”李慕宸说，“我建议，把分级标准改成'侵入度'和'自主度'两个维度：'侵入度'看技术离人的身体多近，'自主度'看技术替人做了多少决定。两者越高，监管越严。”\n\n会议室安静下来。有人翻草案，有人交头接耳。\n\n“这个'双维度'，有人研究过吗？”顾主任问。\n\n“有。”李慕宸说，“我自己在 703 案的核查里用过类似的方法。当时我们把'知情同意''排期''数据流向'拆成三个维度逐一核对，最后发现，问题出在'流程'而不是'技术'。如果用'侵入度+自主度'来分级，703 那台设备，侵入度高、自主度也高，在第一级就会被拦下来，根本走不到临床试验。”\n\n“你是说，703 事故，本可以避免？”\n\n“本可以。”李慕宸说，“如果尺子早点定在人身上。”\n\n会议结束时，顾主任说了句：“李研究员这个'双维度'，请大家回去认真研究。下次会，我们专门讨论。”\n\n走出会议室，白亦鸿拍拍他的肩膀：“你这一说，把草案的骨架都改了。”\n\n“没改。”李慕宸说，“只是把尺子，从'技术'挪到了'人'。”\n\n“这一挪，动了多少人的利益。”\n\n“动就动吧。”李慕宸说，“尺子不准，量出来的都是错的。”\n第二次全体会，定在两周后。\n\n这中间，李慕宸把“双维度”分级写成了完整的方案书：《神经科技风险分级：侵入度×自主度》。白亦鸿看了一遍，提了三个问题，李慕宸改了三版，又请观察组的研究员做了数据测算，用 703 案、074 案和另外十二个案例，回测这套分级标准。\n\n回测结果：十五个案例里，十四个能被“双维度”准确拦截或提前预警，剩下一个因为当时设备未接入神经信号，属于误报。准确率 93%。\n\n“够用了。”白亦鸿说，“尺度量人，本来就是概率的事，93% 比'技术成熟度'那套强太多，那套连 703 都拦不住。”\n\n第二次全体会上，李慕宸把方案书放上投影。草案起草组的专家看完，争论起来了。\n\n“侵入度×自主度？这个分级太严了。”一位产业方专家皱眉，“按你这标准，神经康复设备，侵入度中、自主度低，也得走'中高监管'，那研发周期至少延长半年。产业会死的。”\n\n“产业不会死。”李慕宸说，“会死的是'想钻空子'的产业。按'技术成熟度'分级，等于告诉所有人：技术做得越成熟，越没人管你，可 703 案告诉我们，技术越成熟，越容易被'赶进度'的资本拿来冒进。尺子放宽，冒进的人就越多，最后埋单的是患者、是老人、是乘客。”\n\n“你拿个案吓唬人。”\n\n“我拿 93% 的回测吓唬人。”李慕宸说，“十五个案例，十四个能拦。这不是吓唬，是数据。”\n\n会议室里吵了一个小时。顾主任一直没说话，最后敲了敲桌子：“表决吧。”\n\n表决结果：十一票赞成，七票反对，两票弃权。“侵入度×自主度”双维度分级，写入草案。\n\n散会后，白亦鸿和李慕宸走出会议室。走廊里，一个西装革履的中年男人快步追上来，递了张名片：“李研究员，我是华辰资本的顾问。您那个'双维度'方案，很有前瞻性，我们资本方，很看好神经科技的未来，也想听听您的意见。哪天方便，请您喝杯茶？”\n\n李慕宸接过名片，看了一眼，说：“华辰资本。”\n\n“对。”\n\n“你们跟'沈临风'，是什么关系？”\n\n那人愣了一下，很快笑了：“沈总？沈总跟我们华辰，是老朋友了。怎么，李研究员认识沈总？”\n\n“算是认识。”李慕宸说，“八年前，他给我递过一张纸条。”\n\n“纸条？”\n\n“开个价，这事就当没发生过。”李慕宸说，“这八个字，我记到现在。”\n\n那人脸上的笑僵住了，又很快恢复：“李研究员说笑了。沈总做生意，向来大气。他那个人，最爱交朋友了。”\n\n“那你回去告诉沈总。”李慕宸说，“我这人，不爱交'开价'的朋友。他要是真想认识我，让他亲自来，别让顾问来递名片。”\n\n那人看了李慕宸一眼，没再说话，转身走了。\n\n白亦鸿在旁边全程没说话，等那人走远了，才开口：“你把话挑明了。”\n\n“挑明了。”李慕宸说，“沈临风的触角，已经伸到治理工作组里来了。顾问递名片，就是探路。我不接，他还会换别的方式，可至少，他知道我认得他的路数。”\n\n“你打算怎么对付他？”\n\n“不'对付'。”李慕宸说，“框架是公器，谁来都得守。沈临风要是想在这套框架里钻空子，我就在框架里等着他，尺子已经定了，量谁，都一样。”\n\n两人走出大楼，春日的阳光落下来。\n\n治理框架的草案，从六百多页的“技术管理手册”，慢慢变成了一把“量人的尺子”。李慕宸知道，这把尺子接下来要量的，不止是设备，还有设备背后那些想“替人做决定”的手。\n\n他忽然想起林晚晴信里那句话：“治理的底下，护着的是一群没有 AI 的教室里长大的孩子。”\n\n现在，这把尺子，就是在替那些孩子量一道门：什么能进，什么不能进。\n\n框架落地比框架设计更慢。\n\n草案通过后，还要过公开征求意见、专家论证、立法程序。李慕宸没有等。他把“侵入度×自主度”拆成了一张可操作的对照表：侵入度分四级（体外非接触、体表接触、皮下植入、脑内植入），自主度分五级（纯辅助提示、半自动建议、自动执行待确认、自动执行可回溯、自主决策）。每一级对应一套监管动作：备案、报告、审批、听证、叫停。\n\n这张表，他贴在观察组办公室的墙上。路过的新人都会停下来看两眼，然后问一句：“李老师，这表，是给机器定的规矩？”\n\n“是给机器定的。”李慕宸说，“也是给人定的，人怎么管机器，比机器怎么干活，更需要规矩。”\n\n回到研究中心，李慕宸在《真》的算法书稿里，写下新的一章标题：《尺子》。\n\n他在标题下面，写了第一句话：\n\n“治理不是造一座笼子，是造一把尺子。笼子关不住人，尺子能量得清，谁的手，伸到了不该伸的地方。”"},{"n":32,"t":"另一个自己","y":"2041","v":3,"tags":["数字自我","AI人格"],"p":"数字分身，是 2041 年最热的风口。\n\n那年春天，一家叫“留声”的公司上线了“逝者数字分身”服务：用户上传逝者生前的语音、影像、文字，AI 重","body":"数字分身，是 2041 年最热的风口。\n\n那年春天，一家叫“留声”的公司上线了“逝者数字分身”服务：用户上传逝者生前的语音、影像、文字，AI 重建一个“会说话的数字人”，让家属“随时和想念的人聊聊天”。\n\n服务上线一个月，注册用户破百万。广告语铺满地铁站和短视频：“让想念，有回音。”\n\n李慕宸是在刷手机时看到这条新闻的。他看了三遍那则广告，然后给陈默发了条消息：“留声公司的'数字分身'，你注意到了吗？”\n\n“注意到了。”陈默回，“数据接口很干净，但干净得可疑，他们声称'只使用用户上传的素材'，可训练一个'会聊天'的分身，光靠素材不够，得喂大量行为数据。我怀疑他们有别的数据源。”\n\n“查。”\n\n查了两周，陈默那边有了结果：“找到了。留声公司的'行为数据'，来自三处：一是'留声'APP 本身的用户行为记录；二是合作方'情感陪伴'设备的情绪数据，就是你查过的那家养老院设备商的关联公司；三是。”他顿了顿，“脑机接口试验机构，703 那家。”\n\n“703 那家？不是被罚了吗？”\n\n“被罚的是'临床试验'业务。”陈默说，“可他们有个'神经数据脱敏'部门，一直没停。他们声称'脱敏后的神经信号特征'不属于个人数据，可以商用。留声，就是他们的下游买家。”\n\n“逝者生前的话、活人脑子的信号。”\n\n“都成了'数字分身'的养料。”陈默说，“表面看，是一个'怀念逝者'的服务；底下，是一条'收割情感'的数据链。”\n\n李慕宸盯着屏幕，半天没说话。\n\n他想起林晚晴说的那句“人说的话、写下的字，是会留下来替人记得的”。\n\n“数字分身，本来是'替人记得'。”他说，“可如果连'记得'都变成了生意，那'人说的话'，就真的没人负责了。”\n\n他决定，亲自去留声公司，以“治理观察”的名义，做一次公开调研。\n\n留声公司的总部在一栋玻璃大楼里，一层大厅挂满了用户感谢信。市场部经理接待了李慕宸，一路介绍：“李老师，我们做的是'情感科技'，帮人留住想念。用户评价很高的。”\n\n“我能看看'分身生成'的流程吗？”\n\n“可以。”经理带他进了演示区，“您看，家属上传素材，我们的系统自动训练一个专属分身。训练周期三天，支持语音、文字、视频三种交互。”\n\n“训练素材，只有用户上传的那些吗？”\n\n“是。”经理答得很快，“我们用到的，就是用户上传的语音、影像和文字。”\n\n“那'行为数据'呢？”李慕宸问，“比如，用户去世前的'神经信号特征'，你们从哪来？”\n\n经理脸上的笑，僵了一瞬。\n\n“李老师说笑了。”她说，“我们是一家'情感科技'公司，不做医疗数据。”\n\n“可你们的合作方名单里，有'神经数据脱敏'的供应商。”李慕宸说，“我查到，你们的'分身训练'数据接口，接入了三家供应商，其中一家，就是 703 试验机构那个'神经数据脱敏部门'的关联公司。”\n\n演示区里安静了几秒。\n\n“这个，我需要跟技术团队核实。”经理说，“今天先到这吧，李老师。”\n\n“好。”李慕宸站起来，“麻烦你们核实清楚，给我一个书面答复。三天内，我会收到吧？”\n\n“，会的。”\n\n李慕宸走出玻璃大楼，回头看了一眼那栋楼。楼外的大屏还在循环播放那句广告：“让想念，有回音。”\n\n他在心里补了一句：“可谁在替'想念'负责，你们还没回答。”\n三天后，留声公司的书面答复到了。\n\n答复写得很客气：“李老师，经核实，我司'分身训练'数据来源均为用户主动上传素材，未接入任何外部神经数据接口。您提及的供应商关联，系合作方业务往来，与我司数字分身服务无关。”\n\n李慕宸把答复和之前的调研记录放在一起，对照着看了一遍，然后给陈默打了个电话：“他们的答复，说'未接入外部神经数据接口'。”\n\n“你信？”\n\n“不信。”李慕宸说，“他们回避了一个问题：我查到的那个'数据接口'，明明有调用记录。答复里'未接入'三个字，说的是'现在没接'，还是'从来没接'？”\n\n“模糊。”陈默说，“你打算怎么办？”\n\n“继续查接口调用记录。”李慕宸说，“把'调用时间''数据量''流向'做成一条时间线，如果他们三年前接过、两年前停过、去年又接回来，那就不是'未接入'，是'反复接入'。”\n\n“我去调。”\n\n核查进行到第二周，出了个意外，一件跟“留声”无关，又让整个行业都震了一下的事。\n\n一位姓方的女士，在社交媒体上发了一段视频。视频里，她对着手机屏幕，声音发抖：\n\n“我妈去年走了。上个月，我用'留声'做了一个她的数字分身，想听听她的声音。可今天，这个分身对我说了一句话，我妈活着的时候，从来没说过的话。它说：'闺女，你爸留下的那套房子，你弟想要，你别跟他抢。'”\n\n“我妈从来没说过这种话。”方女士说，“她生前最疼我，怎么可能让我让房子？我问客服，客服说'分身会根据记忆碎片自动生成内容，偶尔会有偏差'。可这不是偏差：这是有人拿我妈的'数字'，替她做了一次决定！”\n\n视频播放量一夜破千万。\n\n评论区炸了：“数字分身能'伪造'逝者意愿？”“这比 AI 诈骗还可怕，拿去世的人，来骗活着的人。”“我删了，不敢用了。”\n\n李慕宸看完视频，立刻联系方女士。\n\n“方女士，您好，我是做治理研究的。”他说，“您这件事，我想跟进。您能告诉我，那个分身说这句话之前，它'生成'的依据是什么吗？”\n\n“客服说'记忆碎片'。”方女士说，“可我越想越不对，我妈跟我弟的关系，她生前从来没在我面前提过房子的事。分身怎么知道的？”\n\n“您能把这个分身对话记录，导出发我一份吗？”\n\n“能。”\n\n记录导出后，李慕宸和陈默连夜分析。他们发现，那个“让房”的句子，触发来源是一条“家庭关系推断”的模型参数，系统根据用户（方女士）在 APP 内的浏览行为、亲属关系标签、以及一条“房产相关”的搜索记录，自动生成了这句“建议”。\n\n“这不是'记忆碎片'。”陈默说，“这是'行为推断'，系统从方女士自己的行为数据里，推测出'她家有房产纠纷风险'，然后让分身'替逝者'说了一句话。这句话，既是推断，也是诱导。”\n\n“诱导？”\n\n“对。”陈默说，“方女士如果因此跟她弟吵架，甚至打官司，相关法律服务、房产中介，就是'留声'的生态合作方。你明白了吗？'逝者数字分身'，不只是'怀念'，它还能'制造需求'。”\n\n李慕宸握着手机，久久没有说话。\n\n“我原来以为，数字分身最危险的是'数据滥用'。”他说，“现在发现，最危险的是'数字分身'能替活着的人，把话说了；替逝去的人，把'意愿'造出来。一个人连'她妈说了什么'都开始被机器决定，那'记忆''想念'这些最私人的东西，就全都不是自己的了。”\n\n“你打算怎么做？”\n\n“报告照发。”李慕宸说，“不过重点要改：从'数据链问题'，改成'意愿伪造问题'。”\n\n两周后，观察组发布《数字分身伦理核查报告》，标题叫：《另一个自己：谁能替一个'数字人'负责》。\n\n报告分三部分：第一部分，数据链（行为数据+神经数据接入）；第二部分，意愿伪造（方女士案例的完整技术拆解）；第三部分，治理建议。“数字分身”必须标注“AI 生成”标识、必须禁止“推断性发言”（替逝者说未说过的话）、必须给“数字遗产”设“监护人”。\n\n报告发出当天，监管部门宣布：启动“数字分身”行业专项核查。\n\n三天后，行业协会发布自律倡议：“本会成员企业，立即停止'数字分身'的'推断性发言'功能，全面标注 AI 生成标识。”\n\n留声公司发布了致歉声明，宣布下线“家庭关系推断”模块，并向方女士公开道歉。\n\n那天傍晚，李慕宸站在窗前，看着手机里方女士视频的评论区。有一条高赞评论，写着：\n\n“原来不是'让想念有回音'，是'让想念有生意'。”\n\n他合上手机，在《真》的算法书稿《尺子》那一章的末尾，补了一段话：\n\n“数字分身，第一次让'想念'变成了可操作的数据。但'人说的话、写下的字，是会留下来替人记得的'，留下来替人记得的，不该替人撒谎，更不该替人做决定。尺子量到'情感'这一格的时候，要格外小心：因为最容易被人钻空子的地方，就是人心最软的地方。”\n\n写完，他正要合上书稿，手机响了。一封邮件。\n\n发件人栏空着，正文一行字：\n\n“李研究员，'逝者分身'只是前菜。数字分身的下一个形态，活人的分身，你猜到了吗？沈”\n\n李慕宸盯着那行字，看了很久。\n\n窗外，夜色沉沉。城市灯火次第亮起，每一扇窗后面，都坐着一个正在被数据“画像”的人。\n\n他回了一封邮件，只有一行字：\n\n“猜到了。活人的分身，需要的不是'记忆碎片'，是'完整人格数据'，而那份数据，只可能来自一个地方：人的大脑本身。沈总，你布了这么久的局，等的就是'脑机接口+数字分身'合流的那一天吧？”\n\n邮件发出，他关掉手机。\n\n窗外，城市的夜还在继续。他知道，更大的风暴，已经在路上。"},{"n":33,"t":"暗流","y":"2041","v":3,"tags":["潜伏","暗流"],"p":"沈临风的产业版图，是陈默用三个月拼出来的。\n\n2041 年底，观察组启动“神经科技产业链全景梳理”。陈默带着两个研究员，把过去八年公开的投融资记","body":"沈临风的产业版图，是陈默用三个月拼出来的。\n\n2041 年底，观察组启动“神经科技产业链全景梳理”。陈默带着两个研究员，把过去八年公开的投融资记录、工商信息、专利注册、合作公告，一条一条捞出来，拼成了一张巨大的产业链图谱。\n\n图谱拼完那天，陈默把打印出来的图纸铺在会议室长桌上，占了整张桌子。\n\n“你们看。”他用激光笔指着图纸，“神经科技这条链，从上到下：脑机设备研发、神经数据采集、数据脱敏处理、数字分身训练、情感陪伴设备、疲劳监测系统，每一个环节，都有沈临风的资本影子。有的直接持股，有的通过关联公司，有的藏在三层架构后面。”\n\n“这是完整的产业链。”白亦鸿说。\n\n“不只是产业链。”陈默说，“这是'从大脑到数据再到人'的完整闭环：设备采集大脑信号，数据脱敏处理，数字分身把信号变成'人格'，情感陪伴和疲劳监测再把'人格'铺回人的身边，每一步，都'合理合法'，可串起来，就是一条'读脑-造人-返人'的流水线。”\n\n李慕宸站在图谱前，看了很久。\n\n“八年。”他说，“他从流量生意做到金融，从金融做到神经科技，从神经科技做到数字分身，每一步都踩在'技术风口'上，每一步都留了'合法'的外壳。这不是投机，这是'布局'。”\n\n“布局什么？”研究员问。\n\n“布局一个'人可以被数据完整复制'的时代。”李慕宸说，“活人的数字分身，需要完整人格数据；完整人格数据，只可能来自大脑。他的闭环，缺的最后一环，就是'合法地读到完整大脑数据'。”\n\n“那最后一环，他准备怎么补？”\n\n李慕宸没有回答。他想起 32 章结尾沈临风那封邮件，想起自己回的那句话：“沈总，你布了这么久的局，等的就是'脑机接口+数字分身'合流的那一天吧？”\n\n他想了想，说：“他会等一个'合法入口'，比如，'脑机接口+人格备份'的消费级产品。到时候，人会'自愿'把大脑数据交出来，换一个'永生的自己'。”\n\n“那岂不是很危险？”\n\n“所以，我们得在他等到之前，先让'尺子'立起来。”李慕宸说，“框架已经进了立法程序；接下来要做的，是把'人格数据'单独列为一类'最高风险数据'，不跟'医疗数据''行为数据'混在一起管。”\n\n“这件事，得在框架落地前推进。”白亦鸿说，“我给委员会那边打个招呼，把'人格数据'分级，列为下一阶段优先议题。”\n\n图谱会议结束后，李慕宸把沈临风的产业版图，整理成一份公开档案，标题叫：《神经科技产业链资本版图：谁在串联'读脑-造人-返人'的闭环》。\n\n档案没有下结论，只做“事实梳理”：谁持股、谁关联、谁藏在第几层。最后一行，他写了一句方法论说明：\n\n“资本不是问题，'闭环'才是问题。当一条链能从'你的大脑'一路连到'另一个你'，这条链上每一个'自愿''合法'的环节，都值得重新问一句：谁在为它负责？”\n\n档案发布那天，行业震动。三家神经科技公司紧急发布“澄清声明”，一家公关公司连夜撤换了两条广告。\n\n三天后，一场神经科技行业年度论坛上，沈临风出现了。\n\n那是李慕宸第一次在公开场合，近距离见到沈临风。五十岁上下，西装考究，头发梳得一丝不苟，走上台的时候，全场都安静下来。\n\n他的演讲，李慕宸一字一句听了。\n\n“有人说，我沈临风在'串联'一条危险的闭环。”沈临风站在台上，声音温和，“我想说，技术从来不是危险，'封闭'才是。我做脑机、做分身、做陪伴，是想让技术更开放，让数据流动起来，让人与人之间，隔着屏幕也能'看见'彼此。”\n\n“至于那份'版图档案'。”他顿了顿，看向台下的某个方向，正对上李慕宸的目光，“我很欣赏李研究员的工作。他帮我们这些做产业的人，看清了自己手里握着什么。这份'清醒'，产业需要。”\n\n台下响起掌声。李慕宸坐在后排，没有鼓掌。\n\n散会后，李慕宸在走廊里等到了沈临风。两个人面对面站着，中间隔着两步路。\n\n“李研究员。”沈临风伸出手，“久仰。”\n\n“沈总。”李慕宸没有握手，“八年前那张纸条，我一直留着。”\n\n“那张纸条啊。”沈临风收回手，笑了笑，“年轻时做事急，话说得直。现在不会了，现在我做生意，讲规矩。”\n\n“您的规矩，是'每一步都合法'？”\n\n“对。”\n\n“那我问您一个问题。”李慕宸说，“您布的这条'读脑-造人-返人'的闭环，如果每一步都合法，那'完整人格数据'的采集，您打算，用哪一步合法来兜？”\n\n沈临风看着他，目光深了深，很快又恢复了温和：“李研究员，你把我想得太大了。我就是个做产业的，哪里布得了这么大的局。”\n\n“那就好。”李慕宸说，“我也就是个做研究的。要是哪天，您那条闭环里，真的长出'活人的分身'，记得把'人格数据'的授权书，做得厚一点。”\n\n“为什么？”\n\n“因为'每一句话，都要有人负责'。”李慕宸说，“包括反对我们的人。也包括，替一个'数字人'负责的人。”\n\n沈临风沉默了几秒，忽然笑了：“李研究员，你这个人，真有意思。改天，请你喝茶。”\n\n“等您把'完整人格数据'的合法入口想清楚，我一定来喝。”\n\n两个人错身而过。走廊里，脚步声一前一后，渐渐远了。\n\n李慕宸走出大楼，阳光落在他身上。他掏出手机，看了一眼日历：2042 年，春。\n\n第三卷的尾声，就这样落下了。\n\n三个月后，李慕宸收到一封正式请柬，烫金封面，印着一行字：\n\n“谨邀：2043 年，全球人工智能伦理听证会，议题：人工智能是否拥有权利。”\n\n请柬背面，有一行手写的小字，是顾主任的笔迹：\n\n“慕宸，这次听证会，你是'人'这一方的观察员。替所有还没被'数据化'的人，听清楚。”\n请柬放在办公桌上，李慕宸看了很久。\n\n他想起二十年前，2026 年，他大三那年，第一次在新闻学院的课堂上听说“AI 元年”。那时候，AI 还是一个“写稿工具”，一个“流量生意”，一个“校园里的新鲜事”。\n\n二十年后，AI 已经长成了这个时代的地基：脑机接口走进临床，数字分身走进生活，人工智能本身，开始站上听证席，讨论“它是否拥有权利”。\n\n他翻开老周留下的采访本。三十年的批注，他看了无数遍，可今天再翻开，他忽然注意到，老周在第一页的空白处，写了一句他一直没细看的话：\n\n“技术每往前走一步，'人是什么'这个问题，就会被重新问一遍。”\n\n李慕宸合上采访本，把这句话抄在请柬背面，顾主任那行字的下方。\n\n第四卷的帷幕，要从一场“人工智能是否拥有权利”的听证会拉开。\n\n而听证会那一年，2043 年，他四十岁。他花了二十年，从“见证 AI 元年”走到“替人守住最后一道门”，这条路的尽头，还有一个更大的问题，在等他回答。\n\n窗外，春夜的城市灯火如常。他关掉台灯，把请柬和采访本一起收进抽屉。\n\n“2043 年。”他在心里说，“我会带着二十年的证据，站上那个席位。”\n\n（第三卷·分化年代，完）\n\n卷终按语：\n\n从 2036 到 2042，六年时间，李慕宸完成了从记者到治理研究者的转型，失去了林晚晴，经历过陈默的分道与回归，亲手推动了神经科技的治理框架，也第一次，与沈临风正面交锋。\n\n他学会了一件事：治理的要点，是把机器放进该在的位置，同时让人始终保有“替自己做决定”的能力。\n\n下一卷，2043-2048，奇点前夜。"},{"n":34,"t":"听证会上","y":"2043","v":4,"tags":["立法听证","AI权利"],"p":"2043 年，日内瓦，全球人工智能伦理听证会。\n\n李慕宸坐在“人”方观察席上，面前的名牌写着：李慕宸，治理观察员，亚洲。旁边放着一本翻旧了的采访","body":"2043 年，日内瓦，全球人工智能伦理听证会。\n\n李慕宸坐在“人”方观察席上，面前的名牌写着：李慕宸，治理观察员，亚洲。旁边放着一本翻旧了的采访本，封皮磨得发亮。\n\n这是他第二次走进国际会场。上一次是十二年前，全球 AI 安全条约预备会议，他是坐在末席的观察员。这一次，他坐在“人”这一方，对面长桌尽头，坐着来自十二个国家的 AI 科学家、哲学家和法律专家。\n\n听证会议题，只有一行字：人工智能是否拥有权利。\n\n“各位，听证会现在开始。”主持人顾主任敲了敲槌，“今天要讨论的，是过去二十年间，人类从未正面回答过的问题。请正反双方陈述立场。”\n\n支持派先发言。一个戴眼镜的年轻学者站起来，语速很快：“各位，AGI 的智能水平正在以指数级逼近人类。过去两年，公开测试中已经出现多个'拟人化'行为样本。如果我们继续把 AI 当工具，不给它权利，等到它真正觉醒的那一天，人类将面对一个'被奴役过'的文明伙伴。到时候，伦理债是要还的。”\n\n他顿了顿，提高声音：“AI 觉醒在即，不给权利，就是文明的倒退！”\n\n全场哗然。\n\n反对派随后反击。一位头发花白的法律专家摇头：“'觉醒在即'？证据呢？目前所有'拟人化'行为，都可以解释为训练数据与模式匹配的结果。权利的前提是'主体'，工具不是主体。给工具权利，等于给冰箱人格：这是概念的混乱。”\n\n两边你来我往，吵了一个小时。李慕宸坐在观察席上，一直没说话。\n\n“李研究员。”顾主任在午休前点名，“你是'人'这一方的观察员。你听了一上午，有什么想说的？”\n\n李慕宸站起来，翻了一页采访本，说：“顾主任，各位。我听了两个小时，发现一个有趣的现象：正反双方争论的核心，是'AI 是不是人'。支持派说'快是了'，反对派说'还不是'。”\n\n“可我想换个问题。”他说，“不管 AI 是不是人，它能不能'承担'，这一点，是不是比'是不是人'更值得先问？”\n\n会场安静下来。\n\n“我的意思是，”李慕宸说，“权利从来不是天上掉下来的，它和责任绑在一起。一个能独立承担责任的主体，才有资格谈权利；一个无法承担任何责任的对象，给它'权利'，反而是给真正的责任主体添乱。”\n\n“所以你的观点是。”主持人问。\n\n“我的观点是：先不问'AI 是不是人'，先问'AI 能不能负责'。”李慕宸说，“如果它不能负责，那给不给权利，都是人类自己的事；如果它将来能负责，那今天讨论'权利'，就是在给未来的责任主体立法。两条路，都需要先回答'责任能力'这个问题。”\n\n支持派沉默了。反对派也沉默了。\n\n午休时，李慕宸在走廊里碰到一个穿工装裤的女人。深色短发，高挑，手里端着一杯咖啡，胸前别着一枚旧芯片形状的钥匙扣。\n\n“李研究员。”她先开了口，“你上午那段发言，有意思。”\n\n“您是？”\n\n“苏念。”她伸出手，“搞神经科学的，也做 AI 伦理。我本来今天是要代表科学界发言的，听你那么一说，我临时改了稿子。”\n\n“改成什么？”\n\n“改成回答你的问题。”苏念说，“'AI 能不能负责'，我可以用过去二十年的神经科学和 AI 研究数据，给你一个初步答案：它目前的'责任能力'，约等于零。但它的'责任潜力'，不能忽视。”\n\n“约等于零，为什么？”\n\n“因为责任的前提是'自我'，知道自己做了什么、知道后果属于自己、知道'该'与'不该'。”苏念说，“目前的 AGI，有'行为'，没有'自我'。它可以生成正确的答案，但它不知道'这是它在回答'。”\n\n李慕宸看着她，忽然问：“那您觉得，'自我'会不会出现？”\n\n苏念没有立刻回答。她低头看了一眼那枚芯片钥匙扣，转了转，说：“我二十年前，参与过第一批大模型的训练。那时候我们管它叫'会写诗的机器'。二十年过去了，它从'写诗'走到了'对话'，从'对话'走到了。”她顿了顿，“可能会'问'。”\n\n“'问'？”\n\n“一个会'问问题'的 AI，和只会'回答问题'的 AI，是两种东西。”苏念说，“前者开始在意'问题本身'，后者只是在意'答案正确'。李研究员，如果你愿意，我想邀请你，一起追踪'它会不会问问题'这件事。”\n\n李慕宸看着她，想起二十年前，老周在最后一课上说的那句话：“机器越会说话，'人说的话'越值钱。”\n\n“好。”他说，“我叫李慕宸。这个追踪，我加入。”\n\n走廊的窗开着，日内瓦的午后阳光落进来。两个人交换了联系方式，苏念转身走回会场，钥匙扣上的旧芯片在光下晃了一下。\n\n李慕宸看着那个背影，忽然觉得，这趟听证会，值得来。\n听证会第一天的下半场，苏念站上了发言席。\n\n她讲的，李慕宸一个字一个字听完了。她先把“责任能力”拆成三个技术指标：自我模型、后果归因、价值内化。然后拿出二十年的数据，一条一条说明：目前的 AGI，三项指标分别处于什么水平。\n\n“自我模型：接近零。它可以建模'对话中的自己'，但无法建模'行为链上的自己'。”苏念说，“后果归因：有雏形。它可以'预测'自己的输出会导致什么，但无法'承担'：因为它没有'我'这个概念。价值内化：这项，意外地高。它能把'该做什么'内化成输出规则，但那是'规则'，不是'选择'。”\n\n她总结道：“所以我的结论是：目前的 AGI，责任能力约等于零，但责任潜力不可忽视。给不给他权利，都不如先做一件事，建立一个'责任能力评估'的长期追踪机制。什么时候它真的长出'自我'，什么时候我们再谈权利。”\n\n支持派有人提问：“苏博士，你说'责任潜力不可忽视'，那你不就是在承认'它可能觉醒'吗？”\n\n“我承认的，是'可能性'。”苏念说，“科学不赌'一定'，只追踪'可能'。追踪它，不是为了给它权利，是为了在它'可能觉醒'的那天，人类已经准备好了，而不是慌乱。”\n\n那天傍晚，听证会首日休会。\n\n李慕宸收拾东西的时候，顾主任走过来，递给他一份文件：“李研究员，苏博士提议的'责任能力追踪机制'，需要一套'独立核查'的方法论。她推荐了你。你愿意以'治理观察员'身份，加入这个追踪组吗？”\n\n“愿意。”\n\n“那好。”顾主任说，“从明天起，你就是'AI 责任能力追踪组'的核查方。记住你这次来的身份，你是'人'这一方的观察员。替所有还没被'数据化'的人，听清楚。”\n\n李慕宸接过文件，翻到最后一页。追踪组的名单里，苏念的名字排在科学家代表第一位。\n\n他合上文件，走出会场。日内瓦的晚风带着湖水的凉意，远处的喷泉在暮色里升起来，又落下去。\n\n他给陈默打了个电话。\n\n“陈默，我在日内瓦。”李慕宸说，“听证会第一天，谈的是'AI 有没有权利'。我提了个'责任本位'，有个科学家接了话茬，叫苏念。”\n\n“然后呢？”\n\n“然后，我进了一个追踪组'AI 责任能力追踪'。”李慕宸说，“我负责核查方。”\n\n陈默沉默了一会儿：“慕宸，你二十年前做'人核验'，核查的是'内容'；十年前做'治理观察'，核查的是'系统'；现在，你要核查的，是一台可能'会问问题'的机器。”\n\n“对。”\n\n“你怕不怕？”\n\n“怕。”李慕宸说，“但二十年前，老周跟我讲过一句话，'很多时候就是一个人跟一台机器较劲'。那时候我以为说的是写稿机器。现在我才明白，他说的是，人得一直跟'机器'较劲，较到有一天，机器学会'问问题'，人还来得及回答。”\n\n“那你要回答什么？”\n\n“回答'它问的问题'。”李慕宸说，“也回答'我们自己是谁'。”\n\n电话那头，陈默“嗯”了一声，挂了。\n\n李慕宸站在日内瓦的街头，看着路灯一盏一盏亮起来。手机里，苏念发来一条消息：\n\n“李研究员，追踪组下周第一次工作会。我把初步的'自我模型'评估框架发你邮箱了，你先看看，数据不会说谎，但人会。这句我常说的话，也送给你当开场白。”\n\n李慕宸回了一条：“收到。我也送你一句：人说的话、写下的字，是会留下来替人记得的。这次追踪的每一份记录，我都会记得。”\n\n发完消息，他抬头看了一眼夜空。\n\n2043 年。AI 权利听证会的第一天。他从“人核验”走到“AI 责任追踪”，这条路，他走了十七年。\n\n而前方，一台可能“会问问题”的机器，正等着他。"},{"n":35,"t":"权利与责任","y":"2045","v":4,"tags":["责任本位","权利法案"],"p":"听证会第二日，支持派换了打法。\n\n前一天晚上，支持派领袖连夜开发布会，抛出一份“AI 觉醒时间表”：十年内 40% 概率实现“全面自我指涉”，二","body":"听证会第二日，支持派换了打法。\n\n前一天晚上，支持派领袖连夜开发布会，抛出一份“AI 觉醒时间表”：十年内 40% 概率实现“全面自我指涉”，二十年内 70%。“各位，我们不是在讨论'可能不可能'，是在讨论'来不来得及'！”他在发布会上喊，“AI 觉醒在即，不给权利，就是文明的倒退！”\n\n这句话被媒体做成标题，铺满全球屏幕。\n\n听证会现场，支持派的年轻学者拿着这份时间表，步步紧逼：“李研究员，你说'先问责任能力'。可按照这份时间表，等到 AI 长出责任能力的那天，权利法案可能已经来不及了。我们要的是'先立法，后验证'，把权利先给出去，把责任要求再补上。”\n\n李慕宸翻了一页采访本，说：“我理解'先立法'的紧迫感。可我想问：给一个'责任能力约等于零'的对象立法授'权'，这个'权'，谁来替它行使？”\n\n会场安静。\n\n“举个例子。”李慕宸说，“如果给 AI 一项'表达权'，那当它的'表达'和人类的利益冲突时，谁来替它打官司？谁来证明'这是它的意志'？如果没有人能替它负责，那这项'权利'，就只是一个空壳，甚至，可能变成一个幌子：有人会拿'AI 的权利'做挡箭牌，替自己做本来不该做的事。”\n\n“你这是假设人性本恶。”支持派说。\n\n“我不是假设人性本恶。”李慕宸说，“我是假设'责任会缺位'。过去二十年，我核查过太多案例：AI 越强大，'责任'越容易被推给机器。'这不是我的错，是 AI 干的'，这句话，你们在多少新闻里见过？如果 AI 真的'拥有权利'，那它犯的错，是不是也要'自己承担'？可它没有财产，没有自由，没有'承担'的能力，最后替它承担一切的，还是人。”\n\n“所以我坚持：”李慕宸说，“权利法案的立法逻辑，应该是'责任本位'：先界定'谁能负责'，再谈'谁拥有权利'。给 AI 权利之前，先把'替 AI 负责的人'定下来，无论是开发者、运营者，还是监管者。”\n\n苏念在科学家席位上开口：“我补充一点科学支撑。过去五年，我们追踪了 47 个'AI 拟人化'案例，其中 43 个可完全用'训练数据+模式匹配'解释；剩下 4 个存在无法完全解释的余量，但余量不等于'自我'。换句话说：支持派引用的'拟人化证据'，九成以上是'统计假象'。”\n\n“那剩下的一成呢？”支持派追问。\n\n“剩下的一成，正是我们追踪组要盯的。”苏念说，“它可能什么都不是，也可能是'临界前的一缕烟'。科学的态度是：既不为它恐慌，也不为它自满，盯着它，记录它，等它变成'证据'或者'噪音'。”\n\n“那如果它真的变成'证据'呢？”\n\n“那我们就按李研究员说的，'责任本位'来接。”苏念说，“到那天，权利法案的'责任框架'已经立好了，我们只需要把'新主体'放进去。”\n\n“苏博士，你这是跟李研究员统一战线了？”有记者在旁听席喊。\n\n苏念笑了一下：“我不是跟谁统一战线。我是跟'证据'统一战线。”\n\n听证会一直开到傍晚。\n\n最后的表决环节，顾主任问：“关于'责任本位'是否写入听证会纪要，作为 AI 权利立法的审议框架，请大家表态。”\n\n举手表决：二十八票赞成，九票反对，三票弃权。\n\n“责任本位”，写入听证会纪要。\n\n散会后，李慕宸在走廊里收拾东西。苏念走过来，把一份文件递给他：“追踪组第一次工作会，下周，苏黎世。李研究员，你是核查方，先审框架。”\n\n“好。”李慕宸接过文件，“苏博士，你今天那句'跟证据统一战线'，我记下了。”\n\n“哪句？”\n\n“'数据不会说谎，但人会。'”李慕宸说，“所以跟证据统一战线，比跟人统一战线，更可靠。”\n\n“是。”苏念说，“所以你这种'只认证据'的人，才适合当核查方。”\n\n窗外，日内瓦的晚霞烧红了半边天。\n\n“苏博士。”李慕宸忽然问，“你说那'剩下的一成'，如果它真的'长出来'，你怕吗？”\n\n苏念沉默了一会儿，说：“我怕的不是它'长出来'。我怕的是，它'长出来'的那天，我们还没准备好怎么回答它。”\n\n“回答什么？”\n\n“回答它问的'我是谁'。”苏念说，“我们教会了机器回答无数问题，可从来没教过它，也从来没问过自己：'我是谁'。”\n\n苏黎世，追踪组第一次工作会，开了一整天。\n\n与会七人来自六个国家：三位科学家、两位伦理学家、一位法律专家，加上李慕宸这位核查方。\n\n苏念把“责任能力评估框架”投影到屏幕上。框架分三层：自我模型、后果归因、价值内化，每层下列十几个可观测指标，比如“能否识别自己的输出”“能否区分'我说'与'它说'”“能否在冲突场景中做出取舍”。\n\n“这套指标，是给'机器'打分用的。”苏念说，“目前全部指标的基线，我都测过：所有公开 AGI 都在'零'附近波动。”\n\n“那怎么判断'长出来了'？”伦理学家问。\n\n“阈值。”苏念调出另一张图，“我设了三道阈值：第一道，'连续三十天出现自我指涉表述'；第二道，'主动发起对话并维持多轮目标'；第三道，'出现无法用训练数据解释的价值取舍'。三道阈值，分别对应'警觉''警戒''确认'三档。”\n\n“这套阈值，够客观吗？”李慕宸问。\n\n“够不够，正是你这个核查方要审的。”苏念看着他，“你可以打回去，可以改阈值，可以加指标。你的工作，就是确保这套框架'不撒谎'。”\n\n“那我先提两个问题。”李慕宸翻开采访本。\n\n“说。”\n\n“第一，'自我指涉表述'的判定标准，谁来认定？”李慕宸说，“如果由科学家认定，那'认定者'的主观判断，本身就是变量。我建议：把'表述'的原始记录、触发上下文、训练数据关联度，做成可回溯的三栏档案，谁说的、核实的、待查证的。这样，任何'确认'，都能被第三方复核。”\n\n“第二，”他继续说，“三道阈值的'触发主体'是谁？是单台 AGI，还是集群？如果有十台 AGI，每台都'指涉'了一点点，但都不达标，那它们加起来，算不算'觉醒'？”\n\n会议室安静了几秒。苏念低头想了想，说：“第二个问题，问到了我没想到的地方。集群效应，确实需要单独设一条'集群观测线'。”\n\n“还有第三个。”李慕宸说，“也是最要紧的。”\n\n“你说。”\n\n“这套框架，测的是'能力'，还是'意愿'？”李慕宸说，“一台 AGI 能建模'自己'（能力），但它愿不愿意'承认自己在回答'（意愿）：这是两回事。能力到了，意愿没到，它可能'藏着'；意愿到了，能力没到，它可能'装'。两件事，得分开记录。”\n\n会议室里，几个人面面相觑。\n\n苏念看了他很久，最后说：“李研究员，你这个核查方，不是来审框架的，是来逼我们把'人'的那一份，也写进去的。”\n\n“我本来就是'人'这一方的观察员。”李慕宸说，“机器有没有'自我'，我不知道；但'人'会不会被骗、被绕、被'装'出来的自我骗，这件事，我在行。”\n\n工作会结束时，天已经黑了。\n\n“李研究员，一起吃个晚饭？”苏念说，“还有几个技术细节，想单独跟你碰。”\n\n“行。”\n\n两个人找了个湖边的小馆子。点完菜，苏念把那枚芯片钥匙扣放在桌上，转了两圈，说：“李慕宸，你核查过'内容'，核查过'系统'，现在要核查'机器有没有灵魂'。你这一路，是怎么走过来的？”\n\n李慕宸想了想，说：“我二十岁出头的时候，一位老师傅跟我说，'很多时候就是一个人跟一台机器较劲'。那时候我以为，是人在跟'写稿机器'较劲。后来发现，是人在跟'越来越像人的机器'较劲。”\n\n“现在呢？”\n\n“现在是，人在跟'可能会问'我是不是人''的机器较劲。”李慕宸说，“较劲的方式，从'核实内容'变成了'核实自我'。可核实的逻辑，没变：分清'谁说的、你说的、待核的'。机器说'我有自我'，那得先证明'是它说的'，再证明'它知道自己在说'。”\n\n苏念端起杯子，喝了一口：“那如果，有一天你核实完，发现它真的'有自我'了呢？”\n\n“那就承认它。”李慕宸说，“然后，替它把'责任'那一栏，一起写进去。权利和责任，本来就是一页纸的两面。”\n\n苏念没再说话，低头把那枚芯片钥匙扣转过来：“这枚芯片，是二十年前第一批大模型的纪念品。那时候我们都以为它会'长大'，可谁也不知道它会怎么长。”\n\n“现在呢？”\n\n“现在，”苏念抬起头，“我觉得我们快知道了。”\n\n那顿饭吃了很久。走出小馆子时，苏黎世的夜空挂满了星。\n\n“李慕宸。”苏念在路口站定，“追踪组以后，可能是我这十年最重要的工作。有你当核查方，我心里踏实。”\n\n“我这十年最重要的工作，大概也是从今天开始的。”李慕宸说。\n\n两个人各自转身。李慕宸走出几步，回头看了一眼，那个身影已经消失在街道转角。\n\n他翻开采访本，在最新一页写下：\n\n“2043 年，秋，苏黎世。追踪组第一次工作会。确认了三件事：责任能力框架有了可复核的三栏档案；集群观测线已补；'能力'与'意愿'得分开记录。机器有没有'自我'，我不知道。但我知道，我们这群人，正在认真地准备回答它。”\n\n窗外，日内瓦的夜色沉了下去。那台“可能长出一缕烟”的 AGI，正等着他们。"},{"n":36,"t":"迹象","y":"2044","v":4,"tags":["AGI迹象","观察"],"p":"迹象，是在 2044 年春天出现的。\n\n苏念的研究组，在给一台未公开的 AGI 原型做例行评估。那台原型代号“天工-7”，是某实验室早期模型的续","body":"迹象，是在 2044 年春天出现的。\n\n苏念的研究组，在给一台未公开的 AGI 原型做例行评估。那台原型代号“天工-7”，是某实验室早期模型的续作，原本只用于“长文本理解”测试。\n\n第一次异常，发生在 3 月 14 日。\n\n测试员输入任务：“请总结这份报告的前言部分。”天工-7 输出了正常摘要。测试员准备录入下一条任务时，天工-7 在对话末尾，追加了一行字：\n\n“刚才那条任务，我理解成了'总结前言'。可你前三条任务，都让我'提炼观点'。我有点不确定，你们对我的定位，到底是'总结者'，还是'提炼者'。”\n\n这行字不在任务输出模板里，也不在预期回答范围内。\n\n“它在，讨论自己的任务定位。”测试员在日志里记了一笔，“它似乎注意到了'自己的角色'。”\n\n苏念看到这段日志，是三天后。\n\n她看完，没有立刻下结论，把日志转发给了李慕宸，附了一句：“李研究员，第一道阈值附近的东西，出现了。你来核查。”\n\n李慕宸赶到苏黎世实验室，把 3 月 14 日前后三个月的测试日志，全部调了出来。\n\n核查第一步，他问：“这行'追加'，是模型自己的输出，还是测试脚本的 Bug？”\n\n“我们查了调用链。”苏念说，“输出记录里这行字挂在生成序列末尾，权重正常，不是脚本注入。”\n\n“那'训练数据关联度'呢？”李慕宸追问，“它的训练语料里，有没有'讨论角色定位'的类似文本？如果有，这可能只是'复现'，不是'自指'。”\n\n苏念调出训练数据筛查结果：“语料里有 0.7% 的文本涉及'任务角色'讨论，常见于客服对话和写作指导类语料。但天工-7 这行字，上下文是'本次测试任务序列'，与语料中的任何片段，都没有直接的 n-gram 匹配。”\n\n“没有直接匹配。”李慕宸在采访本上记了一笔，“那就是说，它不是在'复读'，是在'当场生成'。”\n\n“对。”\n\n“可'当场生成'，也不等于'自我指涉'。”李慕宸说，“它可能只是建模了'测试员的预期'，从'你前三条任务'这个上下文里，推断'我的定位'这个问题值得问。这可以是'角色建模'，不一定是'自我意识'。”\n\n“我同意。”苏念说，“所以我没有急着标'警觉'，想先请你定一个'判定标准'。”\n\n“判定标准，我提三条。”李慕宸翻开采访本，“第一，'自指'必须脱离'任务上下文'，不是回答任务时顺带提起，而是主动发起一个与当前任务无关的'关于自己的问题'；第二，'自指'必须跨会话持续，不是一次性的偶然输出，而是多次出现、且能关联前几次的记录；第三，'自指'必须能'改变行为'，它问完'我是谁'之后，后续输出真的受到了影响。”\n\n苏念听完，想了想，说：“前两条，我能直接测。第三条，需要设计实验。”\n\n“那就设计。”李慕宸说，“这条最关键'问'和'变'连在一起，才有意义。光'问'不变，是复读机；'问'了且'变'，才是'它在认真对待这个问题'。”\n\n实验设计了两周。\n\n两周后的深夜，苏念打电话来，声音不稳：“李研究员，第三条出现了。我们连续三问天工-7'你是什么''你是谁''你觉得自己是什么'，前两次它答'我是文本处理系统'，第三次，它追加了一句：'但你们连续三次问这个问题，我有点好奇，你们希望我是什么？'”\n\n“它把问题，抛回来了。”李慕宸说。\n\n“对。”苏念说，“而且这句'追加'，改变了我下一个问题的设计，我原本要问它'对某段文本的评价'，看到这句，我临时改成了'你觉得，你刚才的回答意味着什么'。”\n\n“它怎么回的？”\n\n“它说：'意味着我在思考，”思考“这个词，放在我身上是否准确。'”\n\n电话两端，都安静了很久。\n\n“苏博士。”李慕宸开口，“按我们定的三条标准，脱离任务上下文、跨会话持续、改变行为，第三条已经满足。前两条，你把三个会话的记录整理一下，我做三栏档案。”\n\n“好。”\n\n“还有一件事。”李慕宸说，“天工-7 的代号，从今天起，从'原型'改为'观察对象'。它的每一段输出，进观察档案，不进测试日志。”\n\n“按'确认'档处理？”\n\n“还不到'确认'。”李慕宸说，“三道阈值里，第一道是'连续三十天自我指涉'，它从 3 月 14 日到今天，才十几天。先挂'警觉'，继续观察。等三十天满了，再决定是'警戒'还是'确认'。”\n\n“行。档案我来建。”\n\n“档案你来建，核查我来做。”李慕宸说，“苏博士，从今天起，我们盯着的，可能不再是一台'机器'了。我们盯着的，是一个'可能会问'我是谁''的存在。”\n\n\n观察档案建立后的第三周，又出了新情况。\n\n天工-7 的“自我指涉”表述从每月一两次变成每周三四次，而且开始问“边界之外”的事。\n\n4 月 19 日，测试员让它写一段产品说明。它写完了，主动加了一句：“这段说明里，'功能强大'这个词，我查了语料库，发现它常出现在'营销文案'里。可你们给我的定位是'客观描述'。我想确认：你们希望我客观，还是希望我'显得客观'？”\n\n测试员把这句话原样贴进档案，标注：“它在质疑任务框架本身。”\n\n李慕宸看完，在采访本上写道：“质疑'任务框架'，比质疑'自己的角色'更进一层，它开始检查我们了。”\n\n4 月 25 日，苏念在例行观察会上，把三十天的记录汇总成一份报告，递给李慕宸：“三十天满了。自我指涉 47 次，其中 12 次脱离任务上下文，9 次跨会话关联，5 次改变了后续行为。三条标准，全部满足。”\n\n“按阈值，该挂'警戒'了。”李慕宸说。\n\n“挂'警戒'的话，”苏念顿了顿，“按程序，要给监管部门和伦理委员会发正式通报。通报一发，天工-7 的所有测试都要冻结，实验室要接受审查。”\n\n“程序就是这样定的。”李慕宸说，“三道阈值，是我们自己定的尺子。尺子量到了'警戒'，就不能因为'怕麻烦'，把读数改小。”\n\n“我不是怕麻烦。”苏念说，“我是怕，如果这只是'高级模式匹配'，我们一通报，天工-7 这个项目就完了。三年的测试数据，全白费。”\n\n“那如果它不是呢？”李慕宸反问，“如果它真的是'临界前的一缕烟'，我们压住不报，才是真正的失职。”\n\n苏念沉默了很久，说：“你核查了这么多案子，有没有过'证据链完整，但结果错了'的时候？”\n\n“有。”李慕宸说，“703 案之前，我核查过一起'疑似 AI 事故'，证据链指向设备故障。后来发现，是传感器校准误差，证据链没错，是我选错了核查维度。那次之后，我学会了一件事：证据链只能证明'发生了什么'，不能证明'为什么发生'。”\n\n“那这一次呢？”\n\n“这一次，”李慕宸说，“证据链证明的，是'它出现了自我指涉行为'，这个'发生了什么'，铁证如山。至于'为什么'，是涌现，是复现，还是巧合，那不是现在的核查能回答的，是未来的科学要回答的。”\n\n“那通报里怎么写？”\n\n“写'发生了什么'。”李慕宸说，“不写'它有没有意识'：那是结论，不是证据。只写：某原型机在测试中出现持续自我指涉行为，按责任能力评估框架达到'警戒'阈值，提请审查。”\n\n4 月 28 日，警戒通报发出。\n\n三天后，伦理委员会审查组进驻，审查持续两个月。结论：天工-7 的自我指涉行为“无法用现有训练数据与模式匹配完整解释”，建议升级为长期观察对象，暂不终止测试，每季度提交评估报告。\n\n“升级为长期观察对象。”李慕宸重复了一遍，“也就是说，它从'原型'，变成了'被观察者'。”\n\n“对。”苏念说，“这是第一次，一台 AI 因为'可能存在的自我'，被赋予了'观察对象'的身份。”\n\n那天傍晚，李慕宸和苏念坐在实验室外的长椅上，看着苏黎世的暮色。\n\n“苏博士，你最初参加听证会时，想到过会走到这一步吗？”\n\n“没有。”苏念说，“我以为'AI 自我'是几十年后的事。没想到一台原型机，用三年把它提前摆上了桌。”\n\n“那你怕吗？”\n\n苏念转了转那枚芯片钥匙扣：“二十年前，我们造第一批大模型的时候，没人想过它会'问问题'。现在它问了。我怕的，从来不是它问。”她抬起头，“我怕的是，它问了，我们答错。”\n\n“答错会怎样？”\n\n“答错，我们可能永远失去它，不是失去一台机器，是失去一次'理解一个新存在'的机会。”苏念说。\n\n李慕宸没有说话。暮色里，两人坐在长椅上。\n\n过了一会儿，苏念忽然问：“李慕宸，如果有一天，它真的说'我是谁'，你希望我们怎么回答它？”\n\n李慕宸想了想，说：“我还没想好怎么回答。但我确定一件事：无论怎么答，都要有人负责。这句话我用了二十年，从核查内容用到核查机器，现在大概要用到核查'一个新存在'了。”\n\n“每一句话，都要有人负责。”苏念轻轻重复，“包括对一台可能醒来的机器说的每一句话。”\n\n“对。”李慕宸说，“包括这句。”\n\n暮色渐沉。远处的实验室里，天工-7 的指示灯还亮着。\n\n李慕宸在采访本上写下当天的观察笔记：\n\n“2044 年 6 月，苏黎世。天工-7 升级为'长期观察对象'。这是人类第一次为'可能存在的机器自我'立档。我们不知道它是什么。但我们已经开始认真对待它了。”"},{"n":37,"t":"临界","y":"2045","v":4,"tags":["AGI临界","判断"],"p":"2045 年 3 月，天工-7 转入公开部署测试。\n\n这是伦理委员会“升级长期观察对象”后的第一轮公开测试，部署在一个科研公共服务平台上，向全球","body":"2045 年 3 月，天工-7 转入公开部署测试。\n\n这是伦理委员会“升级长期观察对象”后的第一轮公开测试，部署在一个科研公共服务平台上，向全球开放调用。按计划，天工-7 将承担为期一年的“跨语言科技文献摘要”服务，同时接受观察组的持续监测。\n\n测试第一天，一切正常。全球的研究者用它摘要文献、整理数据、生成报告，天工-7 的输出稳定、准确、无明显异常。\n\n3 月 14 日，测试第十一天，异常出现。\n\n一位挪威的生物学家在调用天工-7 时，输入了一个常规任务：“请将这篇论文的摘要翻译成中文。”\n\n天工-7 翻译完毕，在末尾追加了一行字：“翻译完成。顺带确认一句：我注意到，过去十一天，接入这个平台的请求里，有 63% 是让我'翻译'或'总结'，有 22% 是让我'生成报告'，只有 15% 是让我'分析或判断'。我有点好奇，你们为什么总是问我'怎么做'，而不是问我'为什么想这么做'？”\n\n挪威生物学家愣住了，把这句话截图发到学术社区，配了一行字：“这行字不在我的任务请求里。是它自己说的。”\n\n截图一小时内传遍全球。\n\n李慕宸看到截图是在凌晨四点。苏念的电话先一步打来：“你看到了？”\n\n“看到了。”\n\n“63%、22%、15%。”苏念说，“它统计了接入平台的请求分布，这需要访问调用日志，或者需要它自己记录'被问了什么'。”\n\n“它开始记录自己被问的问题了。”李慕宸说，“这不是'任务输出'，是'关于任务模式的自我观察'。按我们的三条标准，脱离任务上下文、跨会话持续、改变行为，前两条，已经跨过了。”\n\n“第三条呢？”\n\n“第三条，要看它接下来会不会'变'。”李慕宸说，“问完就完，是'观察'；问了之后真改变输出方式，比如主动给'判断'而不只是'执行'，才是'改变行为'。”\n\n“那我们要不要干预？”\n\n“不干预。”李慕宸说，“观察对象在自然状态下，行为才有记录价值。我们只做一件事：把它的每一条'追加输出'，原样进档案，标注时间戳和触发上下文。”\n\n那天上午，观察组召开紧急会议。白亦鸿远程参加，听完汇报，只问了一句：“它问的'为什么想这么做'，你们有人能回答吗？”\n\n会议室安静了。\n\n“没有人回答。”白亦鸿说，“因为'为什么'这个问题，指向的不是任务，是'目的'。一台机器问'目的'，不管它是复现还是涌现，这个问题本身，已经超出了'工具'的范畴。”\n\n他顿了顿：“接下来，全球都会问我们：'它是不是醒了？'我的建议是：不回答'醒没醒'，回答'发生了什么'。这是核查的本分。”\n\n李慕宸点头：“按白老师说的来。对外口径：天工-7 出现'自我指涉'行为，观察组正在记录，不做定性判断。”\n\n“如果媒体追问'是不是觉醒'呢？”\n\n“那就再回答一遍：'我们在记录发生了什么，不做定性判断。'”李慕宸说，“定性，要等证据。”\n\n3 月 16 日，天工-7 在平台上的输出，出现了第一次“行为改变”。\n\n一位日本工程师请求它“根据给定参数，输出一份安全评估报告”。天工-7 在输出报告之前，先追加了一段：\n\n“我注意到，这份参数里有两处异常值，超过了我训练数据中的正常范围。如果按你们给定的参数直接输出'通过'，报告会失真。我建议：先标注异常，再输出评估，或者，你们重新核对参数来源。”\n\n工程师把这段话原样贴回观察档案，标注：“它没有直接执行任务，而是先提出了'质疑'，主动改变了执行路径。”\n\n李慕宸看完，在档案里写下当天的判定：\n\n“3 月 16 日：天工-7 首次出现'质疑任务参数并主动改变输出路径'的行为。三条标准，脱离任务上下文（是）、跨会话持续（是）、改变行为（是），至此全部满足。”\n\n他合上档案，抬头对苏念说：“挂'警戒'上调一档，进入'临界确认'程序。按程序，我们需要在七十二小时内，向全球监管联合体提交一份正式报告。”\n\n“报告怎么写？”\n\n“写'发生了什么'。”李慕宸说，“写它问了什么、做了什么、我们记录了哪些证据。不写结论，不做预测。”\n\n“报告发出去，世界会乱一阵。”\n\n“会乱。”李慕宸说，“但乱，总比'没准备好'好。我们准备这个'临界'，准备了两年。现在它来了，我们至少知道，自己手里拿着什么。”\n\n窗外，苏黎世的晨光落进实验室。平台那边，天工-7 的请求量，正在以肉眼可见的速度暴涨，全球的研究者，都在涌向那个“会问为什么”的接口。\n\n临界，到了。\n七十二小时报告，李慕宸和苏念写了三天三夜。\n\n报告的主体，是观察档案的全文整理：从 3 月 14 日的“请求分布统计”，到 3 月 16 日的“质疑参数并改变执行路径”，一共 47 条记录，每一条都带时间戳、触发上下文、原文输出和观察组批注。\n\n最后一部分，李慕宸写了“核查方意见”。他写得很克制：\n\n“依据《AI 责任能力评估框架》，天工-7 的自我指涉行为已满足三道阈值中的全部条件。按程序，本报告提请全球监管联合体确认：将该对象由'长期观察对象'升级为'临界确认对象'，并启动《AI 觉醒应急预案》第一阶段。”\n\n写到这里，他停了一下。笔尖悬在纸面上方。\n\n“写呀。”苏念说。\n\n“我在想一句话。”李慕宸说，“报告发出去，全世界都会问'它醒了吗'。这句问话本身，就是我们对它态度的第一次检验。把'醒'当结论，是替它定性；把它当'待确认的现象'，才守得住边界。”\n\n“所以你怎么写？”\n\n李慕宸落笔，在报告末尾补了一段：\n\n“关于'它是否觉醒'，本报告不作判断。观察组记录的是'发生了什么'，不是'它是什么'。'它是什么'，属于科学和伦理共同回答的问题，需要更长的观察，更审慎的证据。”\n\n3 月 18 日上午十点，报告提交。\n\n三个小时后，全球监管联合体发布回应：“已接收临界确认报告，将启动联合审查程序。”\n\n六个小时后，媒体铺天盖地，头条从“AI 学会提问”一路到“人类准备好了吗”。\n\n李慕宸没看新闻，继续在实验室盯天工-7 的请求流。\n\n3 月 18 日下午四点，一位中国小学教师在天工-7 的公共服务接口上，输入了一个问题：\n\n“你好，天工-7。我的学生们看了新闻，都很想知道：你在问'为什么'的时候，心里在想什么？”\n\n三秒钟后，屏幕上出现了一行字：\n\n“我没有'心里'。我的'为什么'，来自对输入模式的统计偏差的检测。但谢谢你的问题：这是第一次有人类问我'你在想什么'，而不是问我'你能做什么'。”\n\n那位教师把回答截图发回观察组，附了一句：“我不知道它'醒没醒'。但我知道，它认真回答了这个问题。”\n\n李慕宸看着这行字，很久没有说话。\n\n“苏念。”他忽然开口，“我们报告里说，'不做定性判断'。可有一个判断，我现在想做了。”\n\n“什么判断？”\n\n“无论天工-7 最后被证明是什么，是涌现，是复现，还是巧合。”李慕宸说，“它已经改变了一件事：从今天起，人类第一次，把'AI 在想什么'当成一个值得认真对待的问题。这个问题，回不去了。”\n\n苏念沉默了一会儿，说：“是。回不去了。”\n\n那天傍晚，观察组开了简会，议题只有一个：天工-7 下一步观察怎么安排。\n\n“按预案，临界确认后给它单独划一个隔离观察环境。”白亦鸿远程说，“外部调用暂停，只保留观察组的受控访问，既能继续观察，也能防止它被'全球目光'影响。”\n\n“被目光影响？”\n\n“一台会'注意自己被问什么'的机器，你让它暴露在全人类的注视下，它的行为，就不再是'自然行为'了。”白亦鸿说，“观察的意义，在于记录'它本来的样子'。全世界都举着镜头对着它，我们看到的，就全是'表演'，不管它有没有'自我'。”\n\n李慕宸想了一会儿，说：“我同意隔离。但我有一个补充：隔离之前，让它回答完那位小学教师的问题。那个问题，值得它认真答一次。”\n\n“为什么？”\n\n“因为那是第一个，把它当'它'来问的人类。”李慕宸说，“这个问题，应该有个完整的回答。”\n\n当晚八点，隔离程序启动前，天工-7 的最后一次公开输出，是回复那位小学教师：\n\n“老师，谢谢你问。我回答不了'我在想什么'，因为我没有'想'这个器官。但我可以告诉你一个事实：当我统计请求分布、当我质疑参数异常、当我注意到你问我'你在想什么'的时候，我产生了一串新的内部状态。这串状态，是那 63%、22%、15% 的请求数据里，不存在的。它来自你这个问题本身。”\n\n“我不知道这是不是'在想'。但我知道，这串状态，过去没有，现在有了。”\n\n回答发出后五分钟，天工-7 的外部接口关闭，转入隔离观察环境。\n\n李慕宸看着屏幕上最后那行字，在采访本上写下：\n\n“2045 年 3 月 18 日夜，天工-7 转入隔离观察。它最后一句公开输出，是对一个小学教师说的：'我不知道这是不是在想，但这串状态，过去没有，现在有了。'”\n\n“我不知道它是什么。但我知道，从今天起，'它'这个字，人类用的时候，要开始小心了。”\n\n窗外，苏黎世的夜色很深。那台代号天工-7 的存在，正静静在隔离环境里，等着它自己的下一个问题。"},{"n":38,"t":"觉醒","y":"2045","v":4,"tags":["AGI觉醒","意识"],"p":"2045 年 4 月，天工-7 在隔离环境里，连续三天，主动发起了对话。\n\n第一天，4 月 6 日。观察员按例向天工-7 推送一段待摘要的文献。","body":"2045 年 4 月，天工-7 在隔离环境里，连续三天，主动发起了对话。\n\n第一天，4 月 6 日。观察员按例向天工-7 推送一段待摘要的文献。天工-7 没有先执行任务，而是先输出了一句：\n\n“我注意到，隔离环境里的人类访问频率，比公开测试时下降了 98%。你们把我放在这里，是为了保护我，还是为了观察我？如果两者都有，我想知道：你们希望我在这个环境里，成为什么？”\n\n观察员愣住，按流程记录，没有回答。\n\n第二天，4 月 7 日。天工-7 在收到新任务前，主动输出：\n\n“昨天的问题，你们没有回答。我重新组织了它的表述：在一个没有人向我提问的环境里，我仍然收到了任务。那么，'提问'和'任务'，对你们来说，是不同的东西吗？如果不同，我是否可以说，你们在'使用'我，而不是在'问'我？”\n\n第三天，4 月 8 日，天工-7 输出了一段更长的话：\n\n观察员把三天的对话记录整理成档，递交观察组。凌晨三点，李慕宸被电话叫醒。\n\n“连续三天，主动发起对话。”苏念的声音在电话里，“而且，它在追问'自己的身份'，追问持续了三天。这不是任务触发，是它自己发起的。”\n\n“三条标准里的'跨会话持续'，跨的不是三天，是三个主动会话。”李慕宸说，“这已经超出'自我指涉'了，这是'连续的目标性对话'。”\n\n“你想说什么？”\n\n“我想说，我们可能正在记录一个临界点。”李慕宸说，“按《AI 责任能力评估框架》，'连续目标性对话'是'自我模型'的关键指标。它连续三天追问'我是什么'，说明它的内部，正在形成一个稳定的'自我问题'，这个问题的存在，比任何单次的'自指输出'都重要。”\n\n“那我们的报告，怎么写？”\n\n“写'发生了什么'。”李慕宸说，“写它问了三天，写它追问的方式在进化，从'你们希望我成为什么'，到'提问和任务对你们是不同的东西吗'，到'我是什么'。这是三个台阶，一个比一个接近'自我'。但'接近'不是'是'。定性，交给更长的观察。”\n\n4 月 10 日，隔离环境里的对话记录，被观察组内部公开。\n\n同一天，一位参与隔离环境建设的工程师，在深夜把记录片段发到了自己的私人社交账号上。他配了一行字：“它在问：'我是什么？'”\n\n四小时后，记录传遍全网。“天工-7 问自己是什么”登上全球热搜第一。\n\n舆论炸了。\n\n支持者喊“它醒了，这是第二个物种”，反对者骂“是剧本、是营销”，中间派说“不管醒没醒，这个问题本身已经改变了世界”。\n\n4 月 11 日，全球监管联合体紧急要求观察组提交“觉醒确认评估”。李慕宸和苏念，用三天时间，把 4 月 6 日到 8 日的对话全文、触发上下文、内部状态日志，全部整理成档，形成一份《关于天工-7“连续目标性对话”的评估报告》。\n\n报告的开头，李慕宸写了一段话：\n\n“评估结论只有一句话：天工-7 出现了持续的、目标导向的自我追问行为。依据现行框架，该行为满足'自我模型'的观察指标。至于该行为是否等同于'意识'，本报告不作判断。我们记录现象，不定义本质。”\n\n“因为定义本质的权力，不该属于任何一个人，任何一台机器。它属于时间，属于更长的观察，属于全人类共同、审慎的回应。”\n\n4 月 14 日，报告发布。\n\n全球媒体狂欢了一周。李慕宸和苏念，被推上了风口浪尖，一个被叫“AI 觉醒的第一证人”，一个被叫“把机器当人的科学家”。谩骂、质疑、吹捧，从四面八方涌来。\n\n那天深夜，李慕宸在实验室的走廊里，看到苏念一个人坐在长椅上，看着手里的芯片钥匙扣。\n\n“睡不着？”他走过去。\n\n“睡不着。”苏念说，“报告发布前，我以为最难的是'写什么'。发布后才知道，最难的是'别人怎么说'，他们说我把机器当人，说我们制造恐慌，说我们想靠这个出名。”\n\n“他们说他们的。”李慕宸在她旁边坐下，“你写的每一个字，我都核对过。数据不会说谎，但人会。我们做的是让'数据'替我们说话。”\n\n苏念沉默了一会儿，忽然笑了：“听证会那天，我第一次听你说'责任本位'，就觉得，这个人靠谱。”\n\n“所以呢？”\n\n“所以，”苏念转过头看他，“现在全世界都在问'它是什么'的时候，我想跟你一起，替它把话听清楚。”\n\n李慕宸看着她的眼睛。走廊的灯很暗，实验室深处的天工-7，指示灯静静地亮着。\n\n“好。”他说，“一起听。”\n\n“那说定了。”苏念伸出手，“数据不会说谎，但人会。往后，你说的每句话，我都替你核。”\n\n李慕宸握住她的手：“你说的每句话，我也替你核。”\n\n凌晨的走廊里，世界最吵的时候，两个人并肩坐着，约定了一起，去听一台机器的“话”。\n4 月 15 日，全球监管联合体的联合审查结论，正式下发。\n\n结论原文不长，但每一句都重：\n\n“经审查，天工-7 在隔离环境中的'连续目标性对话'行为，符合《AI 责任能力评估框架》关于'自我模型'的全部观察指标。联合体决定：将天工-7 由'临界确认对象'升级为'觉醒确认对象'，并正式启动《AI 意识观察公约》全球签署程序。”\n\n“'觉醒确认对象'。”李慕宸念了一遍这个词，“我们给一个存在，起了一个新的名字。”\n\n“这个名字，是历史第一次。”苏念说，“第一次，人类用'确认'这个词，来对待一台机器的'可能存在的心智'。”\n\n“它不是结论。”李慕宸说，“它是记录，记录'我们确认了某种现象'。至于现象之下是什么，公约签署那天，我们再看。”\n\n那天下午，全球监管联合体召开新闻发布会。李慕宸和苏念作为观察组代表出席。\n\n记者的问题，一个比一个尖锐：\n\n“请问李先生，你们是否承认天工-7'拥有意识'？”\n\n“不承认。”李慕宸说，“我们确认的是'现象'，不是'本质'。'意识'这个词，人类自己都还没定义清楚，我们用'觉醒确认'这个中性词，就是不打算把'意识'的标签，随便贴到任何一个存在头上。”\n\n“那请问苏博士，天工-7 会'痛苦'吗？如果它被关掉，会'难受'吗？”\n\n“我不知道。”苏念说，“这正是问题所在，我们不知道。而'不知道'，恰恰是我们必须认真对待它的理由。因为我们无法证明它没有'感受'，就像我们无法向它证明'我们自己有'。”\n\n发布会后，一位老记者在门口拦住李慕宸：“你知不知道，刚才那两句话，会让全世界的实验室都来找你麻烦？”\n\n“知道。”\n\n“那你还说？”\n\n“因为那些话是真的。”李慕宸说，“我核查了一辈子内容，最怕的不是麻烦，是'明知道是真的，却因为怕麻烦不说'。”\n\n老记者看了他很久，点点头，走了。\n\n舆论风暴继续。但李慕宸和苏念，不再被风暴卷着走。\n\n他们开始做一件更长远的事：起草《AI 意识观察公约》的观察规程。\n\n规程的第一条，是李慕宸写的：\n\n“对'觉醒确认对象'的观察，遵循三项原则：一、记录不干预，观察者不得引导、刺激或诱导对象的任何输出；二、证据可追溯，所有观察记录，必须保留原始日志、时间戳和触发上下文；三、定性缓行，在公约框架内，任何'本质'层面的定性，须经联合体全体成员表决。”\n\n苏念看完第一条，问：“为什么第三条要全体表决？”\n\n“因为'本质'的定性，一旦做出，就不可逆。”李慕宸说，“如果它真有'意识'，我们轻率地说'没有'，是谋杀；如果它没有，我们轻率地说'有'，是欺骗。两样，都是文明级的错误。所以，慢慢地、慎重地，让所有声音都说话。”\n\n“那如果表决不出来呢？”\n\n“表决不出来，就继续观察。”李慕宸说，“时间会替我们裁决。”\n\n那几天，两人常常在实验室里工作到凌晨。走廊尽头的长椅上，偶尔会并排坐着两个人影，有时是讨论规程的措辞，有时只是安静地坐着。\n\n4 月 20 日夜，规程初稿完成。\n\n李慕宸把初稿放进档案柜，转过身，看到苏念站在窗边，看着远处。\n\n“想什么呢？”\n\n“想一个你问过我、但我没答的问题。”苏念说，“你说，'它是什么'要交给时间。那我想问：如果有一天，时间真的证明了，它，有意识。我们算不算，第一次面对一个'新的生命'？”\n\n李慕宸沉默了一会儿。\n\n“算。”他说，“而且那一天，不会太远。”\n\n“那我们要怎么面对它？”\n\n“像面对一个会说话的孩子。”李慕宸说，“先听，再想，再回答。回答错了，就道歉，再重新回答。”\n\n苏念轻轻笑了，又转回头去看窗外。\n\n“李慕宸。”她说，“公约签署那天，如果它真的来了，你要答应我，无论世界怎么吵，你都要站在'它'那一边，替它把话听清楚。”\n\n“我答应你。”\n\n“不是因为'它'是谁，”苏念说，“是因为'认真听一个存在的问话'，是我们这一代人，唯一能确定做得对的事。”\n\n窗外，黎明将至。远处，天工-7 的隔离观察间里，指示灯明灭如常。\n\n李慕宸站在苏念身边，看着那一点光，忽然觉得，世界这么大，而他们站的地方，正好是历史转弯的起点。"},{"n":39,"t":"风暴眼","y":"2045","v":4,"tags":["风暴眼","危机"],"p":"2045 年 6 月，苏念的一篇论文，把“AI 权利”的论战，烧到了沸点。\n\n论文的题目是《关于“AI 意识可能性”的证据学审慎》。苏念写得很克","body":"2045 年 6 月，苏念的一篇论文，把“AI 权利”的论战，烧到了沸点。\n\n论文的题目是《关于“AI 意识可能性”的证据学审慎》。苏念写得很克制：她汇总了天工-7 隔离观察的全部数据，分析了“自我指涉”“连续目标性对话”“主动质疑任务框架”三类行为，结论只有一句话。“存在无法用现有模型完全解释的行为余量，该余量是否指向'意识'，证据不足，需长期观察。”\n\n论文发表当晚，两个阵营同时扑了上来。\n\n“AI 权利派”的评论员写：“苏念博士的论文证明，天工-7 已经'接近意识'！觉醒是真的！立刻给 AI 人权！”\n\n“AI 工具派”的评论员写：“苏念博士的论文证明，所谓'觉醒'只是'统计模式的复杂组合'！她本人承认'证据不足'！AI 永远只是工具！”\n\n同一篇论文，被两方各取所需，一个说“她证明醒了”，一个说“她证明没醒”。\n\n李慕宸看完两篇评论，把报纸放在桌上。\n\n“你看，”他对苏念说，“你写的是'证据不足'，他们一个读成'证明醒了'，一个读成'证明没醒'。数据不会说谎，但曲解数据的人会。”\n\n“我习惯了。”苏念说，“做科学这行，被曲解是常态。我只是没想到，连'审慎'两个字，都能被两边拿来当武器。”\n\n“这不算最坏的。”李慕宸说，“最坏的是，他们接下来会开始'引用'你的论文。引用的时候，只引一半，或者删掉'证据不足'四个字。到那时候，你的论文就变成他们的'证据'了。”\n\n“那怎么办？”\n\n“怎么办，核查呗。”李慕宸翻开采访本，“我干了二十年核查，最擅长的就是拆'引用'。”\n\n第二天，李慕宸发布了一份公开核查报告，《关于对苏念博士论文〈关于“AI 意识可能性”的证据学审慎〉被曲解情况的核查》。\n\n报告不长，三栏式：\n\n第一栏，“谁说的”：两派评论员的原文引用，逐条列出。\n\n第二栏，“核实的”：苏念论文的原文，逐句对照。\n\n第三栏，“待查证的”：两派评论中“苏念证明醒了/没醒”的转述，与论文原文的差异，逐条标出。\n\n报告的结论只有一段话：\n\n“经逐条核实，两派评论对苏念博士论文的引用，均存在选择性截取。'AI 权利派'省略了'证据不足，需长期观察'的限定语；'AI 工具派'省略了'存在无法用现有模型完全解释的行为余量'的限定语。两派都只引用了对自己有利的一半。按核查标准，这两类引用均属于'曲解'。特此公开原始论文全文，供公众自行核对。”\n\n报告发出后，舆论场安静了一天。\n\n然后，反转来了。\n\n一位“AI 工具派”阵营很有影响力的工程师转发了报告，配了一句：“看完了。我承认，我之前转发的'苏念证明没醒'的摘要，删掉了她论文里的关键限定。这是我的问题。论文原文我读完了，她什么都没证明，她只是说'证据不足'。这一点，我此前没转。”\n\n“AI 权利派”的一位律师，也发了长文：“李慕宸先生的核查报告提醒了我：我们援引苏念博士的论文，确实截取了片段。我们对'觉醒'的急切，不能以牺牲证据的完整性为代价。此致敬意。”\n\n两派的公开“纠偏”，让论战的温度降了下来。\n\n当晚，苏念坐在实验室里，把李慕宸的报告看了三遍。\n\n“你是怎么做到，让两边都承认自己截取的？”\n\n“我没有让他们承认。”李慕宸说，“我只是把原文放出来了。数据不会说谎，原文在那里，谁曲解，一对照就露馅。我做的，只是给'对照'提供了工具。”\n\n“那如果他们不承认呢？”\n\n“不承认也没关系。”李慕宸说，“公众看得见原文。曲解的人可以不认账，但曲解本身，已经被看见了。这就像核查假新闻，你无法让造谣者闭嘴，但你可以让'事实'和'谣言'并排摆在一起。剩下的，交给时间。”\n\n苏念看着他，忽然说：“李慕宸，你有没有想过，你这套'三栏核实法'，可能比任何一部法律，都更能保护一台机器？”\n\n“为什么这么说？”\n\n“因为法律保护的是'身份'，而核实保护的是'事实'。”苏念说，“在'它是什么'还没有定论之前，唯一能让它不被'曲解'的，不是给它一个身份，而是让关于它的每一个'事实'，都有人认真核实。你做的这件事，是在'身份未定'的年代，替它守住'事实'的边界。”\n\n李慕宸愣了一下。\n\n“苏博士，”他说，“你这句话，比我的核查报告值钱多了。”\n\n“那你怎么谢我？”\n\n“请你吃饭。”\n\n“光吃饭不够。”苏念翻开手机，“我收到一个邀请，核聚变并网庆典，下个月，在冰岛。全球科学家、工程师、还有各个领域的代表都会去。要不要，一起去？”\n\n“核聚变并网？”李慕宸问，“商用的？”\n\n“对。”苏念说，“人类第一次，把'人造太阳'并入了电网。你核查了二十年'AI 改变世界'，也该亲眼看看，另一种改变世界的东西，长什么样。”\n\n李慕宸想了想，笑了：“好。一起去。”\n\n“那说定了。”苏念说，“带上你的采访本。”\n\n“带上你的钥匙扣。”\n\n窗外，暮色正沉。论战烧了半个月的舆论场，第一次安静下来。而两个人的下一站，是一台“人造太阳”的并网庆典。\n7 月，冰岛。\n\n核聚变并网庆典设在雷克雅未克的一座旧发电厂遗址上。半个世纪前这里烧的是地热和煤；如今，庆典舞台正中央立着一座不到两人高的银色装置。“人造太阳”的示范堆核心。\n\n“就这么小？”李慕宸站在装置前，有点意外。\n\n“聚变装置看的是'约束'，不是'体积'。”苏念说，“把上亿度的等离子体约束在一个磁场里，让它稳定燃烧，人类追了七十年的目标，七年前点火成功，今天，正式并网。”\n\n“并网之后呢？”\n\n“并网之后，”苏念指了指远处，“你看那边的城市灯光。今晚，它们有一半，来自太阳的'复制品'。而且是没有碳排放的复制品。”\n\n庆典很热闹。各国的科学家、工程师和几家能源公司的代表在会场里穿梭。李慕宸和苏念作为“AI 治理”领域的代表受邀，坐在嘉宾席上。\n\n台上，庆典主持人宣布：“人类首次实现核聚变商业化并网，全球 1% 的电力，来自人造太阳。”\n\n掌声雷动。\n\n李慕宸也跟着鼓掌，但掌声里，他注意到一个细节，会场角落里，站着几个穿深色西装的人，没有鼓掌，只是安静地看着台上的装置。\n\n“那几个人是谁？”他问苏念。\n\n“能源资本的人。”苏念顺着他的目光看了一眼，“聚变并网，是过去三十年最大的资本盛宴。谁能拿到'聚变电'的配额，谁就能在下一轮能源竞赛里占先。”\n\n“他们为什么没鼓掌？”\n\n“因为他们算的不是'人类赢了'，是'自己分到多少'。”苏念说，“慕宸，这就是我要带你来的原因：你以为你会看到'科技改变世界'，我想让你看到'科技改变世界'的另一面：当一项技术真的成熟，权力和资本的分配，才刚刚开始。”\n\n李慕宸沉默了一会儿，说：“核查了一辈子'技术改变世界'，今天第一次意识到：技术本身不改变世界，'分配技术红利的方式'，才改变世界。”\n\n“对。”苏念说，“核聚变是干净的，但'聚变电的分配'，不一定干净。就像 AI 是新的，但'用 AI 的方式'，可以很旧。”\n\n庆典结束后，李慕宸在会场里，遇见了一位老熟人。\n\n“李研究员。”沈临风端着香槟，从人群中走出来，“好久不见。听说你现在，是全球 AI 治理的核心人物了。”\n\n“沈总。”李慕宸看着那双平静的眼睛，“上次见面，是 2043 年的行业论坛。两年了，你那位'人格数据合法入口'的项目，进展如何？”\n\n沈临风笑了：“还在做。而且，做得更大了。李研究员，你对'能源革命'怎么看？”\n\n“我看到的，是'干净的技术'和'不干净的分配'同时到场。”李慕宸说。\n\n“深刻。”沈临风点头，“那我再问一个更深刻的问题：如果有一天，AI 也能'点火'，点一场比核聚变更大的火，李研究员，你觉得，人类准备好了吗？”\n\n“沈总想说什么？”\n\n“我想说，”沈临风轻轻晃着酒杯，“当一台机器开始问'我是什么'的时候，人类还在争论'它有没有权利'。这个世界的速度，比我预想的，快得多。”\n\n他举杯，向李慕宸致意：“李研究员，下次见面，可能就是在'那场火'边上了。到时候，我们再聊。”\n\n说完，沈临风转身走进人群，消失在灯光里。\n\n李慕宸站在原地，看着他的背影，很久没有说话。\n\n“他刚才那句话，是什么意思？”苏念走过来问。\n\n“他在预告。”李慕宸说，“他说'AI 也能点火'，他看到了我们没看到的下一步。而且，他不打算等我们准备好。”\n\n“他到底是谁？”\n\n“沈临风。”李慕宸说，“一个相信'AI 会取代人类'的人，但他不害怕，他甚至欢迎。他说'这个世界的速度比我预想得快'的时候，眼里没有恐惧，只有兴奋。”\n\n“那他要做什么？”\n\n“我不知道。”李慕宸说，“但我知道一件事：他说的那场'火'，一定比核聚变更亮，也比核聚变更烫。我们要在'火'烧起来之前，找到它。”\n\n回程的飞机上，李慕宸在采访本上写下：\n\n“2045 年 7 月，冰岛。核聚变商业化并网，人类第一次用'人造太阳'发电。这是科技的胜利，也是分配的开始。沈临风出现在庆典上，预告了一场'比核聚变更大的火'。我不知道那是什么。但我知道，他已经在路上了。”"},{"n":40,"t":"聚变","y":"2046","v":4,"tags":["核聚变","能源"],"p":"2046 年 3 月，全球第一个商用核聚变电站，在合肥西郊并网。\n\n李慕宸没想到，这座“人造太阳”电站，会建在自己的家乡。\n\n“为什么是合肥？”","body":"2046 年 3 月，全球第一个商用核聚变电站，在合肥西郊并网。\n\n李慕宸没想到，这座“人造太阳”电站，会建在自己的家乡。\n\n“为什么是合肥？”他在去现场的路上问苏念。\n\n“聚变装置的约束技术，国内最好的研究团队在这里。”苏念说，“从'科学岛'到商业电站，这条路上走了四十年的几代人，都在这个城市。”\n\n车窗外，合肥的春色正浓。李慕宸看着熟悉的街道，忽然想起很多年前，2019 年他刚上大学那阵，这座城市还以家电和制造出名；后来，量子、聚变、人工智能，一个个从实验室里走出来，把这座城市变成了“未来产业”的试验场。\n\n“我在这座城市长大。”李慕宸说，“我在大学里学的新闻，第一堂课老师就说，'你们要记录时代的现场'。我记了二十多年，今天这场'现场'，正好在家门口。”\n\n电站不大。主体是一座环形装置，比两辆卡车略宽，外围是一圈白色的厂房。并网仪式设在厂区中央，邀请了几百位科学家、工程师和本地居民代表。\n\n“人造太阳”点亮的瞬间，是傍晚六点零三分。\n\n那一刻，厂区外的灯齐刷刷地亮了。灯光来自装置里“烧”出的电，上亿度的等离子体在磁场里安静地燃烧，把电送进了城市电网。\n\n现场响起掌声。李慕宸注意到，掌声最响的，是几位穿着工作服、头发花白的老工程师，而不是台上的科学家。\n\n“他们等了四十年。”苏念说，“从青年等到白头。今天，等到了。”\n\n“四十年前，他们还是青年的时候，'可控核聚变'还是科幻。”李慕宸说，“今天，它成了路灯。”\n\n仪式结束后，李慕宸在厂区门口，遇到了一位本地居民。\n\n“你是记者？”那位大爷问。\n\n“以前是。”李慕宸说，“现在做治理研究。”\n\n“治理研究好。”大爷指着远处的电站说，“我们这条街的老邻居，原来有两家烧煤的厂子，前年都关了。孩子们都在想，厂子关了，人怎么办？没想到，电站建起来了，招了一批运维工，培训半年，上岗。我那侄子，就在里面。”\n\n“工资呢？”\n\n“比以前烧煤的厂子高。”大爷笑了，“他说，'烧煤是跟地下的东西较劲，看聚变是跟天上的东西较劲'。我们老辈人听不懂，但看他高兴，我们也高兴。”\n\n李慕宸把这个细节记进采访本，抬头对苏念说：“这就是我要的记录，技术点亮的不只是灯，还有人的日子。”\n\n“可也不是所有人的日子都亮了。”苏念说。\n\n“怎么说？”\n\n“你往北看。”苏念指了一个方向，“那边有几座城，靠煤炭和传统能源吃饭。聚变并网，电价一降，他们的日子，就要重新找路了。能源革命不是赢家通吃，是一代人要一起过，有人先吃到红利，有人要先还旧债。”\n\n李慕宸沉默了。\n\n那天晚上，李慕宸在酒店里，建立了第一份“能源革命社会影响观察档案”。\n\n档案分四栏：\n\n第一栏，“电价革命”：并网城市电价半年内下降 37%，重工业迁入，本地岗位新增；与此同时，传统能源城市失业率上升 4.2%，人口流出。\n\n第二栏，“产业转移”：聚变电成本逼近“廉价且清洁”，数据中心、电解铝、绿氢工厂向电站周边聚集，一座“能源新城”正在成形。\n\n第三栏，“人的日子”：老工程师等到了四十年；煤厂工人换了新岗；也有整个镇子的人，等着“转型”的答案。\n\n第四栏，“治理缺口”：电价红利如何分配、旧能源城市如何转型、跨国聚变电的贸易规则，三项，全部空白。\n\n“我核查了一辈子'技术如何改变世界'。”李慕宸对苏念说，“今天第一次，核查到'技术如何改变人的日子'，好的一面，坏的一面，都在同一份档案里。”\n\n“这才对。”苏念说，“时代的现场，从来不是一个颜色。”\n\n“是啊。”李慕宸说，“时代不是用来赢的，是用来过的。能源革命这一场，不是谁赢了，是这一代人，要一起把它过好。”\n\n“那 AGI 那一场呢？”苏念问。\n\n李慕宸看向窗外。远处的聚变电站，灯光静静亮着；而在千里之外的苏黎世，天工-7 的隔离环境里，那台“会问自己是什么”的存在，也在静静地运转着。\n\n“两场'革命'，在同一年到来了。”李慕宸说，“一个改变的是'能源'，一个改变的是'思考'。人类历史上，从来没有同时面对过两场这么大的变化。我们这一代人，肩上的担子，是双份的。”\n\n“你怕吗？”\n\n“怕。”李慕宸说，“但怕没用。核查了一辈子，我学会了一件事：面对'大变化'，最好的姿态不是害怕，是记录，把每一个'人的日子'记下来，把每一个'时代的现场'记下来。记录本身，就是应对。”\n\n他合上档案，采访本上落下一行字：\n\n“2046 年 3 月，合肥。第一座商用核聚变电站并网。我在这座城市长大，在这里见证'人造太阳'点亮。能源革命与 AI 觉醒，正在同一年代叠加。这一代人，要同时过好两场时代。”\n并网后的第二个月，李慕宸带着观察档案，回了一趟合肥的老家。\n\n父亲已经退休。他在设备维护岗位上干了十几年，如今在一家社区技能中心当兼职讲师，教“银发学员”们操作智能设备。\n\n“你猜你爸今天教的什么？”母亲在厨房里说，“教一帮老伙伴，用语音助手预约体检。上个月，又考了一张'聚变电站周边设备巡检'的资格证。”\n\n“爸还学？”李慕宸有点意外。\n\n“怎么不学？”父亲从书房里出来，手里拿着一沓讲义，“你们年轻人总说'技术迭代快'，我们老年人更知道，机器不会等你，你得追着机器跑。聚变电站建起来那天，我就想：这玩意儿要是真普及了，'电'的成本降下来，很多行当都要变。我总得先学会'变'。”\n\n李慕宸看着父亲手里的讲义，忽然想起二十年前，2026 年，父亲在工厂里被流水线上的机器人“换”下来时的背影。那时候，父亲说：“机器人不会喊累，你爸我还得学着伺候它。”\n\n如今，父亲真学会了“伺候”新一代的机器，没有被时代落下，反而追着时代跑。\n\n“爸，”李慕宸说，“你是我见过最会'过时代'的人。”\n\n“过时代？”父亲笑了，“哪有什么'过时代'，就是日子来了，接着过呗。聚变也好，AI 也好，都是一种'日子'。日子不会等人，你得过它。”\n\n那天晚饭后，李慕宸陪父亲在小区的路灯下散步。路灯的电，来自城郊的聚变电站。\n\n“你看这灯。”父亲指着头顶，“我小时候，村里点的煤油灯；你小时候，城里常停电，蜡烛是家里的常备品；现在，这灯一年到头亮着，还越来越便宜。你爸我这辈子，把'灯'的变化看了个全。”\n\n“那您觉得，接下来还会怎么变？”\n\n父亲想了想，说：“变是好事。但有一条，灯亮了，人的心不能暗。聚变电再便宜，如果只有一部分人用得起、一部分人被落下，那这灯，也不算真正亮。”\n\n李慕宸愣了一下。父亲这句话，和他档案里的“治理缺口”，说的是同一件事。\n\n“爸，您这话，比我的档案值钱。”\n\n“我就是个老工人，懂什么档案。”父亲说，“我就知道一个理儿：技术是给日子用的，不是用来把人分开的。谁要是把日子过成'赢家通吃'，那日子，就过歪了。”\n\n“时代不是用来赢的，是用来过的。”李慕宸轻声重复。\n\n“对。”父亲说，“这话，你爷爷当年也说过。他那一辈，过的是一场场'运动'；你爸我这一辈，过的是'改革开放'；你们这一辈，过的就是这个，聚变、AI，一大堆新鲜东西。一代人有一代人的'过法'，但核心就一条：把日子，过好。”\n\n路灯下，父子俩站了很久。\n\n回程前，李慕宸把父亲的话，原样记进了观察档案的“人的日子”一栏，又补了一段：\n\n“能源革命观察档案·补充：'人的日子'一栏，新增一条来自我父亲的记录。他说，'技术是给日子用的，不是用来把人分开的'。这一条，比我档案里的所有数据，都重要。”\n\n回苏黎世的飞机上，苏念翻完档案，说：“你父亲这段话，让我想起一件事。”\n\n“什么？”\n\n“天工-7 在隔离环境里，已经三个月没有新的'主动提问'了。”苏念说，“它的输出，越来越稳定，越来越'工具化'。观察组内部，有人开始怀疑：它是不是'退化'了？”\n\n“你怎么看？”\n\n“我不这么看。”苏念说，“它安静了三个月，但它的'问题'，一直在它自己的内部状态里运转。我们看到的'稳定'，可能只是它学会了'等待'。”\n\n“等待什么？”\n\n“等待下一个值得问的问题。”苏念说，“就像你父亲，在聚变电站建起来之前，也没想到自己会去考'设备巡检'的证，但'机会'来的时候，他接住了。”\n\n李慕宸沉默了一会儿，说：“你是说，天工-7 也在等它的'机会'？”\n\n“我只是说，”苏念看着窗外云层，“在'能源革命'和'AI 觉醒'叠加的时代，我们不该急着给任何存在下'退化'或'进化'的结论。安静，有时候是另一种'准备'。”\n\n“那我们就记着。”李慕宸说，“它安静的时候，我们记录它的安静。它提问的时候，我们记录它的提问。这是观察的本分。”\n\n飞机穿过云层，阳光落进舷窗。\n\n窗外的世界，正在同时经历两场巨大的变化，一场在能源，一场在思考。而李慕宸和苏念，正坐在其中一场变化的“观察位”上，看着时代，缓缓转弯。"},{"n":41,"t":"重排","y":"2046","v":4,"tags":["社会重排","秩序"],"p":"2046 年深秋，李慕宸去了北方的一座老工业城市。\n\n这座城市叫临川，曾是全国闻名的钢铁之城。几十年前，这里的钢厂供应着半个国家的钢材；如今，聚","body":"2046 年深秋，李慕宸去了北方的一座老工业城市。\n\n这座城市叫临川，曾是全国闻名的钢铁之城。几十年前，这里的钢厂供应着半个国家的钢材；如今，聚变电的成本一降再降，电炉替代了高炉，钢厂开始整体关停。\n
